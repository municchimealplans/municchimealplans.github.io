\n","2:D_turkeyburger":"<p><span class=\"tag\">Sunday prep: bag and freeze the raw\nturkey</span></p>\n<p><strong>Ingredients</strong></p>\n<ul>\n<li>13½ oz (380 g) 93% lean ground turkey</li>\n<li>Seasoning: ½ tsp salt, ½ tsp garlic powder, ½ tsp onion powder, ¼\ntsp black pepper, 1 tsp Worcestershire</li>\n<li>2 whole-wheat sandwich thins</li>\n<li>1 slice American cheese (Rob)</li>\n<li>1¼ cups (60 g) chopped romaine</li>\n<li>1 Roma tomato (80 g), sliced</li>\n<li>¼ cup (40 g) dill pickle chips</li>\n<li>1½ tbsp ketchup</li>\n<li>1 medium sweet potato (215 g)</li>\n<li>2 tsp olive oil, ¼ tsp salt, ¼ tsp smoked paprika</li>\n<li>Cooking spray</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Two nights before (Friday night), move the raw turkey from the\nfreezer to the fridge.</li>\n<li>Cut the sweet potatoes into ¼-inch fries. Toss with the olive oil,\nsalt and smoked paprika.</li>\n<li>Air-fry at 400°F for 18 to 20 minutes, shaking twice.</li>\n<li>Mix the turkey with the seasoning. Shape 2 patties, ¾ inch thick:\nRob's 7 oz (200 g), Maggie's 6¼ oz (180 g). Press a dent in the middle\nof each.</li>\n<li>Heat a sprayed skillet over medium. Cook the patties 4 to 5 minutes\na side, until 165°F. Put the cheese on Rob's for the last minute and\ncover.</li>\n<li>Toast the sandwich thins.</li>\n<li><strong>Divide.</strong> Rob: his cheeseburger on a sandwich thin\nwith ⅔ cup (30 g) romaine, ½ Roma tomato (40 g), 2 tbsp (20 g) pickle\nchips and 1 tbsp ketchup, plus 1 cup sweet potato fries (95 g cooked).\nMaggie: her burger on a sandwich thin with ⅔ cup (30 g) romaine, ½ Roma\ntomato (40 g), 2 tbsp (20 g) pickle chips and 2 tsp ketchup, plus ¾ cup\nsweet potato fries (70 g cooked).</li>\n</ol>\n<p><strong>Reheat</strong></p>\n<p>Burger: microwave covered 45 to 60 seconds, or a covered skillet over\nmedium-low, 2 minutes a side. Fries: air fryer at 400°F, 3 to 4 minutes.\nToast the bun.</p>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>642</td>\n<td>48 g</td>\n<td>56 g</td>\n<td>27 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>499</td>\n<td>41 g</td>\n<td>46 g</td>\n<td>19 g</td>\n</tr>\n</tbody>\n</table>\n","2:S_popcorn":"<p><strong>Ingredients</strong></p>\n<ul>\n<li>7 cups (55 g) popcorn: air-popped, or a 94% fat-free microwave\nbag</li>\n<li>2½ oz (70 g) original beef jerky</li>\n<li>Cooking spray and a pinch of salt</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Pop the popcorn. If it is air-popped, mist it with cooking spray and\ntoss with the salt so it sticks.</li>\n<li><strong>Divide.</strong> Rob: 4 cups popcorn (32 g) and 42 g (1½ oz)\noriginal beef jerky. Maggie: 3 cups popcorn (24 g) and 28 g (1 oz)\noriginal beef jerky.</li>\n</ol>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>244</td>\n<td>19 g</td>\n<td>34 g</td>\n<td>3 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>173</td>\n<td>13 g</td>\n<td>25 g</td>\n<td>2 g</td>\n</tr>\n</tbody>\n</table>\n","3:B_burrito3":"<p><span class=\"tag\">Sunday prep: cook the chorizo</span></p>\n<p><em>Makes chorizo on Sunday for the week; 3 burritos each morning (2\nfor Rob, 1 for Maggie), made fresh.</em></p>\n<p><strong>Ingredients</strong></p>\n<ul>\n<li>Sunday, turkey chorizo for the week: 1 lb (454 g) 93% lean ground\nturkey and the chorizo seasoning: 1 tbsp chili powder, 1 tsp smoked\npaprika, 1 tsp cumin, 1 tsp dried oregano, ½ tsp garlic powder, ¾ tsp\nsalt, ¼ tsp black pepper, 1 tbsp red wine vinegar</li>\n<li>Each morning: ¾ medium Yukon gold potato (140 g), cooking spray and\na pinch of salt</li>\n<li>Each morning: 2 large eggs and ½ cup (120 g) liquid egg whites, with\na pinch of salt</li>\n<li>Each morning: 3 small (8-inch) Olé low-carb wraps (2 for Rob, 1 for\nMaggie) and 4 tbsp jarred salsa</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Sunday: stir the chorizo seasoning together, vinegar included. Heat\na large skillet over high until very hot, add the turkey, press it flat\nand leave it 3 minutes to brown, then break it up. If liquid pools in\nthe pan, spoon or pour it off and keep cooking on high until the meat\nbrowns.</li>\n<li>Add the seasoning and cook 3 to 4 minutes more, until no pink is\nleft. Cool, then split it into 3 containers (one per breakfast):\nMonday's and Wednesday's in the fridge, Friday's in the freezer.</li>\n<li>Each morning: dice the potato into ½-inch cubes, microwave it in a\ncovered bowl 2 minutes, then spray, salt and air-fry at 400°F for 10 to\n12 minutes, shaking once, until crisp.</li>\n<li>While it cooks, whisk the eggs, egg whites and salt. Spray a\nnonstick pan, warm that day's chorizo over medium 2 minutes, then turn\nthe heat to medium-low, pour in the eggs and stir slowly 2 to 3 minutes,\nuntil just set.</li>\n<li>Fold in the potatoes. Warm the wraps 15 seconds in the\nmicrowave.</li>\n<li>Rob: a bit more than half the filling across his 2 wraps. Maggie:\nthe rest in her wrap. Roll up.</li>\n<li><strong>Divide.</strong> Rob: 2 burritos (with ½ cup (60 g) cooked\nturkey and ½ cup crispy diced potatoes (70 g cooked) in them) and 2 tbsp\nsalsa. Maggie: 1 burrito (with ⅓ cup (50 g) cooked turkey and ¼ cup\ncrispy diced potatoes (30 g cooked) in it) and 2 tbsp salsa.\n<strong>Store:</strong> Made fresh each morning. The cooked chorizo goes\nin 3 containers on Sunday: Monday's and Wednesday's in the fridge,\nFriday's in the freezer. Move Friday's to the fridge Wednesday\nnight.</li>\n</ol>\n<p><strong>Reheat</strong></p>\n<p>Best eaten fresh. A leftover burrito: wrap it in a damp paper towel\nand microwave 45 to 60 seconds.</p>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>430</td>\n<td>40 g</td>\n<td>46 g</td>\n<td>16 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>309</td>\n<td>32 g</td>\n<td>23 g</td>\n<td>13 g</td>\n</tr>\n</tbody>\n</table>\n","3:L_korean":"<p><span class=\"tag\">Sunday prep: pack all 6 bowls</span></p>\n<p><em>Makes 6 bowls (3 Rob, 3 Maggie).</em></p>\n<p><strong>Ingredients</strong></p>\n<ul>\n<li>2¼ lb (1,035 g) 95% lean ground beef</li>\n<li>3 garlic cloves, minced</li>\n<li>1 tbsp grated fresh ginger</li>\n<li>Sauce: 5 tbsp gochujang, 3½ tbsp low-sodium soy sauce, 4 tsp honey,\n1 tbsp toasted sesame oil</li>\n<li>Quick pickles: 1¼ English cucumbers (360 g), 4 medium carrots (240\ng), ¼ cup rice vinegar, ½ tsp salt</li>\n<li>1¼ cups dry white rice</li>\n<li>1¾ cups (270 g) frozen shelled edamame</li>\n<li>3 cups (90 g) baby spinach (Maggie)</li>\n<li>Containers: 6</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Cook the rice: bring 1¼ cups dry white rice and 2½ cups water to a\nboil, cover, turn the heat to low and simmer 15 minutes, then let it sit\n5 minutes off the heat and fluff with a fork. (A microwave rice pouch\nworks too.)</li>\n<li>Quick pickles: slice the cucumbers thin and shred the carrots. Toss\nwith the rice vinegar and salt and refrigerate at least 15 minutes, then\ndrain.</li>\n<li>Thaw the edamame: microwave 1 minute or run under warm water.</li>\n<li>Heat a large skillet over high until very hot. Add the beef, press\nit flat and leave it 3 minutes to brown, then add the garlic and ginger\nand cook 4 to 5 minutes more, breaking it up. If liquid pools in the\npan, spoon or pour it off and keep cooking on high until the meat\nbrowns.</li>\n<li>Stir in the gochujang, soy sauce, honey and sesame oil. Simmer 2\nminutes.</li>\n<li><strong>Divide.</strong> Rob: each of his 3 bowls gets ¾ cup (125 g)\nrice, 1 cup (150 g) cooked beef, ¼ cup (40 g) edamame and a sixth of the\npickles. Maggie: each of her 3 bowls gets a bed of 1 cup (30 g) spinach,\n⅓ cup (60 g) rice, ¾ cup (110 g) cooked beef, ⅓ cup (50 g) edamame and a\nsixth of the pickles. If the cooked amounts come out different, weigh as\nyou pack: the cooked amounts above are what each bowl gets.\n<strong>Store:</strong> All 6 bowls in the fridge (Mon to Wed), with the\nsauce and cold toppings in their own containers.</li>\n</ol>\n<p><strong>Reheat</strong></p>\n<p>Microwave 1½ to 2 minutes (move the pickles to the side first if you\nlike them cold).</p>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>592</td>\n<td>53 g</td>\n<td>56 g</td>\n<td>16 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>431</td>\n<td>41 g</td>\n<td>38 g</td>\n<td>13 g</td>\n</tr>\n</tbody>\n</table>\n","3:D_bangbang":"<p><strong>Ingredients</strong></p>\n<ul>\n<li>10½ oz (300 g) frozen raw peeled and deveined shrimp (Rob)</li>\n<li>7½ oz (210 g) chicken breast (Maggie)</li>\n<li>1 tsp olive oil</li>\n<li>Seasoning: ¼ tsp salt, ¼ tsp garlic powder, a pinch of black\npepper</li>\n<li>15 g cornstarch</li>\n<li>Bang bang sauce: 1¾ tbsp light mayo, 2 tbsp (25 g) plain nonfat\nGreek yogurt, 1¾ tbsp sweet chili sauce, 1 tsp sriracha</li>\n<li>⅓ English cucumber (120 g)</li>\n<li>1¾ cups (120 g) coleslaw mix</li>\n<li>⅔ cup dry white rice</li>\n<li>Cooking spray</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Cook the rice: bring ⅔ cup dry white rice and 1⅓ cups water to a\nboil, cover, turn the heat to low and simmer 15 minutes, then let it sit\n5 minutes off the heat and fluff with a fork. (A microwave rice pouch\nworks too.)</li>\n<li>Thaw Rob's shrimp: seal it in a zip-top bag and sit it in a bowl of\ncold water for 15 minutes. Pat dry.</li>\n<li>Cut the chicken into 1-inch cubes. Toss the chicken and the shrimp,\nin separate bowls, with the olive oil and seasoning, then with the\ncornstarch.</li>\n<li>Spray the air fryer basket, add the chicken in one layer and spray\nthe tops. Air-fry at 400°F for 12 minutes, shaking once. Then air-fry\nthe shrimp the same way, 6 to 8 minutes, until pink.</li>\n<li>Sauce: whisk the light mayo, yogurt, sweet chili sauce and sriracha.\nToss the shrimp in a bit more than half of it and the chicken in the\nrest.</li>\n<li>Slice the cucumber.</li>\n<li><strong>Divide.</strong> Rob: 8½ oz (240 g) cooked shrimp in sauce\nover 1 cup (165 g) rice, with ¼ English cucumber (60 g) and ¾ cup (60 g)\nslaw. Maggie: 5½ oz (160 g) cooked chicken in sauce over ⅔ cup (95 g)\nrice, with ¼ English cucumber (60 g) and ¾ cup (60 g) slaw.</li>\n</ol>\n<p><strong>Reheat</strong></p>\n<p>Microwave the chicken and rice covered 1½ minutes (or the chicken in\nthe air fryer at 375°F for 3 minutes to crisp it), then add the sauce.\nCucumber and slaw stay cold.</p>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>639</td>\n<td>68 g</td>\n<td>72 g</td>\n<td>9 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>498</td>\n<td>52 g</td>\n<td>46 g</td>\n<td>10 g</td>\n</tr>\n</tbody>\n</table>\n","3:S_apple":"<p><strong>Ingredients</strong></p>\n<ul>\n<li>2 Honeycrisp apples (1 each)</li>\n<li>Part-skim mozzarella string cheese: 2 sticks for Rob, 1 for\nMaggie</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Wash the apples. That's it: no prep, no mixing the night\nbefore.</li>\n<li><strong>Divide.</strong> Rob: 1 Honeycrisp apple (180 g) and 2\nstring cheese sticks. Maggie: 1 Honeycrisp apple (180 g) and 1 string\ncheese stick.</li>\n</ol>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>254</td>\n<td>15 g</td>\n<td>27 g</td>\n<td>10 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>174</td>\n<td>8 g</td>\n<td>26 g</td>\n<td>5 g</td>\n</tr>\n</tbody>\n</table>\n","3:snack2:S_mshake":"<p><b>Rob's shake:</b> 1 scoop Tripact PB & vanilla protein, 240 ml (1 cup) Fairlife fat-free milk, 2 cups of raw baby spinach, 1 tbsp ground flax, 1 scoop collagen. Blend until smooth. 288 cal, 44 g protein, 13 g carbs.</p><p><b>Maggie (shake):</b> ¾ scoop vanilla whey, 200 ml (¾ cup) Fairlife fat-free milk, a handful (about 1 cup) of raw baby spinach, 60 g mixed berries, fresh or thawed frozen (about ⅓ cup). 204 cal, 32 g protein, 16 g carbs.</p>","3:B_oats_apple":"<p><span class=\"tag\">Made the night before: Monday and Wednesday\nnights</span></p>\n<p><em>Makes one batch, divided into 2 jars (1 Rob, 1 Maggie), made the\nnight before.</em></p>\n<p><strong>Ingredients</strong></p>\n<ul>\n<li>1⅓ cups (120 g) old-fashioned rolled oats</li>\n<li>1 tbsp (10 g) chia seeds</li>\n<li>1 tsp cinnamon</li>\n<li>2 pinches nutmeg</li>\n<li>1 cup (250 ml) Fairlife fat-free milk</li>\n<li>½ cup (125 g) plain nonfat Greek yogurt</li>\n<li>½ Honeycrisp apple (110 g), diced small</li>\n<li>2 tbsp sugar-free maple syrup</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>The night before (Monday night for Tuesday, Wednesday night for\nThursday), get out one mixing bowl and two 16-oz mason jars labeled\n\"Rob\" and \"Maggie\".</li>\n<li>Dice the half apple small.</li>\n<li>In the bowl, stir the oats, chia, cinnamon and nutmeg together.</li>\n<li>Pour in the Fairlife, Greek yogurt, diced apple and syrup and stir.\nIt thickens overnight.</li>\n<li>Set Rob's jar on the scale and zero it, then divide as below.</li>\n<li><strong>Divide.</strong> Rob: 355 g (about 1½ cups) in his jar.\nMaggie: the rest, about 260 g (1 cup), in her jar.\n<strong>Store:</strong> Make both jars the night before (Monday night\nfor Tuesday, Wednesday night for Thursday) and keep them in the fridge.\n<strong>To eat:</strong> Stir and eat cold.</li>\n</ol>\n<p><strong>Reheat</strong></p>\n<p>None. It is eaten cold, straight from the fridge.</p>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>430</td>\n<td>26 g</td>\n<td>68 g</td>\n<td>7 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>317</td>\n<td>19 g</td>\n<td>50 g</td>\n<td>5 g</td>\n</tr>\n</tbody>\n</table>\n","3:D_carnitas":"<p><span class=\"tag\">Sunday prep: the raw pork goes in the fridge, not\nthe freezer</span></p>\n<p><strong>Ingredients</strong></p>\n<ul>\n<li>14¾ oz (420 g) pork tenderloin</li>\n<li>Seasoning: 1 tsp cumin, 1 tsp dried oregano, 2 garlic cloves\n(minced), ½ tsp salt, ¼ tsp black pepper</li>\n<li>1½ tsp olive oil</li>\n<li>¼ cup (55 ml) orange juice and 2 tbsp water</li>\n<li>5 small (8-inch) low-carb tortillas</li>\n<li>Slaw: 2¼ cups (160 g) coleslaw mix, juice of ½ lime, a pinch of\nsalt</li>\n<li>Pico: 1⅔ Roma tomatoes (120 g), ¼ white onion (40 g), 1 tbsp chopped\nfresh cilantro, juice of ½ lime, a pinch of salt</li>\n<li>¼ cup (60 g) plain nonfat Greek yogurt</li>\n<li>1 tbsp (10 g) crumbled feta (Maggie)</li>\n<li>¾ cup (130 g) frozen corn and ½ tsp Tajín</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Cut the pork into 1-inch cubes and toss with the seasoning.</li>\n<li>Heat the olive oil in a skillet over medium-high. Sear the pork 4\nminutes, turning.</li>\n<li>Add the orange juice and water, cover, turn the heat to medium-low\nand simmer 10 minutes.</li>\n<li>Uncover and cook 3 to 5 minutes more, until the liquid is gone and\nthe edges crisp. Shred with two forks.</li>\n<li>Pico: dice the tomatoes and onion and mix with the cilantro, lime\njuice and salt.</li>\n<li>Slaw: toss the coleslaw mix with the lime juice and salt.</li>\n<li>Char the corn in a dry pan over medium-high, 4 to 5 minutes, and\nsprinkle with the Tajín.</li>\n<li>Warm the tortillas: wrap them in a damp paper towel and microwave 30\nseconds.</li>\n<li><strong>Divide.</strong> Rob: 3 tortillas, 6 oz (170 g) cooked pork,\nhalf the slaw and pico, 2 tbsp yogurt as crema and ⅔ cup (100 g) corn on\nthe side. Maggie: 2 tortillas, 5¼ oz (145 g) cooked pork, half the slaw\nand pico, 2 tbsp yogurt as crema, 1 tbsp (10 g) feta and 3 tbsp (30 g)\ncorn on the side.</li>\n</ol>\n<p><strong>Reheat</strong></p>\n<p>Pork in a skillet over medium-high, 2 to 3 minutes, to crisp the\nedges (or microwave 1 minute). Warm the tortillas 15 seconds wrapped in\na damp paper towel. Slaw, pico and yogurt stay cold.</p>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>641</td>\n<td>71 g</td>\n<td>71 g</td>\n<td>19 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>500</td>\n<td>58 g</td>\n<td>45 g</td>\n<td>17 g</td>\n</tr>\n</tbody>\n</table>\n","3:S_rollup":"<p><strong>Ingredients</strong></p>\n<ul>\n<li>7 oz (200 g) oven-roasted deli turkey breast, sliced thin</li>\n<li>1½ slices provolone</li>\n<li>¼ cup (60 g) dill pickle chips</li>\n<li>3 clementines (2 for Rob, 1 for Maggie)</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Lay out the turkey slices. Put a strip of provolone and a few pickle\nchips on each one and roll it up.</li>\n<li>Peel the clementines.</li>\n<li><strong>Divide.</strong> Rob: 4 oz (113 g) deli turkey rolled up\nwith 1 slice provolone and 3 tbsp (30 g) pickle chips, plus 2\nclementines. Maggie: 3 oz (85 g) deli turkey rolled up with ½ slice\nprovolone and 3 tbsp (30 g) pickle chips, plus 1 clementine.</li>\n</ol>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>251</td>\n<td>28 g</td>\n<td>21 g</td>\n<td>7 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>155</td>\n<td>19 g</td>\n<td>12 g</td>\n<td>4 g</td>\n</tr>\n</tbody>\n</table>\n","3:snack2:S_eggs":"<p><b>Rob's shake:</b> 1 scoop Tripact PB & vanilla protein, 240 ml (1 cup) Fairlife fat-free milk, 2 cups of raw baby spinach, 1 tbsp ground flax, 1 scoop collagen. Blend until smooth. 288 cal, 44 g protein, 13 g carbs.</p><p><b>Maggie (edamame + egg):</b> 85 g frozen shelled edamame (about ½ cup), 1 egg. 174 cal, 16 g protein, 8 g carbs.</p>","3:D_parm":"<p><span class=\"tag\">Sunday prep: bag and freeze the raw\nchicken</span></p>\n<p><strong>Ingredients</strong></p>\n<ul>\n<li>13½ oz (380 g) chicken breast: 8 oz (225 g) for Rob, 5½ oz (155 g)\nfor Maggie</li>\n<li>¼ tsp salt and ¼ tsp black pepper</li>\n<li>Coating: ⅔ cup (35 g) panko, 3 tbsp (14 g) grated parmesan, ½ tsp\nItalian seasoning, ¼ tsp garlic powder</li>\n<li>3½ tbsp (50 g) liquid egg whites</li>\n<li>1 cup (275 g) marinara</li>\n<li>⅓ cup (34 g) shredded part-skim mozzarella</li>\n<li>1 medium zucchini (225 g)</li>\n<li>A pinch of salt and ¼ tsp garlic powder for the zucchini</li>\n<li>1¾ oz (50 g) dry spaghetti, plus 1 tbsp salt for the water</li>\n<li>Cooking spray</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Two nights before (Monday night for Wednesday, Friday night for\nSunday), move the raw chicken from the freezer to the fridge.</li>\n<li>Put a pot of water with 1 tbsp salt on to boil.</li>\n<li>Butterfly each chicken breast: slice it horizontally almost all the\nway through and open it like a book. Season with the salt and\npepper.</li>\n<li>Mix the coating on a plate. Pour the egg whites into a shallow\nbowl.</li>\n<li>Dip each piece in the egg white, then press it into the coating on\nboth sides.</li>\n<li>Spray the air fryer basket, lay in the chicken and spray the tops.\nAir-fry at 400°F for 10 to 12 minutes, until 165°F.</li>\n<li>Meanwhile cook the spaghetti as the package says and drain.</li>\n<li>Slice the zucchini into half-moons. Cook in a sprayed pan over\nmedium-high with the salt and garlic powder, 4 minutes.</li>\n<li>Spoon 2 tbsp marinara over each piece of chicken and top with the\nmozzarella (3 tbsp (20 g) mozzarella on Rob's, 2 tbsp (14 g) mozzarella\non Maggie's). Air-fry 2 more minutes, until melted.</li>\n<li>Pour the rest of the marinara into the zucchini pan to warm, then\ntoss in the spaghetti.</li>\n<li><strong>Divide.</strong> Rob: his chicken parm, 6 oz (170 g) cooked\nchicken, with ½ cup cooked spaghetti (1 oz dry) and just under half the\nzucchini and sauce. Maggie: her chicken parm, 4 oz (115 g) cooked\nchicken, with ½ cup cooked spaghetti (1 oz dry) and just over half the\nzucchini and sauce.</li>\n</ol>\n<p><strong>Reheat</strong></p>\n<p>Best eaten fresh. Leftovers: chicken in the air fryer at 375°F, 4 to\n5 minutes (the microwave makes the breading soggy). Pasta and zucchini:\nmicrowave covered 1 to 1½ minutes.</p>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>645</td>\n<td>71 g</td>\n<td>48 g</td>\n<td>17 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>502</td>\n<td>51 g</td>\n<td>43 g</td>\n<td>13 g</td>\n</tr>\n</tbody>\n</table>\n","3:S_edamame":"<p><strong>Ingredients</strong></p>\n<ul>\n<li>1¾ cups (265 g) frozen shelled edamame</li>\n<li>1 navel orange (Rob) and 1 clementine (Maggie)</li>\n<li>A pinch of kosher salt</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Microwave the edamame in a covered bowl with 1 tbsp water, 2\nminutes, until hot. Drain and sprinkle with the salt.</li>\n<li>Peel the fruit.</li>\n<li><strong>Divide.</strong> Rob: 1 cup (155 g) edamame and 1 navel\norange (140 g). Maggie: ¾ cup (110 g) edamame and 1 clementine.</li>\n</ol>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>253</td>\n<td>20 g</td>\n<td>30 g</td>\n<td>8 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>168</td>\n<td>14 g</td>\n<td>19 g</td>\n<td>6 g</td>\n</tr>\n</tbody>\n</table>\n","3:snack2:S_cottage":"<p><b>Rob's shake:</b> 1 scoop Tripact PB & vanilla protein, 240 ml (1 cup) Fairlife fat-free milk, 2 cups of raw baby spinach, 1 tbsp ground flax, 1 scoop collagen. Blend until smooth. 288 cal, 44 g protein, 13 g carbs.</p><p><b>Maggie (cottage cheese ranch dip):</b> 170 g 2% cottage cheese (about ¾ cup), 100 g yellow or orange bell pepper (about ⅔ pepper), 75 g English cucumber (about ¼ cucumber), with 1 tsp ranch seasoning stirred into the cottage cheese. 180 cal, 20 g protein, 16 g carbs.</p>","3:L_ranch":"<p><span class=\"tag\">Sunday prep: the whole batch</span></p>\n<p><em>Makes 8 containers (4 Rob, 4 Maggie).</em></p>\n<p><strong>Ingredients</strong></p>\n<ul>\n<li>2⅔ lb (1,200 g) Yukon gold potatoes, about 7 medium</li>\n<li>1 tbsp olive oil, ½ tsp salt, ½ tsp garlic powder</li>\n<li>2¾ lb (1,250 g) chicken breast</li>\n<li>Chicken seasoning: 1 tsp salt, 1 tsp garlic powder, 1 tsp paprika, ½\ntsp black pepper</li>\n<li>8 slices turkey bacon</li>\n<li>3 cups (300 g) green beans, trimmed</li>\n<li>Sauce: 1½ cups (340 g) plain nonfat Greek yogurt, ½ cup (120 ml)\nFairlife fat-free milk, 2 to 3 tbsp ranch seasoning</li>\n<li>1½ cups (6 oz) shredded reduced-fat cheddar</li>\n<li>Cooking spray and a 9x13 pan</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Heat the oven to 425°F. Spray two sheet pans.</li>\n<li>Cut the potatoes into ¾-inch cubes, toss with the olive oil, salt\nand garlic powder, and roast 25 minutes.</li>\n<li>Season the chicken with the chicken seasoning and bake it on the\nother rack 18 to 22 minutes, until 165°F. Rest 5 minutes and dice.</li>\n<li>Cook the turkey bacon in a skillet over medium, 3 to 4 minutes a\nside, until crisp. Crumble it.</li>\n<li>Bring a pot of water to a boil. Cook the green beans 3 minutes,\ndrain and cut into thirds.</li>\n<li>Sauce: whisk the yogurt, Fairlife and 2 tbsp ranch seasoning. Taste\nand add up to 1 more tbsp ranch.</li>\n<li>Turn the oven down to 375°F. In a sprayed 9x13 pan mix the potatoes,\nchicken, bacon, green beans and sauce. Top with the cheddar.</li>\n<li>Bake 20 minutes, until the cheese melts. Cool 15 minutes before\npacking.</li>\n<li><strong>Divide.</strong> Rob: 4 containers of 2⅓ cups (470 g) each.\nMaggie: 4 containers of 1⅔ cups (340 g) each. <strong>Store:</strong>\nAll 8 containers in the freezer. Two nights before each lunch, move that\nday's 2 containers to the fridge: Tuesday night for Thursday, Wednesday\nnight for Friday, Thursday night for Saturday, Friday night for Sunday.\nCooked food keeps 3 to 4 days in the fridge, which is why these start\nfrozen.</li>\n</ol>\n<p><strong>Reheat</strong></p>\n<p>Microwave covered 2½ to 3 minutes, stirring halfway, until hot in the\nmiddle. If it is still partly frozen, run it 2 minutes on defrost\nfirst.</p>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>595</td>\n<td>67 g</td>\n<td>42 g</td>\n<td>17 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>430</td>\n<td>49 g</td>\n<td>30 g</td>\n<td>12 g</td>\n</tr>\n</tbody>\n</table>\n","3:D_steakfrites":"<p><span class=\"tag\">Sunday prep: bag and freeze the raw\nsteak</span></p>\n<p><strong>Ingredients</strong></p>\n<ul>\n<li>Sirloin steaks: about 9 oz raw for Rob, about 7 oz raw for\nMaggie</li>\n<li>½ tsp salt and ¼ tsp black pepper</li>\n<li>1¼ medium Yukon gold potatoes (215 g)</li>\n<li>2 tsp olive oil, ½ tsp salt, ¼ tsp garlic powder</li>\n<li>Chimichurri: 3 tbsp chopped fresh flat-leaf parsley, 1 small garlic\nclove, 1½ tsp olive oil, 1½ tsp red wine vinegar, a pinch each of red\npepper flakes and salt</li>\n<li>Salad: 3¼ cups (150 g) chopped romaine, about 7 cherry tomatoes (100\ng), 1 cup (30 g) baby spinach for Maggie, 4 tbsp light balsamic\nvinaigrette</li>\n<li>Cooking spray</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Two nights before (Tuesday night), move the raw steak from the\nfreezer to the fridge.</li>\n<li>Cut the potatoes into ¼-inch fries. Toss with the olive oil, salt\nand garlic powder.</li>\n<li>Air-fry at 400°F for 18 to 20 minutes, shaking twice.</li>\n<li>Chimichurri: finely chop the parsley and garlic and stir them with\nthe olive oil, vinegar, red pepper flakes and salt.</li>\n<li>Pat the steaks dry and season them with the salt and pepper.</li>\n<li>Heat a cast-iron pan over high until it just smokes, spray it and\nsear the steaks 3 to 4 minutes a side (130°F for medium-rare). Rest 5\nminutes and slice.</li>\n<li>Salad: halve the tomatoes and toss each person's greens with 2 tbsp\nvinaigrette.</li>\n<li><strong>Divide.</strong> Rob: his 6½ oz (185 g) steak with 1 tbsp\nchimichurri, 1¼ cups fries (100 g cooked) and a salad of 1⅔ cups (75 g)\nromaine, half the tomatoes and 2 tbsp vinaigrette. Maggie: her 5 oz (145\ng) steak with 1 tbsp chimichurri, ⅔ cup fries (55 g cooked) and a salad\nof 1⅔ cups (75 g) romaine, 1 cup (30 g) spinach, half the tomatoes and 2\ntbsp vinaigrette.</li>\n</ol>\n<p><strong>Reheat</strong></p>\n<p>Best eaten fresh. Leftovers: steak in a skillet over low, 1 to 2\nminutes; fries in the air fryer at 400°F, 3 to 4 minutes. Chimichurri\nand salad stay cold.</p>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>640</td>\n<td>59 g</td>\n<td>32 g</td>\n<td>32 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>499</td>\n<td>47 g</td>\n<td>22 g</td>\n<td>26 g</td>\n</tr>\n</tbody>\n</table>\n","3:D_crunchwrap":"<p><span class=\"tag\">Sunday prep: bag and freeze the raw beef</span></p>\n<p><strong>Ingredients</strong></p>\n<ul>\n<li>12¾ oz (365 g) 95% lean ground beef</li>\n<li>1 tbsp taco seasoning and 2 tbsp water</li>\n<li>3 large (10-inch) low-carb tortillas: 2 for Rob, 1 for Maggie</li>\n<li>1½ small (8-inch) low-carb tortillas</li>\n<li>⅓ cup (70 g) plain nonfat Greek yogurt</li>\n<li>⅓ cup (35 g) shredded Mexican-blend cheese</li>\n<li>1⅔ cups (80 g) shredded romaine</li>\n<li>1 Roma tomato (80 g), diced</li>\n<li>4 tbsp jarred salsa</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Two nights before (Wednesday night), move the raw beef from the\nfreezer to the fridge.</li>\n<li>Heat a skillet over high until very hot. Brown the beef 6 minutes,\nleaving it alone for the first 3. If liquid pools in the pan, spoon or\npour it off and keep cooking on high until the meat browns.</li>\n<li>Add the taco seasoning and water and simmer 2 minutes, until thick.\nMove to a bowl and wipe the skillet.</li>\n<li>Toast the small tortillas in the dry skillet, 1 to 2 minutes a side,\nuntil crisp. Break them into 3 halves.</li>\n<li>Lay out the large tortillas. In the center of each, layer the beef\n(1 cup (140 g) cooked beef split across Rob's 2, 1 cup (135 g) cooked\nbeef on Maggie's), the cheese, a crisp tortilla half, the yogurt,\nromaine and tomato.</li>\n<li>Fold the edges up toward the center in pleats until it's\nclosed.</li>\n<li>Toast seam-side down in the dry skillet over medium, 2 to 3 minutes\na side, until golden.</li>\n<li><strong>Divide.</strong> Rob: his 2 crunchwraps with 2 tbsp salsa to\ndip. Maggie: her crunchwrap with 2 tbsp salsa to dip.</li>\n</ol>\n<p><strong>Reheat</strong></p>\n<p>Best eaten fresh. Leftovers: air fryer at 350°F, 4 to 5 minutes, or a\ndry skillet over medium, 2 minutes a side, until crisp and hot (the\nmicrowave makes it soggy).</p>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>639</td>\n<td>67 g</td>\n<td>76 g</td>\n<td>23 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>472</td>\n<td>55 g</td>\n<td>41 g</td>\n<td>17 g</td>\n</tr>\n</tbody>\n</table>\n","3:snack2:S_jerky":"<p><b>Rob's shake:</b> 1 scoop Tripact PB & vanilla protein, 240 ml (1 cup) Fairlife fat-free milk, 2 cups of raw baby spinach, 1 tbsp ground flax, 1 scoop collagen. Blend until smooth. 288 cal, 44 g protein, 13 g carbs.</p><p><b>Maggie (jerky + pear):</b> 28 g (1 oz) original beef jerky, 180 g Bartlett pear (about 1 pear). 183 cal, 11 g protein, 33 g carbs.</p>","3:B_bbwaffles":"<p><strong>Ingredients</strong></p>\n<ul>\n<li>1 cup (115 g) Kodiak Power Cakes mix</li>\n<li>1¼ bananas (140 g)</li>\n<li>⅔ cup (160 ml) Fairlife fat-free milk</li>\n<li>2 large eggs (1 each)</li>\n<li>1 tsp cinnamon</li>\n<li>2 pinches nutmeg</li>\n<li>2 tbsp sugar-free maple syrup</li>\n<li>Cooking spray</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Plug in the waffle iron to heat.</li>\n<li>Rob's batter: mash ¾ banana (80 g) in a bowl, then whisk in ⅔ cup\n(70 g) Kodiak mix, ½ cup (100 ml) Fairlife, 1 egg, ½ tsp cinnamon and a\npinch of nutmeg.</li>\n<li>Maggie's batter: mash ½ banana (60 g), then whisk in ½ cup (45 g)\nKodiak mix, ¼ cup (60 ml) Fairlife, 1 egg, ½ tsp cinnamon and a pinch of\nnutmeg.</li>\n<li>Spray the waffle iron. Cook Rob's batter about 4 minutes, until\ngolden. Spray again and cook Maggie's.</li>\n<li><strong>Divide.</strong> Rob: his waffles with 1 tbsp sugar-free\nmaple syrup. Maggie: her waffles with 1 tbsp sugar-free maple\nsyrup.</li>\n</ol>\n<p><strong>Reheat</strong></p>\n<p>Best eaten fresh. Leftover waffles: toaster or air fryer at 350°F, 2\nto 3 minutes, until crisp (the microwave makes them soft).</p>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>437</td>\n<td>31 g</td>\n<td>64 g</td>\n<td>8 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>316</td>\n<td>22 g</td>\n<td>44 g</td>\n<td>7 g</td>\n</tr>\n</tbody>\n</table>\n","3:D_bbq":"<p><span class=\"tag\">Sunday prep: bag and freeze the raw\nchicken</span></p>\n<p><strong>Ingredients</strong></p>\n<ul>\n<li>15¼ oz (435 g) chicken breast</li>\n<li>4½ tbsp sugar-free BBQ sauce (G Hughes or similar)</li>\n<li>½ tsp smoked paprika, ½ tsp garlic powder, ¼ tsp salt, ¼ cup\nwater</li>\n<li>2½ medium sweet potatoes (510 g)</li>\n<li>1 tsp olive oil and ¼ tsp salt</li>\n<li>Slaw: 2¾ cups (200 g) coleslaw mix, 3 tbsp (45 g) plain nonfat Greek\nyogurt, 2 tsp light mayo, 1 tsp red wine vinegar, a pinch each of salt\nand pepper</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Two nights before (Thursday night), move the raw chicken from the\nfreezer to the fridge.</li>\n<li>Put the chicken in a slow cooker with half the BBQ sauce, the\npaprika, garlic powder, salt and water. Cook 4 hours on low (or 10\nminutes on high in a pressure cooker, then 5 minutes natural\nrelease).</li>\n<li>Shred the chicken with two forks and toss with the rest of the BBQ\nsauce.</li>\n<li>Heat the oven to 425°F. Cut the sweet potatoes into ¾-inch cubes,\ntoss with the olive oil and salt, and roast 25 minutes.</li>\n<li>Slaw: toss the coleslaw mix with the yogurt, light mayo, vinegar,\nsalt and pepper.</li>\n<li><strong>Divide.</strong> Rob: 6 oz (170 g) cooked chicken, shredded\nin BBQ sauce, 1¾ cups roasted sweet potato (235 g cooked) and half the\nslaw. Maggie: 5½ oz (160 g) cooked chicken, shredded in BBQ sauce, 1 cup\nroasted sweet potato (145 g cooked) and half the slaw.</li>\n</ol>\n<p><strong>Reheat</strong></p>\n<p>Microwave the chicken and sweet potato covered 1½ to 2 minutes. Slaw\nstays cold.</p>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>639</td>\n<td>60 g</td>\n<td>75 g</td>\n<td>11 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>498</td>\n<td>54 g</td>\n<td>50 g</td>\n<td>9 g</td>\n</tr>\n</tbody>\n</table>\n","3:B_shakshuka":"<p><strong>Ingredients</strong></p>\n<ul>\n<li>¾ red bell pepper (120 g), diced</li>\n<li>⅓ yellow onion (60 g), diced</li>\n<li>1½ tsp olive oil</li>\n<li>1 garlic clove, minced</li>\n<li>Spices: 1 tsp cumin, 1 tsp smoked paprika, ¼ tsp red pepper flakes,\n½ tsp salt</li>\n<li>1½ cups (350 g) canned crushed tomatoes</li>\n<li>5 large eggs</li>\n<li>2 tbsp (15 g) crumbled feta (Maggie)</li>\n<li>1 Trader Joe's English muffin, split</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Heat the olive oil in a 10-inch skillet over medium. Add the pepper\nand onion and cook 5 minutes, until soft.</li>\n<li>Add the garlic and spices and stir 30 seconds.</li>\n<li>Add the crushed tomatoes and simmer 8 minutes, until thickened.</li>\n<li>Make 5 wells in the sauce: 3 on Rob's side, 2 on Maggie's. Crack an\negg into each.</li>\n<li>Cover, turn the heat to low and cook 6 to 8 minutes, until the\nwhites are set and the yolks are still soft.</li>\n<li>Crumble the feta over Maggie's side. Toast the muffin halves.</li>\n<li><strong>Divide.</strong> Rob: his 3 eggs with a bit more than half\nthe sauce and half the English muffin. Maggie: her 2 eggs with the rest\nof the sauce, 1½ tbsp (15 g) feta and half the English muffin.</li>\n</ol>\n<p><strong>Reheat</strong></p>\n<p>Best eaten fresh. Leftovers: covered in a small skillet over low, 4\nto 5 minutes, or microwave covered at half power 1½ minutes so the eggs\ndon't go rubbery. Toast fresh bread.</p>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>406</td>\n<td>26 g</td>\n<td>34 g</td>\n<td>20 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>350</td>\n<td>21 g</td>\n<td>31 g</td>\n<td>17 g</td>\n</tr>\n</tbody>\n</table>\n","3:S_popcorn":"<p><strong>Ingredients</strong></p>\n<ul>\n<li>7 cups (55 g) popcorn: air-popped, or a 94% fat-free microwave\nbag</li>\n<li>2½ oz (70 g) original beef jerky</li>\n<li>Cooking spray and a pinch of salt</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Pop the popcorn. If it is air-popped, mist it with cooking spray and\ntoss with the salt so it sticks.</li>\n<li><strong>Divide.</strong> Rob: 4 cups popcorn (32 g) and 42 g (1½ oz)\noriginal beef jerky. Maggie: 3 cups popcorn (24 g) and 28 g (1 oz)\noriginal beef jerky.</li>\n</ol>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>244</td>\n<td>19 g</td>\n<td>34 g</td>\n<td>3 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>173</td>\n<td>13 g</td>\n<td>25 g</td>\n<td>2 g</td>\n</tr>\n</tbody>\n</table>\n","4:B_sandwich":"<p><span class=\"tag\">Sunday prep: freeze Wednesday's and Friday's\nsausage links</span></p>\n<p><em>Makes 2 sandwiches each morning, made fresh.</em></p>\n<p><strong>Ingredients</strong></p>\n<ul>\n<li>4 Trader Joe's chicken breakfast sausage links (2 each)</li>\n<li>3 large eggs: 2 for Rob, 1 for Maggie</li>\n<li>A pinch each of salt and black pepper</li>\n<li>2 Trader Joe's English muffins (straight from the freezer)</li>\n<li>2 slices American cheese</li>\n<li>Cooking spray</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Air-fry the 4 links at 400°F for 8 to 10 minutes, turning once,\nuntil 165°F inside. Split each one lengthwise so it lies flat.</li>\n<li>Split and toast the English muffins from frozen.</li>\n<li>Heat a sprayed nonstick pan over medium. Crack in Rob's 2 eggs\ntogether on one side and Maggie's egg on the other, break the yolks,\nseason and cook 2 minutes, then flip.</li>\n<li>Lay a cheese slice on each person's eggs and cook 30 seconds more,\nuntil it melts.</li>\n<li>Build each sandwich: muffin bottom, 2 split links, the eggs and\ncheese, muffin top.</li>\n<li><strong>Divide.</strong> Rob: his sandwich (2 links, 2 eggs, 1 slice\nof cheese). Maggie: her sandwich (2 links, 1 egg, 1 slice of cheese).\n<strong>Store:</strong> Made fresh each morning. On Sunday, Monday's 4\nsausage links stay in the fridge; Wednesday's and Friday's go in the\nfreezer in two bags. Move each bag to the fridge two nights before:\nMonday night for Wednesday, Wednesday night for Friday.</li>\n</ol>\n<p><strong>Reheat</strong></p>\n<p>Best eaten fresh. A leftover sandwich: wrap it in a paper towel and\nmicrowave about 45 seconds.</p>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>403</td>\n<td>32 g</td>\n<td>27 g</td>\n<td>17 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>332</td>\n<td>25 g</td>\n<td>27 g</td>\n<td>12 g</td>\n</tr>\n</tbody>\n</table>\n","4:L_greek":"<p><span class=\"tag\">Sunday prep: pack all 6 bowls</span></p>\n<p><em>Makes 6 bowls (3 Rob, 3 Maggie).</em></p>\n<p><strong>Ingredients</strong></p>\n<ul>\n<li>2½ lb (1,085 g) raw chicken breast</li>\n<li>Marinade: juice of 1 lemon, 2 tsp dried oregano, 3 garlic cloves\n(minced), 1 tsp salt, ½ tsp black pepper, 1 tbsp olive oil</li>\n<li>1⅓ cups dry white rice</li>\n<li>Salad: 1½ English cucumbers (450 g), 6 Roma tomatoes (450 g), ¼ tsp\nsalt, 1 tsp red wine vinegar</li>\n<li>Tzatziki: 1½ cups (330 g) plain nonfat Greek yogurt, ¼ English\ncucumber (75 g), 1 garlic clove, 1 tsp dried dill, juice of ½ lemon, ¼\ntsp salt</li>\n<li>⅓ cup (45 g) crumbled feta (Maggie)</li>\n<li>¾ cup hummus</li>\n<li>8 cups (375 g) chopped romaine</li>\n<li>3 cups (90 g) baby spinach (Maggie)</li>\n<li>Containers: 6, plus 12 sauce cups</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Heat the oven to 425°F and spray a sheet pan.</li>\n<li>Toss the chicken with the marinade. Bake 18 to 22 minutes, until\n165°F. Rest 5 minutes and slice.</li>\n<li>Cook the rice: bring 1⅓ cups dry white rice and 2⅔ cups water to a\nboil, cover, turn the heat to low and simmer 15 minutes, then let it sit\n5 minutes off the heat and fluff with a fork. (A microwave rice pouch\nworks too.)</li>\n<li>Salad: dice the cucumbers and tomatoes and toss with the salt and\nvinegar.</li>\n<li>Tzatziki: grate the ¼ cucumber, squeeze it dry in a paper towel, and\nstir it into the yogurt with the grated garlic, dill, lemon juice and\nsalt.</li>\n<li><strong>Divide.</strong> Rob: each of his 3 bowls gets 1 cup (150 g)\nsliced chicken, 1 cup (150 g) rice, a sixth of the salad and 1 cup (50\ng) romaine; 2 tbsp hummus and ¼ cup tzatziki in sauce cups. Maggie: each\nof her 3 bowls gets ¾ cup (110 g) sliced chicken, ⅓ cup (60 g) rice, a\nsixth of the salad, 1⅔ cups (75 g) romaine, 1 cup (30 g) spinach and 1½\ntbsp (15 g) feta; 2 tbsp hummus and ¼ cup tzatziki in sauce cups. If the\ncooked amounts come out different, weigh as you pack: the cooked amounts\nabove are what each bowl gets. <strong>Store:</strong> All 6 bowls in\nthe fridge (Mon to Wed), with the sauce and cold toppings in their own\ncontainers.</li>\n</ol>\n<p><strong>Reheat</strong></p>\n<p>Eat it cold, or warm the chicken and rice 1 minute first.</p>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>587</td>\n<td>61 g</td>\n<td>56 g</td>\n<td>12 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>440</td>\n<td>48 g</td>\n<td>33 g</td>\n<td>13 g</td>\n</tr>\n</tbody>\n</table>\n","4:D_steaksalad":"<p><strong>Ingredients</strong></p>\n<ul>\n<li>Sirloin steaks: about 9 oz raw for Rob, about 6½ oz raw for\nMaggie</li>\n<li>½ tsp salt and ¼ tsp black pepper</li>\n<li>1¼ medium Yukon gold potatoes (200 g), 1 tsp olive oil and a pinch\nof salt</li>\n<li>4¼ cups (200 g) chopped romaine</li>\n<li>3 cups (90 g) baby spinach</li>\n<li>1 Bartlett pear (180 g)</li>\n<li>2 tbsp (15 g) crumbled blue cheese (Maggie)</li>\n<li>2 tbsp (10 g) shaved or grated parmesan (Rob)</li>\n<li>A thin wedge of red onion (30 g)</li>\n<li>4 tbsp light balsamic vinaigrette</li>\n<li>Cooking spray</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Potato croutons: cut the potato into ½-inch cubes, toss with the\nolive oil and salt, and air-fry at 400°F for 15 minutes, shaking once,\nuntil crisp.</li>\n<li>Season the steaks with the salt and pepper.</li>\n<li>Heat a cast-iron pan over high until it just smokes, spray it and\nsear the steaks 3 to 4 minutes a side. Rest 5 minutes and slice\nthin.</li>\n<li>Slice the pear and the red onion thin.</li>\n<li><strong>Divide.</strong> Rob: a big bowl of 2¼ cups (100 g) romaine,\n1⅓ cups (40 g) spinach, ½ Bartlett pear (100 g), 2 tbsp (10 g) parmesan,\nhalf the red onion and 2 tbsp vinaigrette, topped with his 6½ oz (185 g)\nsteak and ⅔ cup crispy potato croutons (90 g cooked). Maggie: a bowl of\n2¼ cups (100 g) romaine, 1⅔ cups (50 g) spinach, ½ Bartlett pear (80 g),\n2 tbsp (15 g) blue cheese, half the red onion and 2 tbsp vinaigrette,\ntopped with her 4¾ oz (135 g) steak and ⅓ cup crispy potato croutons (55\ng cooked).</li>\n</ol>\n<p><strong>Reheat</strong></p>\n<p>Eat it cold, or warm the steak and potatoes 20 to 30 seconds in the\nmicrowave. Keep the dressing separate until you eat.</p>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>638</td>\n<td>64 g</td>\n<td>47 g</td>\n<td>24 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>503</td>\n<td>48 g</td>\n<td>35 g</td>\n<td>21 g</td>\n</tr>\n</tbody>\n</table>\n","4:S_apple":"<p><strong>Ingredients</strong></p>\n<ul>\n<li>2 Honeycrisp apples (1 each)</li>\n<li>Part-skim mozzarella string cheese: 2 sticks for Rob, 1 for\nMaggie</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Wash the apples. That's it: no prep, no mixing the night\nbefore.</li>\n<li><strong>Divide.</strong> Rob: 1 Honeycrisp apple (180 g) and 2\nstring cheese sticks. Maggie: 1 Honeycrisp apple (180 g) and 1 string\ncheese stick.</li>\n</ol>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>254</td>\n<td>15 g</td>\n<td>27 g</td>\n<td>10 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>174</td>\n<td>8 g</td>\n<td>26 g</td>\n<td>5 g</td>\n</tr>\n</tbody>\n</table>\n","4:snack2:S_mshake":"<p><b>Rob's shake:</b> 1 scoop Tripact PB & vanilla protein, 240 ml (1 cup) Fairlife fat-free milk, 2 cups of raw baby spinach, 1 tbsp ground flax, 1 scoop collagen. Blend until smooth. 288 cal, 44 g protein, 13 g carbs.</p><p><b>Maggie (shake):</b> ¾ scoop vanilla whey, 200 ml (¾ cup) Fairlife fat-free milk, a handful (about 1 cup) of raw baby spinach, 60 g mixed berries, fresh or thawed frozen (about ⅓ cup). 204 cal, 32 g protein, 16 g carbs.</p>","4:B_oats_pb":"<p><span class=\"tag\">Made the night before: Monday and Wednesday\nnights</span></p>\n<p><em>Makes one batch, divided into 2 jars (1 Rob, 1 Maggie), made the\nnight before.</em></p>\n<p><strong>Ingredients</strong></p>\n<ul>\n<li>1 cup (85 g) old-fashioned rolled oats</li>\n<li>1 tbsp (10 g) chia seeds</li>\n<li>3½ tbsp PB2</li>\n<li>1 cup (250 ml) Fairlife fat-free milk</li>\n<li>½ cup (125 g) plain nonfat Greek yogurt</li>\n<li>In the morning: 1 banana</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>The night before (Monday night for Tuesday, Wednesday night for\nThursday), get out one mixing bowl and two 16-oz mason jars labeled\n\"Rob\" and \"Maggie\".</li>\n<li>In the bowl, stir the oats, chia and PB2 together.</li>\n<li>Pour in the Fairlife and Greek yogurt and stir until smooth. It\nthickens overnight.</li>\n<li>Set Rob's jar on the scale and zero it, then divide as below.</li>\n<li><strong>Divide.</strong> Rob: 290 g (about 1¼ cups) in his jar; in\nthe morning top with ½ banana (60 g), sliced. Maggie: the rest, about\n205 g (¾ cup), in her jar; in the morning top with ½ banana (50 g),\nsliced. <strong>Store:</strong> Make both jars the night before (Monday\nnight for Tuesday, Wednesday night for Thursday) and keep them in the\nfridge.</li>\n</ol>\n<p><strong>Reheat</strong></p>\n<p>None. It is eaten cold, straight from the fridge.</p>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>430</td>\n<td>30 g</td>\n<td>62 g</td>\n<td>7 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>312</td>\n<td>21 g</td>\n<td>45 g</td>\n<td>5 g</td>\n</tr>\n</tbody>\n</table>\n","4:D_quesadilla":"<p><span class=\"tag\">Sunday prep: the raw chicken goes in the fridge,\nnot the freezer</span></p>\n<p><strong>Ingredients</strong></p>\n<ul>\n<li>14½ oz (410 g) chicken breast</li>\n<li>Seasoning: ½ tsp chili powder, ½ tsp cumin, ¼ tsp garlic powder, ¼\ntsp salt</li>\n<li>¾ red bell pepper (120 g)</li>\n<li>⅓ yellow onion (60 g)</li>\n<li>1 tsp olive oil</li>\n<li>3 large (10-inch) low-carb tortillas: 2 for Rob, 1 for Maggie</li>\n<li>½ cup (55 g) shredded Mexican-blend cheese</li>\n<li>Pico: 1⅔ Roma tomatoes (120 g), 1 tbsp chopped fresh cilantro, juice\nof ½ lime, a pinch of salt</li>\n<li>⅓ cup (70 g) plain nonfat Greek yogurt</li>\n<li>4 tbsp jarred salsa</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Season the chicken and air-fry at 400°F for 14 minutes, until 165°F.\nRest 5 minutes and slice thin.</li>\n<li>Slice the pepper and onion. Cook them in the olive oil in a skillet\nover medium-high, 6 minutes. Move to a plate and wipe the skillet.</li>\n<li>Pico: dice the tomatoes and mix with the cilantro, lime juice and\nsalt.</li>\n<li>On half of each tortilla, layer cheese, chicken and peppers: ¼ cup\n(30 g) Mexican-blend cheese and 5¼ oz (150 g) cooked chicken split\nacross Rob's 2; ¼ cup (25 g) Mexican-blend cheese and 5½ oz (160 g)\ncooked chicken on Maggie's. Fold over.</li>\n<li>Toast in the dry skillet over medium, 2 to 3 minutes a side, until\ngolden and melted. Cut into wedges.</li>\n<li><strong>Divide.</strong> Rob: his 2 quesadillas with half the pico,\n3 tbsp (40 g) Greek yogurt as crema and 2 tbsp salsa. Maggie: her\nquesadilla with half the pico, 2 tbsp (30 g) Greek yogurt as crema and 2\ntbsp salsa.</li>\n</ol>\n<p><strong>Reheat</strong></p>\n<p>Best eaten fresh. Leftovers: air fryer at 375°F, 3 to 4 minutes, or a\ndry skillet over medium, 2 minutes a side. Pico, yogurt and salsa stay\ncold.</p>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>645</td>\n<td>71 g</td>\n<td>69 g</td>\n<td>22 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>518</td>\n<td>65 g</td>\n<td>41 g</td>\n<td>16 g</td>\n</tr>\n</tbody>\n</table>\n","4:S_rollup":"<p><strong>Ingredients</strong></p>\n<ul>\n<li>7 oz (200 g) oven-roasted deli turkey breast, sliced thin</li>\n<li>1½ slices provolone</li>\n<li>¼ cup (60 g) dill pickle chips</li>\n<li>3 clementines (2 for Rob, 1 for Maggie)</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Lay out the turkey slices. Put a strip of provolone and a few pickle\nchips on each one and roll it up.</li>\n<li>Peel the clementines.</li>\n<li><strong>Divide.</strong> Rob: 4 oz (113 g) deli turkey rolled up\nwith 1 slice provolone and 3 tbsp (30 g) pickle chips, plus 2\nclementines. Maggie: 3 oz (85 g) deli turkey rolled up with ½ slice\nprovolone and 3 tbsp (30 g) pickle chips, plus 1 clementine.</li>\n</ol>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>251</td>\n<td>28 g</td>\n<td>21 g</td>\n<td>7 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>155</td>\n<td>19 g</td>\n<td>12 g</td>\n<td>4 g</td>\n</tr>\n</tbody>\n</table>\n","4:snack2:S_eggs":"<p><b>Rob's shake:</b> 1 scoop Tripact PB & vanilla protein, 240 ml (1 cup) Fairlife fat-free milk, 2 cups of raw baby spinach, 1 tbsp ground flax, 1 scoop collagen. Blend until smooth. 288 cal, 44 g protein, 13 g carbs.</p><p><b>Maggie (edamame + egg):</b> 85 g frozen shelled edamame (about ½ cup), 1 egg. 174 cal, 16 g protein, 8 g carbs.</p>","4:D_bolognese":"<p><span class=\"tag\">Sunday prep: bag and freeze the raw beef</span></p>\n<p><strong>Ingredients</strong></p>\n<ul>\n<li>12¼ oz (350 g) 93% lean ground beef</li>\n<li>⅓ yellow onion (60 g)</li>\n<li>1 medium carrot (60 g)</li>\n<li>1 garlic clove (minced)</li>\n<li>½ tsp Italian seasoning and ¼ tsp salt</li>\n<li>1 cup (275 g) marinara</li>\n<li>2¾ oz (80 g) dry spaghetti, plus 1 tbsp salt for the water</li>\n<li>3 tbsp (14 g) grated parmesan</li>\n<li>Maggie's salad: 1⅔ cups (75 g) chopped romaine, 1 cup (30 g) baby\nspinach, 2 tbsp light balsamic vinaigrette</li>\n<li>Cooking spray</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Two nights before (Monday night), move the raw beef from the freezer\nto the fridge.</li>\n<li>Bring a pot of water with 1 tbsp salt to a boil.</li>\n<li>Finely dice the onion and carrot.</li>\n<li>Heat a skillet over high until very hot. Brown the beef 3 minutes\nwithout stirring, then add the onion, carrot, garlic and Italian\nseasoning and cook 4 to 5 minutes more. If liquid pools in the pan,\nspoon or pour it off and keep cooking on high until the meat browns.\nStir in the salt.</li>\n<li>Add the marinara and simmer 10 minutes.</li>\n<li>Cook the spaghetti as the package says and drain.</li>\n<li>Toss Maggie's salad with the vinaigrette.</li>\n<li><strong>Divide.</strong> Rob: 1 cup cooked spaghetti (2 oz dry)\ntopped with 1 cup (150 g) cooked beef in sauce (a bit more than half the\npot) and 1½ tbsp (8 g) parmesan. Maggie: ½ cup cooked spaghetti (1 oz\ndry) topped with ¾ cup (110 g) cooked beef in sauce (the rest of the\npot), 1 tbsp (6 g) parmesan and her salad.</li>\n</ol>\n<p><strong>Reheat</strong></p>\n<p>Microwave covered 2 minutes with 1 tbsp water, stirring halfway.\nSalad stays cold.</p>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>646</td>\n<td>55 g</td>\n<td>58 g</td>\n<td>21 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>502</td>\n<td>41 g</td>\n<td>40 g</td>\n<td>20 g</td>\n</tr>\n</tbody>\n</table>\n","4:S_edamame":"<p><strong>Ingredients</strong></p>\n<ul>\n<li>1¾ cups (265 g) frozen shelled edamame</li>\n<li>1 navel orange (Rob) and 1 clementine (Maggie)</li>\n<li>A pinch of kosher salt</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Microwave the edamame in a covered bowl with 1 tbsp water, 2\nminutes, until hot. Drain and sprinkle with the salt.</li>\n<li>Peel the fruit.</li>\n<li><strong>Divide.</strong> Rob: 1 cup (155 g) edamame and 1 navel\norange (140 g). Maggie: ¾ cup (110 g) edamame and 1 clementine.</li>\n</ol>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>253</td>\n<td>20 g</td>\n<td>30 g</td>\n<td>8 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>168</td>\n<td>14 g</td>\n<td>19 g</td>\n<td>6 g</td>\n</tr>\n</tbody>\n</table>\n","4:snack2:S_cottage":"<p><b>Rob's shake:</b> 1 scoop Tripact PB & vanilla protein, 240 ml (1 cup) Fairlife fat-free milk, 2 cups of raw baby spinach, 1 tbsp ground flax, 1 scoop collagen. Blend until smooth. 288 cal, 44 g protein, 13 g carbs.</p><p><b>Maggie (cottage cheese ranch dip):</b> 170 g 2% cottage cheese (about ¾ cup), 100 g yellow or orange bell pepper (about ⅔ pepper), 75 g English cucumber (about ¼ cucumber), with 1 tsp ranch seasoning stirred into the cottage cheese. 180 cal, 20 g protein, 16 g carbs.</p>","4:L_lasagna":"<p><span class=\"tag\">Sunday prep: the whole batch</span></p>\n<p><em>Makes one 9x13 pan, 8 pieces.</em></p>\n<p><strong>Ingredients</strong></p>\n<ul>\n<li>1½ lb (680 g) 93% lean ground beef</li>\n<li>½ tsp salt and 1 tsp Italian seasoning</li>\n<li>2 jars (24 oz each) marinara</li>\n<li>24 oz (680 g) 2% cottage cheese</li>\n<li>1 large egg</li>\n<li>¼ cup (1 oz) grated parmesan</li>\n<li>½ tsp garlic powder and ¼ tsp black pepper</li>\n<li>12 oz (340 g) lasagna noodles, about 12</li>\n<li>2 medium zucchini (400 g)</li>\n<li>2 cups (8 oz) shredded part-skim mozzarella</li>\n<li>1 tbsp salt for the water, cooking spray and foil</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Bring a big pot of water and 1 tbsp salt to a boil. Cook the noodles\n2 minutes less than the package says. Drain and lay them flat on a\nsprayed sheet pan.</li>\n<li>Heat a large skillet over high. Brown the beef with the Italian\nseasoning, 8 minutes, leaving it alone for the first 3 so it browns. If\nliquid pools in the pan, spoon or pour it off and keep cooking on high\nuntil the meat browns. Then stir in the salt and both jars of\nmarinara.</li>\n<li>Mix the cottage cheese, egg, parmesan, garlic powder and pepper in a\nbowl.</li>\n<li>Slice the zucchini lengthwise into thin strips (about ⅛ inch).</li>\n<li>Heat the oven to 375°F and spray a 9x13 pan.</li>\n<li>Spread a thin layer of meat sauce in the pan. Then layer: 4 noodles,\na third of the cottage mix, a third of the zucchini, a third of the\nremaining sauce, a third of the mozzarella.</li>\n<li>Repeat the layers two more times, ending with sauce and\nmozzarella.</li>\n<li>Cover with sprayed foil and bake 30 minutes. Uncover and bake 15\nmore. Rest 15 minutes.</li>\n<li>Cut the pan into 4 equal strips across the short side. Cut each\nstrip into a bigger piece for Rob (a little more than half) and a\nsmaller one for Maggie.</li>\n<li><strong>Divide.</strong> Rob: 4 containers, each 1 piece (about 510\ng). Maggie: 4 containers, each 1 piece (about 380 g).\n<strong>Store:</strong> All 8 containers in the freezer. Two nights\nbefore each lunch, move that day's 2 containers to the fridge: Tuesday\nnight for Thursday, Wednesday night for Friday, Thursday night for\nSaturday, Friday night for Sunday. Cooked food keeps 3 to 4 days in the\nfridge, which is why these start frozen.</li>\n</ol>\n<p><strong>Reheat</strong></p>\n<p>Microwave covered 2½ to 3 minutes, then let it sit 1 minute. If it is\nstill partly frozen, run it 2 minutes on defrost first.</p>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>584</td>\n<td>47 g</td>\n<td>52 g</td>\n<td>21 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>435</td>\n<td>35 g</td>\n<td>39 g</td>\n<td>15 g</td>\n</tr>\n</tbody>\n</table>\n","4:D_teriyaki":"<p><span class=\"tag\">Sunday prep: bag and freeze the raw chicken (Rob's\nsalmon stays frozen)</span></p>\n<p><strong>Ingredients</strong></p>\n<ul>\n<li>6 oz (170 g) wild sockeye salmon fillet (Rob)</li>\n<li>6½ oz (185 g) chicken breast (Maggie)</li>\n<li>A pinch of salt</li>\n<li>1½ tsp olive oil</li>\n<li>4½ tbsp low-sodium teriyaki sauce</li>\n<li>1 cup (180 g) pineapple chunks</li>\n<li>2⅓ cups (150 g) snap peas</li>\n<li>½ cup (90 g) frozen shelled edamame, thawed</li>\n<li>¾ red bell pepper (120 g), sliced</li>\n<li>½ cup dry white rice</li>\n<li>Cooking spray</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Two nights before (Tuesday night), move the raw chicken and Rob's\nsalmon from the freezer to the fridge.</li>\n<li>Cook the rice: bring ½ cup dry white rice and 1 cup water to a boil,\ncover, turn the heat to low and simmer 15 minutes, then let it sit 5\nminutes off the heat and fluff with a fork. (A microwave rice pouch\nworks too.)</li>\n<li>Heat the oven to 400°F. Set Rob's salmon on a foil-lined pan, brush\nit with 1 tbsp of the teriyaki and bake 12 to 15 minutes, until it\nflakes (145°F).</li>\n<li>Cut the chicken into 1-inch cubes and season with the salt.</li>\n<li>Heat the olive oil in a skillet over medium-high. Cook the chicken 6\nto 7 minutes, until 165°F.</li>\n<li>Add the rest of the teriyaki and the pineapple and simmer 2\nminutes.</li>\n<li>In a second sprayed pan over high, stir-fry the snap peas, pepper\nand edamame with a pinch of salt, 3 minutes.</li>\n<li><strong>Divide.</strong> Rob: a 6 oz salmon fillet (weighed raw)\nwith a spoonful of the pineapple and sauce, 1 cup (155 g) rice and half\nthe vegetables. Maggie: 5 oz (140 g) cooked chicken with the rest of the\npineapple and sauce, ⅓ cup (60 g) rice and half the vegetables.</li>\n</ol>\n<p><strong>Reheat</strong></p>\n<p>Microwave covered 1½ to 2 minutes, stirring halfway.</p>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>643</td>\n<td>52 g</td>\n<td>76 g</td>\n<td>15 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>502</td>\n<td>54 g</td>\n<td>46 g</td>\n<td>11 g</td>\n</tr>\n</tbody>\n</table>\n","4:D_smashburger":"<p><span class=\"tag\">Sunday prep: burger sauce, and bag and freeze the\nraw beef</span></p>\n<p><strong>Ingredients</strong></p>\n<ul>\n<li>12½ oz (355 g) 95% lean ground beef</li>\n<li>¼ tsp each salt, black pepper and garlic powder</li>\n<li>3 slices American cheese: 2 for Rob, 1 for Maggie</li>\n<li>2 whole-wheat sandwich thins</li>\n<li>5 tbsp burger sauce (the quarter batch from Sunday)</li>\n<li>¼ cup (40 g) dill pickle chips</li>\n<li>¼ white onion (40 g), sliced thin</li>\n<li>¾ cup (40 g) shredded romaine</li>\n<li>1 medium Yukon gold potato (150 g), 1½ tsp olive oil, a pinch of\nsalt</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Two nights before (Wednesday night), move the raw beef from the\nfreezer to the fridge.</li>\n<li>Cut the potato into ¼-inch fries and toss with the olive oil and\nsalt. Air-fry at 400°F for 18 to 20 minutes, shaking twice.</li>\n<li>Divide the beef into 4 balls: Rob's two of 100 g, Maggie's two of 80\ng.</li>\n<li>Heat a cast-iron skillet over high for 3 minutes, until\nsmoking.</li>\n<li>Add 2 balls and smash each flat with a sturdy spatula (a square of\nparchment on top keeps it from sticking). Season with the salt, pepper\nand garlic powder.</li>\n<li>Cook 2 minutes, until crusty. Flip, add the cheese (Rob's 2 patties\nget a slice each, one of Maggie's gets her slice) and cook 30\nseconds.</li>\n<li>Repeat with the other 2 balls.</li>\n<li>Toast the sandwich thins.</li>\n<li><strong>Divide.</strong> Rob: his double cheeseburger on a sandwich\nthin with 3 tbsp burger sauce, 2 tbsp (20 g) pickle chips, 2 tbsp diced\nwhite onion (20 g) and ½ cup (20 g) romaine, plus ⅔ cup fries (55 g\ncooked). Maggie: her double cheeseburger on a sandwich thin with 2 tbsp\nburger sauce, 2 tbsp (20 g) pickle chips, 2 tbsp diced white onion (20\ng) and ½ cup (20 g) romaine, plus ⅔ cup fries (55 g cooked).</li>\n</ol>\n<p><strong>Reheat</strong></p>\n<p>Best eaten fresh. Leftovers: patty in a covered skillet over medium,\n1 to 2 minutes a side (or microwave 45 seconds); fries in the air fryer\nat 400°F, 3 to 4 minutes. Toast the bun; sauce and toppings stay\ncold.</p>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>641</td>\n<td>59 g</td>\n<td>45 g</td>\n<td>26 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>497</td>\n<td>45 g</td>\n<td>42 g</td>\n<td>17 g</td>\n</tr>\n</tbody>\n</table>\n","4:snack2:S_jerky":"<p><b>Rob's shake:</b> 1 scoop Tripact PB & vanilla protein, 240 ml (1 cup) Fairlife fat-free milk, 2 cups of raw baby spinach, 1 tbsp ground flax, 1 scoop collagen. Blend until smooth. 288 cal, 44 g protein, 13 g carbs.</p><p><b>Maggie (jerky + pear):</b> 28 g (1 oz) original beef jerky, 180 g Bartlett pear (about 1 pear). 183 cal, 11 g protein, 33 g carbs.</p>","4:B_kodiak_apple":"<p><strong>Ingredients</strong></p>\n<ul>\n<li>1 cup (110 g) Kodiak Power Cakes mix</li>\n<li>¾ cup (200 ml) Fairlife fat-free milk</li>\n<li>2 large eggs (1 each)</li>\n<li>½ tsp cinnamon</li>\n<li>1 Honeycrisp apple (220 g)</li>\n<li>2 tbsp sugar-free maple syrup</li>\n<li>Cooking spray</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Cinnamon apples: dice the apple, then cook it in a sprayed pan over\nmedium with a pinch of cinnamon, 4 to 5 minutes, until soft. Set\naside.</li>\n<li>Rob's batter: whisk ⅔ cup (70 g) Kodiak mix, ½ cup (120 ml)\nFairlife, 1 egg and ¼ tsp cinnamon until just combined. Let it sit 2\nminutes to thicken.</li>\n<li>Maggie's batter: whisk ⅓ cup (40 g) Kodiak mix, ⅓ cup (80 ml)\nFairlife, 1 egg and ¼ tsp cinnamon the same way.</li>\n<li>Heat a large nonstick pan over medium and spray it. Pour ¼-cup\npancakes and cook 2 minutes a side.</li>\n<li>Cook Rob's batter first and keep it warm in a 200°F oven, then cook\nMaggie's.</li>\n<li><strong>Divide.</strong> Rob: his pancakes topped with a bit more\nthan half the cinnamon apples and 1 tbsp sugar-free maple syrup. Maggie:\nher pancakes topped with the rest of the apples and 1 tbsp sugar-free\nmaple syrup.</li>\n</ol>\n<p><strong>Reheat</strong></p>\n<p>Best eaten fresh. Leftover pancakes: microwave 30 to 45 seconds, or a\ndry skillet over medium, 1 minute a side. Warm the apples 30 seconds in\nthe microwave.</p>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>434</td>\n<td>32 g</td>\n<td>63 g</td>\n<td>8 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>303</td>\n<td>21 g</td>\n<td>42 g</td>\n<td>6 g</td>\n</tr>\n</tbody>\n</table>\n","4:D_porkchop":"<p><span class=\"tag\">Sunday prep: bag and freeze the raw pork\nchops</span></p>\n<p><strong>Ingredients</strong></p>\n<ul>\n<li>2 boneless pork chops: 8 oz (225 g) for Rob, 6½ oz (185 g) for\nMaggie</li>\n<li>Seasoning: ½ tsp salt, ¼ tsp black pepper, ½ tsp garlic powder, ½\ntsp smoked paprika</li>\n<li>1 Honeycrisp apple (220 g), ½ tsp cinnamon, 2 tbsp water</li>\n<li>4¼ cups (375 g) Brussels sprouts</li>\n<li>2½ tsp olive oil</li>\n<li>¼ tsp salt for the sprouts</li>\n<li>1¼ medium Yukon gold potatoes (210 g)</li>\n<li>Mash: 2½ tbsp (35 g) plain nonfat Greek yogurt and a pinch of\nsalt</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Two nights before (Thursday night), move the raw pork chops from the\nfreezer to the fridge.</li>\n<li>Peel and cube the potatoes. Put them in a pot of cold salted water,\nbring to a boil and cook 12 minutes, until tender. Drain and mash with\nthe yogurt and salt.</li>\n<li>Halve the Brussels sprouts, toss with 1½ tsp of the olive oil and\nthe salt, and air-fry at 400°F for 15 to 18 minutes, shaking once.</li>\n<li>Season the chops on both sides.</li>\n<li>Heat the last 1 tsp olive oil in a skillet over medium-high. Sear\nthe chops 4 minutes a side, until 145°F. Rest 5 minutes.</li>\n<li>Slice the apple. In the same skillet over medium, cook it with the\ncinnamon and water 4 to 5 minutes, until soft.</li>\n<li><strong>Divide.</strong> Rob: a pork chop of about 6 oz (170 g)\ncooked, ⅔ cup mashed potatoes (from 135 g Yukon gold, ¾ medium) and a\nbit more than half the apples and Brussels sprouts. Maggie: a pork chop\nof about 5 oz (140 g) cooked, ⅓ cup mashed potatoes (from 75 g Yukon\ngold, ½ medium) and the rest of the apples and Brussels sprouts.</li>\n</ol>\n<p><strong>Reheat</strong></p>\n<p>Microwave covered at half power 2 minutes, or a covered skillet over\nlow, 3 minutes. Sprouts, apples and mash: microwave covered 1\nminute.</p>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>641</td>\n<td>60 g</td>\n<td>59 g</td>\n<td>21 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>497</td>\n<td>49 g</td>\n<td>43 g</td>\n<td>16 g</td>\n</tr>\n</tbody>\n</table>\n","4:B_steakegg":"<p><strong>Ingredients</strong></p>\n<ul>\n<li>6 oz (170 g) sirloin: 3½ oz (100 g) for Rob, 2½ oz (70 g) for\nMaggie</li>\n<li>A pinch each of salt and pepper for the steak</li>\n<li>¾ medium Yukon gold potato (145 g)</li>\n<li>⅔ green bell pepper (100 g), diced</li>\n<li>1 tsp olive oil</li>\n<li>¼ tsp salt and ¼ tsp garlic powder</li>\n<li>4 large eggs</li>\n<li>¼ cup (60 g) liquid egg whites (Rob)</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Dice the potato into ½-inch cubes and microwave in a covered bowl 3\nminutes.</li>\n<li>Heat the olive oil in a 12-inch nonstick skillet over medium-high.\nAdd the potatoes, pepper, salt and garlic powder and cook 6 minutes,\nuntil crisp.</li>\n<li>Dice the steak into ½-inch pieces and season with the salt and\npepper.</li>\n<li>Push the potatoes to the edges. Sear the steak in two piles, Rob's\nand Maggie's, 2 minutes.</li>\n<li>Whisk Rob's eggs (2 eggs plus the egg whites) and Maggie's (2 eggs)\nin separate bowls.</li>\n<li>Turn the heat to medium. Pour Rob's eggs over his steak pile and\nMaggie's over hers, and scramble each side 2 minutes, until just\nset.</li>\n<li><strong>Divide.</strong> Rob: his scramble with ½ cup crispy diced\npotatoes (70 g cooked) and half the peppers. Maggie: her scramble with ¼\ncup crispy diced potatoes (35 g cooked) and half the peppers.</li>\n</ol>\n<p><strong>Reheat</strong></p>\n<p>Best eaten fresh. Leftovers: microwave covered 1 minute, stir, then\n30 seconds more.</p>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>429</td>\n<td>44 g</td>\n<td>21 g</td>\n<td>18 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>312</td>\n<td>30 g</td>\n<td>12 g</td>\n<td>16 g</td>\n</tr>\n</tbody>\n</table>\n","4:D_potpie":"<p><span class=\"tag\">Sunday prep: bag and freeze the raw\nchicken</span></p>\n<p><strong>Ingredients</strong></p>\n<ul>\n<li>13¾ oz (390 g) chicken breast</li>\n<li>½ yellow onion (80 g)</li>\n<li>1 celery rib (50 g)</li>\n<li>1⅔ medium carrots (100 g)</li>\n<li>1½ tsp olive oil and ¼ tsp salt</li>\n<li>2½ tbsp (18 g) all-purpose flour</li>\n<li>1 cup low-sodium chicken broth</li>\n<li>⅔ cup (160 ml) Fairlife fat-free milk</li>\n<li>½ tsp Italian seasoning, 1 garlic clove (minced), ¼ tsp black\npepper</li>\n<li>1 medium Yukon gold potato (175 g)</li>\n<li>⅔ cup (100 g) frozen peas</li>\n<li>3½ sheets phyllo dough</li>\n<li>Cooking spray and two small baking dishes</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Two nights before (Friday night), move the raw chicken from the\nfreezer to the fridge.</li>\n<li>Heat the oven to 400°F.</li>\n<li>Dice the onion, celery and carrots. Dice the chicken into ¾-inch\npieces.</li>\n<li>Dice the potato and microwave it in a covered bowl 3 minutes.</li>\n<li>Heat the olive oil in a deep skillet over medium. Cook the onion,\ncelery and carrots with the salt, 5 minutes.</li>\n<li>Stir in the flour and cook 1 minute.</li>\n<li>Add the broth, Fairlife, Italian seasoning, garlic and pepper.\nSimmer 3 to 4 minutes, until thick.</li>\n<li>Add the chicken and simmer 8 minutes, until cooked through. Stir in\nthe potatoes and peas for 1 minute.</li>\n<li>Spoon a little more than half the filling (about 3 parts to 2) into\nRob's dish and the rest into Maggie's.</li>\n<li>Crumple the phyllo on top (Rob 2 sheets, Maggie 1½), spray it and\nbake 12 to 15 minutes, until golden.</li>\n<li><strong>Divide.</strong> Rob: his pot pie, with 6 oz (170 g) cooked\nchicken. Maggie: her pot pie, with 4¼ oz (125 g) cooked chicken.</li>\n</ol>\n<p><strong>Reheat</strong></p>\n<p>Microwave covered 2 minutes, or air fryer at 350°F, 6 to 8 minutes,\nto keep the top crisp.</p>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>641</td>\n<td>65 g</td>\n<td>64 g</td>\n<td>13 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>497</td>\n<td>49 g</td>\n<td>52 g</td>\n<td>10 g</td>\n</tr>\n</tbody>\n</table>\n","4:S_popcorn":"<p><strong>Ingredients</strong></p>\n<ul>\n<li>7 cups (55 g) popcorn: air-popped, or a 94% fat-free microwave\nbag</li>\n<li>2½ oz (70 g) original beef jerky</li>\n<li>Cooking spray and a pinch of salt</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Pop the popcorn. If it is air-popped, mist it with cooking spray and\ntoss with the salt so it sticks.</li>\n<li><strong>Divide.</strong> Rob: 4 cups popcorn (32 g) and 42 g (1½ oz)\noriginal beef jerky. Maggie: 3 cups popcorn (24 g) and 28 g (1 oz)\noriginal beef jerky.</li>\n</ol>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>244</td>\n<td>19 g</td>\n<td>34 g</td>\n<td>3 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>173</td>\n<td>13 g</td>\n<td>25 g</td>\n<td>2 g</td>\n</tr>\n</tbody>\n</table>\n","w1:1:B_burrito1":"<p><span class=\"tag\">Sunday prep: make the whole batch</span></p>\n<p><em>Makes 6 burritos with 10-inch tortillas, or 9 with 8-inch\nwraps.</em></p>\n<p><strong>Ingredients</strong></p>\n<ul>\n<li>18 Trader Joe's chicken breakfast sausage links (1½ packages)</li>\n<li>2 red bell peppers (300 g), diced</li>\n<li>½ yellow onion (75 g), diced</li>\n<li>6 large eggs</li>\n<li>1¼ cups (300 g) liquid egg whites</li>\n<li>¼ tsp salt and ¼ tsp black pepper for the eggs</li>\n<li>½ cup (2 oz) shredded reduced-fat cheddar</li>\n<li>6 large (10-inch) low-carb tortillas, or 9 small 8-inch wraps</li>\n<li>To serve: 2 tbsp jarred salsa each; ½ banana for Rob (10-inch only);\n¾ cup plain nonfat Greek yogurt for Maggie (8-inch only)</li>\n<li>Cooking spray and foil</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Heat a large nonstick pan over medium and spray it.</li>\n<li>Lay the links in one layer and cook 10 to 12 minutes, turning every\nfew minutes, until browned all over and cooked through (165°F inside).\nCooking them whole keeps them from steaming.</li>\n<li>Move the links to a cutting board and chop them into small pieces.\nPut them in a bowl.</li>\n<li>Spray the pan again. Cook the peppers and onion 5 minutes, stirring,\nuntil soft. Add them to the sausage.</li>\n<li>Whisk the eggs, egg whites, salt and pepper in a bowl. Wipe out the\npan, spray it and turn the heat to medium-low.</li>\n<li>Pour in the eggs and stir slowly 3 to 4 minutes, until just set but\nstill soft. Turn off the heat.</li>\n<li>Fold the sausage and vegetables into the eggs. Let it cool 10\nminutes so the tortillas don't get soggy. It makes about 8 cups of\nfilling.</li>\n<li>Spoon 1⅓ cups (about 200 g) of filling onto each large tortilla, or\na heaping ¾ cup (about 130 g) onto each 8-inch wrap. Sprinkle the cheese\nevenly over all of them.</li>\n<li>Fold in the sides, roll up tight and wrap each one in foil.</li>\n<li><strong>Divide.</strong> Rob: 1 large burrito with 2 tbsp salsa and\n⅔ banana (70 g); with 8-inch wraps, 2 burritos with 2 tbsp salsa and no\nbanana. Maggie: 1 large burrito with 2 tbsp salsa; with 8-inch wraps, 1\nburrito with 2 tbsp salsa plus ¾ cup (170 g) plain nonfat Greek yogurt\non the side to make up the difference. <strong>Store:</strong> 4\nburritos in the fridge (Mon, Wed), 2 in the freezer (Fri). With 8-inch\nwraps: 6 in the fridge, 3 in the freezer.</li>\n</ol>\n<p><strong>Reheat</strong></p>\n<p>Unwrap, wrap in a damp paper towel and microwave 1 to 1½ minutes from\nthe fridge or 2½ minutes from frozen, turning once.</p>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob, 10-inch (1 burrito)</td>\n<td>430</td>\n<td>38 g</td>\n<td>53 g</td>\n<td>14 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie, 10-inch (1 burrito)</td>\n<td>368</td>\n<td>38 g</td>\n<td>37 g</td>\n<td>13 g</td>\n</tr>\n<tr class=\"odd\">\n<td>Rob, 8-inch (2 burritos)</td>\n<td>461</td>\n<td>52 g</td>\n<td>37 g</td>\n<td>17 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie, 8-inch (1 burrito + yogurt)</td>\n<td>336</td>\n<td>44 g</td>\n<td>26 g</td>\n<td>9 g</td>\n</tr>\n</tbody>\n</table>\n","w1:1:L_bigmac":"<p><span class=\"tag\">Sunday prep: pack all 6 bowls</span></p>\n<p><em>Makes 6 bowls (3 Rob, 3 Maggie).</em></p>\n<p><strong>Ingredients</strong></p>\n<ul>\n<li>2½ lb (1,155 g) Yukon gold potatoes, about 7 medium</li>\n<li>1½ tbsp olive oil</li>\n<li>Potato seasoning: 1 tsp salt, 1 tsp garlic powder, ½ tsp black\npepper</li>\n<li>2¼ lb (1,020 g) 95% lean ground beef</li>\n<li>Beef seasoning: 1 tsp onion powder, 1 tsp salt, ½ tsp black\npepper</li>\n<li>3½ romaine hearts (525 g), chopped</li>\n<li>4 Roma tomatoes (300 g)</li>\n<li>⅔ white onion (120 g)</li>\n<li>1¼ cups (180 g) dill pickle chips</li>\n<li>⅔ cup (72 g) shredded reduced-fat cheddar</li>\n<li>1 cup burger sauce (recipe above)</li>\n<li>Containers: 6 two-compartment containers, 6 small containers, 6\nsauce cups</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Heat the oven to 425°F. Line one large or two small sheet pans with\nfoil and spray them.</li>\n<li>Cut the potatoes into ¾-inch cubes.</li>\n<li>Toss them with the olive oil and the potato seasoning and spread\nthem in one layer.</li>\n<li>Roast 30 to 35 minutes, flipping halfway, until browned and crisp at\nthe edges.</li>\n<li>While they roast, heat a large skillet (cast iron or stainless, not\nnonstick) over high until very hot. Add the beef, press it flat and\nleave it 3 minutes to brown, then break it up and cook 2 more minutes.\nIf liquid pools in the pan, spoon or pour it off and keep cooking on\nhigh until the meat browns.</li>\n<li>Add the beef seasoning and cook 3 to 4 minutes more, until no pink\nis left. Drain the fat.</li>\n<li>Chop the romaine. Dice the tomatoes and the white onion.</li>\n<li><strong>Divide.</strong> Rob: each of his 3 bowls gets 1 cup (150 g)\ncooked beef and 1¼ cups roasted potatoes (165 g cooked) in the big side;\n1⅔ cups (75 g) romaine, ⅔ Roma tomato (50 g), 2 tbsp diced white onion\n(20 g), 3 tbsp (30 g) pickle chips and 2 tbsp (14 g) cheddar in the\nsmall container; 3 tbsp burger sauce in a cup. Maggie: each of her 3\nbowls gets ¾ cup (105 g) cooked beef and ¾ cup roasted potatoes (110 g\ncooked) in the big side; 2¼ cups (100 g) romaine, ⅔ Roma tomato (50 g),\n2 tbsp diced white onion (20 g), 3 tbsp (30 g) pickle chips and 1½ tbsp\n(10 g) cheddar in the small container; 2 tbsp burger sauce in a cup. If\nthe cooked amounts come out different, weigh the pile, divide it by 5\nfor each Rob bowl, and give each Maggie bowl two-thirds of that.\n<strong>Store:</strong> All 6 bowls in the fridge (Mon to Wed), with the\nsauce and cold toppings in their own containers.</li>\n</ol>\n<p><strong>Reheat</strong></p>\n<p>Microwave the beef and potatoes 1½ to 2 minutes, then add the cold\ntoppings and sauce.</p>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>600</td>\n<td>56 g</td>\n<td>51 g</td>\n<td>19 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>431</td>\n<td>40 g</td>\n<td>38 g</td>\n<td>14 g</td>\n</tr>\n</tbody>\n</table>\n","w1:1:D_steak":"<p><strong>Ingredients</strong></p>\n<ul>\n<li>Sirloin steaks: about 9 oz raw for Rob, about 6½ oz raw for\nMaggie</li>\n<li>Steak seasoning: ½ tsp salt, ¼ tsp black pepper, ¼ tsp garlic\npowder</li>\n<li>1½ medium Yukon gold potatoes (245 g)</li>\n<li>4¼ cups (375 g) Brussels sprouts</li>\n<li>2 tsp olive oil</li>\n<li>Vegetable seasoning: ½ tsp salt, ½ tsp garlic powder, ¼ tsp black\npepper</li>\n<li>2 tbsp (10 g) grated parmesan</li>\n<li>Horseradish cream: ½ cup (110 g) plain nonfat Greek yogurt, 4 tsp\nprepared white horseradish, a pinch of salt</li>\n<li>Cooking spray</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Take the steaks out of the fridge 20 minutes before cooking and pat\nthem dry.</li>\n<li>Cut the potatoes into ¾-inch cubes and halve the Brussels\nsprouts.</li>\n<li>Toss the potatoes and sprouts with the olive oil and the vegetable\nsea
