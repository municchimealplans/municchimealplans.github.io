soning.</li>\n<li>Air-fry at 400°F for 18 to 20 minutes, shaking halfway (two batches\nif they don't fit in one layer).</li>\n<li>Horseradish cream: stir the yogurt, horseradish and salt\ntogether.</li>\n<li>Season both steaks on both sides with the steak seasoning.</li>\n<li>Heat a cast-iron pan over high until it just starts to smoke, about\n3 to 4 minutes. Spray it.</li>\n<li>Sear the steaks 3 to 4 minutes a side (130°F inside for medium-rare,\n140°F for medium).</li>\n<li>Rest the steaks 5 minutes on a cutting board, then slice across the\ngrain.</li>\n<li>Toss the Brussels sprouts with the parmesan.</li>\n<li><strong>Divide.</strong> Rob: his 6½ oz (185 g) steak, ¾ cup\nair-fried potatoes (110 g cooked), a bit more than half the Brussels\nsprouts and half the horseradish cream. Maggie: her 4½ oz (130 g) steak,\n½ cup air-fried potatoes (65 g cooked), the rest of the Brussels sprouts\nand half the horseradish cream.</li>\n</ol>\n<p><strong>Reheat</strong></p>\n<p>Best eaten fresh. Leftovers: slice the steak and warm it in a skillet\nover low, 1 to 2 minutes (the microwave overcooks it). Potatoes and\nBrussels sprouts: air fryer at 375°F, 4 to 5 minutes. Horseradish cream\nstays cold.</p>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>652</td>\n<td>73 g</td>\n<td>49 g</td>\n<td>21 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>474</td>\n<td>53 g</td>\n<td>35 g</td>\n<td>16 g</td>\n</tr>\n</tbody>\n</table>\n","w1:1:S_choc":"<p><strong>Ingredients</strong></p>\n<ul>\n<li>1½ cups (350 g) plain nonfat Greek yogurt</li>\n<li>A heaping ¾ scoop GNC 100% Casein, Chocolate Supreme</li>\n<li>3½ tbsp PB2</li>\n<li>2 tbsp unsweetened cocoa</li>\n<li>3½ tbsp water</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>In a bowl, stir everything together hard until smooth. Casein\nthickens more than whey: if it is still stiff, add water 1 tsp at a\ntime.</li>\n<li>Set Rob's container on the scale and zero it, then divide as\nbelow.</li>\n<li><strong>Divide.</strong> Rob: 265 g (about 1 cup plus 2 tbsp) in his\ncontainer. Maggie: the rest, about 200 g (¾ cup plus 2 tbsp), in her\ncontainer. <strong>Store:</strong> Mix it the night before and keep it\nin the fridge. It keeps 2 days.</li>\n</ol>\n<p><strong>Reheat</strong></p>\n<p>None. It is eaten cold, straight from the fridge.</p>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>250</td>\n<td>40 g</td>\n<td>16 g</td>\n<td>3 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>185</td>\n<td>29 g</td>\n<td>13 g</td>\n<td>3 g</td>\n</tr>\n</tbody>\n</table>\n","w1:1:snack2:S_mshake":"<p><b>Rob's shake:</b> 1 scoop Tripact PB & vanilla protein, 240 ml (1 cup) Fairlife fat-free milk, 2 cups of raw baby spinach, 1 tbsp ground flax, 1 scoop collagen. Blend until smooth. 288 cal, 44 g protein, 13 g carbs.</p><p><b>Maggie (shake):</b> ¾ scoop vanilla whey, 200 ml (¾ cup) Fairlife fat-free milk, a handful (about 1 cup) of raw baby spinach, 60 g mixed berries, fresh or thawed frozen (about ⅓ cup). 204 cal, 32 g protein, 16 g carbs.</p>","w1:1:B_oats_cinn":"<p><span class=\"tag\">Made the night before: Monday and Wednesday\nnights</span></p>\n<p><em>Makes one batch, divided into 2 jars (1 Rob, 1 Maggie), made the\nnight before.</em></p>\n<p><strong>Ingredients</strong></p>\n<ul>\n<li>⅔ cup (60 g) old-fashioned rolled oats</li>\n<li>1½ tbsp (18 g) chia seeds</li>\n<li>1¾ scoops vanilla whey</li>\n<li>1 tsp cinnamon, plus a pinch for the morning</li>\n<li>⅔ cup (160 ml) Fairlife fat-free milk</li>\n<li>1 cup (250 g) plain nonfat Greek yogurt</li>\n<li>2 tbsp sugar-free maple syrup</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>The night before (Monday night for Tuesday, Wednesday night for\nThursday), get out one mixing bowl and two 16-oz mason jars labeled\n\"Rob\" and \"Maggie\".</li>\n<li>In the bowl, stir the oats, chia, whey and cinnamon together.</li>\n<li>Pour in the Fairlife and whisk until there are no clumps.</li>\n<li>Add the Greek yogurt and syrup and stir until smooth. Whey sets\nlooser than casein, so this uses less milk and no water; it thickens\novernight.</li>\n<li>Set Rob's jar on the scale and zero it, then divide as below.</li>\n<li><strong>Divide.</strong> Rob: 325 g (about 1⅓ cups) in his jar.\nMaggie: the rest, about 245 g (1 cup), in her jar.\n<strong>Store:</strong> Make both jars the night before (Monday night\nfor Tuesday, Wednesday night for Thursday) and keep them in the fridge.\n<strong>To eat:</strong> Stir, add a pinch of cinnamon on top and eat it\ncold.</li>\n</ol>\n<p><strong>Reheat</strong></p>\n<p>None. It is eaten cold, straight from the fridge.</p>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>429</td>\n<td>50 g</td>\n<td>41 g</td>\n<td>7 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>327</td>\n<td>39 g</td>\n<td>31 g</td>\n<td>6 g</td>\n</tr>\n</tbody>\n</table>\n","w1:1:D_smashtaco":"<p><span class=\"tag\">Sunday prep: bag and freeze the raw beef</span></p>\n<p><strong>Ingredients</strong></p>\n<ul>\n<li>13½ oz (385 g) 95% lean ground beef</li>\n<li>Seasoning: ½ tsp salt, ¼ tsp black pepper, ¼ tsp garlic powder</li>\n<li>5 small (8-inch) low-carb tortillas</li>\n<li>¼ cup (30 g) shredded reduced-fat cheddar</li>\n<li>2½ cups (120 g) chopped romaine</li>\n<li>⅓ cup (60 g) dill pickle chips</li>\n<li>¼ white onion (40 g), finely diced</li>\n<li>5 tbsp burger sauce</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Two nights before (Tuesday night), move the raw beef from the\nfreezer to the fridge.</li>\n<li>Mix the beef with the seasoning in a bowl.</li>\n<li>Divide it into 5 equal balls, about 75 g each: 3 for Rob, 2 for\nMaggie.</li>\n<li>Press each ball into a thin, even layer over one side of a tortilla,\nalmost to the edge.</li>\n<li>Heat a large skillet (cast iron is best) over high for 3 minutes. No\noil.</li>\n<li>Lay 2 or 3 tacos meat-side down, press them flat with a spatula and\ncook 2 to 3 minutes, until browned and cooked through.</li>\n<li>Flip. Sprinkle the cheese on the meat side (3 tbsp (20 g) cheddar\nacross Rob's 3, 1½ tbsp (10 g) cheddar across Maggie's 2) and cook 1\nminute, until the tortilla is crisp.</li>\n<li>Repeat with the rest.</li>\n<li><strong>Divide.</strong> Rob: his 3 tacos topped with 1¼ cups (60 g)\nromaine, 3 tbsp (30 g) pickle chips, 2 tbsp diced white onion (20 g) and\n3 tbsp burger sauce. Maggie: her 2 tacos topped with 1¼ cups (60 g)\nromaine, 3 tbsp (30 g) pickle chips, 2 tbsp diced white onion (20 g) and\n2 tbsp burger sauce.</li>\n</ol>\n<p><strong>Reheat</strong></p>\n<p>Best eaten fresh. Leftovers: keep the toppings separate. Warm the\ntaco meat-side down in a dry skillet over medium, 2 to 3 minutes, until\nthe tortilla crisps, then add the cold toppings and sauce.</p>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>637</td>\n<td>73 g</td>\n<td>66 g</td>\n<td>24 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>436</td>\n<td>50 g</td>\n<td>45 g</td>\n<td>16 g</td>\n</tr>\n</tbody>\n</table>\n","w1:1:snack2:S_eggs":"<p><b>Rob's shake:</b> 1 scoop Tripact PB & vanilla protein, 240 ml (1 cup) Fairlife fat-free milk, 2 cups of raw baby spinach, 1 tbsp ground flax, 1 scoop collagen. Blend until smooth. 288 cal, 44 g protein, 13 g carbs.</p><p><b>Maggie (edamame + egg):</b> 85 g frozen shelled edamame (about ½ cup), 1 egg. 174 cal, 16 g protein, 8 g carbs.</p>","w1:1:D_parm":"<p><span class=\"tag\">Sunday prep: bag and freeze the raw\nchicken</span></p>\n<p><strong>Ingredients</strong></p>\n<ul>\n<li>13¼ oz (375 g) chicken breast: 8 oz for Rob, 5¼ oz for Maggie</li>\n<li>¼ tsp salt and ¼ tsp black pepper</li>\n<li>Coating: ⅔ cup (35 g) panko, 3 tbsp (14 g) grated parmesan, ½ tsp\nItalian seasoning, ¼ tsp garlic powder</li>\n<li>3½ tbsp (50 g) liquid egg whites</li>\n<li>1 cup (275 g) marinara</li>\n<li>⅓ cup (34 g) shredded part-skim mozzarella</li>\n<li>1 medium zucchini (225 g)</li>\n<li>A pinch of salt and ¼ tsp garlic powder for the zucchini</li>\n<li>1½ oz (45 g) dry spaghetti, plus 1 tbsp salt for the water</li>\n<li>Cooking spray</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Two nights before (Monday night), move the raw chicken from the\nfreezer to the fridge.</li>\n<li>Put a pot of water with 1 tbsp salt on to boil.</li>\n<li>Butterfly each chicken breast: slice it horizontally almost all the\nway through and open it like a book. Season with the salt and\npepper.</li>\n<li>Mix the coating on a plate. Pour the egg whites into a shallow\nbowl.</li>\n<li>Dip each piece in the egg white, then press it into the coating on\nboth sides.</li>\n<li>Spray the air fryer basket, lay in the chicken and spray the tops.\nAir-fry at 400°F for 10 to 12 minutes, until 165°F.</li>\n<li>Meanwhile cook the spaghetti as the package says and drain.</li>\n<li>Slice the zucchini into half-moons. Cook in a sprayed pan over\nmedium-high with the salt and garlic powder, 4 minutes.</li>\n<li>Spoon 2 tbsp marinara over each piece of chicken and top with the\nmozzarella (3 tbsp (20 g) mozzarella on Rob's, 2 tbsp (14 g) mozzarella\non Maggie's). Air-fry 2 more minutes, until melted.</li>\n<li>Pour the rest of the marinara into the zucchini pan to warm, then\ntoss in the spaghetti.</li>\n<li><strong>Divide.</strong> Rob: his chicken parm, 6 oz (170 g) cooked\nchicken, with ½ cup cooked spaghetti (1 oz dry) and just under half the\nzucchini and sauce. Maggie: her chicken parm, 4 oz (110 g) cooked\nchicken, with ⅓ cup cooked spaghetti (¾ oz dry) and just over half the\nzucchini and sauce.</li>\n</ol>\n<p><strong>Reheat</strong></p>\n<p>Best eaten fresh. Leftovers: chicken in the air fryer at 375°F, 4 to\n5 minutes (the microwave makes the breading soggy). Pasta and zucchini:\nmicrowave covered 1 to 1½ minutes.</p>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>645</td>\n<td>71 g</td>\n<td>48 g</td>\n<td>17 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>477</td>\n<td>50 g</td>\n<td>39 g</td>\n<td>13 g</td>\n</tr>\n</tbody>\n</table>\n","w1:1:snack2:S_cottage":"<p><b>Rob's shake:</b> 1 scoop Tripact PB & vanilla protein, 240 ml (1 cup) Fairlife fat-free milk, 2 cups of raw baby spinach, 1 tbsp ground flax, 1 scoop collagen. Blend until smooth. 288 cal, 44 g protein, 13 g carbs.</p><p><b>Maggie (cottage cheese ranch dip):</b> 170 g 2% cottage cheese (about ¾ cup), 100 g yellow or orange bell pepper (about ⅔ pepper), 75 g English cucumber (about ¼ cucumber), with 1 tsp ranch seasoning stirred into the cottage cheese. 180 cal, 20 g protein, 16 g carbs.</p>","w1:1:L_mac":"<p><span class=\"tag\">Sunday prep: the whole batch</span></p>\n<p><em>Makes 8 containers (4 Rob, 4 Maggie).</em></p>\n<p><strong>Ingredients</strong></p>\n<ul>\n<li>3 lb (1,360 g) chicken breast</li>\n<li>Chicken seasoning: 1 tsp salt, 1 tsp garlic powder, 1 tsp onion\npowder, 1 tsp smoked paprika, ½ tsp black pepper (plus 2 tbsp Frank's\nRedHot if you want more kick)</li>\n<li>1 lb (454 g) elbow pasta, plus 1 tbsp salt for the water</li>\n<li>4 cups (300 g) broccoli florets</li>\n<li>24 oz (680 g) 2% cottage cheese</li>\n<li>1½ cups (360 ml) Fairlife fat-free milk</li>\n<li>1½ cups (6 oz) shredded reduced-fat cheddar</li>\n<li>½ cup Frank's RedHot Original</li>\n<li>2 to 3 tbsp ranch seasoning</li>\n<li>Cooking spray</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Heat the oven to 425°F and spray a sheet pan.</li>\n<li>Lay out the chicken and season both sides with the chicken seasoning\n(toss it in the Frank's first if using). Spray the tops.</li>\n<li>Bake 18 to 22 minutes, until 165°F inside. Rest 5 minutes, then dice\ninto ½-inch pieces.</li>\n<li>Meanwhile bring a big pot of water and 1 tbsp salt to a boil. Cook\nthe pasta 1 minute less than the package says.</li>\n<li>For the last 5 minutes, set a steamer basket of broccoli over the\npot (or drop the florets into the water for the last 3). Drain.</li>\n<li>Blend the cottage cheese with 1 cup of the Fairlife until completely\nsmooth.</li>\n<li>Pour it into a pot over low heat. Add the cheddar, the ½ cup Frank's\nand 2 tbsp ranch seasoning. Stir 4 to 5 minutes until melted. Don't let\nit boil.</li>\n<li>Taste. Add up to 1 more tbsp ranch, and up to ½ cup more Fairlife,\nuntil it looks like thick queso.</li>\n<li>Stir in the chicken, pasta and broccoli.</li>\n<li><strong>Divide.</strong> Rob: 4 containers of 2¼ cups (460 g) each.\nMaggie: 4 containers of 1⅔ cups (330 g) each. <strong>Store:</strong>\nAll 8 containers in the freezer. Two nights before each lunch, move that\nday's 2 containers to the fridge: Tuesday night for Thursday, Wednesday\nnight for Friday, Thursday night for Saturday, Friday night for Sunday.\nCooked food keeps 3 to 4 days in the fridge, which is why these start\nfrozen.</li>\n</ol>\n<p><strong>Reheat</strong></p>\n<p>Microwave covered 2½ to 3 minutes, stirring halfway, until hot in the\nmiddle. If it is still partly frozen, run it 2 minutes on defrost\nfirst.</p>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>601</td>\n<td>67 g</td>\n<td>53 g</td>\n<td>12 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>431</td>\n<td>48 g</td>\n<td>38 g</td>\n<td>9 g</td>\n</tr>\n</tbody>\n</table>\n","w1:1:D_orange":"<p><span class=\"tag\">Sunday prep: the raw chicken goes in the fridge,\nnot the freezer</span></p>\n<p><strong>Ingredients</strong></p>\n<ul>\n<li>13½ oz (385 g) chicken breast</li>\n<li>¼ tsp salt and a pinch of black pepper</li>\n<li>2½ tbsp cornstarch, plus 1 tsp if the sauce needs it</li>\n<li>Sauce: 7 tbsp (105 ml) orange juice, 2¼ tbsp low-sodium soy sauce,\n2½ tsp honey, 2 garlic cloves (grated), 1 tbsp grated fresh ginger, ¼\ntsp red pepper flakes</li>\n<li>4¾ cups (300 g) snap peas</li>\n<li>1 tsp olive oil and a pinch of salt</li>\n<li>½ cup dry white rice</li>\n<li>Cooking spray</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Cook the rice: bring ½ cup dry white rice and 1 cup water to a boil,\ncover, turn the heat to low and simmer 15 minutes, then let it sit 5\nminutes off the heat and fluff with a fork. (A microwave rice pouch\nworks too.)</li>\n<li>Cut the chicken into 1-inch cubes. Season with the salt and\npepper.</li>\n<li>Toss the chicken in the cornstarch until coated.</li>\n<li>Spray the air fryer basket, add the chicken in one layer and spray\nthe tops. Air-fry at 400°F for 12 to 14 minutes, shaking once.</li>\n<li>Sauce: in a small pan over medium, simmer the orange juice, soy\nsauce, honey, garlic, ginger and red pepper flakes 2 minutes, until\nglossy. If it stays thin, stir in 1 tsp cornstarch mixed with 1 tbsp\nwater and simmer 30 seconds.</li>\n<li>Toss the chicken in the sauce.</li>\n<li>Heat the olive oil in a skillet over high. Stir-fry the snap peas\nwith a pinch of salt, 2 minutes.</li>\n<li><strong>Divide.</strong> Rob: 6 oz (170 g) cooked chicken in sauce,\n¾ cup (135 g) rice and half the snap peas. Maggie: 4¼ oz (120 g) cooked\nchicken in sauce, ½ cup (90 g) rice and half the snap peas.</li>\n</ol>\n<p><strong>Reheat</strong></p>\n<p>Microwave the chicken and rice covered 1½ to 2 minutes, stirring\nhalfway, and the snap peas 30 seconds. For crispier chicken, air fryer\nat 375°F for 3 minutes.</p>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>649</td>\n<td>61 g</td>\n<td>76 g</td>\n<td>10 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>473</td>\n<td>44 g</td>\n<td>56 g</td>\n<td>7 g</td>\n</tr>\n</tbody>\n</table>\n","w1:1:D_pizza":"<p><span class=\"tag\">Sunday prep: bag and freeze the raw\nchicken</span></p>\n<p><strong>Ingredients</strong></p>\n<ul>\n<li>1 chicken breast (8 oz raw)</li>\n<li>Seasoning: ½ tsp Italian seasoning, ¼ tsp garlic powder, a pinch of\nsalt</li>\n<li>3 large (10-inch) low-carb tortillas: 2 for Rob, 1 for Maggie (with\n8-inch wraps: 3 and 2)</li>\n<li>⅔ cup (150 g) marinara</li>\n<li>⅔ cup (70 g) shredded part-skim mozzarella</li>\n<li>24 slices (42 g) turkey pepperoni</li>\n<li>⅔ yellow or orange bell pepper (100 g)</li>\n<li>⅓ yellow onion (50 g)</li>\n<li>Salad: 3¼ cups (150 g) chopped romaine, ⅓ English cucumber (100 g),\n1 cup (30 g) baby spinach for Maggie, 4 tbsp light balsamic\nvinaigrette</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Two nights before (Wednesday night), move the raw chicken from the\nfreezer to the fridge.</li>\n<li>Season the chicken and air-fry at 400°F for 14 minutes, until 165°F.\nRest 5 minutes and dice.</li>\n<li>Heat the oven to 425°F. Slice the pepper and onion thin.</li>\n<li>Lay the tortillas on a sheet pan and bake 3 minutes to crisp\nthem.</li>\n<li>Top Rob's 2 tortillas with ⅓ cup (90 g) marinara, ⅓ cup (42 g)\nmozzarella, 16 pepperoni slices, ⅔ cup (85 g) diced chicken and half the\npepper and onion, split between them.</li>\n<li>Top Maggie's tortilla with ¼ cup (60 g) marinara, ¼ cup (28 g)\nmozzarella, 8 pepperoni slices, ½ cup (70 g) diced chicken and the other\nhalf of the pepper and onion.</li>\n<li>Bake 6 to 8 minutes, until the cheese bubbles and the edges are\ncrisp.</li>\n<li>Salad: slice the cucumber and toss each person's greens with 2 tbsp\nvinaigrette.</li>\n<li><strong>Divide.</strong> Rob: his 2 pizzas with a salad of 1⅔ cups\n(75 g) romaine, ¼ English cucumber (50 g) and 2 tbsp vinaigrette.\nMaggie: her pizza with a salad of 1⅔ cups (75 g) romaine, 1 cup (30 g)\nspinach, ¼ English cucumber (50 g) and 2 tbsp vinaigrette.</li>\n</ol>\n<p><strong>Reheat</strong></p>\n<p>Best eaten fresh. Leftovers: air fryer at 350°F, 3 to 4 minutes, or a\ncovered dry skillet over medium-low, 3 to 4 minutes, until the bottom is\ncrisp. Salad stays cold.</p>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>688</td>\n<td>61 g</td>\n<td>76 g</td>\n<td>28 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>469</td>\n<td>43 g</td>\n<td>47 g</td>\n<td>19 g</td>\n</tr>\n</tbody>\n</table>\n","w1:1:snack2:S_jerky":"<p><b>Rob's shake:</b> 1 scoop Tripact PB & vanilla protein, 240 ml (1 cup) Fairlife fat-free milk, 2 cups of raw baby spinach, 1 tbsp ground flax, 1 scoop collagen. Blend until smooth. 288 cal, 44 g protein, 13 g carbs.</p><p><b>Maggie (jerky + apple):</b> 28 g (1 oz) original beef jerky, 180 g Honeycrisp apple (about 1 apple). 174 cal, 11 g protein, 31 g carbs.</p>","w1:1:B_waffles":"<p><strong>Ingredients</strong></p>\n<ul>\n<li>1 cup (105 g) Kodiak Power Cakes mix</li>\n<li>¾ cup (175 g) liquid egg whites</li>\n<li>½ cup (100 ml) Fairlife fat-free milk</li>\n<li>½ tsp cinnamon</li>\n<li>1 cup (205 g) plain nonfat Greek yogurt</li>\n<li>1 banana (Rob)</li>\n<li>⅔ cup mixed berries (Maggie)</li>\n<li>2 tbsp sugar-free maple syrup</li>\n<li>Cooking spray</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Plug in the waffle iron to heat.</li>\n<li>Rob's batter: whisk ½ cup (55 g) Kodiak mix, ⅓ cup (100 g) egg\nwhites, ¼ cup (60 ml) Fairlife and ¼ tsp cinnamon until just combined.\nThe batter is thick.</li>\n<li>Maggie's batter: whisk ½ cup (50 g) Kodiak mix, ⅓ cup (75 g) egg\nwhites, 2½ tbsp (40 ml) Fairlife and ¼ tsp cinnamon the same way.</li>\n<li>Spray the waffle iron. Cook Rob's batter about 4 minutes, until\ngolden. Spray again and cook Maggie's.</li>\n<li>Slice Rob's banana. Rinse Maggie's berries (or thaw frozen ones in\nthe microwave 30 seconds).</li>\n<li><strong>Divide.</strong> Rob: his waffles topped with ½ cup (120 g)\nGreek yogurt, 1 banana (100 g) sliced and 1 tbsp sugar-free maple syrup.\nMaggie: her waffles topped with ⅓ cup (85 g) Greek yogurt, ⅔ cup (100 g)\nberries and 1 tbsp sugar-free maple syrup.</li>\n</ol>\n<p><strong>Reheat</strong></p>\n<p>Best eaten fresh. Leftover waffles: toaster or air fryer at 350°F, 2\nto 3 minutes, until crisp (the microwave makes them soft).</p>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>439</td>\n<td>42 g</td>\n<td>63 g</td>\n<td>3 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>341</td>\n<td>33 g</td>\n<td>48 g</td>\n<td>3 g</td>\n</tr>\n</tbody>\n</table>\n","w1:1:D_philly":"<p><span class=\"tag\">Sunday prep: bag and freeze the raw\nsteak</span></p>\n<p><strong>Ingredients</strong></p>\n<ul>\n<li>13½ oz (385 g) sirloin</li>\n<li>3 green bell peppers (480 g)</li>\n<li>¾ yellow onion (135 g)</li>\n<li>2 tsp olive oil and ¼ tsp salt</li>\n<li>Steak seasoning: 1 tbsp Worcestershire, ½ tsp garlic powder, ¼ tsp\nsalt, ¼ tsp black pepper</li>\n<li>3 slices provolone</li>\n<li>Rice: about ½ cup cooked</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Two nights before (Thursday night), move the raw steak from the\nfreezer to the fridge.</li>\n<li>Slice the steak paper-thin across the grain. It's easiest while it's\nstill a little frozen.</li>\n<li>Rice: heat a microwave rice pouch (90 seconds) and measure out what\nyou need below; the rest keeps 4 days in the fridge.</li>\n<li>Slice the peppers and onion into strips.</li>\n<li>Heat the olive oil in a large skillet over medium-high. Add the\npeppers, onion and salt and cook 8 to 10 minutes, stirring, until soft\nand browned. Move them to a plate.</li>\n<li>Turn the heat to high. Add the steak in one layer with the\nWorcestershire, garlic powder, salt and pepper. Sear 2 to 3 minutes,\ntossing, until no pink is left.</li>\n<li>Make two piles in the pan, Rob's a little bigger. Top each with half\nthe peppers and onions, lay the provolone on top (Rob 2 slices, Maggie\n1), cover and cook 1 minute to melt.</li>\n<li><strong>Divide.</strong> Rob: his pile, 6 oz (170 g) cooked steak\nwith peppers, onions and 2 slices provolone, over ¼ cup (40 g) rice.\nMaggie: her pile, 4¼ oz (120 g) cooked steak with peppers, onions and 1\nslice provolone, over ¼ cup (45 g) rice.</li>\n</ol>\n<p><strong>Reheat</strong></p>\n<p>Microwave covered 1½ to 2 minutes, stirring halfway.</p>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>648</td>\n<td>64 g</td>\n<td>34 g</td>\n<td>28 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>477</td>\n<td>44 g</td>\n<td>33 g</td>\n<td>19 g</td>\n</tr>\n</tbody>\n</table>\n","w1:1:B_ftoast":"<p><strong>Ingredients</strong></p>\n<ul>\n<li>6 slices 45-calorie bread</li>\n<li>1 cup (270 g) liquid egg whites</li>\n<li>2 large eggs</li>\n<li>1¼ tsp cinnamon</li>\n<li>½ tsp vanilla extract</li>\n<li>¼ Honeycrisp apple (Rob)</li>\n<li>¼ cup mixed berries (Maggie)</li>\n<li>⅔ cup (155 g) plain nonfat Greek yogurt</li>\n<li>2 tbsp sugar-free maple syrup</li>\n<li>Cooking spray</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Rob's soak: in a shallow dish whisk ⅔ cup (150 g) egg whites, 1 egg, ½ tsp cinnamon and ¼ tsp vanilla extract.</li>\n<li>Maggie's soak: in a second dish whisk ½ cup (120 g) egg whites, 1\negg, ½ tsp cinnamon and ¼ tsp vanilla extract.</li>\n<li>Heat a large nonstick pan over medium heat and spray it.</li>\n<li>Dip Rob's 3 slices in his soak, 20 seconds a side, and cook 2 to 3\nminutes a side until golden. Spray the pan and repeat with Maggie's 3\nslices.</li>\n<li>Rob's cinnamon apples: dice ¼ Honeycrisp apple (55 g), then cook in\na small sprayed pan over medium with ¼ tsp cinnamon, 4 minutes, until\nsoft.</li>\n<li><strong>Divide.</strong> Rob: his 3 slices topped with the cinnamon\napples, ⅓ cup (80 g) Greek yogurt and 1 tbsp sugar-free maple syrup.\nMaggie: her 3 slices topped with ¼ cup (35 g) berries, ⅓ cup (75 g)\nGreek yogurt and 1 tbsp sugar-free maple syrup.</li>\n</ol>\n<p><strong>Reheat</strong></p>\n<p>Best eaten fresh. Leftovers: air fryer at 350°F for 3 minutes, or a\ndry skillet over medium, 1 to 2 minutes a side. Warm the apples 30\nseconds in the microwave.</p>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>370</td>\n<td>40 g</td>\n<td>42 g</td>\n<td>7 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>341</td>\n<td>36 g</td>\n<td>38 g</td>\n<td>7 g</td>\n</tr>\n</tbody>\n</table>\n","w1:1:D_shawarma":"<p><span class=\"tag\">Sunday prep: bag and freeze the raw\nchicken</span></p>\n<p><strong>Ingredients</strong></p>\n<ul>\n<li>13¼ oz (375 g) chicken breast</li>\n<li>Marinade: 2 tsp olive oil, 1 tsp cumin, 1 tsp ground coriander, 1\ntsp paprika, ½ tsp turmeric, ½ tsp salt, ¼ tsp black pepper, 2 garlic\ncloves (minced), juice of ½ lemon</li>\n<li>¾ cup (120 g) canned chickpeas, plus a pinch each of salt and\ncumin</li>\n<li>Salad: ½ English cucumber (150 g), 2 Roma tomatoes (150 g), a pinch\nof salt</li>\n<li>Tzatziki: ½ cup (110 g) plain nonfat Greek yogurt, a 2-inch piece of\ncucumber, 1 garlic clove, ½ tsp dried dill, juice of ½ lemon, a pinch of\nsalt</li>\n<li>2⅔ cups (125 g) chopped romaine</li>\n<li>1 cup (30 g) baby spinach (Maggie)</li>\n<li>3 tbsp (30 g) crumbled feta</li>\n<li>⅓ cup dry white rice</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Two nights before (Friday night), move the raw chicken from the\nfreezer to the fridge.</li>\n<li>Cook the rice: bring ⅓ cup dry white rice and ⅔ cup water to a boil,\ncover, turn the heat to low and simmer 15 minutes, then let it sit 5\nminutes off the heat and fluff with a fork. (A microwave rice pouch\nworks too.)</li>\n<li>Cut the chicken into strips and toss with the marinade. Let it sit\n10 minutes (or marinate overnight).</li>\n<li>Rinse the chickpeas, pat them dry and toss with the salt and\ncumin.</li>\n<li>Air-fry the chicken and chickpeas at 400°F for about 14 minutes,\nshaking once, until the chicken is 165°F.</li>\n<li>Salad: dice the cucumber and tomatoes and toss with a pinch of\nsalt.</li>\n<li>Tzatziki: grate the 2-inch piece of cucumber, squeeze it dry, and\nstir it into the yogurt with the grated garlic, dill, lemon juice and\nsalt.</li>\n<li><strong>Divide.</strong> Rob: 6 oz (170 g) cooked chicken, ⅔ cup\n(110 g) rice, half the chickpeas and salad, 1 cup (50 g) romaine, half\nthe tzatziki and 1½ tbsp (15 g) feta. Maggie: 4 oz (110 g) cooked\nchicken, ⅓ cup (50 g) rice, half the chickpeas and salad, 1⅔ cups (75 g)\nromaine, 1 cup (30 g) spinach, half the tzatziki and 1½ tbsp (15 g)\nfeta.</li>\n</ol>\n<p><strong>Reheat</strong></p>\n<p>Microwave the chicken, chickpeas and rice covered 1½ minutes. The\nsalad, tzatziki and feta stay cold.</p>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>649</td>\n<td>68 g</td>\n<td>55 g</td>\n<td>16 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>477</td>\n<td>50 g</td>\n<td>39 g</td>\n<td>14 g</td>\n</tr>\n</tbody>\n</table>\n"},"groceries":{"1":[["Meat and eggs",["Boneless skinless chicken breast, about 7.5 lb","95% lean ground beef, 3 lb","Top sirloin (USDA Choice), about 2 lb","Trader Joe's chicken breakfast sausage, 2 packages (24 links): 18 for the burritos (6 each on Mon, Wed and Fri), and 6 frozen for next Sunday's hash","Turkey pepperoni, 1 package","Original beef jerky, about 3.5 oz this week (one bag)","Oven-roasted deli turkey breast, sliced thin, about 1 lb","Omega-3 (DHA) eggs, 18-pack (you need 15)","Liquid egg whites, 1 × 32-oz carton"]],["Dairy",["Plain nonfat Greek yogurt, 1 × 32-oz tub","2% cottage cheese, 2 × 24-oz tubs","Fairlife fat-free milk, 3 × 52-oz bottles","Shredded reduced-fat cheddar, 2 × 8-oz bag","Shredded part-skim mozzarella, 1 × 8-oz bag (pizza night)","Crumbled feta, 1 × 4-oz container","Grated parmesan, 1 small tub (about 3 oz)","Provolone, 6 deli slices","Part-skim mozzarella string cheese, 6 sticks (Rob 2 a day, Maggie 1)"]],["Produce",["Baby spinach, one 16-oz clamshell","Romaine hearts, 2 × 3-pack","Brussels sprouts, 1 lb","Snap peas, 1 lb","Broccoli florets, 1 lb","Bell peppers, 5: 3 green (Philly bowls); 2 yellow or orange (Maggie's snack, pizza night)","Onions, 3: 2 yellow (Philly bowls, pizza night); 1 white (Big Mac bowls)","Roma tomatoes, 6 (Big Mac bowls, shawarma)","English (seedless) cucumbers, 2","Zucchini, 2 medium","Yukon gold potatoes, 2.5 lb","Bananas, 1","Honeycrisp apples, 6","Bartlett pears, 1","Navel oranges, 2","Clementines, 8","Garlic, 1 head (about 5 cloves this week)","Fresh ginger, one 2- to 3-inch piece (about 1 tbsp grated this week; freeze the rest)","Lemons, 1"]],["Frozen",["Mixed berries (Maggie), 1 bag","Shelled edamame, 3 × 12-oz bag"]],["Pant nd-butter), 1 jar","Sugar-free vanilla instant pudding mix, 1 small box","Nilla wafers, 1 small box","Popcorn: plain kernels to air-pop, or 94% fat-free microwave bags (about 7 cups popped this week)","Vanilla whey protein: about 2 scoops this week"]]]},"ops":{"1":["Portion the meat as you unpack it, one labeled bag each:<br>• 3 lb (1,360 g) chicken breast: today's Buffalo chicken mac<br>• 2½ lb (1,140 g) 95% lean ground beef: today's Big Mac bowls<br>• Sirloin steaks, about 9 oz (Rob) and 7¼ oz (Maggie): Monday's steak (fridge)<br>• 15¼ oz (435 g) chicken breast: Tuesday's orange chicken (fridge)<br>• 13½ oz (380 g) chicken breast: Wednesday's chicken parm (freezer)<br>• 13½ oz (385 g) sirloin: Thursday's Philly cheesesteaks (freezer)<br>• 8½ oz (245 g) chicken breast: Friday's pizza (freezer)<br>• 13½ oz (385 g) chicken breast: Saturday's shawarma (freezer)<br>• 13½ oz (380 g) chicken breast: Sunday's chicken parm (freezer)<br>• Chicken breakfast sausage: Monday's 6 links in the fridge; freeze Wednesday's 6, Friday's 6 and 6 for next Sunday's hash, each bag labeled","Heat the oven to 425°F and spray a sheet pan. Put a big pot of water with 1 tbsp salt on high for the pasta.","Knife work: cut 5⅓ medium Yukon gold potatoes (900 g) into ¾-inch cubes. For the bowls' cold toppings: chop 3½ romaine hearts, dice 4 Roma tomatoes and dice ⅔ white onion; keep them in the fridge.","Seasonings, in three small bowls:<br>• Chicken: 1 tsp salt, 1 tsp garlic powder, 1 tsp onion powder, 1 tsp smoked paprika, ½ tsp black pepper<br>• Potatoes: 1 tsp salt, 1 tsp garlic powder, ½ tsp black pepper<br>• Beef: 1 tsp onion powder, 1 tsp salt, ½ tsp black pepper","Mac chicken: lay the 3 lb chicken on the pan, season both sides with the chicken mix, spray the tops and bake 18 to 22 minutes, until 165°F.","Potatoes: toss with 1½ tbsp olive oil and the potato mix. Air-fry in two batches at 400°F, 18 to 20 minutes each, shaking halfway.","Pasta: cook 1 lb elbows 1 minute less than the package says. For the last 5 minutes, steam 4 cups (300 g) broccoli florets in a basket over the pot (or drop them in for the last 3). Drain.","Mac sauce: blend 24 oz (680 g) 2% cottage cheese with 1 cup Fairlife fat-free milk until completely smooth. Pour it into a pot over low and stir in 1½ cups (6 oz) shredded reduced-fat cheddar, ½ cup Frank's RedHot Original and 2 tbsp ranch seasoning, 4 to 5 minutes, until melted (don't let it boil). If it's thicker than queso, stir in up to ½ cup more Fairlife.","Big Mac beef: heat a large skillet (cast iron or stainless) over high until very hot. Add the 2½ lb beef, press it flat and leave it 3 minutes, then break it up and cook 2 minutes more (pour off any liquid). Add the beef mix and cook 3 to 4 minutes, until no pink is left. Drain the fat.","Burger sauce, three-quarter batch: whisk ¾ cup (185 g) plain nonfat Greek yogurt, 2¼ tbsp light mayo, 2¼ tbsp dill relish, 2¼ tsp yellow mustard, ¾ tsp each paprika, garlic powder and onion powder, and ¾ tsp white vinegar.","Hard-boil 2 eggs for Maggie's snacks: cover with cold water, bring to a boil, then 12 minutes, then into ice water.","Chicken out: rest 5 minutes, dice into ½-inch pieces, and stir the chicken, pasta and broccoli into the mac sauce.","Pack the mac: Rob 4 containers of 2¼ cups, Maggie 4 containers of 1⅔ cups. All 8 into the freezer.","Pack 6 Big Mac bowls:<br>• Rob's 3: 1 cup cooked beef and 1¼ cups potatoes in the big side; 1⅔ cups romaine, ⅔ Roma tomato, 2 tbsp onion, 3 tbsp pickle chips and 2 tbsp cheddar in the small container; 3 tbsp burger sauce in a cup<br>• Maggie's 3: 1 cup cooked beef and ½ cup potatoes; 2¼ cups romaine, ⅔ Roma tomato, 2 tbsp onion, 3 tbsp pickle chips and 1½ tbsp cheddar; 2 tbsp burger sauce<br>• All 6 in the fridge (Monday to Wednesday)","Store the rest: the leftover burger sauce and Maggie's 2 eggs in the fridge."],"2":["Portion the meat as you unpack it, one labeled bag each:<br>• 2¾ lb (1,290 g) chicken breast: today's Thai salad chicken<br>• 15¼ oz (435 g) chicken breast: Tuesday's chicken sandwiches (fridge)<br>• 7½ oz (210 g) chicken breast: Friday's fajitas, Maggie's (freezer)<br>• 15¼ oz (435 g) chicken breast: Saturday's tikka masala (freezer)<br>• 3 lb (1,360 g) 93% lean ground beef: today's chili<br>• 15¼ oz (435 g) 93% lean ground beef: Thursday's Mongolian beef (freezer)<br>• 1 lb (454 g) 93% lean ground turkey: today's meatballs<br>• 13½ oz (380 g) 93% lean ground turkey: next Sunday's turkey burgers (freezer)<br>• Pork tenderloin, about 1¼ lb: Monday's dinner (fridge)<br>• Rob's 10½ oz (300 g) shrimp for Friday: stays in its bag in the freezer","Thai salad marinade first, so it gets its 30 minutes: in a gallon zip-top bag, whisk 3 tbsp low-sodium soy sauce, 1 tbsp honey, 1 tbsp toasted sesame oil, the juice of 1 lime, 3 garlic cloves (grated), 1 tbsp grated fresh ginger and ¼ tsp black pepper. Add the 2¾ lb chicken, turn to coat and put it in the fridge.","Knife work for the chili: dice 2 yellow onions and 2 green bell peppers into one bowl. Peel the large sweet potato (1 lb) and cut it into ½-inch cubes. Mince 4 garlic cloves. Open and rinse 2 cans (15 oz) kidney beans and 1 can (15 oz) black beans.","Knife work for the rest of the week: dice 1 red bell pepper for the egg bites (set aside). For the salads, slice 3 bell peppers (red, yellow or orange) thin and shred about ½ small head of red cabbage (6 cups); keep them together in one container in the fridge.","Chili spices: in a small bowl, mix 3 tbsp chili powder, 1 tbsp cumin, 2 tsp smoked paprika, 1 tsp dried oregano, 2 tsp salt and ½ tsp black pepper.","Chili: heat 1 tbsp olive oil in a big pot (6 quarts or more) over medium-high, then turn it to high. Brown the 3 lb beef in two batches, letting each sit 3 to 4 minutes before breaking it up. Add the onions and peppers and cook 6 minutes more (pour off any liquid that pools). Stir in the spices and garlic for 1 minute. Add 2 cans (28 oz) crushed tomatoes, the beans and the sweet potato and bring it to a boil. Turn to low and simmer, lid partly on, 40 minutes, stirring every 10 minutes.","Heat the oven to 425°F and spray a sheet pan. Lay out the marinated chicken (leave the extra marinade behind) and bake 18 to 22 minutes, until 165°F.","While those cook: turkey bacon for the egg bites. Cook 9 slices in a skillet over medium, 3 to 4 minutes a side, until crisp. Cool and crumble.","Meatballs: in a bowl, mix the 1 lb ground turkey, 1 large egg, ⅓ cup (20 g) panko, 3 tbsp (15 g) grated parmesan, 1 tsp Italian seasoning, ½ tsp garlic powder, ½ tsp salt and ¼ tsp black pepper with your hands, just until combined. Roll 16 balls, about 1½ inches (35 g each), onto a sprayed sheet pan.","Hard-boil 2 eggs for Maggie's snacks: cover with cold water, bring to a boil, then 12 minutes, then into ice water.","Chicken out: let it rest 10 minutes. Turn the oven to 400°F and bake the meatballs 15 to 18 minutes, until 165°F.","Egg bites: spray 18 cups of two muffin tins. In a blender, blend 12 large eggs, 1½ cups (360 g) liquid egg whites, 1½ cups (340 g) 2% cottage cheese, ½ tsp salt, ¼ tsp black pepper and ½ tsp garlic powder, 30 seconds. Divide the crumbled bacon, the diced red pepper and ¾ cup (3 oz) shredded reduced-fat cheddar among the 18 cups, then pour the egg mixture over them, about ¾ full.","Meatballs out: turn the oven to 325°F and bake the egg bites 22 to 25 minutes, until the centers barely jiggle. Cool 10 minutes, run a knife around each one and pop them out.","Slice the rested salad chicken thin and put it in the fridge in one container.","Chili done (sweet potato tender): cool it 20 minutes, then portion it. Rob: 4 containers of 2¼ cups. Maggie: 4 containers of 1¾ cups. The 2 extra cups go in a fifth container as a spare lunch. All of it into the freezer (the yogurt and cheddar go on when you eat it).","Store the rest: meatballs in the fridge for Wednesday. Egg bites: 12 in the fridge (Monday and Wednesday), 6 in a freezer bag (Friday). Maggie's 2 eggs in the fridge."],"3":["Portion the meat as you unpack it, one labeled bag each:<br>• 2¾ lb (1,250 g) chicken breast: today's ranch bake<br>• 2¼ lb (1,035 g) 95% lean ground beef: today's Korean beef bowls<br>• 1 lb (454 g) 93% lean ground turkey: today's chorizo<br>• 7½ oz (210 g) chicken breast: Monday's bang bang, Maggie's (fridge); Rob's 10½ oz shrimp stays in its bag in the freezer<br>• 14¾ oz (420 g) pork tenderloin: Tuesday's carnitas (fridge)<br>• 13½ oz (380 g) chicken breast: Wednesday's chicken parm (freezer)<br>• Sirloin steaks, about 9 oz (Rob) and 7 oz (Maggie): Thursday's steak frites (freezer)<br>• 12¾ oz (365 g) 95% lean ground beef: Friday's crunchwraps (freezer)<br>• 15¼ oz (435 g) chicken breast: Saturday's BBQ pulled chicken (freezer)<br>• 13½ oz (380 g) chicken breast: Sunday's chicken parm (freezer)","Heat the oven to 425°F and spray two sheet pans.","Knife work: cut 2⅔ lb (1,200 g) Yukon gold potatoes into ¾-inch cubes. Trim 3 cups (300 g) green beans. For the Korean beef: mince 3 garlic cloves and grate 1 tbsp fresh ginger. For the pickles: slice 1¼ English cucumbers thin and shred 4 medium carrots.","Mixes, in small bowls:<br>• Ranch chicken: 1 tsp salt, 1 tsp garlic powder, 1 tsp paprika, ½ tsp black pepper<br>• Chorizo: 1 tbsp chili powder, 1 tsp smoked paprika, 1 tsp cumin, 1 tsp dried oregano, ½ tsp garlic powder, ¾ tsp salt, ¼ tsp black pepper, 1 tbsp red wine vinegar<br>• Korean sauce: 5 tbsp gochujang, 3½ tbsp low-sodium soy sauce, 4 tsp honey, 1 tbsp toasted sesame oil<br>• Ranch sauce: 1½ cups (340 g) plain nonfat Greek yogurt, ½ cup Fairlife fat-free milk, 2 tbsp ranch seasoning (fridge)","Quick pickles: toss the cucumbers and carrots with ¼ cup rice vinegar and ½ tsp salt and put them in the fridge (at least 15 minutes).","Into the oven: the potatoes tossed with 1 tbsp olive oil, ½ tsp salt and ½ tsp garlic powder on one pan for 25 minutes; the 2¾ lb chicken with the ranch chicken mix on the other rack for 18 to 22 minutes, until 165°F.","Rice: bring 1¼ cups dry white rice and 2½ cups water to a boil, cover, turn to low and simmer 15 minutes, then 5 minutes off the heat; fluff.","Green beans: boil them 3 minutes, drain and cut into thirds. Meanwhile cook 8 slices turkey bacon in a skillet over medium, 3 to 4 minutes a side, until crisp; crumble.","Hard-boil 2 eggs for Maggie's snacks: cover with cold water, bring to a boil, then 12 minutes, then into ice water.","Chorizo: heat a large skillet over high until very hot. Add the 1 lb turkey, press it flat and leave it 3 minutes, then break it up (pour off any liquid). Add the chorizo mix and cook 3 to 4 minutes more, until no pink is left. Cool, then split into 3 containers: Monday's and Wednesday's in the fridge, Friday's in the freezer.","Korean beef: wipe the skillet and heat it over high. Add the 2¼ lb beef, press it flat and leave it 3 minutes, then add the garlic and ginger and cook 4 to 5 minutes more, breaking it up (pour off any liquid). Stir in the Korean sauce and simmer 2 minutes. Microwave 1¾ cups (270 g) frozen edamame 1 minute.","Chicken and potatoes out: rest the chicken 5 minutes and dice it. Turn the oven down to 375°F.","Ranch bake: in a sprayed 9x13 pan, mix the potatoes, chicken, bacon, green beans and ranch sauce. Top with 1½ cups (6 oz) shredded reduced-fat cheddar and bake 20 minutes, until melted. Cool 15 minutes.","Pack 6 Korean beef bowls (drain the pickles first):<br>• Rob's 3: ¾ cup rice, 1 cup cooked beef, ¼ cup edamame and a sixth of the pickles each<br>• Maggie's 3: a bed of 1 cup baby spinach, ⅓ cup rice, ¾ cup cooked beef, ⅓ cup edamame and a sixth of the pickles each<br>• All 6 in the fridge (Monday to Wednesday)","Pack the ranch bake: Rob 4 containers of 2⅓ cups, Maggie 4 containers of 1⅔ cups. All 8 into the freezer.","Store the rest: Maggie's 2 eggs in the fridge."],"4":["Portion the meat as you unpack it, one labeled bag each:<br>• 1½ lb (680 g) 93% lean ground beef: today's lasagna<br>• 2½ lb (1,085 g) chicken breast: today's Greek chicken<br>• Sirloin steaks, about 9 oz (Rob) and 6½ oz (Maggie): Monday's steak salad (fridge)<br>• 14½ oz (410 g) chicken breast: Tuesday's quesadillas (fridge)<br>• 12¼ oz (350 g) 93% lean ground beef: Wednesday's bolognese (freezer)<br>• 6½ oz (185 g) chicken breast: Thursday's teriyaki, Maggie's (freezer); Rob's 6 oz salmon stays frozen<br>• 12½ oz (355 g) 95% lean ground beef: Friday's smash burgers (freezer)<br>• Boneless pork chops, 8 oz (Rob) and 6½ oz (Maggie): Saturday's pork chops (freezer)<br>• 13¾ oz (390 g) chicken breast: Sunday's pot pie (freezer)<br>• Chicken breakfast sausage: Monday's 4 links in the fridge; freeze Wednesday's 4 and Friday's 4 in two labeled bags","Greek chicken marinade first, so it soaks while the lasagna bakes: in a bowl or zip-top bag, mix the juice of 1 lemon, 2 tsp dried oregano, 3 garlic cloves (minced), 1 tsp salt, ½ tsp black pepper and 1 tbsp olive oil. Add the 2½ lb chicken, turn to coat, fridge.","Put a big pot of water with 1 tbsp salt on to boil for the lasagna noodles.","Knife work: slice 2 medium zucchini lengthwise into thin strips (about ⅛ inch). For the bowls: dice 1½ English cucumbers and 6 Roma tomatoes and chop 8 cups romaine. For the tzatziki: grate ¼ English cucumber and squeeze it dry in a paper towel, grate 1 garlic clove and juice ½ lemon.","Noodles: cook 12 oz lasagna noodles (about 12) 2 minutes less than the package says. Drain and lay them flat on a sprayed sheet pan.","Meat sauce: heat a large skillet over high. Brown the 1½ lb beef with 1 tsp Italian seasoning, 8 minutes, leaving it alone for the first 3 (pour off any liquid). Stir in ½ tsp salt and 2 jars (24 oz each) marinara.","Cheese mix: stir 24 oz (680 g) 2% cottage cheese, 1 large egg, ¼ cup (1 oz) grated parmesan, ½ tsp garlic powder and ¼ tsp black pepper.","Lasagna: heat the oven to 375°F and spray a 9x13 pan. Spread a thin layer of meat sauce, then layer 3 times: 4 noodles, a third of the cheese mix, a third of the zucchini, a third of the remaining sauce, a third of 2 cups (8 oz) shredded part-skim mozzarella. Cover with sprayed foil and bake 30 minutes, then uncovered 15 more.","While it bakes: rice. Bring 1⅓ cups dry white rice and 2⅔ cups water to a boil, cover, turn to low and simmer 15 minutes, then 5 minutes off the heat; fluff.","Salad: toss the diced cucumbers and tomatoes with ¼ tsp salt and 1 tsp red wine vinegar. Tzatziki: stir 1½ cups (330 g) plain nonfat Greek yogurt with the grated cucumber, the garlic, 1 tsp dried dill, the lemon juice and ¼ tsp salt.","Burger sauce, quarter batch, for Friday's smash burgers: whisk ¼ cup (62 g) plain nonfat Greek yogurt, 2¼ tsp light mayo, 2¼ tsp dill relish, ¾ tsp yellow mustard, ¼ tsp each paprika, garlic powder and onion powder, and ¼ tsp white vinegar.","Hard-boil 2 eggs for Maggie's snacks: cover with cold water, bring to a boil, then 12 minutes, then into ice water.","Lasagna out (rest it 15 minutes): turn the oven to 425°F, spray a sheet pan and bake the marinated chicken 18 to 22 minutes, until 165°F. Rest 5 minutes and slice.","Cut the lasagna into 4 strips across the short side, then cut each strip into a bigger piece for Rob and a smaller one for Maggie. 8 containers into the freezer.","Pack 6 Greek chicken bowls:<br>• Rob's 3: 1 cup sliced chicken, 1 cup rice, a sixth of the salad and 1 cup romaine; 2 tbsp hummus and ¼ cup tzatziki in sauce cups<br>• Maggie's 3: ¾ cup sliced chicken, ⅓ cup rice, a sixth of the salad, 1⅔ cups romaine, 1 cup baby spinach and 1½ tbsp feta; 2 tbsp hummus and ¼ cup tzatziki in sauce cups<br>• All 6 in the fridge (Monday to Wednesday)","Store the rest: the burger sauce and Maggie's 2 eggs in the fridge."],"2w2":["Portion the meat as you unpack it, one labeled bag each:<br>• 2¾ lb (1,290 g) chicken breast: today's Thai salad chicken<br>• 15¼ oz (435 g) chicken breast: Tuesday's chicken sandwiches (fridge)<br>• 7½ oz (210 g) chicken breast: Friday's fajitas, Maggie's (freezer)<br>• 15¼ oz (435 g) chicken breast: Saturday's tikka masala (freezer)<br>• 3 lb (1,360 g) 93% lean ground beef: today's chili<br>• 15¼ oz (435 g) 93% lean ground beef: Thursday's Mongolian beef (freezer)<br>• 1 lb (454 g) 93% lean ground turkey: today's meatballs<br>• 13½ oz (380 g) 93% lean ground turkey: next Sunday's turkey burgers (freezer)<br>• Pork tenderloin, about 1¼ lb: Monday's dinner (fridge)<br>• Rob's 10½ oz (300 g) shrimp for Friday: stays in its bag in the freezer","This week only: freeze the 12 chicken sausage links in two bags: 6 for next Sunday's hash (move them to the fridge Friday night) and 6 spares.","Thai salad marinade first, so it gets its 30 minutes: in a gallon zip-top bag, whisk 3 tbsp low-sodium soy sauce, 1 tbsp honey, 1 tbsp toasted sesame oil, the juice of 1 lime, 3 garlic cloves (grated), 1 tbsp grated fresh ginger and ¼ tsp black pepper. Add the 2¾ lb chicken, turn to coat and put it in the fridge.","Knife work for the chili: dice 2 yellow onions and 2 green bell peppers into one bowl. Peel the large sweet potato (1 lb) and cut it into ½-inch cubes. Mince 4 garlic cloves. Open and rinse 2 cans (15 oz) kidney beans and 1 can (15 oz) black beans.","Knife work for the rest of the week: dice 1 red bell pepper for the egg bites (set aside). For the salads, slice 3 bell peppers (red, yellow or orange) thin and shred about ½ small head of red cabbage (6 cups); keep them together in one container in the fridge.","Chili spices: in a small bowl, mix 3 tbsp chili powder, 1 tbsp cumin, 2 tsp smoked paprika, 1 tsp dried oregano, 2 tsp salt and ½ tsp black pepper.","Chili: heat 1 tbsp olive oil in a big pot (6 quarts or more) over medium-high, then turn it to high. Brown the 3 lb beef in two batches, letting each sit 3 to 4 minutes before breaking it up. Add the onions and peppers and cook 6 minutes more (pour off any liquid that pools). Stir in the spices and garlic for 1 minute. Add 2 cans (28 oz) crushed tomatoes, the beans and the sweet potato and bring it to a boil. Turn to low and simmer, lid partly on, 40 minutes, stirring every 10 minutes.","Heat the oven to 425°F and spray a sheet pan. Lay out the marinated chicken (leave the extra marinade behind) and bake 18 to 22 minutes, until 165°F.","While those cook: turkey bacon for the egg bites. Cook 9 slices in a skillet over medium, 3 to 4 minutes a side, until crisp. Cool and crumble.","Meatballs: in a bowl, mix the 1 lb ground turkey, 1 large egg, ⅓ cup (20 g) panko, 3 tbsp (15 g) grated parmesan, 1 tsp Italian seasoning, ½ tsp garlic powder, ½ tsp salt and ¼ tsp black pepper with your hands, just until combined. Roll 16 balls, about 1½ inches (35 g each), onto a sprayed sheet pan.","Hard-boil 2 eggs for Maggie's snacks: cover with cold water, bring to a boil, then 12 minutes, then into ice water.","Chicken out: let it rest 10 minutes. Turn the oven to 400°F and bake the meatballs 15 to 18 minutes, until 165°F.","Egg bites: spray 18 cups of two muffin tins. In a blender, blend 12 large eggs, 1½ cups (360 g) liquid egg whites, 1½ cups (340 g) 2% cottage cheese, ½ tsp salt, ¼ tsp black pepper and ½ tsp garlic powder, 30 seconds. Divide the crumbled bacon, the diced red pepper and ¾ cup (3 oz) shredded reduced-fat cheddar among the 18 cups, then pour the egg mixture over them, about ¾ full.","Meatballs out: turn the oven to 325°F and bake the egg bites 22 to 25 minutes, until the centers barely jiggle. Cool 10 minutes, run a knife around each one and pop them out.","Slice the rested salad chicken thin and put it in the fridge in one container.","Chili done (sweet potato tender): cool it 20 minutes, then portion it. Rob: 4 containers of 2¼ cups. Maggie: 4 containers of 1¾ cups. The 2 extra cups go in a fifth container as a spare lunch. All of it into the freezer (the yogurt and cheddar go on when you eat it).","Store the rest: meatballs in the fridge for Wednesday. Egg bites: 12 in the fridge (Monday and Wednesday), 6 in a freezer bag (Friday). Maggie's 2 eggs in the fridge."]},"made":{"1":"Buffalo chicken mac, Big Mac bowls, burger sauce, Maggie's eggs, the week's sausage links split for the fridge and freezer, and the raw dinner proteins for Tue to Sun.","2":"Chili, the Thai salad chicken and vegetables, egg bites, Wednesday's meatballs, Maggie's eggs, and the raw dinner proteins for Tue and Thu to Sun.","3":"Ranch potato bake, Korean beef bowls, the week's turkey chorizo, Maggie's eggs, and the raw dinner proteins for Tue to Sun.","4":"Lasagna, Greek chicken bowls, a quarter batch of burger sauce, Maggie's eggs, the week's sausage links split for the fridge and freezer, and the raw dinner proteins for Tue to Sun.","2w2":"Chili, the Thai salad chicken and vegetables, egg bites, Wednesday's meatballs, Maggie's eggs, and the raw dinner proteins for Tue and Thu to Sun."},"liz":{"start":"2026-11-16","weeks":11,"days":{"2026-11-16":{"w":1,"m":1,"i":0,"menu":"1-0","holiday":"","cuisine":"Tex-Mex"},"2026-11-17":{"w":1,"m":1,"i":1,"menu":"1-1","holiday":"","cuisine":"Tex-Mex"},"2026-11-18":{"w":1,"m":1,"i":2,"menu":"1-2","holiday":"","cuisine":"Tex-Mex"},"2026-11-19":{"w":1,"m":1,"i":3,"menu":"1-3","holiday":"","cuisine":"Tex-Mex"},"2026-11-20":{"w":1,"m":1,"i":4,"menu":"1-4","holiday":"","cuisine":"Tex-Mex"},"2026-11-21":{"w":1,"m":1,"i":5,"menu":"1-5","holiday":"","cuisine":"Tex-Mex"},"2026-11-22":{"w":1,"m":1,"i":6,"menu":"1-6","holiday":"","cuisine":"Tex-Mex"},"2026-11-23":{"w":2,"m":2,"i":0,"menu":"2-0","holiday":"","cuisine":"Asian takeout at home"},"2026-11-24":{"w":2,"m":2,"i":1,"menu":"2-1","holiday":"","cuisine":"Asian takeout at home"},"2026-11-25":{"w":2,"m":2,"i":2,"menu":"2-2","holiday":"","cuisine":"Asian takeout at home"},"2026-11-26":{"w":2,"m":2,"i":3,"menu":"2-3-h","holiday":"Thanksgiving","cuisine":"Asian takeout at home"},"2026-11-27":{"w":2,"m":2,"i":4,"menu":"2-4","holiday":"","cuisine":"Asian takeout at home"},"2026-11-28":{"w":2,"m":2,"i":5,"menu":"2-5","holiday":"","cuisine":"Asian takeout at hom
