 g 2% cottage cheese (about ¾ cup), 100 g yellow or orange bell pepper (about ⅔ pepper), 75 g English cucumber (about ¼ cucumber), with 1 tsp ranch seasoning stirred into the cottage cheese. 180 cal, 20 g protein, 16 g carbs.</p>","w1:1:L_mac":"<p><span class=\"tag\">Sunday prep: the whole batch</span></p>\n<p><em>Makes 8 containers (4 Rob, 4 Maggie).</em></p>\n<p><strong>Ingredients</strong></p>\n<ul>\n<li>3 lb (1,360 g) chicken breast</li>\n<li>Chicken seasoning: 1 tsp salt, 1 tsp garlic powder, 1 tsp onion\npowder, 1 tsp smoked paprika, ½ tsp black pepper (plus 2 tbsp Frank's\nRedHot if you want more kick)</li>\n<li>1 lb (454 g) elbow pasta, plus 1 tbsp salt for the water</li>\n<li>4 cups (300 g) broccoli florets</li>\n<li>24 oz (680 g) 2% cottage cheese</li>\n<li>1½ cups (360 ml) Fairlife fat-free milk</li>\n<li>1½ cups (6 oz) shredded reduced-fat cheddar</li>\n<li>½ cup Frank's RedHot Original</li>\n<li>2 to 3 tbsp ranch seasoning</li>\n<li>Cooking spray</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Heat the oven to 425°F and spray a sheet pan.</li>\n<li>Lay out the chicken and season both sides with the chicken seasoning\n(toss it in the Frank's first if using). Spray the tops.</li>\n<li>Bake 18 to 22 minutes, until 165°F inside. Rest 5 minutes, then dice\ninto ½-inch pieces.</li>\n<li>Meanwhile bring a big pot of water and 1 tbsp salt to a boil. Cook\nthe pasta 1 minute less than the package says.</li>\n<li>For the last 5 minutes, set a steamer basket of broccoli over the\npot (or drop the florets into the water for the last 3). Drain.</li>\n<li>Blend the cottage cheese with 1 cup of the Fairlife until completely\nsmooth.</li>\n<li>Pour it into a pot over low heat. Add the cheddar, the ½ cup Frank's\nand 2 tbsp ranch seasoning. Stir 4 to 5 minutes until melted. Don't let\nit boil.</li>\n<li>Taste. Add up to 1 more tbsp ranch, and up to ½ cup more Fairlife,\nuntil it looks like thick queso.</li>\n<li>Stir in the chicken, pasta and broccoli.</li>\n<li><strong>Divide.</strong> Rob: 4 containers of 2¼ cups (460 g) each.\nMaggie: 4 containers of 1⅔ cups (330 g) each. <strong>Store:</strong>\nAll 8 containers in the freezer. Two nights before each lunch, move that\nday's 2 containers to the fridge: Tuesday night for Thursday, Wednesday\nnight for Friday, Thursday night for Saturday, Friday night for Sunday.\nCooked food keeps 3 to 4 days in the fridge, which is why these start\nfrozen.</li>\n</ol>\n<p><strong>Reheat</strong></p>\n<p>Microwave covered 2½ to 3 minutes, stirring halfway, until hot in the\nmiddle. If it is still partly frozen, run it 2 minutes on defrost\nfirst.</p>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>601</td>\n<td>67 g</td>\n<td>53 g</td>\n<td>12 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>431</td>\n<td>48 g</td>\n<td>38 g</td>\n<td>9 g</td>\n</tr>\n</tbody>\n</table>\n","w1:1:D_orange":"<p><span class=\"tag\">Sunday prep: the raw chicken goes in the fridge,\nnot the freezer</span></p>\n<p><strong>Ingredients</strong></p>\n<ul>\n<li>13½ oz (385 g) chicken breast</li>\n<li>¼ tsp salt and a pinch of black pepper</li>\n<li>2½ tbsp cornstarch, plus 1 tsp if the sauce needs it</li>\n<li>Sauce: 7 tbsp (105 ml) orange juice, 2¼ tbsp low-sodium soy sauce,\n2½ tsp honey, 2 garlic cloves (grated), 1 tbsp grated fresh ginger, ¼\ntsp red pepper flakes</li>\n<li>4¾ cups (300 g) snap peas</li>\n<li>1 tsp olive oil and a pinch of salt</li>\n<li>½ cup dry white rice</li>\n<li>Cooking spray</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Cook the rice: bring ½ cup dry white rice and 1 cup water to a boil,\ncover, turn the heat to low and simmer 15 minutes, then let it sit 5\nminutes off the heat and fluff with a fork. (A microwave rice pouch\nworks too.)</li>\n<li>Cut the chicken into 1-inch cubes. Season with the salt and\npepper.</li>\n<li>Toss the chicken in the cornstarch until coated.</li>\n<li>Spray the air fryer basket, add the chicken in one layer and spray\nthe tops. Air-fry at 400°F for 12 to 14 minutes, shaking once.</li>\n<li>Sauce: in a small pan over medium, simmer the orange juice, soy\nsauce, honey, garlic, ginger and red pepper flakes 2 minutes, until\nglossy. If it stays thin, stir in 1 tsp cornstarch mixed with 1 tbsp\nwater and simmer 30 seconds.</li>\n<li>Toss the chicken in the sauce.</li>\n<li>Heat the olive oil in a skillet over high. Stir-fry the snap peas\nwith a pinch of salt, 2 minutes.</li>\n<li><strong>Divide.</strong> Rob: 6 oz (170 g) cooked chicken in sauce,\n¾ cup (135 g) rice and half the snap peas. Maggie: 4¼ oz (120 g) cooked\nchicken in sauce, ½ cup (90 g) rice and half the snap peas.</li>\n</ol>\n<p><strong>Reheat</strong></p>\n<p>Microwave the chicken and rice covered 1½ to 2 minutes, stirring\nhalfway, and the snap peas 30 seconds. For crispier chicken, air fryer\nat 375°F for 3 minutes.</p>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>649</td>\n<td>61 g</td>\n<td>76 g</td>\n<td>10 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>473</td>\n<td>44 g</td>\n<td>56 g</td>\n<td>7 g</td>\n</tr>\n</tbody>\n</table>\n","w1:1:D_pizza":"<p><span class=\"tag\">Sunday prep: bag and freeze the raw\nchicken</span></p>\n<p><strong>Ingredients</strong></p>\n<ul>\n<li>1 chicken breast (8 oz raw)</li>\n<li>Seasoning: ½ tsp Italian seasoning, ¼ tsp garlic powder, a pinch of\nsalt</li>\n<li>3 large (10-inch) low-carb tortillas: 2 for Rob, 1 for Maggie (with\n8-inch wraps: 3 and 2)</li>\n<li>⅔ cup (150 g) marinara</li>\n<li>⅔ cup (70 g) shredded part-skim mozzarella</li>\n<li>24 slices (42 g) turkey pepperoni</li>\n<li>⅔ yellow or orange bell pepper (100 g)</li>\n<li>⅓ yellow onion (50 g)</li>\n<li>Salad: 3¼ cups (150 g) chopped romaine, ⅓ English cucumber (100 g),\n1 cup (30 g) baby spinach for Maggie, 4 tbsp light balsamic\nvinaigrette</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Two nights before (Wednesday night), move the raw chicken from the\nfreezer to the fridge.</li>\n<li>Season the chicken and air-fry at 400°F for 14 minutes, until 165°F.\nRest 5 minutes and dice.</li>\n<li>Heat the oven to 425°F. Slice the pepper and onion thin.</li>\n<li>Lay the tortillas on a sheet pan and bake 3 minutes to crisp\nthem.</li>\n<li>Top Rob's 2 tortillas with 0 tsp (0 g) marinara, ⅓ cup (42 g)\nmozzarella, 16 pepperoni slices, ⅔ cup (85 g) diced chicken and half the\npepper and onion, split between them.</li>\n<li>Top Maggie's tortilla with 0 tsp (0 g) marinara, ¼ cup (28 g)\nmozzarella, 8 pepperoni slices, ½ cup (70 g) diced chicken and the other\nhalf of the pepper and onion.</li>\n<li>Bake 6 to 8 minutes, until the cheese bubbles and the edges are\ncrisp.</li>\n<li>Salad: slice the cucumber and toss each person's greens with 2 tbsp\nvinaigrette.</li>\n<li><strong>Divide.</strong> Rob: his 2 pizzas with a salad of 1⅔ cups\n(75 g) romaine, ¼ English cucumber (50 g) and 2 tbsp vinaigrette.\nMaggie: her pizza with a salad of 1⅔ cups (75 g) romaine, 1 cup (30 g)\nspinach, ¼ English cucumber (50 g) and 2 tbsp vinaigrette.</li>\n</ol>\n<p><strong>Reheat</strong></p>\n<p>Best eaten fresh. Leftovers: air fryer at 350°F, 3 to 4 minutes, or a\ncovered dry skillet over medium-low, 3 to 4 minutes, until the bottom is\ncrisp. Salad stays cold.</p>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>688</td>\n<td>61 g</td>\n<td>76 g</td>\n<td>28 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>469</td>\n<td>43 g</td>\n<td>47 g</td>\n<td>19 g</td>\n</tr>\n</tbody>\n</table>\n","w1:1:snack2:S_jerky":"<p><b>Rob's shake:</b> 1 scoop Tripact PB & vanilla protein, 240 ml (1 cup) Fairlife fat-free milk, 2 cups of raw baby spinach, 1 tbsp ground flax, 1 scoop collagen. Blend until smooth. 288 cal, 44 g protein, 13 g carbs.</p><p><b>Maggie (jerky + apple):</b> 28 g (1 oz) original beef jerky, 180 g Honeycrisp apple (about 1 apple). 174 cal, 11 g protein, 31 g carbs.</p>","w1:1:B_waffles":"<p><strong>Ingredients</strong></p>\n<ul>\n<li>1 cup (105 g) Kodiak Power Cakes mix</li>\n<li>¾ cup (175 g) liquid egg whites</li>\n<li>½ cup (100 ml) Fairlife fat-free milk</li>\n<li>½ tsp cinnamon</li>\n<li>1 cup (205 g) plain nonfat Greek yogurt</li>\n<li>1 banana (Rob)</li>\n<li>⅔ cup mixed berries (Maggie)</li>\n<li>2 tbsp sugar-free maple syrup</li>\n<li>Cooking spray</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Plug in the waffle iron to heat.</li>\n<li>Rob's batter: whisk ½ cup (55 g) Kodiak mix, ⅓ cup (100 g) egg\nwhites, ¼ cup (60 ml) Fairlife and ¼ tsp cinnamon until just combined.\nThe batter is thick.</li>\n<li>Maggie's batter: whisk ½ cup (50 g) Kodiak mix, ⅓ cup (75 g) egg\nwhites, 2½ tbsp (40 ml) Fairlife and ¼ tsp cinnamon the same way.</li>\n<li>Spray the waffle iron. Cook Rob's batter about 4 minutes, until\ngolden. Spray again and cook Maggie's.</li>\n<li>Slice Rob's banana. Rinse Maggie's berries (or thaw frozen ones in\nthe microwave 30 seconds).</li>\n<li><strong>Divide.</strong> Rob: his waffles topped with ½ cup (120 g)\nGreek yogurt, 1 banana (100 g) sliced and 1 tbsp sugar-free maple syrup.\nMaggie: her waffles topped with ⅓ cup (85 g) Greek yogurt, ⅔ cup (100 g)\nberries and 1 tbsp sugar-free maple syrup.</li>\n</ol>\n<p><strong>Reheat</strong></p>\n<p>Best eaten fresh. Leftover waffles: toaster or air fryer at 350°F, 2\nto 3 minutes, until crisp (the microwave makes them soft).</p>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>439</td>\n<td>42 g</td>\n<td>63 g</td>\n<td>3 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>341</td>\n<td>33 g</td>\n<td>48 g</td>\n<td>3 g</td>\n</tr>\n</tbody>\n</table>\n","w1:1:D_philly":"<p><span class=\"tag\">Sunday prep: bag and freeze the raw\nsteak</span></p>\n<p><strong>Ingredients</strong></p>\n<ul>\n<li>13½ oz (385 g) sirloin</li>\n<li>3 green bell peppers (480 g)</li>\n<li>¾ yellow onion (135 g)</li>\n<li>2 tsp olive oil and ¼ tsp salt</li>\n<li>Steak seasoning: 1 tbsp Worcestershire, ½ tsp garlic powder, ¼ tsp\nsalt, ¼ tsp black pepper</li>\n<li>3 slices provolone</li>\n<li>Rice: about ½ cup cooked</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Two nights before (Thursday night), move the raw steak from the\nfreezer to the fridge.</li>\n<li>Slice the steak paper-thin across the grain. It's easiest while it's\nstill a little frozen.</li>\n<li>Rice: heat a microwave rice pouch (90 seconds) and measure out what\nyou need below; the rest keeps 4 days in the fridge.</li>\n<li>Slice the peppers and onion into strips.</li>\n<li>Heat the olive oil in a large skillet over medium-high. Add the\npeppers, onion and salt and cook 8 to 10 minutes, stirring, until soft\nand browned. Move them to a plate.</li>\n<li>Turn the heat to high. Add the steak in one layer with the\nWorcestershire, garlic powder, salt and pepper. Sear 2 to 3 minutes,\ntossing, until no pink is left.</li>\n<li>Make two piles in the pan, Rob's a little bigger. Top each with half\nthe peppers and onions, lay the provolone on top (Rob 2 slices, Maggie\n1), cover and cook 1 minute to melt.</li>\n<li><strong>Divide.</strong> Rob: his pile, 6 oz (170 g) cooked steak\nwith peppers, onions and 2 slices provolone, over ¼ cup (40 g) rice.\nMaggie: her pile, 4¼ oz (120 g) cooked steak with peppers, onions and 1\nslice provolone, over ¼ cup (45 g) rice.</li>\n</ol>\n<p><strong>Reheat</strong></p>\n<p>Microwave covered 1½ to 2 minutes, stirring halfway.</p>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>648</td>\n<td>64 g</td>\n<td>34 g</td>\n<td>28 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>477</td>\n<td>44 g</td>\n<td>33 g</td>\n<td>19 g</td>\n</tr>\n</tbody>\n</table>\n","w1:1:B_ftoast":"<p><strong>Ingredients</strong></p>\n<ul>\n<li>6 slices 45-calorie bread</li>\n<li>1 cup (270 g) liquid egg whites</li>\n<li>2 large eggs</li>\n<li>½ scoop vanilla whey (Rob)</li>\n<li>1¼ tsp cinnamon</li>\n<li>½ tsp vanilla extract</li>\n<li>¼ Honeycrisp apple (Rob)</li>\n<li>¼ cup mixed berries (Maggie)</li>\n<li>⅔ cup (155 g) plain nonfat Greek yogurt</li>\n<li>2 tbsp sugar-free maple syrup</li>\n<li>Cooking spray</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Rob's soak: in a shallow dish whisk ⅔ cup (150 g) egg whites, 1 egg,\n½ scoop vanilla whey, ½ tsp cinnamon and ¼ tsp vanilla extract.</li>\n<li>Maggie's soak: in a second dish whisk ½ cup (120 g) egg whites, 1\negg, ½ tsp cinnamon and ¼ tsp vanilla extract.</li>\n<li>Heat a large nonstick pan over medium heat and spray it.</li>\n<li>Dip Rob's 3 slices in his soak, 20 seconds a side, and cook 2 to 3\nminutes a side until golden. Spray the pan and repeat with Maggie's 3\nslices.</li>\n<li>Rob's cinnamon apples: dice ¼ Honeycrisp apple (55 g), then cook in\na small sprayed pan over medium with ¼ tsp cinnamon, 4 minutes, until\nsoft.</li>\n<li><strong>Divide.</strong> Rob: his 3 slices topped with the cinnamon\napples, ⅓ cup (80 g) Greek yogurt and 1 tbsp sugar-free maple syrup.\nMaggie: her 3 slices topped with ¼ cup (35 g) berries, ⅓ cup (75 g)\nGreek yogurt and 1 tbsp sugar-free maple syrup.</li>\n</ol>\n<p><strong>Reheat</strong></p>\n<p>Best eaten fresh. Leftovers: air fryer at 350°F for 3 minutes, or a\ndry skillet over medium, 1 to 2 minutes a side. Warm the apples 30\nseconds in the microwave.</p>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>430</td>\n<td>52 g</td>\n<td>43 g</td>\n<td>8 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>341</td>\n<td>36 g</td>\n<td>38 g</td>\n<td>7 g</td>\n</tr>\n</tbody>\n</table>\n","w1:1:D_shawarma":"<p><span class=\"tag\">Sunday prep: bag and freeze the raw\nchicken</span></p>\n<p><strong>Ingredients</strong></p>\n<ul>\n<li>13¼ oz (375 g) chicken breast</li>\n<li>Marinade: 2 tsp olive oil, 1 tsp cumin, 1 tsp ground coriander, 1\ntsp paprika, ½ tsp turmeric, ½ tsp salt, ¼ tsp black pepper, 2 garlic\ncloves (minced), juice of ½ lemon</li>\n<li>¾ cup (120 g) canned chickpeas, plus a pinch each of salt and\ncumin</li>\n<li>Salad: ½ English cucumber (150 g), 2 Roma tomatoes (150 g), a pinch\nof salt</li>\n<li>Tzatziki: ½ cup (110 g) plain nonfat Greek yogurt, a 2-inch piece of\ncucumber, 1 garlic clove, ½ tsp dried dill, juice of ½ lemon, a pinch of\nsalt</li>\n<li>2⅔ cups (125 g) chopped romaine</li>\n<li>1 cup (30 g) baby spinach (Maggie)</li>\n<li>3 tbsp (30 g) crumbled feta</li>\n<li>⅓ cup dry white rice</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Two nights before (Friday night), move the raw chicken from the\nfreezer to the fridge.</li>\n<li>Cook the rice: bring ⅓ cup dry white rice and ⅔ cup water to a boil,\ncover, turn the heat to low and simmer 15 minutes, then let it sit 5\nminutes off the heat and fluff with a fork. (A microwave rice pouch\nworks too.)</li>\n<li>Cut the chicken into strips and toss with the marinade. Let it sit\n10 minutes (or marinate overnight).</li>\n<li>Rinse the chickpeas, pat them dry and toss with the salt and\ncumin.</li>\n<li>Air-fry the chicken and chickpeas at 400°F for about 14 minutes,\nshaking once, until the chicken is 165°F.</li>\n<li>Salad: dice the cucumber and tomatoes and toss with a pinch of\nsalt.</li>\n<li>Tzatziki: grate the 2-inch piece of cucumber, squeeze it dry, and\nstir it into the yogurt with the grated garlic, dill, lemon juice and\nsalt.</li>\n<li><strong>Divide.</strong> Rob: 6 oz (170 g) cooked chicken, ⅔ cup\n(110 g) rice, half the chickpeas and salad, 1 cup (50 g) romaine, half\nthe tzatziki and 1½ tbsp (15 g) feta. Maggie: 4 oz (110 g) cooked\nchicken, ⅓ cup (50 g) rice, half the chickpeas and salad, 1⅔ cups (75 g)\nromaine, 1 cup (30 g) spinach, half the tzatziki and 1½ tbsp (15 g)\nfeta.</li>\n</ol>\n<p><strong>Reheat</strong></p>\n<p>Microwave the chicken, chickpeas and rice covered 1½ minutes. The\nsalad, tzatziki and feta stay cold.</p>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>649</td>\n<td>68 g</td>\n<td>55 g</td>\n<td>16 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>477</td>\n<td>50 g</td>\n<td>39 g</td>\n<td>14 g</td>\n</tr>\n</tbody>\n</table>\n"},"groceries":{"1":[["Meat and eggs",["Boneless skinless chicken breast, about 7.5 lb","95% lean ground beef, 3 lb","Top sirloin (USDA Choice), about 2 lb","Trader Joe's chicken breakfast sausage, 2 packages (24 links): 18 for the burritos (6 each on Mon, Wed and Fri), and 6 frozen for next Sunday's hash","Turkey pepperoni, 1 package","Original beef jerky, 1 bag (Maggie uses 1 oz a week)","Omega-3 (DHA) eggs, 18-pack (you need 15)","Liquid egg whites, 1 × 32-oz carton"]],["Dairy",["Plain nonfat Greek yogurt, 1 × 32-oz tub","2% cottage cheese, 2 × 24-oz tubs","Fairlife fat-free milk, 3 × 52-oz bottles","Shredded reduced-fat cheddar, 2 × 8-oz bag","Shredded part-skim mozzarella, 1 × 8-oz bag (pizza night)","Crumbled feta, 1 × 4-oz container","Grated parmesan, 1 small tub (about 3 oz)","Provolone, ain.","Dice the chicken and mix the mac. Pack 8 containers (4 Rob, 4 Maggie)\nand freeze them for Thu to Sun.","Whisk a three-quarter batch of <strong>burger sauce</strong> for the\nbowls.","Pack 6 <strong>Big Mac bowls</strong>: beef and potatoes in one side,\ncold toppings in a small container, sauce in a cup.","Sausage links for the <strong>breakfast burritos</strong>: Monday's 6\nstay in the fridge. Freeze Wednesday's 6, Friday's 6, and 6 more for\nnext Sunday's hash, each in its own labeled bag.","Hard-boil 2 eggs for Maggie's snacks (12 min, then ice water).","Wash and cut the week's peppers, onions and cucumbers.","Bag, label and freeze the raw dinner proteins for Wed to Sun (two\nbags of chicken for the two parm nights). Monday's steak and Tuesday's\nchicken stay in the fridge."],"2":["Whisk the marinade for the <strong>Thai salad</strong> chicken, add\n2¾ lb (1,290 g) raw chicken breast and let it sit while you start the\nchili.","Dice 2 onions, 2 peppers and 1 lb sweet potato for the\n<strong>chili</strong>.","Brown 3 lb beef with the onions and peppers in 1 tbsp oil. Stir in\nthe spices and garlic, then the tomatoes, beans and sweet potato. Simmer\n40 min while you do the rest.","Oven to 425°F. Bake the salad chicken 18 to 22 min, rest 10 min,\nslice and refrigerate.","Cook 9 slices of turkey bacon for the <strong>egg bites</strong> and\ncrumble.","Mix and roll 16 <strong>turkey meatballs</strong> for Wednesday's\ndinner.","Chicken out: oven to 400°F and bake the meatballs 15 to 18 min.\nRefrigerate.","Oven to 325°F. Blend the eggs, whites and cottage cheese, pour over\nthe bacon, cheddar and pepper in 18 muffin cups, and bake 22 to 25\nmin.","Slice 3 peppers thin and shred the red cabbage for the salads; one\ncontainer in the fridge.","Portion the <strong>chili</strong>: Rob 2¼ cups, Maggie 1¾ cups, 8\ncontainers into the freezer for Thu to Sun.","Egg bites: Monday's and Wednesday's in the fridge, Friday's in a\nfreezer bag.","Hard-boil 2 eggs for Maggie's snacks. Cut the week's vegetables.","Bag, label and freeze the raw dinner proteins for Thu to Sun (Rob's\nshrimp stays in its bag in the freezer). Monday's pork tenderloin and\nTuesday's chicken stay in the fridge."],"3":["Oven to 425°F. Dice 2⅔ lb potatoes for the <strong>ranch\nbake</strong>, toss with oil and roast 25 min.","Season 2¾ lb raw chicken for the ranch bake (1 tsp each salt, garlic\npowder and paprika, ½ tsp pepper) and bake it on the other rack, 18 to\n22 min.","Start 1¼ cups of dry rice for the <strong>Korean beef\nbowls</strong>.","Cook 8 slices of turkey bacon. Blanch 300 g green beans for 3\nmin.","Brown 1 lb turkey into <strong>chorizo</strong> with the spices and\nvinegar for the week's breakfast burritos. Cool it and split it into 3\ncontainers: Monday's and Wednesday's in the fridge, Friday's in the\nfreezer.","Same pan: brown 2¼ lb (1,035 g) beef with garlic and ginger, then\nstir in the Korean sauce.","Quick-pickle the sliced cucumber and shredded carrot in rice vinegar.\nThaw the edamame.","Pack 6 <strong>Korean beef bowls</strong>; Maggie's go on a bed of\nspinach.","Assemble the <strong>ranch bake</strong> (potatoes, diced chicken,\nbacon, green beans, sauce, cheddar on top) and bake at 375°F for 20\nmin.","Portion the ranch bake: 8 containers (4 Rob, 4 Maggie) into the\nfreezer for Thu to Sun.","Hard-boil 2 eggs for Maggie's snacks. Cut the week's vegetables.","Bag, label and freeze the raw dinner proteins for Wed to Sun (two\nbags of chicken for the two parm nights). Monday's chicken and Tuesday's\npork stay in the fridge; Rob's shrimp for Monday stays in its bag in the\nfreezer."],"4":["Big pot of water on for the <strong>lasagna</strong> noodles. Brown\n1½ lb beef and stir in the marinara.","Boil 12 oz noodles. Mix the cottage cheese, egg and parmesan. Slice\nthe zucchini thin.","Layer the lasagna and bake covered at 375°F for 30 min, then\nuncovered 15. Rest 15.","Lasagna out: oven to 425°F. Season 2½ lb (1,085 g) raw chicken breast\nfor the <strong>Greek bowls</strong> and bake 18 to 22 min.","Start 1⅓ cups of dry rice for the bowls.","Make the tzatziki and the cucumber-tomato salad.","Pack 6 <strong>Greek chicken bowls</strong> (Maggie's on spinach,\nwith her feta), with tzatziki and hummus in sauce cups.","Portion the <strong>lasagna</strong>: 8 containers (4 Rob, 4 Maggie)\ninto the freezer for Thu to Sun.","Whisk a quarter batch of <strong>burger sauce</strong> for Friday's\nsmash burgers.","Sausage links for the <strong>breakfast sandwiches</strong>: Monday's\n4 stay in the fridge; freeze Wednesday's 4 and Friday's 4 in two labeled\nbags.","Hard-boil 2 eggs for Maggie's snacks. Cut the week's vegetables.","Bag, label and freeze the raw dinner proteins for Wed to Sun (Rob's\nsalmon stays frozen). Monday's steak and Tuesday's chicken stay in the\nfridge."]},"made":{"1":"Buffalo chicken mac, Big Mac bowls, burger sauce, Maggie's eggs, the week's sausage links split for the fridge and freezer, and the raw dinner proteins for Tue to Sun.","2":"Chili, the Thai salad chicken and vegetables, egg bites, Wednesday's meatballs, Maggie's eggs, and the raw dinner proteins for Tue and Thu to Sun.","3":"Ranch potato bake, Korean beef bowls, the week's turkey chorizo, Maggie's eggs, and the raw dinner proteins for Tue to Sun.","4":"Lasagna, Greek chicken bowls, a quarter batch of burger sauce, Maggie's eggs, the week's sausage links split for the fridge and freezer, and the raw dinner proteins for Tue to Sun."}};
const DAYS = DATA.days, N = DAYS.length;
const SHORT = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const pad = n => String(n).padStart(2,'0');
const iso = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const idxOf = s => DAYS.findIndex(d => d.date === s);
function todayIdx(){ const t = iso(new Date()); const i = idxOf(t);
  if (i >= 0) return i; return t < DAYS[0].date ? 0 : N-1; }
const store = {
  get(k){ try { return localStorage.getItem('mmp|'+k) === '1'; } catch(e){ return false; } },
  set(k,v){ try { v ? localStorage.setItem('mmp|'+k,'1') : localStorage.removeItem('mmp|'+k); } catch(e){} }
};
// Shared checkmarks (groceries and nightly reminders): both phones see the same ticks within a second or two.
const SYNC = (DATA.sync || '').replace(/\/$/, '');
const HOUSE = SYNC ? SYNC + '/checks/municchi' : '';
const shared = {
  data: {}, live: false,
  key(k){ return k.replace(/[^A-Za-z0-9_-]/g, '_'); },
  get(k){ return this.live ? !!this.data[this.key(k)] : store.get(k); },
  set(k, v){
    store.set(k, v);
    const kk = this.key(k);
    if (v) this.data[kk] = true; else delete this.data[kk];
    if (!HOUSE) return;
    fetch(HOUSE + '/' + kk + '.json', { method: v ? 'PUT' : 'DELETE', body: v ? 'true' : undefined }).catch(() => {});
  },
  start(){
    if (!HOUSE || !window.EventSource) return;
    const es = new EventSource(HOUSE + '.json');
    const apply = (ev) => {
      let msg; try { msg = JSON.parse(ev.data); } catch(e){ return; }
      if (!msg || typeof msg.path !== 'string') return;
      if (ev.type === 'put') {
        if (msg.path === '/') this.data = (msg.data && typeof msg.data === 'object') ? msg.data : {};
        else { const kk = msg.path.slice(1); if (msg.data === null) delete this.data[kk]; else this.data[kk] = msg.data; }
      } else {
        const base = msg.path === '/' ? '' : msg.path.slice(1) + '/';
        Object.entries(msg.data || {}).forEach(([k, v]) => { if (v === null) delete this.data[base + k]; else this.data[base + k] = v; });
      }
      this.live = true;
      document.querySelectorAll('[data-skey]').forEach(inp => {
        const on = !!this.data[this.key(inp.dataset.skey)];
        if (inp.checked !== on){ inp.checked = on; inp.dispatchEvent(new Event('sync')); }
      });
      const st = document.getElementById('syncstat'); if (st) st.textContent = 'Shared: ticks show up on both phones';
    };
    es.addEventListener('put', apply); es.addEventListener('patch', apply);
    es.onerror = () => { const st = document.getElementById('syncstat'); if (st) st.textContent = 'Offline: ticks saved on this phone only'; };
  }
};
function sharedBox(key, row, onChange){
  const cb = el('input'); cb.type = 'checkbox'; cb.dataset.skey = key; cb.checked = shared.get(key);
  row.classList.toggle('done', cb.checked);
  cb.addEventListener('change', () => { shared.set(key, cb.checked); row.classList.toggle('done', cb.checked); if (onChange) onChange(); });
  cb.addEventListener('sync', () => { row.classList.toggle('done', cb.checked); if (onChange) onChange(); });
  return cb;
}
let state = { tab:'meals', i: todayIdx() };
(function fromHash(){
  const m = location.hash.match(/^#(meals|rob|mag)(?:\/(\d{4}-\d{2}-\d{2}))?/);
  if (m){ state.tab = m[1]; if (m[2] && idxOf(m[2]) >= 0) state.i = idxOf(m[2]); }
})();
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const fmt = n => n.toLocaleString('en-US');

function checkRow(key, html, cls){
  const row = el('label', cls || 'check'); const cb = el('input'); cb.type = 'checkbox';
  cb.checked = store.get(key); if (cb.checked) row.classList.add('done');
  cb.addEventListener('change', () => { store.set(key, cb.checked); row.classList.toggle('done', cb.checked); });
  const l = el('span','lbl'); l.innerHTML = html; row.append(cb, l); return row;
}

function renderMeals(d, main){
  if (d.holiday){ main.append(el('div','banner', d.holiday + ': one plate at the holiday meal, then back on the plan tomorrow morning.')); }
  const tots = el('div','totals');
  [['R','Rob'],['M','Maggie']].forEach(([p,who]) => {
    const t = DATA.menu[d.menu].tot[p], box = el('div','tot '+p);
    box.append(el('b', null, who), document.createTextNode(fmt(t[0])+' cal · '+t[3]+' g carbs · '+t[1]+' g protein'));
    tots.append(box);
  });
  main.append(tots);
  DATA.menu[d.menu].meals.forEach(ml => {
    const c = el('div','card');
    const h = el('div','chead'); h.append(el('span','slot', ml.slot)); if (ml.badge) h.append(el('span','badge', ml.badge)); c.append(h);
    const R = ml.R, M = ml.M, same = R.name === M.name;
    if (same) c.append(el('div','dish', R.name));
    if (same && R.help && R.help === M.help) c.append(el('div','help', R.help));
    const ppl = el('div','people');
    [['R','Rob',R],['M','Maggie',M]].forEach(([p,who,x]) => {
      const row = el('div','pp '+p); row.append(el('span','who '+p, who));
      const t = el('div','t');
      if (!same) t.append(el('div','n', x.name));
      if (x.help && !(same && R.help === M.help)) t.append(el('div','help', x.help));
      if (x.portion) t.append(el('div','portion', x.portion));
      const mac = el('div','mac');
      mac.innerHTML = x.cal+' cal · '+x.pro+' g protein · <b>'+x.carbs+' g carbs</b> · '+x.fat+' g fat';
      t.append(mac); row.append(t); ppl.append(row);
    });
    c.append(ppl);
    const det = el('details'); det.append(el('summary', null, ml.slot.startsWith('Snack 2') ? 'What to make' : 'Recipe'));
    const rc = el('div','recipe'); rc.innerHTML = DATA.recipes[ml.recipe] || ''; det.append(rc); c.append(det);
    main.append(c);
  });
  main.append(el('h2','sec','Reminders for tonight'));
  const tn = el('div','card');
  d.tonight.forEach((r, j) => {
    const key = d.date+'|night|'+j, row = el('div','rem');
    row.append(el('span','num', (j+1)+'.'));
    const rb = el('div','rb'), lab = el('label'), cb = sharedBox(key, row);
    lab.append(cb, el('span','rt', r.text)); rb.append(lab);
    if (r.recipe){ const det = el('details'); det.append(el('summary', null, 'Recipe'));
      const rc = el('div','recipe'); rc.innerHTML = DATA.recipes[r.recipe] || ''; det.append(rc); rb.append(det); }
    row.append(rb); tn.append(row);
  });
  main.append(tn);
  if (d.prep){
    const m = d.prep;
    main.append(el('h2','sec','Sunday prep for next week'));
    const c = el('div','card');
    c.append(el('div','help', 'Made today: ' + DATA.made[m] + ' About 2 to 2½ hours with two people.'));
    const d1 = el('details'); d1.append(el('summary', null, 'Step by step'));
    const ol = el('ol','ops'); DATA.ops[m].forEach(s => { const li = el('li'); li.innerHTML = s; ol.append(li); }); d1.append(ol); c.append(d1);
    main.append(c);
    const h = el('h2','sec','Grocery list for next week'); h.id = 'groceries'; main.append(h);
    const g = el('div','card glist');
    const count = el('div','gcount'); g.append(count);
    g.append(el('div','syncstat', HOUSE ? 'Connecting…' : 'Ticks are saved on this phone')); g.lastChild.id = 'syncstat';
    const boxes = [];
    const recount = () => { const n = boxes.filter(b => b.checked).length; count.textContent = n + ' of ' + boxes.length + ' in the cart'; };
    DATA.groceries[m].forEach(([sec, items], si) => {
      g.append(el('div','gsec', sec));
      items.forEach((it, j) => {
        const row = el('label','grow');
        const cb = sharedBox('g_' + d.date + '_' + si + '_' + j, row, recount);
        boxes.push(cb); row.append(cb, el('span','gi', it)); g.append(row);
      });
    });
    recount(); main.append(g);
    const jump = el('button','jump','🛒 Grocery list ↓'); jump.onclick = () => document.getElementById('groceries').scrollIntoView({behavior:'smooth'});
    main.prepend(jump);
  }
}

function renderWorkout(d, who, main){
  const w = d.work[who];
  const box = el('div', who === 'Rob' ? 'rob' : 'mag');
  if (!w){
    const c = el('div','card rest'); c.append(el('b', null, 'Rest day')); c.append(document.createTextNode('No workout today. Tomorrow starts week '+(d.w+1 <= 12 ? d.w+1 : d.w)+'.'));
    box.append(c); main.append(box); return;
  }
  const head = el('div','card');
  head.append(el('h2','wtitle', w.title));
  head.append(el('div','wmeta', w.meta || ('Week '+d.w+' of 12')));
  if (w.note) head.append(el('div','banner', w.note));
  if (w.warm) head.append(el('div','warm', 'Warm-up: '+w.warm));
  box.append(head);
  box.append(el('div','note','Weights for each week fill in after the Sunday check-in. Blank lines (___) are still to be set. Dumbbell weights are per hand.'));
  const tick = (key, row) => { const cb = el('input'); cb.type = 'checkbox'; cb.checked = store.get(key);
    if (cb.checked) row.classList.add('done');
    cb.addEventListener('change', () => { store.set(key, cb.checked); row.classList.toggle('done', cb.checked); }); return cb; };
  const howto = x => { if (!x.video) return null; const a = el('a','howto','▶ How to'); a.href = x.video; a.target = '_blank'; a.rel = 'noopener';
    a.addEventListener('click', ev => ev.stopPropagation()); return a; };
  w.sections.forEach((s, si) => {
    if (s.name) box.append(el('h2','sec', s.name));
    const c = el('div','card');
    s.items.forEach((x, j) => {
      const base = d.date+'|'+who+'|'+si+'|'+j;
      if (x.kind === 'sets' || x.kind === 'cond'){
        const blk = el('div','exb');
        const hd = el('div','exh'), nm = el('div','nm');
        if (x.main) nm.append(el('span','main','Main lift'));
        nm.append(document.createTextNode(x.name)); hd.append(nm);
        const a = howto(x); if (a) hd.append(a);
        blk.append(hd);
        if (x.cue) blk.append(el('div','sub', x.cue));
        if (x.kind === 'cond'){
          blk.append(el('div','sub', x.summary));
          blk.append(el('div','setting', x.setting + ': ' + (x.svalue || '___')));
          x.rows.forEach((rtxt, k) => {
            const row = el('label','setrow'); row.append(tick(base+'|'+k, row));
            row.append(el('span','sl', rtxt)); blk.append(row);
          });
        } else {
          x.sets.forEach((st, k) => {
            const row = el('label','setrow' + (st.wu ? ' wu' : '')); row.append(tick(base+'|'+k, row));
            row.append(el('span','sl', st.label));
            row.append(el('span','sr', String(st.reps).replace(/^(\d+)-(\d+)$/, '$1–$2') + ' ' + st.runit));
            const wt = st.weight || (x.wunit === 'ball lb' ? '___ lb ball' : x.load === 'BW' ? 'bodyweight' : '___ lb');
            row.append(el('span','sw' + (st.weight && wt !== 'bodyweight' ? '' : ' empty'), wt));
            blk.append(row);
          });
        }
        c.append(blk);
      } else {
        const row = el('label','ex'); row.append(tick(base, row));
        const body = el('div','body'); const nm = el('div','nm'); nm.append(document.createTextNode(x.name)); body.append(nm);
        if (x.cue) body.append(el('div','sub', x.cue));
        if (x.setting !== undefined && x.setting !== '') body.append(el('div','sub', x.setting + ': ' + (x.svalue || '___')));
        const rx = el('div','rx'); rx.append(el('div','s', x.scheme));
        const a = howto(x); if (a) rx.append(a);
        row.append(body, rx); c.append(row);
      }
    });
    box.append(c);
  });
  main.append(box);
}

function render(){
  const d = DAYS[state.i], main = document.getElementById('main');
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', t.dataset.tab === state.tab));
  document.getElementById('dtitle').textContent = d.label;
  const ti = todayIdx();
  const sub = document.getElementById('dsub'); sub.textContent = 'Week '+d.w+' of 12';
  if (state.i === ti) sub.append(el('span','todaypill','Today'));
  else { const b = el('button','gotoday','Go to today'); b.onclick = () => go(ti); sub.append(b); }
  document.getElementById('prev').disabled = state.i === 0;
  document.getElementById('next').disabled = state.i === N-1;
  const strip = document.getElementById('strip'); strip.innerHTML = '';
  const mon = state.i - d.i;
  for (let k = 0; k < 7; k++){
    const j = mon + k; if (j < 0 || j >= N) continue;
    const b = el('button', (j === state.i ? 'on ' : '') + (j === ti ? 'today' : ''));
    b.append(document.createTextNode(SHORT[k])); b.append(el('b', null, String(+DAYS[j].date.slice(8))));
    b.onclick = () => go(j); strip.append(b);
  }
  main.innerHTML = '';
  if (state.tab === 'meals') renderMeals(d, main);
  else renderWorkout(d, state.tab === 'rob' ? 'Rob' : 'Maggie', main);
  history.replaceState(null, '', '#'+state.tab+'/'+d.date);
}
function go(i){ state.i = Math.max(0, Math.min(N-1, i)); render(); window.scrollTo(0,0); }
document.getElementById('prev').onclick = () => go(state.i-1);
document.getElementById('next').onclick = () => go(state.i+1);
document.querySelectorAll('.tab').forEach(t => t.onclick = () => { state.tab = t.dataset.tab; render(); window.scrollTo(0,0); });
document.getElementById('span').textContent = 'Nov 9 – Jan 31';
let sx = null, sy = null;
document.addEventListener('touchstart', e => { if (e.touches.length === 1){ sx = e.touches[0].clientX; sy = e.touches[0].clientY; } }, {passive:true});
document.addEventListener('touchend', e => {
  if (sx === null) return; const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; sx = null;
  if (Math.abs(dx) > 70 && Math.abs(dy) < 45 && !(window.getSelection && String(window.getSelection()))) go(state.i + (dx < 0 ? 1 : -1));
}, {passive:true});
shared.start();
render();
</script>
</body>
</html>
