Ingredients</b></p><ul><li>¾ cup diced chili-lime chicken (made Sunday)</li><li>1 cup cooked rice (made Sunday)</li><li>¼ cup canned black beans, rinsed</li><li>¼ cup frozen corn, straight from the freezer</li><li>2 tbsp shredded 2% Mexican blend cheese</li><li>2 tbsp jarred salsa, in a small side cup</li><li>2 tbsp plain nonfat Greek yogurt, in the side cup, as sour cream</li></ul><p><b>Steps</b></p><ol><li>Each morning, put these in a microwave-safe container: the chicken, rice, beans, corn and cheese. Salsa and yogurt go in a small side cup (they stay cold).</li><li>At lunch: microwave the bowl, loosely covered, 2½ minutes, stir and give it 30 seconds more if it isn't hot. Top with the salsa and yogurt.</li></ol><p class=\"rnote\">Anything marked made Sunday is in Sunday's prep steps, with its full recipe.</p>","D_chili":"<p class=\"rmeta\">1 serving · 669 cal · 64 g protein · 50 g carbs · 25 g fat</p><p><b>Ingredients</b></p><ul><li>1 container turkey chili (made Sunday)</li><li>2 tbsp shredded 2% Mexican blend cheese</li><li>2 tbsp plain nonfat Greek yogurt, as sour cream</li></ul><p><b>Steps</b></p><ol><li>Microwave the container, covered, 3 minutes, stir, then 1 to 2 minutes more until hot all the way through.</li><li>Top with the cheese and Greek yogurt.</li></ol><p class=\"rnote\">Anything marked made Sunday is in Sunday's prep steps, with its full recipe.</p>","S_yogurt":"<p class=\"rmeta\">1 serving · 302 cal · 23 g protein · 39 g carbs · 6 g fat</p><p><b>Ingredients</b></p><ul><li>¾ cup plain nonfat Greek yogurt</li><li>⅓ cup granola, packed separately so it stays crunchy</li><li>1 tsp honey</li></ul><p><b>Steps</b></p><ol><li>Spoon the yogurt into a container and drizzle with honey. Pack the granola in a small bag and stir it in when you eat.</li></ol>","B_oats":"<p class=\"rmeta\">1 serving · 420 cal · 29 g protein · 56 g carbs · 10 g fat</p><p><b>Ingredients</b></p><ul><li>1 jar overnight oats (made Sunday)</li></ul><p><b>Steps</b></p><ol><li>Grab a jar from the fridge and stir. Eat it cold, or microwave 1½ minutes if you like it warm.</li></ol><p class=\"rnote\">Anything marked made Sunday is in Sunday's prep steps, with its full recipe.</p>","L_tsoup":"<p class=\"rmeta\">1 serving · 525 cal · 47 g protein · 48 g carbs · 16 g fat</p><p><b>Ingredients</b></p><ul><li>1 container chicken tortilla soup (made Sunday)</li><li>2 tbsp shredded 2% Mexican blend cheese, in a small bag</li><li>2 crunchy taco shells, in a small bag</li></ul><p><b>Steps</b></p><ol><li>Each morning, grab the day's soup container. Put the cheese in one small bag and the 2 taco shells in another.</li><li>At lunch: microwave the soup, covered, 2½ minutes, stir, and 30 seconds more if it isn't hot. Top with the cheese and crush the shells over it.</li></ol><p class=\"rnote\">Anything marked made Sunday is in Sunday's prep steps, with its full recipe.</p>","D_fajitas":"<p class=\"rmeta\">1 serving · 650 cal · 55 g protein · 65 g carbs · 19 g fat</p><p><b>Ingredients</b></p><ul><li>6 oz raw boneless skinless chicken breast, sliced into thin strips</li><li>1 bell pepper, any color, sliced</li><li>½ yellow onion, sliced</li><li>1 tsp olive oil</li><li>1 tsp chili powder</li><li>½ tsp ground cumin</li><li>¼ tsp garlic powder</li><li>¼ tsp kosher salt</li><li>1 tbsp lime juice</li><li>2 flour tortillas (8-inch)</li><li>2 tbsp shredded 2% Mexican blend cheese</li><li>2 tbsp jarred salsa</li><li>2 tbsp plain nonfat Greek yogurt, as sour cream</li></ul><p><b>Steps</b></p><ol><li>Toss the chicken with the chili powder, cumin, garlic powder and salt.</li><li>Heat the oil in a large skillet over medium-high. Cook the pepper and onion 4 minutes, until they start to brown, then push them to the side.</li><li>Add the chicken and cook 5 to 6 minutes, stirring now and then, until no pink is left. Squeeze in the lime juice and toss everything together.</li><li>Warm the tortillas 20 seconds in the microwave. Fill with the chicken and peppers and top with the cheese, salsa and yogurt.</li></ol>","S_eggs":"<p class=\"rmeta\">1 serving · 293 cal · 21 g protein · 19 g carbs · 15 g fat</p><p><b>Ingredients</b></p><ul><li>2 hard-boiled eggs (made Sunday)</li><li>1 string cheese</li><li>2 clementines</li></ul><p><b>Steps</b></p><ol><li>Peel 2 of Sunday's hard-boiled eggs (a pinch of salt in a twist of foil if you like). Pack with the string cheese and clementines.</li></ol><p class=\"rnote\">Anything marked made Sunday is in Sunday's prep steps, with its full recipe.</p>","S_popcorn":"<p class=\"rmeta\">1 serving · 305 cal · 18 g protein · 33 g carbs · 13 g fat</p><p><b>Ingredients</b></p><ul><li>1 mini bag 94% fat-free microwave popcorn</li><li>2 string cheeses</li><li>1 clementine</li></ul><p><b>Steps</b></p><ol><li>Pop the mini bag (about 1½ minutes, stop when the pops slow to 2 seconds apart). Two string cheeses and a clementine with it.</li></ol>","D_tacos":"<p class=\"rmeta\">1 serving · 597 cal · 49 g protein · 45 g carbs · 25 g fat</p><p><b>Ingredients</b></p><ul><li>6 oz raw 93% lean ground turkey</li><li>1 tsp chili powder</li><li>½ tsp ground cumin</li><li>¼ tsp garlic powder</li><li>¼ tsp onion powder</li><li>¼ tsp kosher salt</li><li>3 crunchy taco shells</li><li>½ cup shredded lettuce</li><li>1 Roma tomato, diced</li><li>2 tbsp shredded 2% Mexican blend cheese</li><li>2 tbsp jarred salsa</li><li>2 tbsp plain nonfat Greek yogurt, as sour cream</li><li>½ cup canned black beans, rinsed</li></ul><p><b>Steps</b></p><ol><li>Cook the turkey in a sprayed skillet over medium-high 6 to 7 minutes, breaking it up, until no pink is left.</li><li>Stir in the chili powder, cumin, garlic powder, onion powder, salt and 2 tbsp water. Simmer 2 minutes.</li><li>Warm the shells on a sheet pan at 350°F for 5 minutes (or 30 seconds in the microwave). Microwave the beans 1 minute.</li><li>Fill the shells with the turkey and top with the lettuce, tomato, cheese, salsa and yogurt. Beans on the side.</li></ol>","D_parm":"<p class=\"rmeta\">1 serving · 644 cal · 59 g protein · 63 g carbs · 15 g fat</p><p><b>Ingredients</b></p><ul><li>6 oz raw boneless skinless chicken breast, 1 breast or cutlet</li><li>2 tbsp liquid egg whites</li><li>¼ cup panko breadcrumbs</li><li>1 tbsp grated Parmesan</li><li>½ tsp Italian seasoning</li><li>¼ tsp garlic powder</li><li>¼ tsp kosher salt</li><li>½ cup marinara sauce</li><li>1 slice provolone</li><li>2 oz dry spaghetti (a bundle about the width of a quarter)</li><li>1 tsp kosher salt, for the pasta water</li></ul><p><b>Steps</b></p><ol><li>Heat the oven to 425°F. Put a pot of water on to boil with the 1 tsp salt.</li><li>Pound the chicken between plastic wrap to ½ inch thick. Mix the panko, Parmesan, Italian seasoning, garlic powder and ¼ tsp salt on a plate.</li><li>Dip the chicken in the egg whites, then press it into the crumbs on both sides. Set it on a foil-lined, sprayed sheet pan and spray the top.</li><li>Bake 15 to 18 minutes, until 165°F inside. Top with ¼ cup of the marinara and the provolone, and bake 3 minutes more.</li><li>Meanwhile, cook the spaghetti 9 to 10 minutes, drain, and toss with the other ¼ cup marinara (warmed 30 seconds in the microwave).</li></ol>","B_pancakes":"<p class=\"rmeta\">1 serving · 471 cal · 38 g protein · 70 g carbs · 5 g fat</p><p><b>Ingredients</b></p><ul><li>⅔ cup Kodiak pancake mix</li><li>⅔ cup 1% milk</li><li>2 tbsp lite pancake syrup</li><li>½ cup frozen mixed berries</li><li>½ cup liquid egg whites</li><li>⅛ tsp kosher salt</li></ul><p><b>Steps</b></p><ol><li>Stir the Kodiak mix and milk together until just combined (a few lumps are fine). Let it sit 2 minutes.</li><li>Heat a sprayed nonstick pan over medium. Pour ¼-cup scoops and cook until bubbles cover the top, about 2 minutes, then flip and cook 1 minute more. You get about 5 small pancakes.</li><li>Microwave the berries 45 seconds. Scramble the egg whites with the salt in the same pan, about 2 minutes.</li><li>Top the pancakes with the berries and syrup; egg whites on the side.</li></ol>","L_melt":"<p class=\"rmeta\">1 serving · 448 cal · 30 g protein · 63 g carbs · 10 g fat</p><p><b>Ingredients</b></p><ul><li>2 slices whole wheat bread</li><li>3 oz sliced deli turkey breast</li><li>1 slice provolone</li><li>1 tsp yellow mustard</li><li>1 apple</li></ul><p><b>Steps</b></p><ol><li>Spread the mustard on one slice of bread. Layer the turkey and provolone and close the sandwich.</li><li>Cook in a sprayed nonstick pan over medium-low, covered, 3 minutes a side, until golden and the cheese melts.</li><li>Apple on the side.</li></ol>","D_quesadilla":"<p class=\"rmeta\">1 serving · 653 cal · 54 g protein · 59 g carbs · 23 g fat</p><p><b>Ingredients</b></p><ul><li>5 oz raw boneless skinless chicken breast, diced small</li><li>½ bell pepper, diced</li><li>¼ yellow onion, diced</li><li>1 tsp olive oil</li><li>½ tsp chili powder</li><li>¼ tsp ground cumin</li><li>¼ tsp kosher salt</li><li>2 flour tortillas (8-inch)</li><li>⅓ cup shredded 2% Mexican blend cheese</li><li>2 tbsp jarred salsa</li><li>2 tbsp plain nonfat Greek yogurt, as sour cream</li></ul><p><b>Steps</b></p><ol><li>Heat the oil in a large nonstick skillet over medium-high. Cook the chicken with the chili powder, cumin and salt 4 minutes, add the pepper and onion and cook 3 to 4 minutes more, until the chicken has no pink left. Scoop it into a bowl and wipe the pan.</li><li>Lay out the tortillas. On half of each, sprinkle a little cheese, then half the chicken mixture, then the rest of the cheese. Fold over.</li><li>Cook in the sprayed pan over medium, 2 to 3 minutes a side, pressing with a spatula, until golden and melted.</li><li>Cut into wedges. Salsa and yogurt for dipping.</li></ol>","S_rollups":"<p class=\"rmeta\">1 serving · 335 cal · 31 g protein · 29 g carbs · 12 g fat</p><p><b>Ingredients</b></p><ul><li>3 oz sliced deli turkey breast</li><li>2 string cheeses</li><li>1 apple</li></ul><p><b>Steps</b></p><ol><li>Pull each string cheese into 3 strips. Wrap turkey slices around each strip.</li><li>Apple on the side.</li></ol>","B_scramble":"<p class=\"rmeta\">1 serving · 408 cal · 35 g protein · 35 g carbs · 14 g fat</p><p><b>Ingredients</b></p><ul><li>2 large eggs</li><li>½ cup liquid egg whites</li><li>½ bell pepper, diced</li><li>¼ yellow onion, diced</li><li>2 tbsp shredded 2% Mexican blend cheese (or any shredded cheese you have)</li><li>⅛ tsp kosher salt</li><li>⅛ tsp black pepper</li><li>1 slice whole wheat bread, toasted</li><li>1 clementine</li></ul><p><b>Steps</b></p><ol><li>Cook the pepper and onion in a sprayed nonstick pan over medium for 4 minutes, until soft.</li><li>Whisk the eggs, egg whites, salt and pepper, pour them in and stir slowly until just set, about 2 minutes. Sprinkle the cheese on top.</li><li>Serve with the toast and clementine.</li></ol>","L_sand":"<p class=\"rmeta\">1 serving · 528 cal · 31 g protein · 75 g carbs · 13 g fat</p><p><b>Ingredients</b></p><ul><li>2 slices whole wheat bread</li><li>3 oz sliced deli turkey breast</li><li>1 slice provolone</li><li>1 tbsp light mayo</li><li>1 tsp yellow mustard</li><li>1 cup baby carrots</li><li>1 apple</li></ul><p><b>Steps</b></p><ol><li>Spread the mayo and mustard on the bread, layer the turkey and provolone, and close it up.</li><li>Baby carrots and the apple on the side.</li></ol>","D_bbq":"<p class=\"rmeta\">1 serving · 622 cal · 52 g protein · 81 g carbs · 11 g fat</p><p><b>Ingredients</b></p><ul><li>7 oz raw boneless skinless chicken breast</li><li>¼ tsp smoked paprika</li><li>¼ tsp garlic powder</li><li>¼ tsp kosher salt</li><li>2 tbsp BBQ sauce</li><li>8 oz sweet potato (1 medium)</li><li>1 tsp butter</li><li>⅛ tsp kosher salt, for the potato</li><li>¾ cup frozen corn</li></ul><p><b>Steps</b></p><ol><li>Heat the oven to 425°F. Season the chicken with the paprika, garlic powder and salt and set it on a foil-lined, sprayed sheet pan.</li><li>Bake 10 minutes, brush with the BBQ sauce, and bake 8 to 10 minutes more, until 165°F inside.</li><li>Meanwhile, poke the sweet potato a few times with a fork and microwave it 5 to 7 minutes, until soft. Split it and add the butter and salt.</li><li>Microwave the corn, covered, 2 minutes.</li></ol>","B_parfait":"<p class=\"rmeta\">1 serving · 415 cal · 30 g protein · 60 g carbs · 7 g fat</p><p><b>Ingredients</b></p><ul><li>1 yogurt parfait jar (made Sunday)</li></ul><p><b>Steps</b></p><ol><li>Grab a jar and a granola bag. Stir the granola in when you eat.</li></ol><p class=\"rnote\">Anything marked made Sunday is in Sunday's prep steps, with its full recipe.</p>","L_teri":"<p class=\"rmeta\">1 serving · 506 cal · 42 g protein · 68 g carbs · 7 g fat</p><p><b>Ingredients</b></p><ul><li>¾ cup diced garlic-ginger chicken (made Sunday)</li><li>1¼ cups cooked rice (made Sunday)</li><li>1 cup frozen broccoli florets</li><li>2 tbsp teriyaki sauce</li><li>½ tsp sesame seeds</li></ul><p><b>Steps</b></p><ol><li>Each morning, put these in a microwave-safe container: the rice, the frozen broccoli, then the chicken. Drizzle the teriyaki sauce over the chicken and sprinkle the sesame seeds.</li><li>At lunch: microwave loosely covered 3 minutes (the broccoli steams as it heats), stir, and give it 30 seconds more if needed.</li></ol><p class=\"rnote\">Anything marked made Sunday is in Sunday's prep steps, with its full recipe.</p>","D_friedrice":"<p class=\"rmeta\">1 serving · 661 cal · 55 g protein · 69 g carbs · 17 g fat</p><p><b>Ingredients</b></p><ul><li>1 container chicken fried rice (made Sunday)</li><li>1 tsp sriracha, optional, on top</li></ul><p><b>Steps</b></p><ol><li>Microwave the container, loosely covered, 2½ minutes, stir, then 1 minute more until hot all the way through.</li></ol><p class=\"rnote\">Anything marked made Sunday is in Sunday's prep steps, with its full recipe.</p>","S_applepb":"<p class=\"rmeta\">1 serving · 316 cal · 14 g protein · 31 g carbs · 17 g fat</p><p><b>Ingredients</b></p><ul><li>1 apple, sliced</li><li>1½ tbsp peanut butter</li><li>1 string cheese</li></ul><p><b>Steps</b></p><ol><li>Slice the apple and pack the peanut butter in a small container for dipping. String cheese on the side.</li></ol>","B_eggbites":"<p class=\"rmeta\">1 serving · 427 cal · 30 g protein · 37 g carbs · 18 g fat</p><p><b>Ingredients</b></p><ul><li>2 egg bites (made Sunday)</li><li>1 English muffin</li><li>1 tsp butter</li><li>1 clementine</li></ul><p><b>Steps</b></p><ol><li>Microwave 2 egg bites 40 seconds (from the freezer: 1½ minutes). Toast the English muffin and butter it.</li><li>Tuck the egg bites into the muffin for a sandwich, or eat them side by side. Clementine on the way out the door.</li></ol><p class=\"rnote\">Anything marked made Sunday is in Sunday's prep steps, with its full recipe.</p>","L_asian":"<p class=\"rmeta\">1 serving · 466 cal · 47 g protein · 32 g carbs · 18 g fat</p><p><b>Ingredients</b></p><ul><li>1 cup diced garlic-ginger chicken (made Sunday)</li><li>2 cups coleslaw mix</li><li>1 green onion, sliced</li><li>1 clementine, peeled and pulled into segments</li><li>1 tsp sesame seeds</li><li>1 tbsp low-sodium soy sauce (dressing)</li><li>2 tsp toasted sesame oil (dressing)</li><li>2 tsp honey (dressing)</li><li>1 tbsp lime juice (dressing)</li><li>¼ tsp ground ginger (dressing)</li></ul><p><b>Steps</b></p><ol><li>The dressing is made Sunday in a small jar: soy sauce, sesame oil, honey, lime juice and ginger.</li><li>Each morning, put the coleslaw mix in a container with the chicken, green onion and clementine, and sprinkle the sesame seeds on top. Pack the dressing jar next to it.</li><li>At lunch: shake the dressing, pour it over and toss. It's eaten cold (warm the chicken 30 seconds first if you like).</li></ol><p class=\"rnote\">Anything marked made Sunday is in Sunday's prep steps, with its full recipe.</p>","D_thai":"<p class=\"rmeta\">1 serving · 665 cal · 53 g protein · 65 g carbs · 22 g fat</p><p><b>Ingredients</b></p><ul><li>6 oz raw boneless skinless chicken breast, cut into 1-inch pieces</li><li>¼ tsp kosher salt</li><li>1 tsp olive oil</li><li>1½ tbsp peanut butter</li><li>1 tbsp low-sodium soy sauce</li><li>1 tsp honey</li><li>1 tbsp lime juice</li><li>1 tsp sriracha</li><li>¼ tsp garlic powder</li><li>¼ tsp ground ginger</li><li>1 green onion, sliced</li><li>1 cup cooked rice, from Sunday</li><li>1 cup frozen broccoli florets</li></ul><p><b>Steps</b></p><ol><li>Peanut sauce: in a cup, stir the peanut butter, soy sauce, honey, lime juice, sriracha, garlic powder and ginger with 2 tbsp hot water until smooth.</li><li>Season the chicken with the salt. Heat the oil in a nonstick skillet over medium-high and cook the chicken 3 minutes a side, until golden and no pink is left.</li><li>Turn the heat to low, pour in the peanut sauce and toss 1 minute to coat (add a splash of water if it gets too thick).</li><li>Microwave the rice (with a splash of water, covered) 1½ minutes and the broccoli, covered, 3 minutes. Spoon the chicken over the rice and top with the green onion.</li></ol><p class=\"rnote\">Anything marked made Sunday is in Sunday's prep steps, with its full recipe.</p>","D_lomein":"<p class=\"rmeta\">1 serving · 636 cal · 53 g protein · 72 g carbs · 15 g fat</p><p><b>Ingredients</b></p><ul><li>6 oz raw boneless skinless chicken breast, sliced into thin strips</li><li>2½ oz dry spaghetti</li><li>1 tsp kosher salt, for the pasta water</li><li>1 tsp olive oil</li><li>1½ cups coleslaw mix</li><li>½ bell pepper, sliced</li><li>2 green onions, sliced</li><li>2 tbsp low-sodium soy sauce</li><li>1 tsp honey</li><li>1 tsp toasted sesame oil</li><li>½ tsp garlic powder</li><li>¼ tsp ground ginger</li></ul><p><b>Steps</b></p><ol><li>Cook the spaghetti in boiling water with the salt, 9 minutes. Drain. Stir the soy sauce, honey, sesame oil, garlic powder and ginger together in a cup.</li><li>Heat the olive oil in a large nonstick skillet over medium-high. Cook the chicken 4 to 5 minutes, until no pink is left.</li><li>Add the coleslaw mix and pepper and stir-fry 2 minutes, until just wilted.</li><li>Add the spaghetti and the sauce and toss 1 minute over the heat. Top with the green onion.</li></ol>","B_ftoast":"<p class=\"rmeta\">1 serving · 449 cal · 31 g protein · 62 g carbs · 9 g fat</p><p><b>Ingredients</b></p><ul><li>2 slices whole wheat bread</li><li>1 large egg</li><li>⅓ cup liquid egg whites</li><li>2 tbsp 1% milk</li><li>¼ tsp ground cinnamon</li><li>2 tbsp lite pancake syrup</li><li>½ cup frozen mixed berries</li><li>¼ cup plain nonfat Greek yogurt</li></ul><p><b>Steps</b></p><ol><li>Whisk the egg, egg whites, milk and cinnamon in a shallow bowl.</li><li>Heat a sprayed nonstick pan over medium. Soak each slice of bread 10 seconds a side, then cook 3 minutes a side, until golden.</li><li>Microwave the berries 45 seconds. Top the French toast with the berries, Greek yogurt and syrup.</li></ol>","D_korean":"<p class=\"rmeta\">1 serving · 622 cal · 40 g protein · 68 g carbs · 21 g fat</p><p><b>Ingredients</b></p><ul><li>6 oz raw 93% lean ground turkey</li><li>1 tbsp gochujang (Korean chili paste)</li><li>1 tbsp low-sodium soy sauce</li><li>1 tsp honey</li><li>1 tsp toasted sesame oil (½ tsp for the turkey, ½ tsp for the slaw)</li><li>½ tsp garlic powder</li><li>¼ tsp ground ginger</li><li>1 cup cooked rice, from the freezer</li><li>1½ cups coleslaw mix</li><li>⅛ tsp kosher salt, for the slaw</li><li>1 green onion, sliced</li><li>1 tsp sesame seeds</li></ul><p><b>Steps</b></p><ol><li>Stir the gochujang, soy sauce, honey, ½ tsp sesame oil, garlic powder and ginger together in a cup.</li><li>Cook the turkey in a sprayed skillet over medium-high 6 to 7 minutes, breaking it up, until no pink is left. Pour in the sauce and stir 1 minute until it coats the turkey.</li><li>Slaw: toss the coleslaw mix with the other ½ tsp sesame oil and the salt.</li><li>Microwave the frozen rice with a splash of water, covered, 2 minutes. Top with the turkey, the slaw, the green onion and sesame seeds.</li></ol><p class=\"rnote\">Anything marked made Sunday is in Sunday's prep steps, with its full recipe.</p>","D_sweetsour":"<p class=\"rmeta\">1 serving · 634 cal · 43 g protein · 82 g carbs · 14 g fat</p><p><b>Ingredients</b></p><ul><li>6 oz raw boneless skinless chicken breast, cut into 1-inch pieces</li><li>1 tbsp cornstarch</li><li>¼ tsp kosher salt</li><li>2 tsp olive oil</li><li>½ bell pepper, cut into 1-inch pieces</li><li>¼ yellow onion, cut into 1-inch pieces</li><li>½ cup canned pineapple chunks, drained</li><li>3 tbsp sweet and sour sauce</li><li>¾ cup cooked rice, from the freezer</li></ul><p><b>Steps</b></p><ol><li>Toss the chicken with the cornstarch and salt. Heat the oil in a nonstick skillet over medium-high and cook the chicken 3 minutes a side, until golden and no pink is left.</li><li>Add the pepper and onion and cook 2 to 3 minutes, until crisp-tender.</li><li>Add the pineapple and sweet and sour sauce and toss 1 minute.</li><li>Microwave the frozen rice with a splash of water, covered, 2 minutes. Serve the chicken over it.</li></ol><p class=\"rnote\">Anything marked made Sunday is in Sunday's prep steps, with its full recipe.</p>","L_ital":"<p class=\"rmeta\">1 serving · 497 cal · 50 g protein · 45 g carbs · 13 g fat</p><p><b>Ingredients</b></p><ul><li>1 cup diced Italian chicken (made Sunday)</li><li>1¼ cups roasted potatoes (made Sunday)</li><li>1 cup frozen cut green beans, straight from the freezer</li><li>¼ cup marinara sauce, spooned over the chicken</li><li>1 tbsp grated Parmesan</li></ul><p><b>Steps</b></p><ol><li>Each morning, put these in a microwave-safe container: the potatoes and the frozen green beans, then the chicken. Spoon the marinara over the chicken and sprinkle the Parmesan on top.</li><li>At lunch: microwave loosely covered 3 minutes (the beans steam as it heats), stir, and give it 30 seconds more if needed.</li></ol><p class=\"rnote\">Anything marked made Sunday is in Sunday's prep steps, with its full recipe.</p>","D_meatballs":"<p class=\"rmeta\">1 serving · 714 cal · 64 g protein · 44 g carbs · 31 g fat</p><p><b>Ingredients</b></p><ul><li>8 turkey meatballs (made Sunday)</li><li>½ cup marinara sauce</li><li>1¼ oz dry spaghetti</li><li>1 tsp kosher salt, for the pasta water</li><li>1 tbsp grated Parmesan</li></ul><p><b>Steps</b></p><ol><li>Cook the spaghetti in boiling water with the salt, 9 to 10 minutes. Drain.</li><li>Meanwhile, put the meatballs and marinara in a covered bowl and microwave 2 minutes, stir, then 1 minute more.</li><li>Spoon the meatballs and sauce over the spaghetti and sprinkle with the Parmesan.</li></ol><p class=\"rnote\">Anything marked made Sunday is in Sunday's prep steps, with its full recipe.</p>","L_caesar":"<p class=\"rmeta\">1 serving · 508 cal · 53 g protein · 27 g carbs · 20 g fat</p><p><b>Ingredients</b></p><ul><li>1 cup diced Italian chicken (made Sunday)</li><li>3 cups chopped romaine</li><li>2 tbsp grated Parmesan</li><li>1 bag croutons, made Sunday</li><li>3 tbsp light Caesar dressing, in a small cup</li></ul><p><b>Steps</b></p><ol><li>Each morning, put the romaine in a container with the chicken and Parmesan. Pack the croutons in their bag and the dressing in a small cup.</li><li>At lunch: pour the dressing over, add the croutons and toss. It's eaten cold (warm the chicken 30 seconds first if you like).</li></ol><p class=\"rnote\">Anything marked made Sunday is in Sunday's prep steps, with its full recipe.</p>","D_pesto":"<p class=\"rmeta\">1 serving · 641 cal · 50 g protein · 50 g carbs · 25 g fat</p><p><b>Ingredients</b></p><ul><li>6 oz raw boneless skinless chicken breast, cut into ¾-inch pieces</li><li>½ tsp Italian seasoning</li><li>¼ tsp kosher salt</li><li>1 tsp olive oil</li><li>2 oz dry penne (a heaping ½ cup)</li><li>1 tsp kosher salt, for the pasta water</li><li>2 tbsp basil pesto</li><li>1 cup grape tomatoes, halved</li><li>1 tbsp grated Parmesan</li></ul><p><b>Steps</b></p><ol><li>Cook the penne in boiling water with the salt, 11 minutes. Save 2 tbsp of the pasta water, then drain.</li><li>Meanwhile, heat the oil in a skillet over medium-high. Cook the chicken with the Italian seasoning and salt 5 to 6 minutes, until no pink is left.</li><li>Turn the heat to low. Add the pasta, tomatoes, pesto and the saved pasta water and toss 1 minute, until the tomatoes just warm through.</li><li>Top with the Parmesan.</li></ol>","D_sub":"<p class=\"rmeta\">1 serving · 685 cal · 54 g protein · 49 g carbs · 29 g fat</p><p><b>Ingredients</b></p><ul><li>6 turkey meatballs (made Sunday)</li><li>¼ cup marinara sauce</li><li>1 sub roll (6-inch)</li><li>1 slice provolone</li></ul><p><b>Steps</b></p><ol><li>Heat the oven (or toaster oven) to 400°F.</li><li>Microwave the meatballs and marinara in a covered bowl 2 minutes, stir, then 1 minute more.</li><li>Split the roll, fill it with the meatballs and sauce, lay the provolone on top and bake 4 to 5 minutes, until the cheese melts and the roll is toasty.</li></ol><p class=\"rnote\">Anything marked made Sunday is in Sunday's prep steps, with its full recipe.</p>","D_bolognese":"<p class=\"rmeta\">1 serving · 628 cal · 44 g protein · 57 g carbs · 25 g fat</p><p><b>Ingredients</b></p><ul><li>6 oz raw 93% lean ground turkey</li><li>1 tsp olive oil</li><li>¼ yellow onion, finely diced</li><li>¼ tsp garlic powder</li><li>½ tsp Italian seasoning</li><li>¼ tsp kosher salt</li><li>⅔ cup marinara sauce</li><li>2 oz dry penne</li><li>1 tsp kosher salt, for the pasta water</li><li>1 tbsp grated Parmesan</li></ul><p><b>Steps</b></p><ol><li>Put the pasta water on with the salt. Cook the penne 11 minutes and drain.</li><li>Meanwhile, heat the oil in a skillet over medium-high. Cook the onion 3 minutes, then add the turkey, garlic powder, Italian seasoning and ¼ tsp salt and cook 6 to 7 minutes, breaking it up, until no pink is left.</li><li>Stir in the marinara and simmer 5 minutes.</li><li>Spoon over the penne and top with the Parmesan.</li></ol>","D_pizza":"<p class=\"rmeta\">1 serving · 638 cal · 60 g protein · 43 g carbs · 23 g fat</p><p><b>Ingredients</b></p><ul><li>1 flour tortilla (10-inch)</li><li>¼ cup marinara sauce</li><li>2 slices provolone, torn into pieces</li><li>1 cup diced Italian chicken (Friday's extra from Sunday)</li><li>¼ tsp dried oregano</li><li>½ cup grape tomatoes</li></ul><p><b>Steps</b></p><ol><li>Heat the oven to 425°F. Set the tortilla on a sprayed sheet pan and bake it plain 3 minutes, so it crisps.</li><li>Spread the marinara on it, leaving a thin edge. Top with the provolone and chicken and sprinkle the oregano.</li><li>Bake 7 to 9 minutes, until the cheese bubbles and the edge is browned. Cut into 6 slices. Grape tomatoes on the side.</li></ol><p class=\"rnote\">Anything marked made Sunday is in Sunday's prep steps, with its full recipe.</p>","D_caprese":"<p class=\"rmeta\">1 serving · 648 cal · 56 g protein · 32 g carbs · 32 g fat</p><p><b>Ingredients</b></p><ul><li>6 oz raw boneless skinless chicken breast</li><li>½ tsp Italian seasoning</li><li>¼ tsp garlic powder</li><li>¼ tsp kosher salt</li><li>1 tsp olive oil</li><li>2 oz fresh mozzarella, sliced</li><li>1 Roma tomato, sliced</li><li>1 tbsp basil pesto</li><li>1 tbsp balsamic vinegar</li><li>1 slice whole wheat bread</li><li>1 tsp butter</li><li>⅛ tsp garlic powder, for the toast</li><li>1 cup frozen cut green beans</li></ul><p><b>Steps</b></p><ol><li>Heat the oven to 425°F. Season the chicken with the Italian seasoning, garlic powder and salt. Spread the frozen green beans on one side of a sprayed sheet pan, spray them and sprinkle with a pinch of salt.</li><li>Heat the oil in an oven-safe skillet over medium-high and sear the chicken 3 minutes a side. (No oven-safe skillet: sear it, then move it to the sheet pan.)</li><li>Top the chicken with the tomato and mozzarella and put it in the oven with the green beans for 8 to 10 minutes, until the chicken is 165°F inside.</li><li>Spread the butter on the bread, sprinkle with garlic powder and toast it in the oven for the last 3 minutes.</li><li>Drizzle the chicken with the pesto and balsamic.</li></ol>","L_greek":"<p class=\"rmeta\">1 serving · 534 cal · 45 g protein · 63 g carbs · 10 g fat</p><p><b>Ingredients</b></p><ul><li>¾ cup diced lemon-oregano chicken (made Sunday)</li><li>1¼ cups cooked rice (made Sunday)</li><li>½ cup cucumber, diced, in the side cup</li><li>1 Roma tomato, diced, in the side cup</li><li>¼ cup tzatziki, in its own small cup (made Sunday)</li><li>2 tbsp crumbled feta</li></ul><p><b>Steps</b></p><ol><li>Each morning, put these in a microwave-safe container: the chicken and rice. The cucumber, tomato and feta go in a side container, and the tzatziki in a small cup (all stay cold).</li><li>At lunch: microwave the chicken and rice loosely covered 2 minutes, stir, 30 seconds more if needed. Pile the cold salad on top and spoon on the tzatziki.</li></ol><p class=\"rnote\">Anything marked made Sunday is in Sunday's prep steps, with its full recipe.</p>","D_buffmac":"<p class=\"rmeta\">1 serving · 645 cal · 62 g protein · 59 g carbs · 17 g fat</p><p><b>Ingredients</b></p><ul><li>1 container Buffalo chicken mac (made Sunday)</li></ul><p><b>Steps</b></p><ol><li>Microwave the container, loosely covered, 2½ minutes, stir (add a splash of milk if it looks dry), then 1 minute more.</li></ol><p class=\"rnote\">Anything marked made Sunday is in Sunday's prep steps, with its full recipe.</p>","L_bbqbowl":"<p class=\"rmeta\">1 serving · 494 cal · 40 g protein · 60 g carbs · 11 g fat</p><p><b>Ingredients</b></p><ul><li>¾ cup diced smoky BBQ chicken (made Sunday)</li><li>1 cup roasted sweet potato (made Sunday)</li><li>½ cup frozen corn, straight from the freezer</li><li>2 tbsp BBQ sauce</li><li>2 tbsp shredded 2% sharp cheddar</li></ul><p><b>Steps</b></p><ol><li>Each morning, put these in a microwave-safe container: the sweet potato, the frozen corn, then the chicken. Spoon the BBQ sauce over the chicken and sprinkle the cheddar on top.</li><li>At lunch: microwave loosely covered 2½ minutes, stir, and 30 seconds more if needed.</li></ol><p class=\"rnote\">Anything marked made Sunday is in Sunday's prep steps, with its full recipe.</p>","D_honeymustard":"<p class=\"rmeta\">1 serving · 628 cal · 48 g protein · 79 g carbs · 15 g fat</p><p><b>Ingredients</b></p><ul><li>6 oz raw boneless skinless chicken breast</li><li>1 tbsp yellow mustard</li><li>1 tbsp honey</li><li>¼ tsp garlic powder</li><li>¼ tsp kosher salt</li><li>11 oz Yukon Gold potatoes, cut into ¾-inch cubes</li><li>2 tsp olive oil</li><li>¼ tsp kosher salt, for the potatoes</li><li>¼ tsp garlic powder, for the potatoes</li><li>1 cup frozen broccoli florets</li></ul><p><b>Steps</b></p><ol><li>Heat the oven to 425°F. Toss the potatoes with the oil, salt and garlic powder on a sprayed sheet pan and roast 10 minutes.</li><li>Stir the mustard, honey and garlic powder together. Season the chicken with the salt, set it on the pan with the potatoes and brush half the honey mustard over it.</li><li>Roast 18 to 20 minutes, until the chicken is 165°F inside. Brush with the rest of the honey mustard.</li><li>Microwave the broccoli, covered, 3 minutes.</li></ol>","D_burger":"<p class=\"rmeta\">1 serving · 659 cal · 44 g protein · 65 g carbs · 26 g fat</p><p><b>Ingredients</b></p><ul><li>6 oz raw 93% lean ground turkey</li><li>¼ tsp garlic powder</li><li>¼ tsp onion powder</li><li>¼ tsp kosher salt</li><li>⅛ tsp black pepper</li><li>1 hamburger bun</li><li>1 slice American cheese</li><li>¼ cup shredded lettuce</li><li>½ Roma tomato, sliced</li><li>4 dill pickle chips</li><li>1 tbsp ketchup</li><li>1 tsp yellow mustard</li><li>7 oz Yukon Gold potatoes, cut into ½-inch fries</li><li>1 tsp olive oil</li><li>¼ tsp kosher salt, for the fries</li></ul><p><b>Steps</b></p><ol><li>Heat the oven to 425°F. Toss the potatoes with the oil and salt on a sprayed sheet pan in one layer. Bake 25 to 30 minutes, flipping once, until crisp.</li><li>Mix the turkey with the garlic powder, onion powder, salt and pepper and shape one patty about ¾ inch thick, a little wider than the bun.</li><li>Cook in a sprayed skillet over medium 5 minutes a side, until 165°F inside. Lay the American slice on for the last minute and cover the pan to melt it.</li><li>Toast the bun and build it: ketchup, mustard, burger, lettuce, tomato, pickles.</li></ol>","D_crispy":"<p class=\"rmeta\">1 serving · 640 cal · 51 g protein · 73 g carbs · 15 g fat</p><p><b>Ingredients</b></p><ul><li>6 oz raw boneless skinless chicken breast, 1 breast or cutlet</li><li>2 tbsp liquid egg whites</li><li>⅓ cup panko breadcrumbs</li><li>¼ tsp garlic powder</li><li>¼ tsp smoked paprika</li><li>¼ tsp kosher salt</li><li>1 hamburger bun</li><li>1 tbsp light mayo</li><li>4 dill pickle chips</li><li>¼ cup shredded lettuce</li><li>6 oz sweet potato, cut into ½-inch fries</li><li>1 tsp olive oil</li><li>⅛ tsp kosher salt, for the fries</li><li>⅛ tsp smoked paprika, for the fries</li></ul><p><b>Steps</b></p><ol><li>Heat the oven to 425°F. Toss the sweet potato with the oil, salt and paprika on one side of a sprayed sheet pan and bake 10 minutes.</li><li>Pound the chicken to ½ inch thick. Mix the panko, garlic powder, paprika and salt. Dip the chicken in the egg whites, press it into the crumbs and set it on the other side of the pan. Spray the top.</li><li>Bake 15 to 18 minutes, until the chicken is 165°F inside and the fries are browned (flip the fries once).</li><li>Toast the bun, spread the mayo and build it with the chicken, pickles and lettuce.</li></ol>","D_bigmac":"<p class=\"rmeta\">1 serving · 637 cal · 46 g protein · 53 g carbs · 28 g fat</p><p><b>Ingredients</b></p><ul><li>6 oz raw 93% lean ground turkey</li><li>¼ tsp garlic powder</li><li>¼ tsp onion powder</li><li>¼ tsp kosher salt</li><li>2 cups shredded lettuce</li><li>¼ yellow onion, finely diced</li><li>1 Roma tomato, diced</li><li>2 tbsp dill pickle chips, chopped</li><li>¼ cup shredded 2% sharp cheddar</li><li>1 tbsp light mayo</li><li>1 tsp sweet relish</li><li>1 tsp yellow mustard</li><li>½ tsp ketchup</li><li>8 oz Yukon Gold potatoes, cut into ¾-inch cubes</li><li>1 tsp olive oil</li><li>⅛ tsp kosher salt, for the potatoes</li></ul><p><b>Steps</b></p><ol><li>Heat the oven to 425°F. Toss the potatoes with the oil and salt on a sprayed sheet pan and roast 25 minutes, flipping once.</li><li>Cook the turkey with the garlic powder, onion powder and salt in a sprayed skillet over medium-high, 6 to 7 minutes, breaking it up, until no pink is left. Sprinkle the cheddar on top, turn off the heat and cover 1 minute to melt.</li><li>Stir the sauce together: mayo, relish, mustard and ketchup.</li><li>Bowl: lettuce, then the turkey and potatoes, then the onion, tomato and pickles. Drizzle with the sauce.</li></ol>","D_greeklemon":"<p class=\"rmeta\">1 serving · 621 cal · 54 g protein · 61 g carbs · 18 g fat</p><p><b>Ingredients</b></p><ul><li>6 oz raw boneless skinless chicken breast</li><li>2 tbsp lemon juice (1 tbsp for the chicken, 1 tbsp for the potatoes)</li><li>1 tsp dried oregano (½ tsp for each)</li><li>¼ tsp garlic powder</li><li>½ tsp kosher salt (¼ tsp for each)</li><li>2 tsp olive oil (1 tsp for each)</li><li>10 oz Yukon Gold potatoes, cut into wedges</li><li>¼ cup plain nonfat Greek yogurt</li><li>2 tbsp crumbled feta</li><li>¾ cup cucumber (2 tbsp grated for the tzatziki, the rest diced)</li><li>1 Roma tomato, diced</li><li>⅛ tsp dried dill</li></ul><p><b>Steps</b></p><ol><li>Heat the oven to 425°F. Toss the potato wedges with 1 tsp oil, 1 tbsp lemon juice, ½ tsp oregano and ¼ tsp salt on a sprayed sheet pan and roast 15 minutes.</li><li>Rub the chicken with the other 1 tsp oil, 1 tbsp lemon juice, ½ tsp oregano, ¼ tsp salt and the garlic powder. Add it to the pan and roast 18 to 20 minutes, until 165°F inside.</li><li>Quick tzatziki: stir the Greek yogurt with 2 tbsp grated cucumber (squeezed dry) and the dill.</li><li>Toss the rest of the cucumber with the tomato and feta for a salad. Serve the chicken and potatoes with the tzatziki on the side.</li></ol>","D_orange":"<p class=\"rmeta\">1 serving · 634 cal · 44 g protein · 79 g carbs · 14 g fat</p><p><b>Ingredients</b></p><ul><li>6 oz raw boneless skinless chicken breast, cut into 1-inch pieces</li><li>1 tbsp cornstarch</li><li>¼ tsp kosher salt</li><li>2 tsp olive oil</li><li>3 tbsp bottled orange sauce</li><li>¾ cup cooked rice, from Sunday</li><li>1 cup frozen broccoli florets</li></ul><p><b>Steps</b></p><ol><li>Toss the chicken with the cornstarch and salt until coated.</li><li>Heat the oil in a nonstick skillet over medium-high. Cook the chicken in one layer 3 minutes without moving it, then turn and cook 3 minutes more, until golden and no pink is left.</li><li>Turn off the heat, add the orange sauce and toss to coat.</li><li>Microwave the rice (with a splash of water, covered) 1½ minutes and the broccoli, covered, 3 minutes.</li></ol><p class=\"rnote\">Anything marked made Sunday is in Sunday's prep steps, with its full recipe.</p>"},"groceries":{"2026-11-15":{"w":1,"lists":[["Meat and eggs",["93% lean ground turkey, 1-lb packs: 2","Boneless skinless chicken breasts: 3 lb (a family pack is fine; freeze what's left for next week)","Large eggs: 1 dozen","Liquid egg whites, 32-oz carton: 1","Oven-roasted turkey breast, sliced, sealed 9-oz pack: 1"]],["Dairy",["1% milk, quart: 1","Butter, 1 lb (sticks): 1","Grated Parmesan, 8 oz: 1","Part-skim string cheese, 12-pack: 1","Plain nonfat Greek yogurt, 32-oz tub: 2","Shredded 2% Mexican blend, 8-oz bag: 1","Sliced provolone, 8-oz pack (about 10 slices): 1"]],["Produce",["Apples (any kind you like): 3","Baby carrots, 1-lb bag: 1","Bell peppers, any color: 4","Clementines: 9","Limes: 2","Roma tomatoes: 1","Shredded lettuce, 8-oz bag: 1","Yellow onions: 3"]],["Bread and tortillas",["100% whole wheat bread, 1 loaf: 1","8-inch flour tortillas, 10-pack: 1","Crunchy taco shells, 12-count: 1","English muffins, 6-pack (freeze any extra): 1"]],["Frozen",["Frozen corn, 12-oz bag: 1","Frozen mixed berries, 16-oz bag: las, 8-pack: 1","100% whole wheat bread, 1 loaf: 1"]],["Frozen",["Frozen cut green beans, 12-oz bag: 1","Frozen mixed berries, 16-oz bag: 1"]],["Cans, jars and dry goods",["Basil pesto, 6.7-oz jar: 1","Honey, 12 oz: 1","Marinara, 24-oz jar: 2","Penne, 1-lb box: 1"]]]}},"prep":{"2026-11-15":{"steps":["Portion the meat as you unpack it, one labeled bag or container each:<br>• 1¾ lb chicken: today's lunch chicken<br>• 6 oz chicken: Tuesday's chicken fajitas (fridge)<br>• 6 oz chicken: Friday's chicken parm (freezer)<br>• 5 oz chicken: Saturday's chicken quesadillas (freezer)<br>• 1 lb ground turkey: today's chili<br>• 6 oz ground turkey: Thursday's turkey tacos (freezer)<br>• Anything left over: freezer, for next week","Heat the oven to 425°F. Line a sheet pan with foil and spray it, and spray 6 cups of a muffin tin (up the sides too).","Knife work. Chili: dice 1 yellow onion and 1 bell pepper into one bowl. Egg bites: finely dice ¼ bell pepper and ¼ yellow onion into a second bowl. Tortilla soup: dice ½ yellow onion. Open and rinse the can of kidney beans and the can of black beans (¾ cup of the black beans go in the soup; the rest are for the burrito bowls).","Spice cups. Chili: 1 tbsp chili powder, 1½ tsp ground cumin, 1 tsp garlic powder, ½ tsp smoked paprika, ½ tsp dried oregano and ¾ tsp kosher salt. Soup: 1 tsp chili powder, ½ tsp ground cumin, ¼ tsp garlic powder and ¼ tsp kosher salt.","Lunch chicken: pat the 1¾ lb chicken dry and slice any breast thicker than 1 inch in half the long way. Toss it on the foil-lined pan with 1¾ tsp chili powder, ¾ tsp ground cumin, ¾ tsp garlic powder, ¾ tsp kosher salt, 1¾ tsp olive oil and 2 tbsp lime juice. Into the oven for 18 to 22 minutes, until the thickest piece reads 165°F.","Rice: in a medium pot, bring 2 cups water and ¼ tsp kosher salt to a boil. Stir in 1 cup rice, cover, turn the heat to low and simmer 18 minutes, then take it off the heat and leave it covered.","Chili: heat 1 tsp olive oil in a large pot over medium-high. Cook the 1 lb ground turkey 6 to 8 minutes, breaking it up, until no pink is left. Add the onion and pepper and cook 5 minutes. Stir in the chili spices and cook 1 minute. Add the kidney beans, a can of diced tomatoes with its juice and ½ cup water. Cover and simmer on low 20 minutes, stirring now and then.","Hard-boiled eggs: put 4 eggs in a small pot, cover with cold water by 1 inch and bring to a boil. Turn off the heat, cover, and let them sit 11 minutes, then move them to a bowl of ice water for 5 minutes. They stay in the shell in the fridge.","Overnight oats, 2 jars (16 oz each). Into each: ½ cup old-fashioned oats, ⅔ cup Greek yogurt, ½ cup 1% milk, 2 tsp peanut butter, 1 tsp honey and ¼ tsp cinnamon. Stir well, top each with ½ cup frozen berries, lid on, fridge.","When the chicken comes out, let it rest and turn the oven down to 350°F (open the door for a minute to cool it faster).","Egg bites: whisk 6 eggs, 1 cup liquid egg whites, ¼ tsp kosher salt and ⅛ tsp black pepper. Divide the finely diced pepper and onion and ⅓ cup shredded 2% Mexican blend cheese among the 6 sprayed muffin cups, then pour the eggs over them, almost to the top. Bake 20 to 22 minutes, until set in the middle. Cool 5 minutes, then run a knife around each and lift them out.","Dice the rested chicken into ½-inch pieces (about 4¼ cups). Fluff the rice and spread it on a sheet pan to cool for 15 minutes.","Tortilla soup: heat 1 tsp olive oil in a medium pot over medium and cook the diced ½ onion 4 minutes. Stir in the soup spices for 30 seconds. Add the other can of diced tomatoes with its juice, 2 cups low-sodium chicken broth, the ¾ cup black beans and ½ cup frozen corn. Simmer 10 minutes, then stir in 1½ cups of the diced chicken and 1 tbsp lime juice. Split between 2 containers (about 2 cups each).","Chili: split it evenly between 2 containers (about 3 cups each) for Monday's and Wednesday's dinners.","Chicken burrito bowl (Monday, Wednesday and Friday): keep Monday and Wednesday's share of the chicken and the rice in the fridge. Friday's portion (¾ cup diced chili-lime chicken, 1 cup cooked rice) goes in its own freezer bag, labeled with the day.","Chicken tortilla soup (Tuesday and Thursday): Tuesday's container in the fridge, Thursday's in the freezer.","Egg bites: Monday and Wednesday's in the fridge, Friday's in a freezer bag (they reheat from frozen).","Overnight oats: both jars in the fridge.","Eggs: the hard-boiled eggs stay in their shells in the fridge (peel them the morning you pack them)."]},"2026-11-22":{"steps":["Portion the meat as you unpack it, one labeled bag or container each:<br>• 7 oz chicken: tonight's BBQ chicken with sweet potato (fridge)<br>• 1¾ lb chicken: today's lunch chicken<br>• 12 oz chicken: today's fried rice<br>• 6 oz chicken: Tuesday's Thai peanut chicken (fridge)<br>• 6 oz chicken: Friday's chicken lo mein (freezer)<br>• 6 oz ground turkey: Saturday's Korean turkey bowl (freezer)<br>• Anything left over: freezer, for next week","Rice first, because the fried rice needs it cold: this is a big batch, so use two pots. In each, bring 3 cups water and ¼ tsp kosher salt to a boil, stir in 1½ cups rice, cover, turn the heat to low and simmer 18 minutes, then take it off the heat and leave it covered 5 minutes.","Heat the oven to 425°F. Line a sheet pan with foil and spray it, and spray 4 cups of a muffin tin (up the sides too).","Lunch chicken: pat the 1¾ lb chicken dry and slice any breast thicker than 1 inch in half the long way. Toss it on the foil-lined pan with ¾ tsp garlic powder, ½ tsp ground ginger, ½ tsp kosher salt and 1¾ tsp olive oil. Into the oven for 18 to 22 minutes, until the thickest piece reads 165°F.","Knife work. Fried rice: cut the 12 oz chicken into ½-inch pieces, dice ½ yellow onion and slice 2 green onions; beat 2 eggs in a cup; in another cup, mix 3 tbsp low-sodium soy sauce, ½ tsp garlic powder and ¼ tsp ground ginger. Egg bites: finely dice ¼ bell pepper and thinly slice 1 green onion.","When the rice is done: fluff it, spread 2½ cups on a plate and put it in the fridge for 30 minutes (cold rice fries; warm rice turns mushy). Spread the rest on a sheet pan to cool.","Hard-boiled eggs: put 4 eggs in a small pot, cover with cold water by 1 inch and bring to a boil. Turn off the heat, cover, and let them sit 11 minutes, then move them to a bowl of ice water for 5 minutes. They stay in the shell in the fridge.","Yogurt parfaits, 3 jars (16 oz each). Into each: 1 cup Greek yogurt, ¾ cup frozen berries and 2 tsp honey. Lid on, fridge. Put ⅓ cup granola in each of 3 small snack bags.","Salad dressing, 2 small jars. Into each: 1 tbsp low-sodium soy sauce, 2 tsp toasted sesame oil, 2 tsp honey, 1 tbsp lime juice and ¼ tsp ground ginger. Lid on, shake, fridge.","When the chicken comes out, let it rest and turn the oven down to 350°F (open the door for a minute to cool it faster).","Egg bites: whisk 4 eggs, ⅔ cup liquid egg whites, ¼ tsp kosher salt and ⅛ tsp black pepper. Divide the pepper, green onion and ¼ cup shredded 2% sharp cheddar among the 4 sprayed muffin cups, then pour the eggs over them, almost to the top. Bake 20 to 22 minutes, until set in the middle. Cool 5 minutes, then run a knife around each and lift them out.","Dice the rested chicken into ½-inch pieces (about 4¼ cups).","Fried rice (once the rice has chilled 30 minutes): heat 1 tsp olive oil in a large nonstick skillet over medium-high and cook the 12 oz chicken pieces 5 to 6 minutes, until no pink is left; move them to a plate. Add 1 tsp toasted sesame oil, the diced onion and 1 cup frozen peas and carrots and cook 3 minutes. Push it to one side, pour the eggs into the empty side and scramble until just set. Add the cold rice, the chicken and the soy mixture plus 1 more tsp sesame oil, and stir-fry 3 to 4 minutes. Stir in the green onion.","Split the fried rice evenly between 2 containers (about 3 cups each) for Monday's and Wednesday's dinners.","Teriyaki chicken bowl (Monday, Wednesday and Friday): keep Monday and Wednesday's share of the chicken and the rice in the fridge. Friday's portion (¾ cup diced garlic-ginger chicken, 1¼ cups cooked rice) goes in its own freezer bag, labeled with the day.","Crunchy Asian chicken salad (Tuesday and Thursday): keep Tuesday's share of the chicken in the fridge. Thursday's portion (1 cup diced garlic-ginger chicken) goes in its own freezer bag, labeled with the day.","Salad dressing: the 2 jars stay in the fridge. The coleslaw mix stays in its bag in the fridge.","Dinner rice: fridge a container for Tuesday (1 cup). Freeze a labeled bag each for Saturday (1 cup) and Sunday (¾ cup) (microwave it straight from frozen).","Yogurt parfaits: all 3 jars in the fridge, granola bags in the pantry.","Egg bites: Tuesday's in the fridge, Thursday's in a freezer bag (they reheat from frozen).","Eggs: the hard-boiled eggs stay in their shells in the fridge (peel them the morning you pack them)."]},"2026-11-29":{"steps":["Portion the meat as you unpack it, one labeled bag or container each:<br>• 6 oz chicken: tonight's sweet and sour chicken (fridge)<br>• 2½ lb chicken: today's lunch chicken<br>• 6 oz chicken: Tuesday's chicken pesto pasta (fridge)<br>• 6 oz chicken: Saturday's chicken parm (freezer)<br>• 1 lb ground turkey: today's meatballs<br>• 6 oz ground turkey: Thursday's turkey bolognese (freezer)<br>• Anything left over: freezer, for next week","Heat the oven to 425°F. Line one sheet pan with foil and spray it (chicken); spray a second sheet pan (potatoes).","Potatoes: cut the 1¼ lb Yukon Gold potatoes into ¾-inch cubes and toss them on the potato pan with 2 tsp olive oil, ½ tsp kosher salt and ½ tsp Italian seasoning, in one layer.","Lunch chicken: pat the 2½ lb chicken dry and slice any breast thicker than 1 inch in half the long way. Toss it on the foil-lined pan with 2½ tsp Italian seasoning, 1¼ tsp garlic powder, 1¼ tsp kosher salt, ½ tsp black pepper and 2½ tsp olive oil. Into the oven for 18 to 22 minutes, until the thickest piece reads 165°F. Potatoes go in at the same time, on the other rack, for 30 minutes; flip them halfway.","Croutons: cut 2 slices whole wheat bread into ¾-inch cubes, spray them, and toss with ¼ tsp garlic powder and ⅛ tsp kosher salt. Set them aside on a piece of foil.","Meatballs while those roast: in a bowl, beat 1 egg, then mix in ⅓ cup panko, 2 tbsp grated Parmesan, 1 tsp Italian seasoning, ½ tsp garlic powder, ½ tsp kosher salt and ¼ tsp black pepper. Add the 1 lb ground turkey and mix with your hands just until combined. Roll 14 meatballs (a heaping tablespoon each) onto a plate.","Hard-boiled eggs: put 4 eggs in a small pot, cover with cold water by 1 inch and bring to a boil. Turn off the heat, cover, and let them sit 11 minutes, then move them to a bowl of ice water for 5 minutes. They stay in the shell in the fridge.","Overnight oats, 3 jars (16 oz each). Into each: ½ cup old-fashioned oats, ⅔ cup Greek yogurt, ½ cup 1% milk, 2 tsp peanut butter, 1 tsp honey and ¼ tsp cinnamon. Stir well, top each with ½ cup frozen berries, lid on, fridge.","Yogurt parfaits, 2 jars (16 oz each). Into each: 1 cup Greek yogurt, ¾ cup frozen berries and 2 tsp honey. Lid on, fridge. Put ⅓ cup granola in each of 2 small snack bags.","When the chicken comes out, let it rest. Put fresh foil on its pan, spray it, set the meatballs on one side and the croutons on the other, and put the pan in next to the potatoes, still at 425°F. Croutons come out after 6 to 8 minutes, when crisp; meatballs after 12 to 15 minutes, when 165°F in the middle.","Dice the rested chicken into ½-inch pieces (about 6 cups). Put 1 cup in a small freezer bag labeled \"Friday pizza.\"","Cool the meatballs and keep them all in one container: 8 for Monday's spaghetti, 6 for Wednesday's sub.","Italian chicken bowl (Monday, Wednesday and Friday): keep Monday and Wednesday's share of the chicken and the potatoes in the fridge. Friday's portion (1 cup diced Italian chicken, 1¼ cups roasted potatoes) goes in its own freezer bag, labeled with the day.","Chicken Caesar salad (Tuesday and Thursday): keep Tuesday's share of the chicken in the fridge. Thursday's portion (1 cup diced Italian chicken) goes in its own freezer bag, labeled with the day.","Croutons: once cool, put each salad's share in a small bag; they stay in the pantry.","Overnight oats: all 3 jars in the fridge.","Yogurt parfaits: both jars in the fridge, granola bags in the pantry.","Eggs: the hard-boiled eggs stay in their shells in the fridge (peel them the morning you pack them)."]},"2026-12-06":{"steps":["Portion the meat as you unpack it, one labeled bag or container each:<br>• 6 oz chicken: tonight's chicken caprese (fridge)<br>• 1 lb chicken: today's lunch chicken (lemon-oregano)<br>• ¾ lb chicken: today's BBQ lunch chicken<br>• 12 oz chicken: today's Buffalo chicken mac<br>• 6 oz chicken: Tuesday's honey mustard chicken (fridge)<br>• 6 oz chicken: Friday's crispy chicken sandwich (freezer)<br>• 6 oz ground turkey: Thursday's turkey burger and fries (freezer)<br>• 6 oz ground turkey: Saturday's turkey Big Mac bowl (freezer)<br>• Anything left over: freezer, for next week","Heat the oven to 425°F. Line a sheet pan with foil and spray it (chicken), spray a second sheet pan (sweet potatoes), and spray 6 cups of a muffin tin.","Knife work. Egg bites: finely dice ¼ bell pepper and thinly slice 1 green onion. Mac: cut the 12 oz chicken into ½-inch pieces. Tzatziki: grate ½ cucumber and squeeze it dry in a paper towel. BBQ bowls: peel the ¾ lb sweet potatoes and cut them into ¾-inch cubes.","Sweet potatoes: toss them on their pan with 1¼ tsp olive oil, ¼ tsp kosher salt and ¼ tsp smoked paprika, in one layer. Into the oven for 25 to 30 minutes, flipping once.","Lunch chicken, two seasonings on the foil-lined pan. Pat it dry and slice any breast thicker than 1 inch in half the long way. On one half, toss the 1 lb Greek chicken with 1 tbsp lemon juice, 1 tsp dried oregano, ½ tsp garlic powde oz chicken: Friday's crispy chicken sandwich (freezer)<br>• 6 oz ground turkey: Thursday's turkey burger and fries (freezer)<br>• 6 oz ground turkey: Saturday's turkey Big Mac bowl (freezer)<br>• Anything left over: freezer, for next week","Heat the oven to 425°F. Line a sheet pan with foil and spray it (chicken), spray a second sheet pan (sweet potatoes), and spray 6 cups of a muffin tin.","Knife work. Egg bites: finely dice ¼ bell pepper and thinly slice 1 green onion. Mac: cut the 12 oz chicken into ½-inch pieces. Tzatziki: grate ½ cucumber and squeeze it dry in a paper towel. BBQ bowls: peel the ¾ lb sweet potatoes and cut them into ¾-inch cubes.","Sweet potatoes: toss them on their pan with 1¼ tsp olive oil, ¼ tsp kosher salt and ¼ tsp smoked paprika, in one layer. Into the oven for 25 to 30 minutes, flipping once.","Lunch chicken, two seasonings on the foil-lined pan. Pat it dry and slice any breast thicker than 1 inch in half the long way. On one half, toss the 1 lb Greek chicken with 1 tbsp lemon juice, 1 tsp dried oregano, ½ tsp garlic powder, ½ tsp kosher salt, ¼ tsp black pepper and 1 tsp olive oil. On the other half, toss the ¾ lb BBQ chicken with ¾ tsp smoked paprika, ¼ tsp garlic powder, ¼ tsp kosher salt, ⅛ tsp black pepper and ¾ tsp olive oil. Into the oven for 18 to 22 minutes, until the thickest piece reads 165°F.","Rice: in a medium pot, bring 2½ cups water and ¼ tsp kosher salt to a boil. Stir in 1¼ cups rice, cover, turn the heat to low and simmer 18 minutes, then take it off the heat and leave it covered.","Buffalo mac: bring a pot of water with 1 tsp kosher salt to a boil and cook 4 oz penne (a heaping cup) 10 minutes; drain. Meanwhile, heat 1 tsp olive oil in a skillet over medium-high and cook the 12 oz chicken with ¼ tsp kosher salt 5 to 6 minutes, until no pink is left, and microwave 2 cups frozen broccoli in a covered bowl 4 minutes.","Mac sauce: in the empty pasta pot, whisk ¾ cup 1% milk with 1 tbsp cornstarch and heat over medium, whisking, until it simmers and thickens, about 2 minutes. Off the heat, stir in ¾ cup shredded cheddar until melted, then ¼ cup Buffalo sauce and ¼ tsp garlic powder. Stir in the pasta, chicken and broccoli and split evenly between 2 containers (about 3 cups each) for Monday's and Wednesday's dinners.","Hard-boiled eggs: put 4 eggs in a small pot, cover with cold water by 1 inch and bring to a boil. Turn off the heat, cover, and let them sit 11 minutes, then move them to a bowl of ice water for 5 minutes. They stay in the shell in the fridge.","Tzatziki: stir together ⅔ cup plain nonfat Greek yogurt, the grated cucumber, ½ tbsp lemon juice, ¼ tsp garlic powder, ½ tsp dried dill and ⅛ tsp kosher salt. Cover and fridge.","Overnight oats, 2 jars (16 oz each). Into each: ½ cup old-fashioned oats, ⅔ cup Greek yogurt, ½ cup 1% milk, 2 tsp peanut butter, 1 tsp honey and ¼ tsp cinnamon. Stir well, top each with ½ cup frozen berries, lid on, fridge.","When the chicken and sweet potatoes come out, let the chicken rest and turn the oven down to 350°F (open the door for a minute to cool it faster).","Egg bites: whisk 6 eggs, 1 cup liquid egg whites, ¼ tsp kosher salt and ⅛ tsp black pepper. Divide the pepper, green onion and ⅓ cup shredded 2% sharp cheddar among the 6 sprayed muffin cups, then pour the eggs over them, almost to the top. Bake 20 to 22 minutes, until set in the middle. Cool 5 minutes, then run a knife around each and lift them out.","Dice the rested chicken into ½-inch pieces, keeping the Greek and BBQ chicken apart (about 2½ cups and 1¾ cups). Fluff the rice and spread it on a sheet pan to cool for 15 minutes.","Greek chicken and rice bowl (Monday, Wednesday and Friday): keep Monday and Wednesday's share of the chicken and the rice in the fridge. Friday's portion (¾ cup diced lemon-oregano chicken, 1¼ cups cooked rice) goes in its own freezer bag, labeled with the day.","BBQ chicken and sweet potato bowl (Tuesday and Thursday): keep Tuesday's share of the BBQ chicken and the sweet potato in the fridge. Thursday's portion (¾ cup diced smoky BBQ chicken, 1 cup roasted sweet potato) goes in its own freezer bag, labeled with the day.","Tzatziki: in the fridge, for the Greek bowls.","Egg bites: Monday and Wednesday's in the fridge, Friday's in a freezer bag (they reheat from frozen).","Overnight oats: both jars in the fridge.","Eggs: the hard-boiled eggs stay in their shells in the fridge (peel them the morning you pack them)."]},"2027-01-10":{"steps":["Portion the meat as you unpack it, one labeled bag or container each:<br>• 6 oz chicken: tonight's Greek lemon chicken (fridge)<br>• 1¾ lb chicken: today's lunch chicken<br>• 6 oz chicken: Tuesday's chicken fajitas (fridge)<br>• 6 oz chicken: Friday's chicken parm (freezer)<br>• 5 oz chicken: Saturday's chicken quesadillas (freezer)<br>• 1 lb ground turkey: today's chili<br>• 6 oz ground turkey: Thursday's turkey tacos (freezer)<br>• Anything left over: freezer, for next week","Heat the oven to 425°F. Line a sheet pan with foil and spray it, and spray 6 cups of a muffin tin (up the sides too).","Knife work. Chili: dice 1 yellow onion and 1 bell pepper into one bowl. Egg bites: finely dice ¼ bell pepper and ¼ yellow onion into a second bowl. Tortilla soup: dice ½ yellow onion. Open and rinse the can of kidney beans and the can of black beans (¾ cup of the black beans go in the soup; the rest are for the burrito bowls).","Spice cups. Chili: 1 tbsp chili powder, 1½ tsp ground cumin, 1 tsp garlic powder, ½ tsp smoked paprika, ½ tsp dried oregano and ¾ tsp kosher salt. Soup: 1 tsp chili powder, ½ tsp ground cumin, ¼ tsp garlic powder and ¼ tsp kosher salt.","Lunch chicken: pat the 1¾ lb chicken dry and slice any breast thicker than 1 inch in half the long way. Toss it on the foil-lined pan with 1¾ tsp chili powder, ¾ tsp ground cumin, ¾ tsp garlic powder, ¾ tsp kosher salt, 1¾ tsp olive oil and 2 tbsp lime juice. Into the oven for 18 to 22 minutes, until the thickest piece reads 165°F.","Rice: in a medium pot, bring 2 cups water and ¼ tsp kosher salt to a boil. Stir in 1 cup rice, cover, turn the heat to low and simmer 18 minutes, then take it off the heat and leave it covered.","Chili: heat 1 tsp olive oil in a large pot over medium-high. Cook the 1 lb ground turkey 6 to 8 minutes, breaking it up, until no pink is left. Add the onion and pepper and cook 5 minutes. Stir in the chili spices and cook 1 minute. Add the kidney beans, a can of diced tomatoes with its juice and ½ cup water. Cover and simmer on low 20 minutes, stirring now and then.","Hard-boiled eggs: put 4 eggs in a small pot, cover with cold water by 1 inch and bring to a boil. Turn off the heat, cover, and let them sit 11 minutes, then move them to a bowl of ice water for 5 minutes. They stay in the shell in the fridge.","Overnight oats, 2 jars (16 oz each). Into each: ½ cup old-fashioned oats, ⅔ cup Greek yogurt, ½ cup 1% milk, 2 tsp peanut butter, 1 tsp honey and ¼ tsp cinnamon. Stir well, top each with ½ cup frozen berries, lid on, fridge.","When the chicken comes out, let it rest and turn the oven down to 350°F (open the door for a minute to cool it faster).","Egg bites: whisk 6 eggs, 1 cup liquid egg whites, ¼ tsp kosher salt and ⅛ tsp black pepper. Divide the finely diced pepper and onion and ⅓ cup shredded 2% Mexican blend cheese among the 6 sprayed muffin cups, then pour the eggs over them, almost to the top. Bake 20 to 22 minutes, until set in the middle. Cool 5 minutes, then run a knife around each and lift them out.","Dice the rested chicken into ½-inch pieces (about 4¼ cups). Fluff the rice and spread it on a sheet pan to cool for 15 minutes.","Tortilla soup: heat 1 tsp olive oil in a medium pot over medium and cook the diced ½ onion 4 minutes. Stir in the soup spices for 30 seconds. Add the other can of diced tomatoes with its juice, 2 cups low-sodium chicken broth, the ¾ cup black beans and ½ cup frozen corn. Simmer 10 minutes, then stir in 1½ cups of the diced chicken and 1 tbsp lime juice. Split between 2 containers (about 2 cups each).","Chili: split it evenly between 2 containers (about 3 cups each) for Monday's and Wednesday's dinners.","Chicken burrito bowl (Monday, Wednesday and Friday): keep Monday and Wednesday's share of the chicken and the rice in the fridge. Friday's portion (¾ cup diced chili-lime chicken, 1 cup cooked rice) goes in its own freezer bag, labeled with the day.","Chicken tortilla soup (Tuesday and Thursday): Tuesday's container in the fridge, Thursday's in the freezer.","Egg bites: Monday and Wednesday's in the fridge, Friday's in a freezer bag (they reheat from frozen).","Overnight oats: both jars in the fridge.","Eggs: the hard-boiled eggs stay in their shells in the fridge (peel them the morning you pack them)."]},"2027-01-17":{"steps":["Portion the meat as you unpack it, one labeled bag or container each:<br>• 7 oz chicken: tonight's BBQ chicken with sweet potato (fridge)<br>• 1¾ lb chicken: today's lunch chicken<br>• 12 oz chicken: today's fried rice<br>• 6 oz chicken: Tuesday's Thai peanut chicken (fridge)<br>• 6 oz chicken: Thursday's orange chicken (freezer)<br>• 6 oz chicken: Friday's chicken lo mein (freezer)<br>• 6 oz ground turkey: Saturday's Korean turkey bowl (freezer)<br>• Anything left over: freezer, for next week","Rice first, because the fried rice needs it cold: this is a big batch, so use two pots. In each, bring 3¼ cups water and ¼ tsp kosher salt to a boil, stir in 1⅔ cups rice, cover, turn the heat to low and simmer 18 minutes, then take it off the heat and leave it covered 5 minutes.","Heat the oven to 425°F. Line a sheet pan with foil and spray it, and spray 4 cups of a muffin tin (up the sides too).","Lunch chicken: pat the 1¾ lb chicken dry and slice any breast thicker than 1 inch in half the long way. Toss it on the foil-lined pan with ¾ tsp garlic powder, ½ tsp ground ginger, ½ tsp kosher salt and 1¾ tsp olive oil. Into the oven for 18 to 22 minutes, until the thickest piece reads 165°F.","Knife work. Fried rice: cut the 12 oz chicken into ½-inch pieces, dice ½ yellow onion and slice 2 green onions; beat 2 eggs in a cup; in another cup, mix 3 tbsp low-sodium soy sauce, ½ tsp garlic powder and ¼ tsp ground ginger. Egg bites: finely dice ¼ bell pepper and thinly slice 1 green onion.","When the rice is done: fluff it, spread 2½ cups on a plate and put it in the fridge for 30 minutes (cold rice fries; warm rice turns mushy). Spread the rest on a sheet pan to cool.","Hard-boiled eggs: put 4 eggs in a small pot, cover with cold water by 1 inch and bring to a boil. Turn off the heat, cover, and let them sit 11 minutes, then move them to a bowl of ice water for 5 minutes. They stay in the shell in the fridge.","Yogurt parfaits, 3 jars (16 oz each). Into each: 1 cup Greek yogurt, ¾ cup frozen berries and 2 tsp honey. Lid on, fridge. Put ⅓ cup granola in each of 3 small snack bags.","Salad dressing, 2 small jars. Into each: 1 tbsp low-sodium soy sauce, 2 tsp toasted sesame oil, 2 tsp honey, 1 tbsp lime juice and ¼ tsp ground ginger. Lid on, shake, fridge.","When the chicken comes out, let it rest and turn the oven down to 350°F (open the door for a minute to cool it faster).","Egg bites: whisk 4 eggs, ⅔ cup liquid egg whites, ¼ tsp kosher salt and ⅛ tsp black pepper. Divide the pepper, green onion and ¼ cup shredded 2% sharp cheddar among the 4 sprayed muffin cups, then pour the eggs over them, almost to the top. Bake 20 to 22 minutes, until set in the middle. Cool 5 minutes, then run a knife around each and lift them out.","Dice the rested chicken into ½-inch pieces (about 4¼ cups).","Fried rice (once the rice has chilled 30 minutes): heat 1 tsp olive oil in a large nonstick skillet over medium-high and cook the 12 oz chicken pieces 5 to 6 minutes, until no pink is left; move them to a plate. Add 1 tsp toasted sesame oil, the diced onion and 1 cup frozen peas and carrots and cook 3 minutes. Push it to one side, pour the eggs into the empty side a       this.live = true;
      document.querySelectorAll('[data-skey]').forEach(inp => {
        const on = !!this.data[this.key(inp.dataset.skey)];
        if (inp.checked !== on){ inp.checked = on; inp.dispatchEvent(new Event('sync')); }
      });
      const st = document.getElementById('syncstat'); if (st) st.textContent = 'Shared: ticks show up on both phones';
    };
    es.addEventListener('put', apply); es.addEventListener('patch', apply);
    es.onerror = () => { const st = document.getElementById('syncstat'); if (st) st.textContent = 'Offline: ticks saved on this phone only'; };
  }
};
function sharedBox(key, row, onChange){
  const cb = el('input'); cb.type = 'checkbox'; cb.dataset.skey = key; cb.checked = shared.get(key);
  row.classList.toggle('done', cb.checked);
  cb.addEventListener('change', () => { shared.set(key, cb.checked); row.classList.toggle('done', cb.checked); if (onChange) onChange(); });
  cb.addEventListener('sync', () => { row.classList.toggle('done', cb.checked); if (onChange) onChange(); });
  return cb;
}

function render(){
  const d = DAYS[state.i], main = document.getElementById('main');
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', t.dataset.tab === state.tab));
  document.getElementById('dtitle').textContent = d.label;
  const ti = todayIdx();
  const sub = document.getElementById('dsub');
  if (state.tab.startsWith('liz')){ const ld = LIZ.days[d.date]; sub.textContent = ld ? 'Liz week ' + ld.w + ' of ' + LIZ.weeks : 'Liz starts Monday, Nov 16'; }
  else sub.textContent = 'Week '+d.w+' of 12';
  if (state.i === ti) sub.append(el('span','todaypill','Today'));
  else { const b = el('button','gotoday','Go to today'); b.onclick = () => go(ti); sub.append(b); }
  document.getElementById('prev').disabled = state.i === 0;
  document.getElementById('next').disabled = state.i === N-1;
  const strip = document.getElementById('strip'); strip.innerHTML = '';
  const mon = state.i - d.i;
  for (let k = 0; k < 7; k++){
    const j = mon + k; if (j < 0 || j >= N) continue;
    const b = el('button', (j === state.i ? 'on ' : '') + (j === ti ? 'today' : ''));
    b.append(document.createTextNode(SHORT[k])); b.append(el('b', null, String(+DAYS[j].date.slice(8))));
    b.onclick = () => go(j); strip.append(b);
  }
  main.innerHTML = '';
  if (state.tab === 'meals') renderMeals(d, main);
  else if (state.tab === 'lizm') renderLizMeals(d, main);
  else if (state.tab === 'lizw') renderLizWork(d, main);
  else renderWorkout(d, state.tab === 'rob' ? 'Rob' : 'Maggie', main);
  history.replaceState(null, '', '#'+state.tab+'/'+d.date);
}
function go(i){ state.i = Math.max(0, Math.min(N-1, i)); render(); window.scrollTo(0,0); }
document.getElementById('prev').onclick = () => go(state.i-1);
document.getElementById('next').onclick = () => go(state.i+1);
document.querySelectorAll('.tab').forEach(t => t.onclick = () => { state.tab = t.dataset.tab; render(); window.scrollTo(0,0); });
document.getElementById('span').textContent = 'Nov 9 – Jan 31';
let sx = null, sy = null;
document.addEventListener('touchstart', e => { if (e.touches.length === 1){ sx = e.touches[0].clientX; sy = e.touches[0].clientY; } }, {passive:true});
document.addEventListener('touchend', e => {
  if (sx === null) return; const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; sx = null;
  if (Math.abs(dx) > 70 && Math.abs(dy) < 45 && !(window.getSelection && String(window.getSelection()))) go(state.i + (dx < 0 ? 1 : -1));
}, {passive:true});
shared.start();
render();
