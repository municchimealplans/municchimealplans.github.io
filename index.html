rito with 2 tbsp salsa; with 8-inch\nwraps, 1 burrito with 2 tbsp salsa plus ¾ cup (170 g) plain nonfat Greek\nyogurt on the side to make up the difference. <strong>Store:</strong> 4\nburritos in the fridge (Mon, Wed), 2 in the freezer (Fri). With 8-inch\nwraps: 6 in the fridge, 3 in the freezer. <strong>To eat:</strong>\nUnwrap, wrap in a damp paper towel and microwave 1 to 1½ minutes from\nthe fridge or 2½ minutes from frozen, turning once.</li>\n</ol>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob, 10-inch (1 burrito)</td>\n<td>432</td>\n<td>36 g</td>\n<td>47 g</td>\n<td>18 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie, 10-inch (1 burrito)</td>\n<td>397</td>\n<td>35 g</td>\n<td>38 g</td>\n<td>17 g</td>\n</tr>\n<tr class=\"odd\">\n<td>Rob, 8-inch (2 burritos)</td>\n<td>498</td>\n<td>49 g</td>\n<td>39 g</td>\n<td>23 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie, 8-inch (1 burrito + yogurt)</td>\n<td>355</td>\n<td>42 g</td>\n<td>27 g</td>\n<td>12 g</td>\n</tr>\n</tbody>\n</table>\n","3:L_korean":"<p><span class=\"tag\">Sunday prep: pack all 6 bowls</span></p>\n<p><em>Makes 6 bowls (3 Rob, 3 Maggie).</em></p>\n<p><strong>Ingredients</strong></p>\n<ul>\n<li>2¼ lb (1,020 g) 95% lean ground beef</li>\n<li>3 garlic cloves, minced</li>\n<li>1 tbsp grated fresh ginger</li>\n<li>Sauce: 5 tbsp gochujang, 3½ tbsp low-sodium soy sauce, 4 tsp honey,\n1 tbsp toasted sesame oil</li>\n<li>Quick pickles: 1¼ English cucumbers (360 g), 4 medium carrots (240\ng), ¼ cup rice vinegar, ½ tsp salt</li>\n<li>1¼ cups dry white rice</li>\n<li>1¾ cups (270 g) frozen shelled edamame</li>\n<li>3 cups (90 g) baby spinach (Maggie)</li>\n<li>Containers: 6</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Cook the rice: bring 1¼ cup dry white rice and 2½ cups water to a\nboil, cover, turn the heat to low and simmer 15 minutes, then let it sit\n5 minutes off the heat and fluff with a fork. (A microwave rice pouch\nworks too.)</li>\n<li>Quick pickles: slice the cucumbers thin and shred the carrots. Toss\nwith the rice vinegar and salt and refrigerate at least 15 minutes, then\ndrain.</li>\n<li>Thaw the edamame: microwave 1 minute or run under warm water.</li>\n<li>Heat a large skillet over high until very hot. Add the beef, press\nit flat and leave it 3 minutes to brown, then add the garlic and ginger\nand cook 4 to 5 minutes more, breaking it up. If liquid pools in the\npan, spoon or pour it off and keep cooking on high until the meat\nbrowns.</li>\n<li>Stir in the gochujang, soy sauce, honey and sesame oil. Simmer 2\nminutes.</li>\n<li><strong>Divide.</strong> Rob: each of his 3 bowls gets ¾ cup (130 g)\nrice, 1 cup (150 g) cooked beef, ¼ cup (40 g) edamame and a sixth of the\npickles. Maggie: each of her 3 bowls gets a bed of 1 cup (30 g) spinach,\n⅓ cup (65 g) rice, ¾ cup (105 g) cooked beef, ⅓ cup (50 g) edamame and a\nsixth of the pickles. If the cooked amounts come out different, weigh\nthe pile, divide it by 5 for each Rob bowl, and give each Maggie bowl\ntwo-thirds of that. <strong>Store:</strong> All 6 bowls in the fridge\n(Mon to Wed), with the sauce and cold toppings in their own containers.\n<strong>To eat:</strong> Microwave 1½ to 2 minutes (move the pickles to\nthe side first if you like them cold).</li>\n</ol>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>598</td>\n<td>53 g</td>\n<td>58 g</td>\n<td>16 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>431</td>\n<td>40 g</td>\n<td>39 g</td>\n<td>12 g</td>\n</tr>\n</tbody>\n</table>\n","3:D_bangbang":"<p><strong>Ingredients</strong></p>\n<ul>\n<li>13½ oz (385 g) chicken breast</li>\n<li>1 tsp olive oil</li>\n<li>Seasoning: ¼ tsp salt, ¼ tsp garlic powder, a pinch of black\npepper</li>\n<li>2 tbsp cornstarch</li>\n<li>Bang bang sauce: 1¾ tbsp light mayo, 2 tbsp (25 g) plain nonfat\nGreek yogurt, 1¾ tbsp sweet chili sauce, 1 tsp sriracha</li>\n<li>⅓ English cucumber (120 g)</li>\n<li>1¾ cups (120 g) coleslaw mix</li>\n<li>⅔ cup dry white rice</li>\n<li>Cooking spray</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Cook the rice: bring ⅔ cup dry white rice and 1⅓ cups water to a\nboil, cover, turn the heat to low and simmer 15 minutes, then let it sit\n5 minutes off the heat and fluff with a fork. (A microwave rice pouch\nworks too.)</li>\n<li>Cut the chicken into 1-inch cubes. Toss with the olive oil and\nseasoning, then with the cornstarch.</li>\n<li>Spray the air fryer basket, add the chicken in one layer and spray\nthe tops. Air-fry at 400°F for 12 minutes, shaking once.</li>\n<li>Sauce: whisk the light mayo, yogurt, sweet chili sauce and\nsriracha.</li>\n<li>Toss the hot chicken in the sauce.</li>\n<li>Slice the cucumber.</li>\n<li><strong>Divide.</strong> Rob: 6 oz (170 g) cooked chicken in sauce\nover 1 cup (160 g) rice, with ¼ English cucumber (60 g) and ¾ cup (60 g)\nslaw. Maggie: 4¼ oz (120 g) cooked chicken in sauce over ¾ cup (125 g)\nrice, with ¼ English cucumber (60 g) and ¾ cup (60 g) slaw.</li>\n</ol>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>648</td>\n<td>58 g</td>\n<td>70 g</td>\n<td>13 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>477</td>\n<td>42 g</td>\n<td>54 g</td>\n<td>9 g</td>\n</tr>\n</tbody>\n</table>\n","3:snack2:S_mshake":"<p><b>Rob's shake:</b> 1 scoop Tripact PB & vanilla protein, 240 ml (1 cup) Fairlife fat-free milk, 2 cups of raw baby spinach, 1 tbsp ground flax, 1 scoop collagen, plus 3 to 5 g creatine. Blend until smooth. 272 cal, 45 g protein, 13 g carbs.</p><p><b>Maggie (shake):</b> ¾ scoop vanilla protein powder, 200 ml (¾ cup) Fairlife fat-free milk, a handful (about 1 cup) of raw baby spinach, 60 g mixed berries, fresh or thawed frozen (about ⅓ cup). 203 cal, 32 g protein, 16 g carbs.</p>","3:B_oats_apple":"<p><span class=\"tag\">Sunday prep: all 4 jars</span></p>\n<p><em>Makes 4 jars (2 Rob, 2 Maggie).</em></p>\n<p><strong>Ingredients</strong></p>\n<ul>\n<li>1½ cups (130 g) old-fashioned rolled oats</li>\n<li>Vanilla protein powder: 2 scoops for Rob's jars, 1½ scoops for\nMaggie's</li>\n<li>1¾ cups (440 ml) Fairlife fat-free milk</li>\n<li>2¼ cups (500 g) plain nonfat Greek yogurt</li>\n<li>1 Honeycrisp apple (220 g), diced small</li>\n<li>4 tbsp sugar-free maple syrup</li>\n<li>2 tsp cinnamon</li>\n<li>4 pinches nutmeg</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Line up four 16-oz mason jars and label two \"Rob\" and two\n\"Maggie\".</li>\n<li>Dice the apple small.</li>\n<li>Into each Rob jar: ⅓ cup (35 g) oats, 1 scoop vanilla protein\npowder, ½ tsp cinnamon and a pinch of nutmeg.</li>\n<li>Into each Maggie jar: ⅓ cup (30 g) oats, ¾ scoop vanilla protein\npowder, ½ tsp cinnamon and a pinch of nutmeg.</li>\n<li>Stir the dry mix in each jar.</li>\n<li>Pour ½ cup (120 ml) Fairlife into each Rob jar and ½ cup (100 ml)\nFairlife into each Maggie jar. Stir until there are no clumps.</li>\n<li>Add ⅔ cup (150 g) Greek yogurt, ⅓ Honeycrisp apple (60 g) of the\ndiced apple and 1 tbsp sugar-free maple syrup to each Rob jar; ½ cup\n(100 g) Greek yogurt, ¼ Honeycrisp apple (50 g) of the apple and 1 tbsp\nsyrup to each Maggie jar. Stir.</li>\n<li>Put the lids on and refrigerate overnight.</li>\n<li><strong>Divide.</strong> Rob: his 2 jars (Tue, Thu). Maggie: her 2\njars (Tue, Thu). <strong>Store:</strong> All 4 jars in the fridge (Tue,\nThu). They keep 5 days. <strong>To eat:</strong> Stir and eat cold.</li>\n</ol>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>422</td>\n<td>51 g</td>\n<td>46 g</td>\n<td>4 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>342</td>\n<td>40 g</td>\n<td>39 g</td>\n<td>4 g</td>\n</tr>\n</tbody>\n</table>\n","3:D_carnitas":"<p><span class=\"tag\">Sunday prep: bag and freeze the raw pork</span></p>\n<p><strong>Ingredients</strong></p>\n<ul>\n<li>13½ oz (385 g) pork tenderloin</li>\n<li>Seasoning: 1 tsp cumin, 1 tsp dried oregano, 2 garlic cloves\n(minced), ½ tsp salt, ¼ tsp black pepper</li>\n<li>1½ tsp olive oil</li>\n<li>¼ cup (55 ml) orange juice and 2 tbsp water</li>\n<li>5 small (8-inch) low-carb tortillas</li>\n<li>Slaw: 2¼ cups (160 g) coleslaw mix, juice of ½ lime, a pinch of\nsalt</li>\n<li>Pico: 1⅔ Roma tomatoes (120 g), ¼ white onion (40 g), 1 tbsp chopped\nfresh cilantro, juice of ½ lime, a pinch of salt</li>\n<li>¼ cup (60 g) plain nonfat Greek yogurt</li>\n<li>2 tbsp (20 g) crumbled feta</li>\n<li>½ cup (70 g) frozen corn and ½ tsp Tajín</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>The night before (Monday), move the raw pork from the freezer to the\nfridge.</li>\n<li>Cut the pork into 1-inch cubes and toss with the seasoning.</li>\n<li>Heat the olive oil in a skillet over medium-high. Sear the pork 4\nminutes, turning.</li>\n<li>Add the orange juice and water, cover, turn the heat to medium-low\nand simmer 10 minutes.</li>\n<li>Uncover and cook 3 to 5 minutes more, until the liquid is gone and\nthe edges crisp. Shred with two forks.</li>\n<li>Pico: dice the tomatoes and onion and mix with the cilantro, lime\njuice and salt.</li>\n<li>Slaw: toss the coleslaw mix with the lime juice and salt.</li>\n<li>Char the corn in a dry pan over medium-high, 4 to 5 minutes, and\nsprinkle with the Tajín.</li>\n<li>Warm the tortillas: wrap them in a damp paper towel and microwave 30\nseconds.</li>\n<li><strong>Divide.</strong> Rob: 3 tortillas, 6 oz (170 g) cooked pork,\nhalf the slaw and pico, 2 tbsp yogurt as crema, 1 tbsp feta and ⅓ cup\n(45 g) corn on the side. Maggie: 2 tortillas, 4¼ oz (120 g) cooked pork,\nhalf the slaw and pico, 2 tbsp yogurt as crema, 1 tbsp feta and 2½ tbsp\n(25 g) corn on the side.</li>\n</ol>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>650</td>\n<td>70 g</td>\n<td>79 g</td>\n<td>22 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>474</td>\n<td>51 g</td>\n<td>56 g</td>\n<td>16 g</td>\n</tr>\n</tbody>\n</table>\n","3:snack2:S_eggs":"<p><b>Rob's shake:</b> 1 scoop Tripact PB & vanilla protein, 240 ml (1 cup) Fairlife fat-free milk, 2 cups of raw baby spinach, 1 tbsp ground flax, 1 scoop collagen, plus 3 to 5 g creatine. Blend until smooth. 272 cal, 45 g protein, 13 g carbs.</p><p><b>Maggie (edamame + egg):</b> 85 g frozen shelled edamame (about ½ cup), 1 egg. 174 cal, 16 g protein, 8 g carbs.</p>","3:D_pesto":"<p><span class=\"tag\">Sunday prep: bag and freeze the raw\nchicken</span></p>\n<p><strong>Ingredients</strong></p>\n<ul>\n<li>13½ oz (385 g) chicken breast</li>\n<li>Seasoning: ½ tsp Italian seasoning, ½ tsp garlic powder, ¼ tsp salt,\na pinch of black pepper</li>\n<li>3¾ oz (110 g) dry penne, plus 1 tbsp salt for the water</li>\n<li>12 asparagus spears (200 g)</li>\n<li>2¼ tbsp store-bought basil pesto</li>\n<li>About 13 cherry tomatoes (200 g), halved</li>\n<li>2 tbsp (10 g) grated parmesan</li>\n<li>Cooking spray</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>The night before (Tuesday), move the raw chicken from the freezer to\nthe fridge.</li>\n<li>Bring a pot of water with 1 tbsp salt to a boil.</li>\n<li>Cut the chicken into strips and season it. Cook in a sprayed skillet\nover medium-high 6 to 7 minutes, until 165°F.</li>\n<li>Cook the penne as the package says. Cut the asparagus into 2-inch\npieces and add it to the pot for the last 2 minutes.</li>\n<li>Scoop out ¼ cup of the pasta water, then drain.</li>\n<li>Toss the penne and asparagus with the pesto, tomatoes and a splash\nof the pasta water.</li>\n<li><strong>Divide.</strong> Rob: 6 oz (170 g) cooked chicken over 1½\ncups cooked penne (2¼ oz dry) with a bit more than half the asparagus\nand tomatoes, and 1 tbsp parmesan. Maggie: 4¼ oz (120 g) cooked chicken\nover 1 cup cooked penne (1½ oz dry) with the rest of the asparagus and\ntomatoes, and 1 tbsp parmesan.</li>\n</ol>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>657</td>\n<td>65 g</td>\n<td>58 g</td>\n<td>17 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>483</td>\n<td>47 g</td>\n<td>42 g</td>\n<td>13 g</td>\n</tr>\n</tbody>\n</table>\n","3:snack2:S_cottage":"<p><b>Rob's shake:</b> 1 scoop Tripact PB & vanilla protein, 240 ml (1 cup) Fairlife fat-free milk, 2 cups of raw baby spinach, 1 tbsp ground flax, 1 scoop collagen, plus 3 to 5 g creatine. Blend until smooth. 272 cal, 45 g protein, 13 g carbs.</p><p><b>Maggie (cottage cheese ranch dip):</b> 170 g 2% cottage cheese (about ¾ cup), 100 g yellow or orange bell pepper (about ⅔ pepper), 75 g English cucumber (about ¼ cucumber), with 1 tsp ranch seasoning stirred into the cottage cheese. 180 cal, 20 g protein, 16 g carbs.</p>","3:L_ranch":"<p><span class=\"tag\">Sunday prep: the whole batch</span></p>\n<p><em>Makes 8 containers (4 Rob, 4 Maggie).</em></p>\n<p><strong>Ingredients</strong></p>\n<ul>\n<li>2⅔ lb (1,200 g) Yukon gold potatoes, about 7 medium</li>\n<li>1 tbsp olive oil, ½ tsp salt, ½ tsp garlic powder</li>\n<li>2¾ lb (1,250 g) chicken breast</li>\n<li>Chicken seasoning: 1 tsp salt, 1 tsp garlic powder, 1 tsp paprika, ½\ntsp black pepper</li>\n<li>8 slices turkey bacon</li>\n<li>3 cups (300 g) green beans, trimmed</li>\n<li>Sauce: 1½ cups (340 g) plain nonfat Greek yogurt, ½ cup (120 ml)\nFairlife fat-free milk, 2 to 3 tbsp ranch seasoning</li>\n<li>1½ cups (6 oz) shredded reduced-fat cheddar</li>\n<li>Cooking spray and a 9x13 pan</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Heat the oven to 425°F. Spray two sheet pans.</li>\n<li>Cut the potatoes into ¾-inch cubes, toss with the olive oil, salt\nand garlic powder, and roast 25 minutes.</li>\n<li>Season the chicken with the chicken seasoning and bake it on the\nother rack 18 to 22 minutes, until 165°F. Rest 5 minutes and dice.</li>\n<li>Cook the turkey bacon in a skillet over medium, 3 to 4 minutes a\nside, until crisp. Crumble it.</li>\n<li>Bring a pot of water to a boil. Cook the green beans 3 minutes,\ndrain and cut into thirds.</li>\n<li>Sauce: whisk the yogurt, Fairlife and 2 tbsp ranch seasoning. Taste\nand add up to 1 more tbsp ranch.</li>\n<li>Turn the oven down to 375°F. In a sprayed 9x13 pan mix the potatoes,\nchicken, bacon, green beans and sauce. Top with the cheddar.</li>\n<li>Bake 20 minutes, until the cheese melts. Cool 15 minutes before\npacking.</li>\n<li><strong>Divide.</strong> Rob: 4 containers of 2⅓ cups (470 g) each.\nMaggie: 4 containers of 1⅔ cups (340 g) each. <strong>Store:</strong>\nAll 8 containers in the freezer. Wednesday night, move 4 to the fridge\n(Thu, Fri); Friday night, move the other 4 (Sat, Sun). Reheat covered,\n2½ to 3 minutes, stirring halfway. Cooked food keeps 3 to 4 days in the\nfridge, which is why these start frozen.</li>\n</ol>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>595</td>\n<td>67 g</td>\n<td>42 g</td>\n<td>17 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>430</td>\n<td>49 g</td>\n<td>30 g</td>\n<td>12 g</td>\n</tr>\n</tbody>\n</table>\n","3:D_steakfrites":"<p><span class=\"tag\">Sunday prep: bag and freeze the raw\nsteak</span></p>\n<p><strong>Ingredients</strong></p>\n<ul>\n<li>Sirloin steaks: about 9 oz raw for Rob, about 6½ oz raw for\nMaggie</li>\n<li>½ tsp salt and ¼ tsp black pepper</li>\n<li>1½ medium Yukon gold potatoes (230 g)</li>\n<li>2 tsp olive oil, ½ tsp salt, ¼ tsp garlic powder</li>\n<li>Chimichurri: 3 tbsp chopped fresh flat-leaf parsley, 1 small garlic\nclove, 1½ tsp olive oil, 1½ tsp red wine vinegar, a pinch each of red\npepper flakes and salt</li>\n<li>Salad: 3¼ cups (150 g) chopped romaine, about 7 cherry tomatoes (100\ng), 1 cup (30 g) baby spinach for Maggie, 4 tbsp light balsamic\nvinaigrette</li>\n<li>Cooking spray</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>The night before (Wednesday), move the raw steak from the freezer to\nthe fridge.</li>\n<li>Cut the potatoes into ¼-inch fries. Toss with the olive oil, salt\nand garlic powder.</li>\n<li>Air-fry at 400°F for 18 to 20 minutes, shaking twice.</li>\n<li>Chimichurri: finely chop the parsley and garlic and stir them with\nthe olive oil, vinegar, red pepper flakes and salt.</li>\n<li>Pat the steaks dry and season them with the salt and pepper.</li>\n<li>Heat a cast-iron pan over high until it just smokes, spray it and\nsear the steaks 3 to 4 minutes a side (130°F for medium-rare). Rest 5\nminutes and slice.</li>\n<li>Salad: halve the tomatoes and toss each person's greens with 2 tbsp\nvinaigrette.</li>\n<li><strong>Divide.</strong> Rob: his 6½ oz (185 g) steak with 1 tbsp\nchimichurri, 1¼ cups fries (110 g cooked) and a salad of 1⅔ cups (75 g)\nromaine, half the tomatoes and 2 tbsp vinaigrette. Maggie: her 4½ oz\n(130 g) steak with 1 tbsp chimichurri, ⅔ cup fries (60 g cooked) and a\nsalad of 1⅔ cups (75 g) romaine, 1 cup (30 g) spinach, half the tomatoes\nand 2 tbsp vinaigrette.</li>\n</ol>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>648</td>\n<td>59 g</td>\n<td>34 g</td>\n<td>32 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>475</td>\n<td>42 g</td>\n<td>23 g</td>\n<td>25 g</td>\n</tr>\n</tbody>\n</table>\n","3:D_crunchwrap":"<p><span class=\"tag\">Sunday prep: bag and freeze the raw beef</span></p>\n<p><strong>Ingredients</strong></p>\n<ul>\n<li>11½ oz (325 g) 95% lean ground beef</li>\n<li>1 tbsp taco seasoning and 2 tbsp water</li>\n<li>3 large (10-inch) low-carb tortillas: 2 for Rob, 1 for Maggie</li>\n<li>1½ small (8-inch) low-carb tortillas</li>\n<li>⅓ cup (70 g) plain nonfat Greek yogurt</li>\n<li>⅓ cup (35 g) shredded Mexican-blend cheese</li>\n<li>1⅔ cups (80 g) shredded romaine</li>\n<li>1 Roma tomato (80 g), diced</li>\n<li>4 tbsp jarred salsa</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>The night before (Thursday), move the raw beef from the freezer to\nthe fridge.</li>\n<li>Heat a skillet over high until very hot. Brown the beef 6 minutes,\nleaving it alone for the first 3. If liquid pools in the pan, spoon or\npour it off and keep cooking on high until the meat browns.</li>\n<li>Add the taco seasoning and water and simmer 2 minutes, until thick.\nMove to a bowl and wipe the skillet.</li>\n<li>Toast the small tortillas in the dry skillet, 1 to 2 minutes a side,\nuntil crisp. Break them into 3 halves.</li>\n<li>Lay out the large tortillas. In the center of each, layer the beef\n(1 cup (140 g) cooked beef split across Rob's 2, ¾ cup (105 g) cooked\nbeef on Maggie's), the cheese, a crisp tortilla half, the yogurt,\nromaine and tomato.</li>\n<li>Fold the edges up toward the center in pleats until it's\nclosed.</li>\n<li>Toast seam-side down in the dry skillet over medium, 2 to 3 minutes\na side, until golden.</li>\n<li><strong>Divide.</strong> Rob: his 2 crunchwraps with 2 tbsp salsa to\ndip. Maggie: her crunchwrap with 2 tbsp salsa to dip.</li>\n</ol>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>649</td>\n<td>67 g</td>\n<td>82 g</td>\n<td>23 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>422</td>\n<td>47 g</td>\n<td>44 g</td>\n<td>15 g</td>\n</tr>\n</tbody>\n</table>\n","3:snack2:S_jerky":"<p><b>Rob's shake:</b> 1 scoop Tripact PB & vanilla protein, 240 ml (1 cup) Fairlife fat-free milk, 2 cups of raw baby spinach, 1 tbsp ground flax, 1 scoop collagen, plus 3 to 5 g creatine. Blend until smooth. 272 cal, 45 g protein, 13 g carbs.</p><p><b>Maggie (jerky + apple):</b> 28 g (1 oz) original beef jerky, 180 g Honeycrisp apple (about 1 apple). 174 cal, 11 g protein, 31 g carbs.</p>","3:B_bbwaffles":"<p><strong>Ingredients</strong></p>\n<ul>\n<li>1¼ cups (120 g) Kodiak Power Cakes mix</li>\n<li>1¼ bananas (130 g)</li>\n<li>¾ cup (175 g) liquid egg whites</li>\n<li>1 tsp cinnamon</li>\n<li>2 pinches nutmeg</li>\n<li>1 cup (205 g) plain nonfat Greek yogurt</li>\n<li>2 tbsp sugar-free maple syrup</li>\n<li>Cooking spray</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Plug in the waffle iron to heat.</li>\n<li>Rob's batter: mash ¾ banana (80 g) in a bowl, then whisk in ⅔ cup\n(65 g) Kodiak mix, ⅓ cup (100 g) egg whites, ½ tsp cinnamon and a pinch\nof nutmeg.</li>\n<li>Maggie's batter: mash ½ banana (50 g), then whisk in ½ cup (55 g)\nKodiak mix, ⅓ cup (75 g) egg whites, ½ tsp cinnamon and a pinch of\nnutmeg.</li>\n<li>Spray the waffle iron. Cook Rob's batter about 4 minutes, until\ngolden. Spray again and cook Maggie's.</li>\n<li><strong>Divide.</strong> Rob: his waffles topped with ½ cup (120 g)\nGreek yogurt and 1 tbsp sugar-free maple syrup. Maggie: her waffles\ntopped with ⅓ cup (85 g) Greek yogurt and 1 tbsp sugar-free maple\nsyrup.</li>\n</ol>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>437</td>\n<td>41 g</td>\n<td>63 g</td>\n<td>3 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>341</td>\n<td>32 g</td>\n<td>49 g</td>\n<td>3 g</td>\n</tr>\n</tbody>\n</table>\n","3:D_bbq":"<p><span class=\"tag\">Sunday prep: bag and freeze the raw\nchicken</span></p>\n<p><strong>Ingredients</strong></p>\n<ul>\n<li>13½ oz (385 g) chicken breast</li>\n<li>4½ tbsp sugar-free BBQ sauce (G Hughes or similar)</li>\n<li>½ tsp smoked paprika, ½ tsp garlic powder, ¼ tsp salt, ¼ cup\nwater</li>\n<li>3 medium sweet potatoes (565 g)</li>\n<li>1 tsp olive oil and ¼ tsp salt</li>\n<li>Slaw: 2¾ cups (200 g) coleslaw mix, 3 tbsp (45 g) plain nonfat Greek\nyogurt, 2 tsp light mayo, 1 tsp red wine vinegar, a pinch each of salt\nand pepper</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>The night before (Friday), move the raw chicken from the freezer to\nthe fridge.</li>\n<li>Put the chicken in a slow cooker with half the BBQ sauce, the\npaprika, garlic powder, salt and water. Cook 4 hours on low (or 10\nminutes on high in a pressure cooker, then 5 minutes natural\nrelease).</li>\n<li>Shred the chicken with two forks and toss with the rest of the BBQ\nsauce.</li>\n<li>Heat the oven to 425°F. Cut the sweet potatoes into ¾-inch cubes,\ntoss with the olive oil and salt, and roast 25 minutes.</li>\n<li>Slaw: toss the coleslaw mix with the yogurt, light mayo, vinegar,\nsalt and pepper.</li>\n<li><strong>Divide.</strong> Rob: 6 oz (170 g) cooked chicken, shredded\nin BBQ sauce, 2 cups roasted sweet potato (250 g cooked) and half the\nslaw. Maggie: 4¼ oz (120 g) cooked chicken, shredded in BBQ sauce, 1⅓\ncups roasted sweet potato (175 g cooked) and half the slaw.</li>\n</ol>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>652</td>\n<td>60 g</td>\n<td>78 g</td>\n<td>11 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>473</td>\n<td>43 g</td>\n<td>58 g</td>\n<td>7 g</td>\n</tr>\n</tbody>\n</table>\n","3:B_shakshuka":"<p><strong>Ingredients</strong></p>\n<ul>\n<li>¾ red bell pepper (120 g), diced</li>\n<li>⅓ yellow onion (60 g), diced</li>\n<li>1½ tsp olive oil</li>\n<li>1 garlic clove, minced</li>\n<li>Spices: 1 tsp cumin, 1 tsp smoked paprika, ¼ tsp red pepper flakes,\n½ tsp salt</li>\n<li>1½ cups (350 g) canned crushed tomatoes</li>\n<li>5 large eggs</li>\n<li>¼ cup (35 g) crumbled feta</li>\n<li>2 slices 45-calorie bread</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Heat the olive oil in a 10-inch skillet over medium. Add the pepper\nand onion and cook 5 minutes, until soft.</li>\n<li>Add the garlic and spices and stir 30 seconds.</li>\n<li>Add the crushed tomatoes and simmer 8 minutes, until thickened.</li>\n<li>Make 5 wells in the sauce: 3 on Rob's side, 2 on Maggie's. Crack an\negg into each.</li>\n<li>Cover, turn the heat to low and cook 6 to 8 minutes, until the\nwhites are set and the yolks are still soft.</li>\n<li>Crumble the feta over the top. Toast the bread.</li>\n<li><strong>Divide.</strong> Rob: his 3 eggs with a bit more than half\nthe sauce, 2 tbsp (20 g) feta and 1 slice of toast. Maggie: her 2 eggs\nwith the rest of the sauce, 1½ tbsp (15 g) feta and 1 slice of\ntoast.</li>\n</ol>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>439</td>\n<td>29 g</td>\n<td>32 g</td>\n<td>24 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>330</td>\n<td>21 g</td>\n<td>28 g</td>\n<td>17 g</td>\n</tr>\n</tbody>\n</table>\n","3:D_roast":"<p><span class=\"tag\">Sunday prep: bag and freeze the raw\nchicken</span></p>\n<p><strong>Ingredients</strong></p>\n<ul>\n<li>15 oz (425 g) chicken breast</li>\n<li>2½ medium Yukon gold potatoes (430 g)</li>\n<li>4¼ cups (375 g) Brussels sprouts</li>\n<li>1 tbsp olive oil</li>\n<li>3 garlic cloves (minced), 1 tsp dried rosemary, ¾ tsp salt, ½ tsp\nblack pepper</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>The night before (Saturday), move the raw chicken from the freezer\nto the fridge.</li>\n<li>Heat the oven to 425°F.</li>\n<li>Cut the chicken into 2-inch chunks, the potatoes into ¾-inch cubes,\nand halve the Brussels sprouts.</li>\n<li>Toss everything on one large sheet pan with the olive oil, garlic,\nrosemary, salt and pepper (use two pans if crowded).</li>\n<li>Roast 25 minutes, flipping halfway, until the chicken is 165°F and\nthe potatoes are tender.</li>\n<li><strong>Divide.</strong> Rob: 6½ oz (190 g) cooked chicken, 1⅓ cups\nroasted potatoes (180 g cooked) and a bit more than half the Brussels\nsprouts. Maggie: 4¾ oz (130 g) cooked chicken, 1 cup roasted potatoes\n(130 g cooked) and the rest of the Brussels sprouts.</li>\n</ol>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>649</td>\n<td>68 g</td>\n<td>62 g</td>\n<td>15 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>477</td>\n<td>49 g</td>\n<td>47 g</td>\n<td>11 g</td>\n</tr>\n</tbody>\n</table>\n","4:S_banana":"<p><strong>Ingredients</strong></p>\n<ul>\n<li>1½ cups (350 g) plain nonfat Greek yogurt</li>\n<li>¾ scoop vanilla protein powder</li>\n<li>1 tbsp sugar-free vanilla pudding mix (dry)</li>\n<li>¾ banana</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>In Rob's container: 1 cup (200 g) Greek yogurt, ½ scoop vanilla\nprotein powder and 1½ tsp dry pudding mix.</li>\n<li>In Maggie's container: ⅔ cup (150 g) Greek yogurt, ⅓ scoop vanilla\nprotein powder and 1½ tsp dry pudding mix.</li>\n<li>Stir each one until smooth. Lid on, into the fridge overnight.</li>\n<li><strong>Divide.</strong> Rob: his container, topped with ½ banana\n(50 g) sliced when he eats it. Maggie: her container, topped with ⅓\nbanana (40 g) sliced when she eats it. If you use the chocolate casein\ninstead of vanilla powder (it makes it chocolate banana), stir in 2 tbsp\nwater for Rob and 1½ tbsp for Maggie. <strong>Store:</strong> Mix it the\nnight before and keep it in the fridge. It keeps 2 days.</li>\n</ol>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>235</td>\n<td>33 g</td>\n<td>23 g</td>\n<td>2 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>177</td>\n<td>24 g</td>\n<td>19 g</td>\n<td>1 g</td>\n</tr>\n</tbody>\n</table>\n","4:B_sandwich":"<p><span class=\"tag\">Sunday prep: make the whole batch</span></p>\n<p><em>Makes 6 sandwiches.</em></p>\n<p><strong>Ingredients</strong></p>\n<ul>\n<li>12 Trader Joe's chicken breakfast sausage links (1 package)</li>\n<li>6 large eggs</li>\n<li>1 cup plus 2 tbsp (270 g) liquid egg whites</li>\n<li>A pinch each of salt and pepper</li>\n<li>6 light English muffins (100 calories)</li>\n<li>6 slices American cheese</li>\n<li>To serve: ¾ Bartlett pear for Rob each breakfast</li>\n<li>Cooking spray, a 9x13 pan and foil or plastic wrap</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Heat the oven to 350°F and spray a 9x13 pan.</li>\n<li>Whisk the eggs, egg whites, salt and pepper. Pour into the pan and\nbake 15 minutes, until set (or bake it next to the lasagna at 375°F for\n12 to 15 minutes).</li>\n<li>Cool 5 minutes and cut into 6 squares.</li>\n<li>Squeeze the sausage out of its casings, 2 links per patty, and press\n6 thin patties a little wider than the muffins.</li>\n<li>Heat a large sprayed skillet over medium. Cook the patties 3 minutes\na side, until browned and cooked through (165°F).</li>\n<li>Toast the English muffins if you like.</li>\n<li>Build each sandwich: muffin bottom, patty, egg square, cheese slice,\nmuffin top.</li>\n<li>Wrap each sandwich in foil or plastic wrap.</li>\n<li><strong>Divide.</strong> Rob: 1 sandwich with 1 Bartlett pear (185\ng). Maggie: 1 sandwich. <strong>Store:</strong> 4 sandwiches in the\nfridge (Mon, Wed), 2 in the freezer (Fri). <strong>To eat:</strong>\nUnwrap, wrap in a paper towel and microwave about 1 minute from the\nfridge or 1½ to 2 minutes from frozen.</li>\n</ol>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>430</td>\n<td>31 g</td>\n<td>55 g</td>\n<td>13 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>325</td>\n<td>30 g</td>\n<td>27 g</td>\n<td>12 g</td>\n</tr>\n</tbody>\n</table>\n","4:L_greek":"<p><span class=\"tag\">Sunday prep: pack all 6 bowls</span></p>\n<p><em>Makes 6 bowls (3 Rob, 3 Maggie).</em></p>\n<p><strong>Ingredients</strong></p>\n<ul>\n<li>2⅓ lb (1,060 g) chicken breast</li>\n<li>Marinade: juice of 1 lemon, 2 tsp dried oregano, 3 garlic cloves\n(minced), 1 tsp salt, ½ tsp black pepper, 1 tbsp olive oil</li>\n<li>1 cup dry white rice</li>\n<li>Salad: 1½ English cucumbers (450 g), 6 Roma tomatoes (450 g), ¼ tsp\nsalt, 1 tsp red wine vinegar</li>\n<li>Tzatziki: 1½ cups (330 g) plain nonfat Greek yogurt, ¼ English\ncucumber (75 g), 1 garlic clove, 1 tsp dried dill, juice of ½ lemon, ¼\ntsp salt</li>\n<li>⅔ cup (90 g) crumbled feta</li>\n<li>¾ cup hummus</li>\n<li>8 cups (375 g) chopped romaine</li>\n<li>3 cups (90 g) baby spinach (Maggie)</li>\n<li>Containers: 6, plus 12 sauce cups</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Heat the oven to 425°F and spray a sheet pan.</li>\n<li>Toss the chicken with the marinade. Bake 18 to 22 minutes, until\n165°F. Rest 5 minutes and slice.</li>\n<li>Cook the rice: bring 1 cup dry white rice and 2 cups water to a\nboil, cover, turn the heat to low and simmer 15 minutes, then let it sit\n5 minutes off the heat and fluff with a fork. (A microwave rice pouch\nworks too.)</li>\n<li>Salad: dice the cucumbers and tomatoes and toss with the salt and\nvinegar.</li>\n<li>Tzatziki: grate the ¼ cucumber, squeeze it dry in a paper towel, and\nstir it into the yogurt with the grated garlic, dill, lemon juice and\nsalt.</li>\n<li><strong>Divide.</strong> Rob: each of his 3 bowls gets 1 cup (150 g)\nsliced chicken, ¾ cup (130 g) rice, a sixth of the salad, 1 cup (50 g)\nromaine and 1½ tbsp (15 g) feta; 2 tbsp hummus and ¼ cup tzatziki in\nsauce cups. Maggie: each of her 3 bowls gets ¾ cup (110 g) sliced\nchicken, ⅓ cup (50 g) rice, a sixth of the salad, 1⅔ cups (75 g)\nromaine, 1 cup (30 g) spinach and 1½ tbsp (15 g) feta; 2 tbsp hummus and\n¼ cup tzatziki in sauce cups. If the cooked amounts come out different,\nweigh the pile, divide it by 5 for each Rob bowl, and give each Maggie\nbowl two-thirds of that. <strong>Store:</strong> All 6 bowls in the\nfridge (Mon to Wed), with the sauce and cold toppings in their own\ncontainers. <strong>To eat:</strong> Eat it cold, or warm the chicken\nand rice 1 minute first.</li>\n</ol>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>601</td>\n<td>62 g</td>\n<td>51 g</td>\n<td>15 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>427</td>\n<td>48 g</td>\n<td>30 g</td>\n<td>13 g</td>\n</tr>\n</tbody>\n</table>\n","4:D_steaksalad":"<p><strong>Ingredients</strong></p>\n<ul>\n<li>Sirloin steaks: about 9 oz raw for Rob, about 6½ oz raw for\nMaggie</li>\n<li>½ tsp salt and ¼ tsp black pepper</li>\n<li>1 small Yukon gold potato (150 g), 1 tsp olive oil and a pinch of\nsalt</li>\n<li>4¼ cups (200 g) chopped romaine</li>\n<li>3 cups (90 g) baby spinach</li>\n<li>1 Bartlett pear (180 g)</li>\n<li>¼ cup (35 g) crumbled blue cheese</li>\n<li>A thin wedge of red onion (30 g)</li>\n<li>4 tbsp light balsamic vinaigrette</li>\n<li>Cooking spray</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Potato croutons: cut the potato into ½-inch cubes, toss with the\nolive oil and salt, and air-fry at 400°F for 15 minutes, shaking once,\nuntil crisp.</li>\n<li>Season the steaks with the salt and pepper.</li>\n<li>Heat a cast-iron pan over high until it just smokes, spray it and\nsear the steaks 3 to 4 minutes a side. Rest 5 minutes and slice\nthin.</li>\n<li>Slice the pear and the red onion thin.</li>\n<li><strong>Divide.</strong> Rob: a big bowl of 2¼ cups (100 g) romaine,\n1⅓ cups (40 g) spinach, ½ Bartlett pear (100 g), 2½ tbsp (20 g) blue\ncheese, half the red onion and 2 tbsp vinaigrette, topped with his 6½ oz\n(185 g) steak and ½ cup crispy potato croutons (70 g cooked). Maggie: a\nbowl of 2¼ cups (100 g) romaine, 1⅔ cups (50 g) spinach, ½ Bartlett pear\n(80 g), 2 tbsp (15 g) blue cheese, half the red onion and 2 tbsp\nvinaigrette, topped with her 4½ oz (130 g) steak and ¼ cup crispy potato\ncroutons (35 g cooked).</li>\n</ol>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>651</td>\n<td>64 g</td>\n<td>42 g</td>\n<td>27 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>475</td>\n<td>46 g</td>\n<td>31 g</td>\n<td>21 g</td>\n</tr>\n</tbody>\n</table>\n","4:snack2:S_mshake":"<p><b>Rob's shake:</b> 1 scoop Tripact PB & vanilla protein, 240 ml (1 cup) Fairlife fat-free milk, 2 cups of raw baby spinach, 1 tbsp ground flax, 1 scoop collagen, plus 3 to 5 g creatine. Blend until smooth. 272 cal, 45 g protein, 13 g carbs.</p><p><b>Maggie (shake):</b> ¾ scoop vanilla protein powder, 200 ml (¾ cup) Fairlife fat-free milk, a handful (about 1 cup) of raw baby spinach, 60 g mixed berries, fresh or thawed frozen (about ⅓ cup). 203 cal, 32 g protein, 16 g carbs.</p>","4:B_oats_pb":"<p><span class=\"tag\">Sunday prep: all 4 jars</span></p>\n<p><em>Makes 4 jars (2 Rob, 2 Maggie).</em></p>\n<p><strong>Ingredients</strong></p>\n<ul>\n<li>¾ cup (70 g) old-fashioned rolled oats</li>\n<li>Vanilla protein powder: 2 scoops for Rob's jars, 1½ scoops for\nMaggie's</li>\n<li>1¾ cups (440 ml) Fairlife fat-free milk</li>\n<li>2¼ cups (500 g) plain nonfat Greek yogurt</li>\n<li>7 tbsp PB2</li>\n<li>In the morning: 2 bananas</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Line up four 16-oz mason jars and label two \"Rob\" and two\n\"Maggie\".</li>\n<li>Into each Rob jar: ¼ cup (20 g) oats, 1 scoop vanilla protein powder\nand 2 tbsp PB2.</li>\n<li>Into each Maggie jar: 2½ tbsp (15 g) oats, ¾ scoop vanilla protein\npowder and 1½ tbsp PB2.</li>\n<li>Stir the dry mix in each jar.</li>\n<li>Pour ½ cup (120 ml) Fairlife into each Rob jar and ½ cup (100 ml)\nFairlife into each Maggie jar. Stir until there are no clumps.</li>\n<li>Add ⅔ cup (150 g) Greek yogurt to each Rob jar and ½ cup (100 g)\nGreek yogurt to each Maggie jar. Stir until smooth.</li>\n<li>Put the lids on and refrigerate overnight.</li>\n<li><strong>Divide.</strong> Rob: his 2 jars (Tue, Thu); each morning\ntop with ½ banana (60 g), sliced. Maggie: her 2 jars (Tue, Thu); each\nmorning top with ½ banana (50 g), sliced. <strong>Store:</strong> All 4\njars in the fridge (Tue, Thu). They keep 5 days.</li>\n</ol>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>437</td>\n<td>55 g</td>\n<td>44 g</td>\n<td>5 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>340</td>\n<td>43 g</td>\n<td>34 g</td>\n<td>4 g</td>\n</tr>\n</tbody>\n</table>\n","4:D_quesadilla":"<p><span class=\"tag\">Sunday prep: bag and freeze the raw\nchicken</span></p>\n<p><strong>Ingredients</strong></p>\n<ul>\n<li>12¾ oz (360 g) chicken breast</li>\n<li>Seasoning: ½ tsp chili powder, ½ tsp cumin, ¼ tsp garlic powder, ¼\ntsp salt</li>\n<li>¾ red bell pepper (120 g)</li>\n<li>⅓ yellow onion (60 g)</li>\n<li>1 tsp olive oil</li>\n<li>3 large (10-inch) low-carb tortillas: 2 for Rob, 1 for Maggie</li>\n<li>½ cup (55 g) shredded Mexican-blend cheese</li>\n<li>Pico: 1⅔ Roma tomatoes (120 g), 1 tbsp chopped fresh cilantro, juice\nof ½ lime, a pinch of salt</li>\n<li>⅓ cup (70 g) plain nonfat Greek yogurt</li>\n<li>4 tbsp jarred salsa</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>The night before (Monday), move the raw chicken from the freezer to\nthe fridge.</li>\n<li>Season the chicken and air-fry at 400°F for 14 minutes, until 165°F.\nRest 5 minutes and slice thin.</li>\n<li>Slice the pepper and onion. Cook them in the olive oil in a skillet\nover medium-high, 6 minutes. Move to a plate and wipe the skillet.</li>\n<li>Pico: dice the tomatoes and mix with the cilantro, lime juice and\nsalt.</li>\n<li>On half of each tortilla, layer cheese, chicken and peppers: ¼ cup\n(30 g) Mexican-blend cheese and 5¼ oz (150 g) cooked chicken split\nacross Rob's 2; ¼ cup (25 g) Mexican-blend cheese and 4¼ oz (120 g)\ncooked chicken on Maggie's. Fold over.</li>\n<li>Toast in the dry skillet over medium, 2 to 3 minutes a side, until\ngolden and melted. Cut into wedges.</li>\n<li><strong>Divide.</strong> Rob: his 2 quesadillas with half the pico,\n3 tbsp (40 g) Greek yogurt as crema and 2 tbsp salsa. Maggie: her\nquesadilla with half the pico, 2 tbsp (30 g) Greek yogurt as crema and 2\ntbsp salsa.</li>\n</ol>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>645</td>\n<td>71 g</td>\n<td>69 g</td>\n<td>22 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>458</td>\n<td>53 g</td>\n<td>41 g</td>\n<td>15 g</td>\n</tr>\n</tbody>\n</table>\n","4:snack2:S_eggs":"<p><b>Rob's shake:</b> 1 scoop Tripact PB & vanilla protein, 240 ml (1 cup) Fairlife fat-free milk, 2 cups of raw baby spinach, 1 tbsp ground flax, 1 scoop collagen, plus 3 to 5 g creatine. Blend until smooth. 272 cal, 45 g protein, 13 g carbs.</p><p><b>Maggie (edamame + egg):</b> 85 g frozen shelled edamame (about ½ cup), 1 egg. 174 cal, 16 g protein, 8 g carbs.</p>","4:D_bolognese":"<p><span class=\"tag\">Sunday prep: bag and freeze the raw beef</span></p>\n<p><strong>Ingredients</strong></p>\n<ul>\n<li>12 oz (340 g) 93% lean ground beef</li>\n<li>⅓ yellow onion (60 g)</li>\n<li>1 medium carrot (60 g)</li>\n<li>1 garlic clove (minced)</li>\n<li>½ tsp Italian seasoning and ¼ tsp salt</li>\n<li>1 cup (275 g) marinara</li>\n<li>2¾ oz (75 g) dry spaghetti, plus 1 tbsp salt for the water</li>\n<li>3 tbsp (14 g) grated parmesan</li>\n<li>Maggie's salad: 1⅔ cups (75 g) chopped romaine, 1 cup (30 g) baby\nspinach, 2 tbsp light balsamic vinaigrette</li>\n<li>Cooking spray</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>The night before (Tuesday), move the raw beef from the freezer to\nthe fridge.</li>\n<li>Bring a pot of water with 1 tbsp salt to a boil.</li>\n<li>Finely dice the onion and carrot.</li>\n<li>Heat a skillet over high until very hot. Brown the beef 3 minutes\nwithout stirring, then add the onion, carrot, garlic and Italian\nseasoning and cook 4 to 5 minutes more. If liquid pools in the pan,\nspoon or pour it off and keep cooking on high until the meat browns.\nStir in the salt.</li>\n<li>Add the marinara and simmer 10 minutes.</li>\n<li>Cook the spaghetti as the package says and drain.</li>\n<li>Toss Maggie's salad with the vinaigrette.</li>\n<li><strong>Divide.</strong> Rob: 1 cup cooked spaghetti (2 oz dry)\ntopped with 1 cup (150 g) cooked beef in sauce (a bit more than half the\npot) and 1½ tbsp (8 g) parmesan. Maggie: ⅓ cup cooked spaghetti (¾ oz\ndry) topped with ¾ cup (105 g) cooked beef in sauce (the rest of the\npot), 1 tbsp (6 g) parmesan and her salad.</li>\n</ol>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>646</td>\n<td>55 g</td>\n<td>58 g</td>\n<td>21 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>468</td>\n<td>38 g</td>\n<td>36 g</td>\n<td>19 g</td>\n</tr>\n</tbody>\n</table>\n","4:snack2:S_cottage":"<p><b>Rob's shake:</b> 1 scoop Tripact PB & vanilla protein, 240 ml (1 cup) Fairlife fat-free milk, 2 cups of raw baby spinach, 1 tbsp ground flax, 1 scoop collagen, plus 3 to 5 g creatine. Blend until smooth. 272 cal, 45 g protein, 13 g carbs.</p><p><b>Maggie (cottage cheese ranch dip):</b> 170 g 2% cottage cheese (about ¾ cup), 100 g yellow or orange bell pepper (about ⅔ pepper), 75 g English cucumber (about ¼ cucumber), with 1 tsp ranch seasoning stirred into the cottage cheese. 180 cal, 20 g protein, 16 g carbs.</p>","4:L_lasagna":"<p><span class=\"tag\">Sunday prep: the whole batch</span></p>\n<p><em>Makes one 9x13 pan, 8 pieces.</em></p>\n<p><strong>Ingredients</strong></p>\n<ul>\n<li>1½ lb (680 g) 93% lean ground beef</li>\n<li>½ tsp salt and 1 tsp Italian seasoning</li>\n<li>2 jars (24 oz each) marinara</li>\n<li>24 oz (680 g) 2% cottage cheese</li>\n<li>1 large egg</li>\n<li>¼ cup (1 oz) grated parmesan</li>\n<li>½ tsp garlic powder and ¼ tsp black pepper</li>\n<li>12 oz (340 g) lasagna noodles, about 12</li>\n<li>2 medium zucchini (400 g)</li>\n<li>2 cups (8 oz) shredded part-skim mozzarella</li>\n<li>1 tbsp salt for the water, cooking spray and foil</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Bring a big pot of water and 1 tbsp salt to a boil. Cook the noodles\n2 minutes less than the package says. Drain and lay them flat on a\nsprayed sheet pan.</li>\n<li>Heat a large skillet over high. Brown the beef with the Italian\nseasoning, 8 minutes, leaving it alone for the first 3 so it browns. If\nliquid pools in the pan, spoon or pour it off and keep cooking on high\nuntil the meat browns. Then stir in the salt and both jars of\nmarinara.</li>\n<li>Mix the cottage cheese, egg, parmesan, garlic powder and pepper in a\nbowl.</li>\n<li>Slice the zucchini lengthwise into thin strips (about ⅛ inch).</li>\n<li>Heat the oven to 375°F and spray a 9x13 pan.</li>\n<li>Spread a thin layer of meat sauce in the pan. Then layer: 4 noodles,\na third of the cottage mix, a third of the zucchini, a third of the\nremaining sauce, a third of the mozzarella.</li>\n<li>Repeat the layers two more times, ending with sauce and\nmozzarella.</li>\n<li>Cover with sprayed foil and bake 30 minutes. Uncover and bake 15\nmore. Rest 15 minutes.</li>\n<li>Cut the pan into 4 equal strips across the short side. Cut each\nstrip into a bigger piece for Rob (a little more than half) and a\nsmaller one for Maggie.</li>\n<li><strong>Divide.</strong> Rob: 4 containers, each 1 piece (about 520\ng). Maggie: 4 containers, each 1 piece (about 380 g).\n<strong>Store:</strong> All 8 containers in the freezer. Wednesday\nnight, move 4 to the fridge (Thu, Fri); Friday night, move the other 4\n(Sat, Sun). Reheat covered, 2½ to 3 minutes. Cooked food keeps 3 to 4\ndays in the fridge, which is why these start frozen.</li>\n</ol>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>596</td>\n<td>47 g</td>\n<td>53 g</td>\n<td>21 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>435</td>\n<td>35 g</td>\n<td>39 g</td>\n<td>15 g</td>\n</tr>\n</tbody>\n</table>\n","4:D_teriyaki":"<p><span class=\"tag\">Sunday prep: bag and freeze the raw\nchicken</span></p>\n<p><strong>Ingredients</strong></p>\n<ul>\n<li>13½ oz (385 g) chicken breast</li>\n<li>A pinch of salt</li>\n<li>1½ tsp olive oil</li>\n<li>4½ tbsp low-sodium teriyaki sauce</li>\n<li>1 cup (180 g) pineapple chunks</li>\n<li>2⅓ cups (150 g) snap peas</li>\n<li>½ cup (90 g) frozen shelled edamame, thawed</li>\n<li>¾ red bell pepper (120 g), sliced</li>\n<li>⅓ cup dry white rice</li>\n<li>Cooking spray</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>The night before (Wednesday), move the raw chicken from the freezer\nto the fridge.</li>\n<li>Cook the rice: bring ⅓ cup dry white rice and ⅔ cup water to a boil,\ncover, turn the heat to low and simmer 15 minutes, then let it sit 5\nminutes off the heat and fluff with a fork. (A microwave rice pouch\nworks too.)</li>\n<li>Cut the chicken into 1-inch cubes and season with the salt.</li>\n<li>Heat the olive oil in a skillet over medium-high. Cook the chicken 6\nto 7 minutes, until 165°F.</li>\n<li>Add the teriyaki sauce and pineapple and simmer 2 minutes.</li>\n<li>In a second sprayed pan over high, stir-fry the snap peas, pepper\nand edamame with a pinch of salt, 3 minutes.</li>\n<li><strong>Divide.</strong> Rob: 6 oz (170 g) cooked chicken with a bit\nmore than half the pineapple and sauce, ¾ cup (125 g) rice and half the\nvegetables. Maggie: 4¼ oz (120 g) cooked chicken with the rest of the\npineapple and sauce, ⅓ cup (60 g) rice and half the vegetables.</li>\n</ol>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>651</td>\n<td>64 g</td>\n<td>68 g</td>\n<td>13 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>472</td>\n<td>48 g</td>\n<td>46 g</td>\n<td>10 g</td>\n</tr>\n</tbody>\n</table>\n","4:D_smashburger":"<p><span class=\"tag\">Sunday prep: burger sauce, and bag and freeze the\nraw beef</span></p>\n<p><strong>Ingredients</strong></p>\n<ul>\n<li>12 oz (340 g) 95% lean ground beef</li>\n<li>¼ tsp each salt, black pepper and garlic powder</li>\n<li>3 slices American cheese: 2 for Rob, 1 for Maggie</li>\n<li>2 whole-wheat sandwich thins</li>\n<li>5 tbsp burger sauce (the quarter batch from Sunday)</li>\n<li>¼ cup (40 g) dill pickle chips</li>\n<li>¼ white onion (40 g), sliced thin</li>\n<li>¾ cup (40 g) shredded romaine</li>\n<li>1 medium Yukon gold potato (160 g), 1½ tsp olive oil, a pinch of\nsalt</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>The night before (Thursday), move the raw beef from the freezer to\nthe fridge.</li>\n<li>Cut the potato into ¼-inch fries and toss with the olive oil and\nsalt. Air-fry at 400°F for 18 to 20 minutes, shaking twice.</li>\n<li>Divide the beef into 4 balls: Rob's two of 100 g, Maggie's two of 70\ng.</li>\n<li>Heat a cast-iron skillet over high for 3 minutes, until\nsmoking.</li>\n<li>Add 2 balls and smash each flat with a sturdy spatula (a square of\nparchment on top keeps it from sticking). Season with the salt, pepper\nand garlic powder.</li>\n<li>Cook 2 minutes, until crusty. Flip, add the cheese (Rob's 2 patties\nget a slice each, one of Maggie's gets her slice) and cook 30\nseconds.</li>\n<li>Repeat with the other 2 balls.</li>\n<li>Toast the sandwich thins.</li>\n<li><strong>Divide.</strong> Rob: his double cheeseburger on a sandwich\nthin with 3 tbsp burger sauce, 2 tbsp (20 g) pickle chips, 2 tbsp diced\nwhite onion (20 g) and ½ cup (20 g) romaine, plus ¾ cup fries (60 g\ncooked). Maggie: her double cheeseburger on a sandwich thin with 2 tbsp\nburger sauce, 2 tbsp (20 g) pickle chips, 2 tbsp diced white onion (20\ng) and ½ cup (20 g) romaine, plus ⅔ cup fries (55 g cooked).</li>\n</ol>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>649</td>\n<td>59 g</td>\n<td>46 g</td>\n<td>26 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>477</td>\n<td>42 g</td>\n<td>42 g</td>\n<td>17 g</td>\n</tr>\n</tbody>\n</table>\n","4:snack2:S_jerky":"<p><b>Rob's shake:</b> 1 scoop Tripact PB & vanilla protein, 240 ml (1 cup) Fairlife fat-free milk, 2 cups of raw baby spinach, 1 tbsp ground flax, 1 scoop collagen, plus 3 to 5 g creatine. Blend until smooth. 272 cal, 45 g protein, 13 g carbs.</p><p><b>Maggie (jerky + apple):</b> 28 g (1 oz) original beef jerky, 180 g Honeycrisp apple (about 1 apple). 174 cal, 11 g protein, 31 g carbs.</p>","4:B_kodiak_apple":"<p><strong>Ingredients</strong></p>\n<ul>\n<li>1 cup (115 g) Kodiak Power Cakes mix</li>\n<li>¾ cup (175 g) liquid egg whites</li>\n<li>½ cup (100 ml) Fairlife fat-free milk</li>\n<li>1 tsp cinnamon</li>\n<li>1 Honeycrisp apple (220 g)</li>\n<li>¾ cup (175 g) plain nonfat Greek yogurt</li>\n<li>2 tbsp sugar-free maple syrup</li>\n<li>Cooking spray</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Cinnamon apples: dice the apple, then cook it in a sprayed pan over\nmedium with ½ tsp cinnamon, 4 to 5 minutes, until soft. Set aside.</li>\n<li>Rob's batter: whisk ⅔ cup (65 g) Kodiak mix, ⅓ cup (100 g) egg\nwhites, ¼ cup (60 ml) Fairlife and ¼ tsp cinnamon until just\ncombined.</li>\n<li>Maggie's batter: whisk ½ cup (50 g) Kodiak mix, ⅓ cup (75 g) egg\nwhites, 2½ tbsp (40 ml) Fairlife and ¼ tsp cinnamon.</li>\n<li>Heat a large nonstick pan over medium and spray it. Pour ¼-cup\npancakes and cook 2 minutes a side.</li>\n<li>Cook Rob's batter first and keep it warm in a 200°F oven, then cook\nMaggie's.</li>\n<li><strong>Divide.</strong> Rob: his pancakes topped with a bit more\nthan half the cinnamon apples, ½ cup (100 g) Greek yogurt and 1 tbsp\nsugar-free maple syrup. Maggie: her pancakes topped with the rest of the\napples, ⅓ cup (75 g) Greek yogurt and 1 tbsp sugar-free maple\nsyrup.</li>\n</ol>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>436</td>\n<td>42 g</td>\n<td>62 g</td>\n<td>3 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>337</td>\n<td>32 g</td>\n<td>49 g</td>\n<td>3 g</td>\n</tr>\n</tbody>\n</table>\n","4:D_porkchop":"<p><span class=\"tag\">Sunday prep: bag and freeze the raw pork\nchops</span></p>\n<p><strong>Ingredients</strong></p>\n<ul>\n<li>2 boneless pork chops: 8 oz for Rob, 5¾ oz for Maggie</li>\n<li>Seasoning: ½ tsp salt, ¼ tsp black pepper, ½ tsp garlic powder, ½\ntsp smoked paprika</li>\n<li>1 Honeycrisp apple (220 g), ½ tsp cinnamon, 2 tbsp water</li>\n<li>4¼ cups (375 g) Brussels sprouts</li>\n<li>2½ tsp olive oil</li>\n<li>¼ tsp salt for the sprouts</li>\n<li>1½ medium Yukon gold potatoes (235 g)</li>\n<li>Mash: 2½ tbsp (35 g) plain nonfat Greek yogurt and a pinch of\nsalt</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>The night before (Friday), move the raw pork chops from the freezer\nto the fridge.</li>\n<li>Peel and cube the potatoes. Put them in a pot of cold salted water,\nbring to a boil and cook 12 minutes, until tender. Drain and mash with\nthe yogurt and salt.</li>\n<li>Halve the Brussels sprouts, toss with 1½ tsp of the olive oil and\nthe salt, and air-fry at 400°F for 15 to 18 minutes, shaking once.</li>\n<li>Season the chops on both sides.</li>\n<li>Heat the last 1 tsp olive oil in a skillet over medium-high. Sear\nthe chops 4 minutes a side, until 145°F. Rest 5 minutes.</li>\n<li>Slice the apple. In the same skillet over medium, cook it with the\ncinnamon and water 4 to 5 minutes, until soft.</li>\n<li><strong>Divide.</strong> Rob: a pork chop of about 6 oz (170 g)\ncooked, ⅔ cup mashed potatoes (from 145 g Yukon gold, ¾ medium) and a\nbit more than half the apples and Brussels sprouts. Maggie: a pork chop\nof about 4¼ oz (120 g) cooked, ½ cup mashed potatoes (from 90 g Yukon\ngold, ½ medium) and the rest of the apples and Brussels sprouts.</li>\n</ol>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>649</td>\n<td>60 g</td>\n<td>61 g</td>\n<td>21 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>474</td>\n<td>44 g</td>\n<td>46 g</td>\n<td>15 g</td>\n</tr>\n</tbody>\n</table>\n","4:B_steakegg":"<p><strong>Ingredients</strong></p>\n<ul>\n<li>6 oz (170 g) sirloin: 3½ oz (100 g) for Rob, 2½ oz (70 g) for\nMaggie</li>\n<li>A pinch each of salt and pepper for the steak</li>\n<li>1 medium Yukon gold potato (180 g)</li>\n<li>⅔ green bell pepper (100 g), diced</li>\n<li>1 tsp olive oil</li>\n<li>¼ tsp salt and ¼ tsp garlic powder</li>\n<li>4 large eggs</li>\n<li>¼ cup (60 g) liquid egg whites (Rob)</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Dice the potato into ½-inch cubes and microwave in a covered bowl 3\nminutes.</li>\n<li>Heat the olive oil in a 12-inch nonstick skillet over medium-high.\nAdd the potatoes, pepper, salt and garlic powder and cook 6 minutes,\nuntil crisp.</li>\n<li>Dice the steak into ½-inch pieces and season with the salt and\npepper.</li>\n<li>Push the potatoes to the edges. Sear the steak in two piles, Rob's\nand Maggie's, 2 minutes.</li>\n<li>Whisk Rob's eggs (2 eggs plus the egg whites) and Maggie's (2 eggs)\nin separate bowls.</li>\n<li>Turn the heat to medium. Pour Rob's eggs over his steak pile and\nMaggie's over hers, and scramble each side 2 minutes, until just\nset.</li>\n<li><strong>Divide.</strong> Rob: his scramble with half the potatoes\nand peppers. Maggie: her scramble with half the potatoes and\npeppers.</li>\n</ol>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>429</td>\n<td>44 g</td>\n<td>21 g</td>\n<td>18 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>339</td>\n<td>30 g</td>\n<td>19 g</td>\n<td>16 g</td>\n</tr>\n</tbody>\n</table>\n","4:D_potpie":"<p><span class=\"tag\">Sunday prep: bag and freeze the raw\nchicken</span></p>\n<p><strong>Ingredients</strong></p>\n<ul>\n<li>13½ oz (385 g) chicken breast</li>\n<li>½ yellow onion (80 g)</li>\n<li>1 celery rib (50 g)</li>\n<li>1⅔ medium carrots (100 g)</li>\n<li>1½ tsp olive oil and ¼ tsp salt</li>\n<li>2½ tbsp (18 g) all-purpose flour</li>\n<li>1 cup low-sodium chicken broth</li>\n<li>⅔ cup (160 ml) Fairlife fat-free milk</li>\n<li>½ tsp Italian seasoning, 1 garlic clove (minced), ¼ tsp black\npepper</li>\n<li>1 medium Yukon gold potato (165 g)</li>\n<li>⅔ cup (100 g) frozen peas</li>\n<li>3½ sheets phyllo dough</li>\n<li>Cooking spray and two small baking dishes</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>The night before (Saturday), move the raw chicken from the freezer\nto the fridge.</li>\n<li>Heat the oven to 400°F.</li>\n<li>Dice the onion, celery and carrots. Dice the chicken into ¾-inch\npieces.</li>\n<li>Dice the potato and microwave it in a covered bowl 3 minutes.</li>\n<li>Heat the olive oil in a deep skillet over medium. Cook the onion,\ncelery and carrots with the salt, 5 minutes.</li>\n<li>Stir in the flour and cook 1 minute.</li>\n<li>Add the broth, Fairlife, Italian seasoning, garlic and pepper.\nSimmer 3 to 4 minutes, until thick.</li>\n<li>Add the chicken and simmer 8 minutes, until cooked through. Stir in\nthe potatoes and peas for 1 minute.</li>\n<li>Spoon a little more than half the filling (about 3 parts to 2) into\nRob's dish and the rest into Maggie's.</li>\n<li>Crumple the phyllo on top (Rob 2 sheets, Maggie 1½), spray it and\nbake 12 to 15 minutes, until golden.</li>\n<li><strong>Divide.</strong> Rob: his pot pie, with 6 oz (170 g) cooked\nchicken. Maggie: her pot pie, with 4¼ oz (120 g) cooked chicken.</li>\n</ol>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>649</td>\n<td>65 g</td>\n<td>65 g</td>\n<td>13 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>476</td>\n<td>47 g</td>\n<td>48 g</td>\n<td>9 g</td>\n</tr>\n</tbody>\n</table>\n"},"groceries":{"1":[["Meat and eggs",["Boneless skinless chicken breast, about 6.5 lb","95% lean ground beef, 3.5 lb","Top sirloin (USDA Choice), about 2 lb","Trader Joe's chicken breakfast sausage, 2 packages (24 links): 18 for the burritos; freeze the other 6 for next Sunday's hash","Turkey pepperoni, 1 package","Original beef jerky, 1 bag (Maggie uses 1 oz a week)","Omega-3 (DHA) eggs, 1 dozen (you need 11)","Liquid egg whites, 1 × 32-oz carton"]],["Dairy",["Plain nonfat Greek yogurt, 5 × 32-oz tubs","2% cottage cheese, 2 × 24-oz tubs","Fairlife fat-free milk, 2 × 52-oz bottles","Shredded reduced-fat cheddar, 2 × 8-oz bag","Shredded part-skim mozzarella, 1 × 8-oz bag (pizza night)","Crumbled feta, 1 × 4-oz container","Grated parmesan, 1 small tub (about 3 oz)","Provolone, 3 deli slices"]],["Produce",["Baby spinach, one 16-oz clamshell","Romaine hearts, 3 × 3-pack","Brussels sprouts, 1 lb","Snap peas, 1 lb","Broccoli florets, 1 lb","Bell peppers, 7: 3 green (Philly bowls); 2 yellow or orange (Maggie's snack, pizza night); 2 red (breakfast burritos)","Onions, 3: 2 yellow (pizza night, Philly bowls, breakfast burritos); 1 white (Big Mac bowls, smash tacos)","Roma tomatoes, 6 (Big Mac bowls, shawarma)","English (seedless) cucumbers, 2","Zucchini, 1 medium","Yukon gold potatoes, 3.5 lb","Bananas, 3","Honeycrisp apples, 2","Garlic, 1 head (about 5 cloves this week)","Fresh ginger, one 2- to 3-inch piece (about 1 tbsp grated this week; freeze the rest)","Lemons, 1"]],["Frozen",["Mixed berries (Maggie), 1 bag","Shelled edamame, 1 × 12-oz bag"]],["Pantry and other",["Elbow pasta, 1 lb box (mac); spaghetti, 1 box (keeps for lat nd bake 22 to 25\nmin.","Sauté 3 sliced peppers and an onion. Char the corn in a dry pan with\nTajín. Rinse the black beans.","Slice the chicken and pack 6 <strong>burrito bowls</strong>, with the\nromaine, salsa and yogurt crema in small containers.","Portion the <strong>chili</strong>: Rob 2¼ cups, Maggie 1¾ cups, 8\ncontainers into the freezer for Thu to Sun.","Egg bites: Monday's and Wednesday's in the fridge, Friday's in a\nfreezer bag.","Make 4 jars of <strong>banana pudding overnight oats</strong>. Banana\nand wafers go on in the morning.","Hard-boil 3 eggs for Maggie's snacks. Cut the week's vegetables.","Bag, label and freeze the raw dinner proteins for Tue and Thu to Sun.\nMonday's pork tenderloin stays in the fridge."],"3":["Oven to 425°F. Dice 2⅔ lb potatoes for the <strong>ranch\nbake</strong> and 200 g more for the <strong>burritos</strong>. Toss\nwith oil and roast (25 min and 20 min).","Season 2¾ lb raw chicken for the ranch bake (1 tsp each salt, garlic\npowder and paprika, ½ tsp pepper) and bake it on the other rack, 18 to\n22 min.","Start 1 cup dry rice for the <strong>Korean beef bowls</strong>.","Cook 8 slices of turkey bacon. Blanch 300 g green beans for 3\nmin.","Brown 1 lb turkey into <strong>chorizo</strong> with the spices and\nvinegar. Set aside.","Scramble 6 eggs with the whites, fold in the chorizo, potatoes and\nonion. Roll 6 burritos (9 with 8-inch wraps) and wrap in foil: Friday's\ngo in the freezer, the rest in the fridge.","Same pan: brown 2¼ lb beef with garlic and ginger, then stir in the\nKorean sauce.","Quick-pickle the sliced cucumber and shredded carrot in rice vinegar.\nThaw the edamame.","Pack 6 <strong>Korean beef bowls</strong>; Maggie's go on a bed of\nspinach.","Assemble the <strong>ranch bake</strong> (potatoes, diced chicken,\nbacon, green beans, sauce, cheddar on top) and bake at 375°F for 20\nmin.","Portion the ranch bake: 8 containers (4 Rob, 4 Maggie) into the\nfreezer for Thu to Sun.","Make 4 jars of <strong>apple const DAYS = DATA.days, N = DAYS.length;
const SHORT = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const pad = n => String(n).padStart(2,'0');
const iso = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const idxOf = s => DAYS.findIndex(d => d.date === s);
function todayIdx(){ const t = iso(new Date()); const i = idxOf(t);
  if (i >= 0) return i; return t < DAYS[0].date ? 0 : N-1; }
const store = {
  get(k){ try { return localStorage.getItem('mmp|'+k) === '1'; } catch(e){ return false; } },
  set(k,v){ try { v ? localStorage.setItem('mmp|'+k,'1') : localStorage.removeItem('mmp|'+k); } catch(e){} }
};
let state = { tab:'meals', i: todayIdx() };
(function fromHash(){
  const m = location.hash.match(/^#(meals|rob|mag)(?:\/(\d{4}-\d{2}-\d{2}))?/);
  if (m){ state.tab = m[1]; if (m[2] && idxOf(m[2]) >= 0) state.i = idxOf(m[2]); }
})();
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const fmt = n => n.toLocaleString('en-US');

function checkRow(key, html, cls){
  const row = el('label', cls || 'check'); const cb = el('input'); cb.type = 'checkbox';
  cb.checked = store.get(key); if (cb.checked) row.classList.add('done');
  cb.addEventListener('change', () => { store.set(key, cb.checked); row.classList.toggle('done', cb.checked); });
  const l = el('span','lbl'); l.innerHTML = html; row.append(cb, l); return row;
}

function renderMeals(d, main){
  if (d.holiday){ main.append(el('div','banner', d.holiday + ': one plate at the holiday meal, then back on the plan tomorrow morning.')); }
  const tots = el('div','totals');
  [['R','Rob'],['M','Maggie']].forEach(([p,who]) => {
    const t = DATA.menu[d.menu].tot[p], box = el('div','tot '+p);
    box.append(el('b', null, who), document.createTextNode(fmt(t[0])+' cal · '+t[3]+' g carbs · '+t[1]+' g protein'));
    tots.append(box);
  });
  main.append(tots);
  DATA.menu[d.menu].meals.forEach(ml => {
    const c = el('div','card');
    const h = el('div','chead'); h.append(el('span','slot', ml.slot)); if (ml.badge) h.append(el('span','badge', ml.badge)); c.append(h);
    const R = ml.R, M = ml.M, same = R.name === M.name;
    if (same) c.append(el('div','dish', R.name));
    if (same && R.help && R.help === M.help) c.append(el('div','help', R.help));
    const ppl = el('div','people');
    [['R','Rob',R],['M','Maggie',M]].forEach(([p,who,x]) => {
      const row = el('div','pp '+p); row.append(el('span','who '+p, who));
      const t = el('div','t');
      if (!same) t.append(el('div','n', x.name));
      if (x.help && !(same && R.help === M.help)) t.append(el('div','help', x.help));
      if (x.portion) t.append(el('div','portion', x.portion));
      const mac = el('div','mac');
      mac.innerHTML = x.cal+' cal · '+x.pro+' g protein · <b>'+x.carbs+' g carbs</b> · '+x.fat+' g fat';
      t.append(mac); row.append(t); ppl.append(row);
    });
    c.append(ppl);
    const det = el('details'); det.append(el('summary', null, ml.slot.startsWith('Snack 2') ? 'What to make' : 'Recipe'));
    const rc = el('div','recipe'); rc.innerHTML = DATA.recipes[ml.recipe] || ''; det.append(rc); c.append(det);
    main.append(c);
  });
  main.append(el('h2','sec','Reminders for tonight'));
  const tn = el('div','card');
  d.tonight.forEach((r, j) => {
    const key = d.date+'|night|'+j, row = el('div','rem');
    row.append(el('span','num', (j+1)+'.'));
    const rb = el('div','rb'), lab = el('label'), cb = el('input'); cb.type = 'checkbox';
    cb.checked = store.get(key); if (cb.checked) row.classList.add('done');
    cb.addEventListener('change', () => { store.set(key, cb.checked); row.classList.toggle('done', cb.checked); });
    lab.append(cb, el('span','rt', r.text)); rb.append(lab);
    if (r.recipe){ const det = el('details'); det.append(el('summary', null, 'Recipe'));
      const rc = el('div','recipe'); rc.innerHTML = DATA.recipes[r.recipe] || ''; det.append(rc); rb.append(det); }
    row.append(rb); tn.append(row);
  });
  main.append(tn);
  if (d.prep){
    const m = d.prep;
    main.append(el('h2','sec','Sunday prep for next week'));
    const c = el('div','card');
    c.append(el('div','help', 'Made today: ' + DATA.made[m] + ' About 2 to 2½ hours with two people.'));
    const d1 = el('details'); d1.append(el('summary', null, 'Step by step'));
    const ol = el('ol','ops'); DATA.ops[m].forEach(s => { const li = el('li'); li.innerHTML = s; ol.append(li); }); d1.append(ol); c.append(d1);
    const d2 = el('details'); d2.append(el('summary', null, 'Grocery list'));
    DATA.groceries[m].forEach(([sec, items], si) => {
      d2.append(el('div','gsec', sec));
      items.forEach((it, j) => d2.append(checkRow(d.date+'|groc|'+si+'|'+j, it.replace(/&/g,'&amp;').replace(/</g,'&lt;'))));
    });
    c.append(d2); main.append(c);
  }
}

function renderWorkout(d, who, main){
  const w = d.work[who];
  const box = el('div', who === 'Rob' ? 'rob' : 'mag');
  if (!w){
    const c = el('div','card rest'); c.append(el('b', null, 'Rest day')); c.append(document.createTextNode('No workout today. Tomorrow starts week '+(d.w+1 <= 12 ? d.w+1 : d.w)+'.'));
    box.append(c); main.append(box); return;
  }
  const head = el('div','card');
  head.append(el('h2','wtitle', w.title));
  const phase = d.w <= 4 ? 1 : d.w <= 8 ? 2 : 3;
  head.append(el('div','wmeta', 'Week '+d.w+' of 12 · Phase '+phase + (d.w === 7 ? ' · Christmas week: lighter, 2 working sets' : '')));
  if (w.warm) head.append(el('div','warm', 'Warm-up: '+w.warm));
  box.append(head);
  let anyMissing = false;
  w.sections.forEach((s, si) => {
    if (s.name) box.append(el('h2','sec', s.name));
    const c = el('div','card');
    s.items.forEach((x, j) => {
      const key = d.date+'|'+who+'|'+si+'|'+j;
      const row = el('label','ex'); const cb = el('input'); cb.type = 'checkbox'; cb.checked = store.get(key);
      if (cb.checked) row.classList.add('done');
      cb.addEventListener('change', () => { store.set(key, cb.checked); row.classList.toggle('done', cb.checked); });
      const body = el('div','body'); const nm = el('div','nm');
      if (x.main){ nm.append(el('span','main','Main lift')); }
      nm.append(document.createTextNode(x.name)); body.append(nm);
      if (x.wu) body.append(el('div','sub', x.wu));
      const rx = el('div','rx'); rx.append(el('div','s', x.scheme));
      if (x.weight) rx.append(el('div','w', x.weight));
      if (x.video){ const a = el('a','howto','▶ How to'); a.href = x.video; a.target = '_blank'; a.rel = 'noopener';
        a.addEventListener('click', ev => ev.stopPropagation()); rx.append(a); }
      else if (!/sec|Record|stretch|minutes|rounds/.test(x.scheme+x.name) && !/BW|bodyweight/.test(x.weight)) anyMissing = true;
      row.append(cb, body, rx); c.append(row);
    });
    box.append(c);
  });
  if (anyMissing) box.append(el('div','note','No weight shown yet? Weights for each week get filled in at the Sunday check-in. Dumbbell weights are per hand.'));
  main.append(box);
}

function render(){
  const d = DAYS[state.i], main = document.getElementById('main');
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', t.dataset.tab === state.tab));
  document.getElementById('dtitle').textContent = d.label;
  const ti = todayIdx();
  const sub = document.getElementById('dsub'); sub.textContent = 'Week '+d.w+' of 12';
  if (state.i === ti) sub.append(el('span','todaypill','Today'));
  else { const b = el('button','gotoday','Go to today'); b.onclick = () => go(ti); sub.append(b); }
  document.getElementById('prev').disabled = state.i === 0;
  document.getElementById('next').disabled = state.i === N-1;
  const strip = document.getElementById('strip'); strip.innerHTML = '';
  const mon = state.i - d.i;
  for (let k = 0; k < 7; k++){
    const j = mon + k; if (j < 0 || j >= N) continue;
    const b = el('button', (j === state.i ? 'on ' : '') + (j === ti ? 'today' : ''));
    b.append(document.createTextNode(SHORT[k])); b.append(el('b', null, String(+DAYS[j].date.slice(8))));
    b.onclick = () => go(j); strip.append(b);
  }
  main.innerHTML = '';
  if (state.tab === 'meals') renderMeals(d, main);
  else renderWorkout(d, state.tab === 'rob' ? 'Rob' : 'Maggie', main);
  history.replaceState(null, '', '#'+state.tab+'/'+d.date);
}
function go(i){ state.i = Math.max(0, Math.min(N-1, i)); render(); window.scrollTo(0,0); }
document.getElementById('prev').onclick = () => go(state.i-1);
document.getElementById('next').onclick = () => go(state.i+1);
document.querySelectorAll('.tab').forEach(t => t.onclick = () => { state.tab = t.dataset.tab; render(); window.scrollTo(0,0); });
document.getElementById('span').textContent = 'Nov 9 – Jan 31';
let sx = null, sy = null;
document.addEventListener('touchstart', e => { if (e.touches.length === 1){ sx = e.touches[0].clientX; sy = e.touches[0].clientY; } }, {passive:true});
document.addEventListener('touchend', e => {
  if (sx === null) return; const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; sx = null;
  if (Math.abs(dx) > 70 && Math.abs(dy) < 45 && !(window.getSelection && String(window.getSelection()))) go(state.i + (dx < 0 ? 1 : -1));
}, {passive:true});
render();
</script>
</body>
