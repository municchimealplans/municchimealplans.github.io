<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Meal Plans">
<meta name="theme-color" content="#f5f2ec">
<title>Municchi Meal Plans</title>
<style>
:root{
  --bg:#f5f2ec; --card:#fffdf9; --ink:#1f1d1a; --muted:#6f6a62; --line:#e6e0d6;
  --rob:#1f4e79; --rob-soft:#e3ecf5; --mag:#b5531a; --mag-soft:#f8e6da;
  --accent:#2f6b4f; --accent-soft:#e2efe7; --tag:#fff0b8; --warn:#fdeccc;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#161513; --card:#201e1b; --ink:#f1ede6; --muted:#a59e93; --line:#35312c;
    --rob:#8db6de; --rob-soft:#1d2a37; --mag:#f0a072; --mag-soft:#3a2518;
    --accent:#7fc4a1; --accent-soft:#1d2e25; --tag:#4a4020; --warn:#3d3020; }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding-bottom:env(safe-area-inset-bottom)}
.wrap{max-width:720px;margin:0 auto;padding:0 14px 40px}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 10px) 0 8px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:0 14px;max-width:720px;margin:0 auto}
.brand h1{font-size:19px;margin:0;letter-spacing:.2px;font-weight:700}
.brand .sub{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:6px;padding:10px 14px 0;max-width:720px;margin:0 auto}
.tab{flex:1.12;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 4px;font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer}
.tab[data-tab=meals]{flex:.76}
.tab[aria-selected=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.datebar{display:flex;align-items:center;gap:8px;padding:10px 14px 0;max-width:720px;margin:0 auto}
.navbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:20px;line-height:1;cursor:pointer}
.navbtn:disabled{opacity:.35}
.dlabel{flex:1;text-align:center}
.dlabel b{display:block;font-size:17px}
.dlabel span{font-size:12px;color:var(--muted)}
.todaypill{background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:12px;border-radius:999px;padding:2px 9px;margin-left:6px}
.gotoday{border:1px solid var(--line);background:var(--card);color:var(--muted);font-size:12px;border-radius:999px;padding:2px 9px;margin-left:6px;cursor:pointer}
.portion{font-size:14px;color:var(--ink);margin-top:2px}
.mac{font-size:13px;color:var(--muted);margin-top:3px}
.mac b{color:var(--ink)}
.pp.R .mac b{color:var(--rob)} .pp.M .mac b{color:var(--mag)}
.rem{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.rem:last-child{border-bottom:none}
.rem .num{font-weight:700;color:var(--accent);min-width:18px;font-size:15px}
.rem .rb{flex:1;min-width:0}
.rem .rb label{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-size:15px}
.rem .rb input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--accent);flex:none}
.rem.done .rt{color:var(--muted);text-decoration:line-through}
.rem details{margin-top:6px;padding-top:6px}
.howto{display:inline-block;margin-top:4px;font-size:12px;font-weight:600;color:var(--accent);text-decoration:none;border:1px solid var(--accent-soft);background:var(--accent-soft);border-radius:999px;padding:2px 8px}
.strip{display:flex;gap:4px;padding:8px 14px 0;max-width:720px;margin:0 auto}
.strip button{flex:1;border:1px solid transparent;background:none;color:var(--muted);border-radius:10px;padding:4px 0;font-size:11px;cursor:pointer}
.strip button b{display:block;font-size:15px;color:var(--ink)}
.strip button.on{background:var(--card);border-color:var(--line)}
.strip button.today b{color:var(--accent)}
.strip button.today{position:relative}
.strip button.today::after{content:"";position:absolute;bottom:2px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--accent)}
main{padding-top:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:0 0 10px}
.banner{background:var(--warn);border-radius:12px;padding:10px 14px;margin-bottom:10px;font-size:14px}
.totals{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.tot{border-radius:12px;padding:8px 12px;font-size:13px}
.tot b{display:block;font-size:15px}
.tot.R{background:var(--rob-soft)} .tot.R b{color:var(--rob)}
.tot.M{background:var(--mag-soft)} .tot.M b{color:var(--mag)}
.chead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.slot{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--muted)}
.badge{font-size:11px;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:2px 8px;white-space:nowrap}
.dish{font-size:17px;font-weight:650;line-height:1.3}
.help{font-size:14px;color:var(--muted);margin-top:1px}
.people{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.pp{display:flex;gap:10px;align-items:flex-start}
.who{font-size:11px;font-weight:700;border-radius:6px;padding:2px 6px;min-width:52px;text-align:center;margin-top:2px}
.who.R{background:var(--rob-soft);color:var(--rob)} .who.M{background:var(--mag-soft);color:var(--mag)}
.pp .t{flex:1;font-size:14px}
.pp .t .n{font-weight:600}
.carbs{font-size:13px;font-weight:700;white-space:nowrap;margin-top:2px}
.carbrow{display:flex;gap:14px;margin-top:8px;font-size:13px}
.carbrow span b{font-weight:700}
.carbrow .R b{color:var(--rob)} .carbrow .M b{color:var(--mag)}
details{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--accent);list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸ ";} details[open]>summary::before{content:"▾ ";}
.recipe{font-size:15px}
.recipe p{margin:.5em 0}
.recipe ul,.recipe ol{padding-left:1.3em;margin:.4em 0}
.recipe li{margin:.25em 0}
.recipe table{border-collapse:collapse;width:100%;font-size:13px;margin:.5em 0}
.recipe th,.recipe td{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left}
.tag{background:var(--tag);border-radius:4px;padding:1px 5px;font-style:normal;font-size:13px}
h2.sec{font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:18px 2px 8px}
.check{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line);font-size:15px;cursor:pointer}
.check:last-child{border-bottom:none}
.check input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--accent);flex:none}
.check.done .lbl{color:var(--muted);text-decoration:line-through}
.gsec{font-weight:700;font-size:13px;margin:12px 0 2px;color:var(--muted)}
ol.ops{padding-left:1.4em;margin:.3em 0} ol.ops li{margin:.35em 0;font-size:15px}
.wtitle{font-size:20px;font-weight:700;margin:0}
.wmeta{font-size:13px;color:var(--muted);margin-top:2px}
.warm{font-size:14px;background:var(--accent-soft);border-radius:10px;padding:8px 10px;margin-top:10px}
.ex{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
.ex:last-child{border-bottom:none}
.ex input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--accent);flex:none}
.ex .body{flex:1;min-width:0}
.ex .nm{font-size:15px;font-weight:600}
.ex .nm .main{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;background:var(--ink);color:var(--bg);border-radius:4px;padding:1px 5px;margin-right:6px;vertical-align:2px}
.ex .sub{font-size:13px;color:var(--muted);margin-top:2px}
.ex .rx{text-align:right;flex:none;max-width:42%}
.ex .rx .s{font-size:15px;font-weight:700;white-space:nowrap}
.ex .rx .w{font-size:13px;color:var(--muted)}
.ex.done .nm{color:var(--muted);text-decoration:line-through}
.rob .wtitle{color:var(--rob)} .mag .wtitle{color:var(--mag)}
.rest{text-align:center;padding:30px 14px}
.rest b{font-size:20px;display:block;margin-bottom:6px}
.note{font-size:12px;color:var(--muted);margin:14px 2px}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><h1>Municchi Meal Plans</h1><span class="sub" id="span"></span></div>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="meals">Meals</button>

    <div class="dlabel"><b id="dtitle"></b><span id="dsub"></span></div>
    <button class="navbtn" id="next" aria-label="Next day">›</button>
  </div>
  <div class="strip" id="strip"></div>
</header>
<div class="wrap"><main id="main"></main></div>

h, 1 tbsp ground flax, 1 scoop collagen, plus 3 to 5 g creatine"},"M":{"name":"Cottage cheese ranch dip","help":"cottage cheese with ranch, with pepper and cucumber to dip","carbs":16,"cal":180,"pro":20,"fat":4,"portion":"170 g 2% cottage cheese (about ¾ cup), 100 g yellow or orange bell pepper (about ⅔ pepper), 75 g English cucumber (about ¼ cucumber), with 1 tsp ranch seasoning"},"recipe":"4:snack2:S_cottage"}],"tot":{"R":[2181,234,59,175],"M":[1606,156,46,140]}}},"recipes":{"1:B_burrito1":"<p><span class=\"tag\">Sunday prep: make the whole batch</span></p>\n<p><em>Makes 6 burritos with 10-inch tortillas, or 9 with 8-inch\nwraps.</em></p>\n<p><strong>Ingredients</strong></p>\n<ul>\n<li>18 Trader Joe's chicken breakfast sausage links (1½ packages)</li>\n<li>2 red bell peppers (300 g), diced</li>\n<li>½ yellow onion (75 g), diced</li>\n<li>6 large eggs</li>\n<li>1¼ cups (300 g) liquid egg whites</li>\n<li>¼ tsp salt and ¼ tsp black pepper for the eggs</li>\n<li>½ cup (2 oz) shredded reduced-fat cheddar</li>\n<li>6 large (10-inch) low-carb tortillas, or 9 small 8-inch wraps</li>\n<li>To serve: 2 tbsp jarred salsa each; ½ banana for Rob (10-inch only);\n¾ cup plain nonfat Greek yogurt for Maggie (8-inch only)</li>\n<li>Cooking spray and foil</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Heat a large nonstick pan over medium and spray it.</li>\n<li>Lay the links in one layer and cook 10 to 12 minutes, turning every\nfew minutes, until browned all over and cooked through (165°F inside).\nCooking them whole keeps them from steaming.</li>\n<li>Move the links to a cutting board and chop them into small pieces.\nPut them in a bowl.</li>\n<li>Spray the pan again. Cook the peppers and onion 5 minutes, stirring,\nuntil soft. Add them to the sausage.</li>\n<li>Whisk the eggs, egg whites, salt and pepper in a bowl. Wipe out the\npan, spray it and turn the heat to medium-low.</li>\n<li>Pour in the eggs and stir slowly 3 to 4 minutes, until just set but\nstill soft. Turn off the heat.</li>\n<li>Fold the sausage and vegetables into the eggs. Let it cool 10\nminutes so the tortillas don't get soggy. It makes about 8 cups of\nfilling.</li>\n<li>Spoon 1⅓ cups (about 200 g) of filling onto each large tortilla, or\na heaping ¾ cup (about 130 g) onto each 8-inch wrap. Sprinkle the cheese\nevenly over all of them.</li>\n<li>Fold in the sides, roll up tight and wrap each one in foil.</li>\n<li><strong>Divide.</strong> Rob: 1 large burrito with 2 tbsp salsa and\n⅔ banana (70 g); with 8-inch wraps, 2 burritos with 2 tbsp salsa and no\nbanana. Maggie: 1 large burrito with 2 tbsp salsa; with 8-inch wraps, 1\nburrito with 2 tbsp salsa plus ¾ cup (170 g) plain nonfat Greek yogurt\non the side to make up the difference. <strong>Store:</strong> 4\nburritos in the fridge (Mon, Wed), 2 in the freezer (Fri). With 8-inch\nwraps: 6 in the fridge, 3 in the freezer. <strong>To eat:</strong>\nUnwrap, wrap in a damp paper towel and microwave 1 to 1½ minutes from\nthe fridge or 2½ minutes from frozen, turning once.</li>\n</ol>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob, 10-inch (1 burrito)</td>\n<td>430</td>\n<td>38 g</td>\n<td>53 g</td>\n<td>14 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie, 10-inch (1 burrito)</td>\n<td>368</td>\n<td>38 g</td>\n<td>37 g</td>\n<td>13 g</td>\n</tr>\n<tr class=\"odd\">\n<td>Rob, 8-inch (2 burritos)</td>\n<td>461</td>\n<td>52 g</td>\n<td>37 g</td>\n<td>17 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie, 8-inch (1 burrito + yogurt)</td>\n<td>336</td>\n<td>44 g</td>\n<td>26 g</td>\n<td>9 g</td>\n</tr>\n</tbody>\n</table>\n","1:L_bigmac":"<p><span class=\"tag\">Sunday prep: pack all 6 bowls</span></p>\n<p><em>Makes 6 bowls (3 Rob, 3 Maggie).</em></p>\n<p><strong>Ingredients</strong></p>\n<ul>\n<li>2½ lb (1,155 g) Yukon gold potatoes, about 7 medium</li>\n<li>1½ tbsp olive oil</li>\n<li>Potato seasoning: 1 tsp salt, 1 tsp garlic powder, ½ tsp black\npepper</li>\n<li>2¼ lb (1,020 g) 95% lean ground beef</li>\n<li>Beef seasoning: 1 tsp onion powder, 1 tsp salt, ½ tsp black\npepper</li>\n<li>3½ romaine hearts (525 g), chopped</li>\n<li>4 Roma tomatoes (300 g)</li>\n<li>⅔ white onion (120 g)</li>\n<li>1¼ cups (180 g) dill pickle chips</li>\n<li>⅔ cup (72 g) shredded reduced-fat cheddar</li>\n<li>1 cup burger sauce (recipe above)</li>\n<li>Containers: 6 two-compartment containers, 6 small containers, 6\nsauce cups</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Heat the oven to 425°F. Line one large or two small sheet pans with\nfoil and spray them.</li>\n<li>Cut the potatoes into ¾-inch cubes.</li>\n<li>Toss them with the olive oil and the potato seasoning and spread\nthem in one layer.</li>\n<li>Roast 30 to 35 minutes, flipping halfway, until browned and crisp at\nthe edges.</li>\n<li>While they roast, heat a large skillet (cast iron or stainless, not\nnonstick) over high until very hot. Add the beef, press it flat and\nleave it 3 minutes to brown, then break it up and cook 2 more minutes.\nIf liquid pools in the pan, spoon or pour it off and keep cooking on\nhigh until the meat browns.</li>\n<li>Add the beef seasoning and cook 3 to 4 minutes more, until no pink\nis left. Drain the fat.</li>\n<li>Chop the romaine. Dice the tomatoes and the white onion.</li>\n<li><strong>Divide.</strong> Rob: each of his 3 bowls gets 1 cup (150 g)\ncooked beef and 1¼ cups roasted potatoes (165 g cooked) in the big side;\n1⅔ cups (75 g) romaine, ⅔ Roma tomato (50 g), 2 tbsp diced white onion\n(20 g), 3 tbsp (30 g) pickle chips and 2 tbsp (14 g) cheddar in the\nsmall container; 3 tbsp burger sauce in a cup. Maggie: each of her 3\nbowls gets ¾ cup (105 g) cooked beef and ¾ cup roasted potatoes (110 g\ncooked) in the big side; 2¼ cups (100 g) romaine, ⅔ Roma tomato (50 g),\n2 tbsp diced white onion (20 g), 3 tbsp (30 g) pickle chips and 1½ tbsp\n(10 g) cheddar in the small container; 2 tbsp burger sauce in a cup. If\nthe cooked amounts come out different, weigh the pile, divide it by 5\nfor each Rob bowl, and give each Maggie bowl two-thirds of that.\n<strong>Store:</strong> All 6 bowls in the fridge (Mon to Wed), with the\nsauce and cold toppings in their own containers. <strong>To\neat:</strong> Microwave the beef and potatoes 1½ to 2 minutes, then add\nthe cold toppings and sauce.</li>\n</ol>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>600</td>\n<td>56 g</td>\n<td>51 g</td>\n<td>19 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>431</td>\n<td>40 g</td>\n<td>38 g</td>\n<td>14 g</td>\n</tr>\n</tbody>\n</table>\n","1:D_steak":"<p><strong>Ingredients</strong></p>\n<ul>\n<li>Sirloin steaks: about 9 oz raw for Rob, about 6½ oz raw for\nMaggie</li>\n<li>Steak seasoning: ½ tsp salt, ¼ tsp black pepper, ¼ tsp garlic\npowder</li>\n<li>1½ medium Yukon gold potatoes (245 g)</li>\n<li>4¼ cups (375 g) Brussels sprouts</li>\n<li>2 tsp olive oil</li>\n<li>Vegetable seasoning: ½ tsp salt, ½ tsp garlic powder, ¼ tsp black\npepper</li>\n<li>2 tbsp (10 g) grated parmesan</li>\n<li>Horseradish cream: ½ cup (110 g) plain nonfat Greek yogurt, 4 tsp\nprepared white horseradish, a pinch of salt</li>\n<li>Cooking spray</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Take the steaks out of the fridge 20 minutes before cooking and pat\nthem dry.</li>\n<li>Cut the potatoes into ¾-inch cubes and halve the Brussels\nsprouts.</li>\n<li>Toss the potatoes and sprouts with the olive oil and the vegetable\nseasoning.</li>\n<li>Air-fry at 400°F for 18 to 20 minutes, shaking halfway (two batches\nif they don't fit in one layer).</li>\n<li>Horseradish cream: stir the yogurt, horseradish and salt\ntogether.</li>\n<li>Season both steaks on both sides with the steak seasoning.</li>\n<li>Heat a cast-iron pan over high until it just starts to smoke, about\n3 to 4 minutes. Spray it.</li>\n<li>Sear the steaks 3 to 4 minutes a side (130°F inside for medium-rare,\n140°F for medium).</li>\n<li>Rest the steaks 5 minutes on a cutting board, then slice across the\ngrain.</li>\n<li>Toss the Brussels sprouts with the parmesan.</li>\n<li><strong>Divide.</strong> Rob: his 6½ oz (185 g) steak, ¾ cup\nair-fried potatoes (110 g cooked), a bit more than half the Brussels\nsprouts and half the horseradish cream. Maggie: her 4½ oz (130 g) steak,\n½ cup air-fried potatoes (65 g cooked), the rest of the Brussels sprouts\nand half the horseradish cream.</li>\n</ol>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>652</td>\n<td>73 g</td>\n<td>49 g</td>\n<td>21 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>474</td>\n<td>53 g</td>\n<td>35 g</td>\n<td>16 g</td>\n</tr>\n</tbody>\n</table>\n","1:S_choc":"<p><strong>Ingredients</strong></p>\n<ul>\n<li>1½ cups (350 g) plain nonfat Greek yogurt</li>\n<li>¾ scoop GNC Pro Performance 100% Casein, Chocolate Supreme</li>\n<li>3½ tbsp PB2</li>\n<li>2 tbsp unsweetened cocoa</li>\n<li>3½ tbsp water</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>In Rob's container: 1 cup (200 g) Greek yogurt, ½ scoop chocolate\ncasein, 2 tbsp PB2, 1 tbsp cocoa and 2 tbsp water.</li>\n<li>In Maggie's container: ⅔ cup (150 g) Greek yogurt, ⅓ scoop chocolate\ncasein, 1½ tbsp PB2, 1 tbsp cocoa and 1½ tbsp water.</li>\n<li>Stir each one hard until smooth. Casein thickens more than whey: if\nit is still stiff, add water 1 tsp at a time.</li>\n<li>Lid on, into the fridge overnight. It sets like mousse.</li>\n<li><strong>Divide.</strong> Rob: his container. Maggie: her container.\n<strong>Store:</strong> Mix it the night before and keep it in the\nfridge. It keeps 2 days.</li>\n</ol>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>250</td>\n<td>40 g</td>\n<td>16 g</td>\n<td>3 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>185</td>\n<td>29 g</td>\n<td>13 g</td>\n<td>3 g</td>\n</tr>\n</tbody>\n</table>\n","1:snack2:S_mshake":"<p><b>Rob's shake:</b> 1 scoop Tripact PB & vanilla protein, 240 ml (1 cup) Fairlife fat-free milk, 2 cups of raw baby spinach, 1 tbsp ground flax, 1 scoop collagen, plus 3 to 5 g creatine. Blend until smooth. 272 cal, 45 g protein, 13 g carbs.</p><p><b>Maggie (shake):</b> ¾ scoop vanilla protein powder, 200 ml (¾ cup) Fairlife fat-free milk, a handful (about 1 cup) of raw baby spinach, 60 g mixed berries, fresh or thawed frozen (about ⅓ cup). 203 cal, 32 g protein, 16 g carbs.</p>","1:B_oats_cinn":"<p><span class=\"tag\">Sunday prep: all 4 jars</span></p>\n<p><em>Makes 4 jars (2 Rob, 2 Maggie).</em></p>\n<p><strong>Ingredients</strong></p>\n<ul>\n<li>1⅓ cups (120 g) old-fashioned rolled oats</li>\n<li>3 tbsp (36 g) chia seeds</li>\n<li>Vanilla protein powder: 2 scoops for Rob's jars, 1½ scoops for\nMaggie's</li>\n<li>1¾ cups (440 ml) Fairlife fat-free milk</li>\n<li>2¼ cups (500 g) plain nonfat Greek yogurt</li>\n<li>4 tbsp sugar-free maple syrup</li>\n<li>2 tsp cinnamon, plus a pinch for the morning</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Line up four 16-oz mason jars and label two \"Rob\" and two\n\"Maggie\".</li>\n<li>Into each Rob jar: ⅓ cup (35 g) oats, 2½ tsp (10 g) chia seeds, 1\nscoop vanilla protein powder and ½ tsp cinnamon.</li>\n<li>Into each Maggie jar: ¼ cup (25 g) oats, 2 tsp (8 g) chia seeds, ¾\nscoop vanilla protein powder and ½ tsp cinnamon.</li>\n<li>Stir the dry mix in each jar so the protein powder is spread\nout.</li>\n<li>Pour ½ cup (120 ml) Fairlife into each Rob jar and ½ cup (100 ml)\nFairlife into each Maggie jar. Stir until there are no protein\nclumps.</li>\n<li>Add ⅔ cup (150 g) Greek yogurt to each Rob jar and ½ cup (100 g)\nGreek yogurt to each Maggie jar, plus 1 tbsp sugar-free maple syrup in\nevery jar. Stir until smooth.</li>\n<li>Put the lids on and refrigerate overnight.</li>\n<li><strong>Divide.</strong> Rob: his 2 jars, one on Tuesday and one on\nThursday. Maggie: her 2 jars, one on Tuesday and one on Thursday.\n<strong>Store:</strong> All 4 jars in the fridge (Tue, Thu). They keep 5\ndays. <strong>To eat:</strong> Stir, add a pinch of cinnamon on top and\neat it cold.</li>\n</ol>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>439</td>\n<td>52 g</td>\n<td>42 g</td>\n<td>7 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>336</td>\n<td>40 g</td>\n<td>32 g</td>\n<td>6 g</td>\n</tr>\n</tbody>\n</table>\n","1:D_smashtaco":"<p><span class=\"tag\">Sunday prep: bag and freeze the raw beef</span></p>\n<p><strong>Ingredients</strong></p>\n<ul>\n<li>13½ oz (385 g) 95% lean ground beef</li>\n<li>Seasoning: ½ tsp salt, ¼ tsp black pepper, ¼ tsp garlic powder</li>\n<li>5 small (8-inch) low-carb tortillas</li>\n<li>¼ cup (30 g) shredded reduced-fat cheddar</li>\n<li>2½ cups (120 g) chopped romaine</li>\n<li>⅓ cup (60 g) dill pickle chips</li>\n<li>¼ white onion (40 g), finely diced</li>\n<li>5 tbsp burger sauce</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>The night before (Monday), move the raw beef from the freezer to the\nfridge.</li>\n<li>Mix the beef with the seasoning in a bowl.</li>\n<li>Divide it into 5 equal balls, about 75 g each: 3 for Rob, 2 for\nMaggie.</li>\n<li>Press each ball into a thin, even layer over one side of a tortilla,\nalmost to the edge.</li>\n<li>Heat a large skillet (cast iron is best) over high for 3 minutes. No\noil.</li>\n<li>Lay 2 or 3 tacos meat-side down, press them flat with a spatula and\ncook 2 to 3 minutes, until browned and cooked through.</li>\n<li>Flip. Sprinkle the cheese on the meat side (3 tbsp (20 g) cheddar\nacross Rob's 3, 1½ tbsp (10 g) cheddar across Maggie's 2) and cook 1\nminute, until the tortilla is crisp.</li>\n<li>Repeat with the rest.</li>\n<li><strong>Divide.</strong> Rob: his 3 tacos topped with 1¼ cups (60 g)\nromaine, 3 tbsp (30 g) pickle chips, 2 tbsp diced white onion (20 g) and\n3 tbsp burger sauce. Maggie: her 2 tacos topped with 1¼ cups (60 g)\nromaine, 3 tbsp (30 g) pickle chips, 2 tbsp diced white onion (20 g) and\n2 tbsp burger sauce.</li>\n</ol>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>637</td>\n<td>73 g</td>\n<td>66 g</td>\n<td>24 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>436</td>\n<td>50 g</td>\n<td>45 g</td>\n<td>16 g</td>\n</tr>\n</tbody>\n</table>\n","1:snack2:S_eggs":"<p><b>Rob's shake:</b> 1 scoop Tripact PB & vanilla protein, 240 ml (1 cup) Fairlife fat-free milk, 2 cups of raw baby spinach, 1 tbsp ground flax, 1 scoop collagen, plus 3 to 5 g creatine. Blend until smooth. 272 cal, 45 g protein, 13 g carbs.</p><p><b>Maggie (edamame + egg):</b> 85 g frozen shelled edamame (about ½ cup), 1 egg. 174 cal, 16 g protein, 8 g carbs.</p>","1:D_parm":"<p><span class=\"tag\">Sunday prep: bag and freeze the raw\nchicken</span></p>\n<p><strong>Ingredients</strong></p>\n<ul>\n<li>13¼ oz (375 g) chicken breast: 8 oz for Rob, 5¼ oz for Maggie</li>\n<li>¼ tsp salt and ¼ tsp black pepper</li>\n<li>Coating: ⅔ cup (35 g) panko, 3 tbsp (14 g) grated parmesan, ½ tsp\nItalian seasoning, ¼ tsp garlic powder</li>\n<li>3½ tbsp (50 g) liquid egg whites</li>\n<li>1 cup (275 g) marinara</li>\n<li>⅓ cup (34 g) shredded part-skim mozzarella</li>\n<li>1 medium zucchini (225 g)</li>\n<li>A pinch of salt and ¼ tsp garlic powder for the zucchini</li>\n<li>1½ oz (45 g) dry spaghetti, plus 1 tbsp salt for the water</li>\n<li>Cooking spray</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>The night before (Tuesday), move the raw chicken from the freezer to\nthe fridge.</li>\n<li>Put a pot of water with 1 tbsp salt on to boil.</li>\n<li>Butterfly each chicken breast: slice it horizontally almost all the\nway through and open it like a book. Season with the salt and\npepper.</li>\n<li>Mix the coating on a plate. Pour the egg whites into a shallow\nbowl.</li>\n<li>Dip each piece in the egg white, then press it into the coating on\nboth sides.</li>\n<li>Spray the air fryer basket, lay in the chicken and spray the tops.\nAir-fry at 400°F for 10 to 12 minutes, until 165°F.</li>\n<li>Meanwhile cook the spaghetti as the package says and drain.</li>\n<li>Slice the zucchini into half-moons. Cook in a sprayed pan over\nmedium-high with the salt and garlic powder, 4 minutes.</li>\n<li>Spoon 2 tbsp marinara over each piece of chicken and top with the\nmozzarella (3 tbsp (20 g) mozzarella on Rob's, 2 tbsp (14 g) mozzarella\non Maggie's). Air-fry 2 more minutes, until melted.</li>\n<li>Pour the rest of the marinara into the zucchini pan to warm, then\ntoss in the spaghetti.</li>\n<li><strong>Divide.</strong> Rob: his chicken parm, 6 oz (170 g) cooked\nchicken, with ½ cup cooked spaghetti (1 oz dry) and just under half the\nzucchini and sauce. Maggie: her chicken parm, 4 oz (110 g) cooked\nchicken, with ⅓ cup cooked spaghetti (¾ oz dry) and just over half the\nzucchini and sauce.</li>\n</ol>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>645</td>\n<td>71 g</td>\n<td>48 g</td>\n<td>17 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>477</td>\n<td>50 g</td>\n<td>39 g</td>\n<td>13 g</td>\n</tr>\n</tbody>\n</table>\n","1:snack2:S_cottage":"<p><b>Rob's shake:</b> 1 scoop Tripact PB & vanilla protein, 240 ml (1 cup) Fairlife fat-free milk, 2 cups of raw baby spinach, 1 tbsp ground flax, 1 scoop collagen, plus 3 to 5 g creatine. Blend until smooth. 272 cal, 45 g protein, 13 g carbs.</p><p><b>Maggie (cottage cheese ranch dip):</b> 170 g 2% cottage cheese (about ¾ cup), 100 g yellow or orange bell pepper (about ⅔ pepper), 75 g English cucumber (about ¼ cucumber), with 1 tsp ranch seasoning stirred into the cottage cheese. 180 cal, 20 g protein, 16 g carbs.</p>","1:L_mac":"<p><span class=\"tag\">Sunday prep: the whole batch</span></p>\n<p><em>Makes 8 containers (4 Rob, 4 Maggie).</em></p>\n<p><strong>Ingredients</strong></p>\n<ul>\n<li>3 lb (1,360 g) chicken breast</li>\n<li>Chicken seasoning: 1 tsp salt, 1 tsp garlic powder, 1 tsp onion\npowder, 1 tsp smoked paprika, ½ tsp black pepper (plus 2 tbsp Frank's\nRedHot if you want more kick)</li>\n<li>1 lb (454 g) elbow pasta, plus 1 tbsp salt for the water</li>\n<li>4 cups (300 g) broccoli florets</li>\n<li>24 oz (680 g) 2% cottage cheese</li>\n<li>1½ cups (360 ml) Fairlife fat-free milk</li>\n<li>1½ cups (6 oz) shredded reduced-fat cheddar</li>\n<li>½ cup Frank's RedHot Original</li>\n<li>2 to 3 tbsp ranch seasoning</li>\n<li>Cooking spray</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Heat the oven to 425°F and spray a sheet pan.</li>\n<li>Lay out the chicken and season both sides with the chicken seasoning\n(toss it in the Frank's first if using). Spray the tops.</li>\n<li>Bake 18 to 22 minutes, until 165°F inside. Rest 5 minutes, then dice\ninto ½-inch pieces.</li>\n<li>Meanwhile bring a big pot of water and 1 tbsp salt to a boil. Cook\nthe pasta 1 minute less than the package says.</li>\n<li>For the last 5 minutes, set a steamer basket of broccoli over the\npot (or drop the florets into the water for the last 3). Drain.</li>\n<li>Blend the cottage cheese with 1 cup of the Fairlife until completely\nsmooth.</li>\n<li>Pour it into a pot over low heat. Add the cheddar, the ½ cup Frank's\nand 2 tbsp ranch seasoning. Stir 4 to 5 minutes until melted. Don't let\nit boil.</li>\n<li>Taste. Add up to 1 more tbsp ranch, and up to ½ cup more Fairlife,\nuntil it looks like thick queso.</li>\n<li>Stir in the chicken, pasta and broccoli.</li>\n<li><strong>Divide.</strong> Rob: 4 containers of 2¼ cups (460 g) each.\nMaggie: 4 containers of 1⅔ cups (330 g) each. <strong>Store:</strong>\nAll 8 containers in the freezer. Wednesday night, move 4 to the fridge\n(Thu, Fri); Friday night, move the other 4 (Sat, Sun). Reheat covered,\n2½ to 3 minutes, stirring halfway. Cooked food keeps 3 to 4 days in the\nfridge, which is why these start frozen.</li>\n</ol>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>601</td>\n<td>67 g</td>\n<td>53 g</td>\n<td>12 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>431</td>\n<td>48 g</td>\n<td>38 g</td>\n<td>9 g</td>\n</tr>\n</tbody>\n</table>\n","1:D_orange":"<p><span class=\"tag\">Sunday prep: bag and freeze the raw\nchicken</span></p>\n<p><strong>Ingredients</strong></p>\n<ul>\n<li>13½ oz (385 g) chicken breast</li>\n<li>¼ tsp salt and a pinch of black pepper</li>\n<li>2½ tbsp cornstarch, plus 1 tsp if the sauce needs it</li>\n<li>Sauce: 7 tbsp (105 ml) orange juice, 2¼ tbsp low-sodium soy sauce,\n2½ tsp honey, 2 garlic cloves (grated), 1 tbsp grated fresh ginger, ¼\ntsp red pepper flakes</li>\n<li>4¾ cups (300 g) snap peas</li>\n<li>1 tsp olive oil and a pinch of salt</li>\n<li>½ cup dry white rice</li>\n<li>Cooking spray</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>The night before (Wednesday), move the raw chicken from the freezer\nto the fridge.</li>\n<li>Cook the rice: bring ½ cup dry white rice and 1 cup water to a boil,\ncover, turn the heat to low and simmer 15 minutes, then let it sit 5\nminutes off the heat and fluff with a fork. (A microwave rice pouch\nworks too.)</li>\n<li>Cut the chicken into 1-inch cubes. Season with the salt and\npepper.</li>\n<li>Toss the chicken in the cornstarch until coated.</li>\n<li>Spray the air fryer basket, add the chicken in one layer and spray\nthe tops. Air-fry at 400°F for 12 to 14 minutes, shaking once.</li>\n<li>Sauce: in a small pan over medium, simmer the orange juice, soy\nsauce, honey, garlic, ginger and red pepper flakes 2 minutes, until\nglossy. If it stays thin, stir in 1 tsp cornstarch mixed with 1 tbsp\nwater and simmer 30 seconds.</li>\n<li>Toss the chicken in the sauce.</li>\n<li>Heat the olive oil in a skillet over high. Stir-fry the snap peas\nwith a pinch of salt, 2 minutes.</li>\n<li><strong>Divide.</strong> Rob: 6 oz (170 g) cooked chicken in sauce,\n¾ cup (135 g) rice and half the snap peas. Maggie: 4¼ oz (120 g) cooked\nchicken in sauce, ½ cup (90 g) rice and half the snap peas.</li>\n</ol>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>649</td>\n<td>61 g</td>\n<td>76 g</td>\n<td>10 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>473</td>\n<td>44 g</td>\n<td>56 g</td>\n<td>7 g</td>\n</tr>\n</tbody>\n</table>\n","1:D_pizza":"<p><span class=\"tag\">Sunday prep: bag and freeze the raw\nchicken</span></p>\n<p><strong>Ingredients</strong></p>\n<ul>\n<li>1 chicken breast (8 oz raw)</li>\n<li>Seasoning: ½ tsp Italian seasoning, ¼ tsp garlic powder, a pinch of\nsalt</li>\n<li>3 large (10-inch) low-carb tortillas: 2 for Rob, 1 for Maggie (with\n8-inch wraps: 3 and 2)</li>\n<li>⅔ cup (150 g) marinara</li>\n<li>⅔ cup (70 g) shredded part-skim mozzarella</li>\n<li>24 slices (42 g) turkey pepperoni</li>\n<li>⅔ yellow or orange bell pepper (100 g)</li>\n<li>⅓ yellow onion (50 g)</li>\n<li>Salad: 3¼ cups (150 g) chopped romaine, ⅓ English cucumber (100 g),\n1 cup (30 g) baby spinach for Maggie, 4 tbsp light balsamic\nvinaigrette</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>The night before (Thursday), move the raw chicken from the freezer\nto the fridge.</li>\n<li>Season the chicken and air-fry at 400°F for 14 minutes, until 165°F.\nRest 5 minutes and dice.</li>\n<li>Heat the oven to 425°F. Slice the pepper and onion thin.</li>\n<li>Lay the tortillas on a sheet pan and bake 3 minutes to crisp\nthem.</li>\n<li>Top Rob's 2 tortillas with 0 tsp (0 g) marinara, ⅓ cup (42 g)\nmozzarella, 16 pepperoni slices, ⅔ cup (85 g) diced chicken and half the\npepper and onion, split between them.</li>\n<li>Top Maggie's tortilla with 0 tsp (0 g) marinara, ¼ cup (28 g)\nmozzarella, 8 pepperoni slices, ½ cup (70 g) diced chicken and the other\nhalf of the pepper and onion.</li>\n<li>Bake 6 to 8 minutes, until the cheese bubbles and the edges are\ncrisp.</li>\n<li>Salad: slice the cucumber and toss each person's greens with 2 tbsp\nvinaigrette.</li>\n<li><strong>Divide.</strong> Rob: his 2 pizzas with a salad of 1⅔ cups\n(75 g) romaine, ¼ English cucumber (50 g) and 2 tbsp vinaigrette.\nMaggie: her pizza with a salad of 1⅔ cups (75 g) romaine, 1 cup (30 g)\nspinach, ¼ English cucumber (50 g) and 2 tbsp vinaigrette.</li>\n</ol>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>688</td>\n<td>61 g</td>\n<td>76 g</td>\n<td>28 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>469</td>\n<td>43 g</td>\n<td>47 g</td>\n<td>19 g</td>\n</tr>\n</tbody>\n</table>\n","1:snack2:S_jerky":"<p><b>Rob's shake:</b> 1 scoop Tripact PB & vanilla protein, 240 ml (1 cup) Fairlife fat-free milk, 2 cups of raw baby spinach, 1 tbsp ground flax, 1 scoop collagen, plus 3 to 5 g creatine. Blend until smooth. 272 cal, 45 g protein, 13 g carbs.</p><p><b>Maggie (jerky + apple):</b> 28 g (1 oz) original beef jerky, 180 g Honeycrisp apple (about 1 apple). 174 cal, 11 g protein, 31 g carbs.</p>","1:B_waffles":"<p><strong>Ingredients</strong></p>\n<ul>\n<li>1 cup (105 g) Kodiak Power Cakes mix</li>\n<li>¾ cup (175 g) liquid egg whites</li>\n<li>½ cup (100 ml) Fairlife fat-free milk</li>\n<li>½ tsp cinnamon</li>\n<li>1 cup (205 g) plain nonfat Greek yogurt</li>\n<li>1 banana (Rob)</li>\n<li>⅔ cup mixed berries (Maggie)</li>\n<li>2 tbsp sugar-free maple syrup</li>\n<li>Cooking spray</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Plug in the waffle iron to heat.</li>\n<li>Rob's batter: whisk ½ cup (55 g) Kodiak mix, ⅓ cup (100 g) egg\nwhites, ¼ cup (60 ml) Fairlife and ¼ tsp cinnamon until just combined.\nThe batter is thick.</li>\n<li>Maggie's batter: whisk ½ cup (50 g) Kodiak mix, ⅓ cup (75 g) egg\nwhites, 2½ tbsp (40 ml) Fairlife and ¼ tsp cinnamon the same way.</li>\n<li>Spray the waffle iron. Cook Rob's batter about 4 minutes, until\ngolden. Spray again and cook Maggie's.</li>\n<li>Slice Rob's banana. Rinse Maggie's berries (or thaw frozen ones in\nthe microwave 30 seconds).</li>\n<li><strong>Divide.</strong> Rob: his waffles topped with ½ cup (120 g)\nGreek yogurt, 1 banana (100 g) sliced and 1 tbsp sugar-free maple syrup.\nMaggie: her waffles topped with ⅓ cup (85 g) Greek yogurt, ⅔ cup (100 g)\nberries and 1 tbsp sugar-free maple syrup.</li>\n</ol>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>438</td>\n<td>42 g</td>\n<td>63 g</td>\n<td>3 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>341</td>\n<td>33 g</td>\n<td>48 g</td>\n<td>3 g</td>\n</tr>\n</tbody>\n</table>\n","1:D_philly":"<p><span class=\"tag\">Sunday prep: bag and freeze the raw\nsteak</span></p>\n<p><strong>Ingredients</strong></p>\n<ul>\n<li>13½ oz (385 g) sirloin</li>\n<li>3 green bell peppers (480 g)</li>\n<li>¾ yellow onion (135 g)</li>\n<li>2 tsp olive oil and ¼ tsp salt</li>\n<li>Steak seasoning: 1 tbsp Worcestershire, ½ tsp garlic powder, ¼ tsp\nsalt, ¼ tsp black pepper</li>\n<li>3 slices provolone</li>\n<li>Rice: about ½ cup cooked</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>The night before (Friday), move the raw steak from the freezer to\nthe fridge.</li>\n<li>Slice the steak paper-thin across the grain. It's easiest while it's\nstill a little frozen.</li>\n<li>Rice: heat a microwave rice pouch (90 seconds) and measure out what\nyou need below; the rest keeps 4 days in the fridge.</li>\n<li>Slice the peppers and onion into strips.</li>\n<li>Heat the olive oil in a large skillet over medium-high. Add the\npeppers, onion and salt and cook 8 to 10 minutes, stirring, until soft\nand browned. Move them to a plate.</li>\n<li>Turn the heat to high. Add the steak in one layer with the\nWorcestershire, garlic powder, salt and pepper. Sear 2 to 3 minutes,\ntossing, until no pink is left.</li>\n<li>Make two piles in the pan, Rob's a little bigger. Top each with half\nthe peppers and onions, lay the provolone on top (Rob 2 slices, Maggie\n1), cover and cook 1 minute to melt.</li>\n<li><strong>Divide.</strong> Rob: his pile, 6 oz (170 g) cooked steak\nwith peppers, onions and 2 slices provolone, over ¼ cup (40 g) rice.\nMaggie: her pile, 4¼ oz (120 g) cooked steak with peppers, onions and 1\nslice provolone, over ¼ cup (45 g) rice.</li>\n</ol>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>648</td>\n<td>64 g</td>\n<td>34 g</td>\n<td>28 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>477</td>\n<td>44 g</td>\n<td>33 g</td>\n<td>19 g</td>\n</tr>\n</tbody>\n</table>\n","1:B_ftoast":"<p><strong>Ingredients</strong></p>\n<ul>\n<li>6 slices 45-calorie bread</li>\n<li>1 cup (270 g) liquid egg whites</li>\n<li>2 large eggs</li>\n<li>½ scoop vanilla protein powder (Rob)</li>\n<li>1¼ tsp cinnamon</li>\n<li>½ tsp vanilla extract</li>\n<li>¼ Honeycrisp apple (Rob)</li>\n<li>¼ cup mixed berries (Maggie)</li>\n<li>⅔ cup (155 g) plain nonfat Greek yogurt</li>\n<li>2 tbsp sugar-free maple syrup</li>\n<li>Cooking spray</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Rob's soak: in a shallow dish whisk ⅔ cup (150 g) egg whites, 1 egg,\n½ scoop vanilla protein powder, ½ tsp cinnamon and ¼ tsp vanilla\nextract.</li>\n<li>Maggie's soak: in a second dish whisk ½ cup (120 g) egg whites, 1\negg, ½ tsp cinnamon and ¼ tsp vanilla extract.</li>\n<li>Heat a large nonstick pan over medium heat and spray it.</li>\n<li>Dip Rob's 3 slices in his soak, 20 seconds a side, and cook 2 to 3\nminutes a side until golden. Spray the pan and repeat with Maggie's 3\nslices.</li>\n<li>Rob's cinnamon apples: dice ¼ Honeycrisp apple (55 g), then cook in\na small sprayed pan over medium with ¼ tsp cinnamon, 4 minutes, until\nsoft.</li>\n<li><strong>Divide.</strong> Rob: his 3 slices topped with the cinnamon\napples, ⅓ cup (80 g) Greek yogurt and 1 tbsp sugar-free maple syrup.\nMaggie: her 3 slices topped with ¼ cup (35 g) berries, ⅓ cup (75 g)\nGreek yogurt and 1 tbsp sugar-free maple syrup.</li>\n</ol>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>430</td>\n<td>52 g</td>\n<td>43 g</td>\n<td>8 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>341</td>\n<td>36 g</td>\n<td>38 g</td>\n<td>7 g</td>\n</tr>\n</tbody>\n</table>\n","1:D_shawarma":"<p><span class=\"tag\">Sunday prep: bag and freeze the raw\nchicken</span></p>\n<p><strong>Ingredients</strong></p>\n<ul>\n<li>13¼ oz (375 g) chicken breast</li>\n<li>Marinade: 2 tsp olive oil, 1 tsp cumin, 1 tsp ground coriander, 1\ntsp paprika, ½ tsp turmeric, ½ tsp salt, ¼ tsp black pepper, 2 garlic\ncloves (minced), juice of ½ lemon</li>\n<li>¾ cup (120 g) canned chickpeas, plus a pinch each of salt and\ncumin</li>\n<li>Salad: ½ English cucumber (150 g), 2 Roma tomatoes (150 g), a pinch\nof salt</li>\n<li>Tzatziki: ½ cup (110 g) plain nonfat Greek yogurt, a 2-inch piece of\ncucumber, 1 garlic clove, ½ tsp dried dill, juice of ½ lemon, a pinch of\nsalt</li>\n<li>2⅔ cups (125 g) chopped romaine</li>\n<li>1 cup (30 g) baby spinach (Maggie)</li>\n<li>3 tbsp (30 g) crumbled feta</li>\n<li>⅓ cup dry white rice</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>The night before (Saturday), move the raw chicken from the freezer\nto the fridge.</li>\n<li>Cook the rice: bring ⅓ cup dry white rice and ⅔ cup water to a boil,\ncover, turn the heat to low and simmer 15 minutes, then let it sit 5\nminutes off the heat and fluff with a fork. (A microwave rice pouch\nworks too.)</li>\n<li>Cut the chicken into strips and toss with the marinade. Let it sit\n10 minutes (or marinate overnight).</li>\n<li>Rinse the chickpeas, pat them dry and toss with the salt and\ncumin.</li>\n<li>Air-fry the chicken and chickpeas at 400°F for about 14 minutes,\nshaking once, until the chicken is 165°F.</li>\n<li>Salad: dice the cucumber and tomatoes and toss with a pinch of\nsalt.</li>\n<li>Tzatziki: grate the 2-inch piece of cucumber, squeeze it dry, and\nstir it into the yogurt with the grated garlic, dill, lemon juice and\nsalt.</li>\n<li><strong>Divide.</strong> Rob: 6 oz (170 g) cooked chicken, ⅔ cup\n(110 g) rice, half the chickpeas and salad, 1 cup (50 g) romaine, half\nthe tzatziki and 1½ tbsp (15 g) feta. Maggie: 4 oz (110 g) cooked\nchicken, ⅓ cup (50 g) rice, half the chickpeas and salad, 1⅔ cups (75 g)\nromaine, 1 cup (30 g) spinach, half the tzatziki and 1½ tbsp (15 g)\nfeta.</li>\n</ol>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>649</td>\n<td>68 g</td>\n<td>55 g</td>\n<td>16 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>477</td>\n<td>50 g</td>\n<td>39 g</td>\n<td>14 g</td>\n</tr>\n</tbody>\n</table>\n","2:S_banana":"<p><strong>Ingredients</strong></p>\n<ul>\n<li>1½ cups (350 g) plain nonfat Greek yogurt</li>\n<li>¾ scoop vanilla protein powder</li>\n<li>1 tbsp sugar-free vanilla pudding mix (dry)</li>\n<li>¾ banana</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>In Rob's container: 1 cup (200 g) Greek yogurt, ½ scoop vanilla\nprotein powder and 1½ tsp dry pudding mix.</li>\n<li>In Maggie's container: ⅔ cup (150 g) Greek yogurt, ⅓ scoop vanilla\nprotein powder and 1½ tsp dry pudding mix.</li>\n<li>Stir each one until smooth. Lid on, into the fridge overnight.</li>\n<li><strong>Divide.</strong> Rob: his container, topped with ½ banana\n(50 g) sliced when he eats it. Maggie: her container, topped with ⅓\nbanana (40 g) sliced when she eats it. If you use the chocolate casein\ninstead of vanilla powder (it makes it chocolate banana), stir in 2 tbsp\nwater for Rob and 1½ tbsp for Maggie. <strong>Store:</strong> Mix it the\nnight before and keep it in the fridge. It keeps 2 days.</li>\n</ol>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>235</td>\n<td>33 g</td>\n<td>23 g</td>\n<td>2 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>177</td>\n<td>24 g</td>\n<td>19 g</td>\n<td>1 g</td>\n</tr>\n</tbody>\n</table>\n","2:B_eggbites":"<p><span class=\"tag\">Sunday prep: make the whole batch</span></p>\n<p><em>Makes 18 egg bites.</em></p>\n<p><strong>Ingredients</strong></p>\n<ul>\n<li>9 slices turkey bacon</li>\n<li>1 red bell pepper (110 g), diced</li>\n<li>12 large eggs</li>\n<li>1½ cups (360 g) liquid egg whites</li>\n<li>1½ cups (340 g) 2% cottage cheese</li>\n<li>½ tsp salt, ¼ tsp black pepper, ½ tsp garlic powder</li>\n<li>¾ cup (3 oz) shredded reduced-fat cheddar</li>\n<li>To serve, each breakfast: 1 light English muffin and ¼ navel orange\nfor Rob; ⅓ cup berries for Maggie</li>\n<li>Cooking spray and two 12-cup muffin tins</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Heat the oven to 325°F. Spray 18 muffin cups well.</li>\n<li>Cook the turkey bacon in a skillet over medium, 3 to 4 minutes a\nside, until crisp. Cool and crumble.</li>\n<li>Dice the bell pepper.</li>\n<li>In a blender combine the eggs, egg whites, cottage cheese, salt,\npepper and garlic powder. Blend 30 seconds until smooth.</li>\n<li>Divide the bacon, pepper and cheddar among the 18 cups.</li>\n<li>Pour the egg mixture over them, about ¾ full.</li>\n<li>Bake 22 to 25 minutes, until just set (the centers barely\njiggle).</li>\n<li>Cool 10 minutes, run a knife around each one and pop them out.</li>\n<li><strong>Divide.</strong> Rob: 3 egg bites with 1 light English\nmuffin (toasted) and ¼ navel orange (40 g). Maggie: 3 egg bites with ⅓\ncup (55 g) berries. <strong>Store:</strong> 12 egg bites in the fridge\n(Mon, Wed), 6 in a freezer bag in the freezer (Fri). <strong>To\neat:</strong> Microwave 45 to 60 seconds from the fridge or 1½ minutes\nfrom frozen.</li>\n</ol>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>431</td>\n<td>37 g</td>\n<td>34 g</td>\n<td>19 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>340</td>\n<td>32 g</td>\n<td>12 g</td>\n<td>18 g</td>\n</tr>\n</tbody>\n</table>\n","2:L_bowl":"<p><span class=\"tag\">Sunday prep: pack all 6 bowls</span></p>\n<p><em>Makes 6 bowls (3 Rob, 3 Maggie).</em></p>\n<p><strong>Ingredients</strong></p>\n<ul>\n<li>2⅓ lb (1,060 g) chicken breast</li>\n<li>Chicken seasoning: 1 tbsp chili powder, 2 tsp cumin, 1 tsp garlic\npowder, 1 tsp salt, juice of 1 lime</li>\n<li>¾ cup dry white rice</li>\n<li>1 can (15 oz) black beans</li>\n<li>1⅓ cups (210 g) frozen corn and 1 tsp Tajín</li>\n<li>3 bell peppers (1 red, 1 green, 1 yellow; 420 g), sliced</li>\n<li>1 yellow onion (180 g), sliced</li>\n<li>1 tbsp olive oil, ½ tsp cumin, ¼ tsp salt</li>\n<li>1½ cups jarred salsa</li>\n<li>Crema: 1 cup (240 g) plain nonfat Greek yogurt, juice of ½ lime, a\npinch of salt</li>\n<li>⅔ cup (75 g) shredded Mexican-blend cheese</li>\n<li>8 cups (375 g) chopped romaine</li>\n<li>3 cups (90 g) baby spinach (Maggie)</li>\n<li>Containers: 6 two-compartment containers and 6 small containers</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Heat the oven to 425°F and spray a sheet pan.</li>\n<li>Toss the chicken with the chicken seasoning and lime juice. Bake 18\nto 22 minutes, until 165°F. Rest 5 minutes and slice.</li>\n<li>Cook the rice: bring ¾ cup dry white rice and 1½ cups water to a\nboil, cover, turn the heat to low and simmer 15 minutes, then let it sit\n5 minutes off the heat and fluff with a fork. (A microwave rice pouch\nworks too.)</li>\n<li>Rinse and drain the black beans.</li>\n<li>Heat the olive oil in a large skillet over medium-high. Add the\npeppers, onion, cumin and salt and cook 8 minutes, until soft and\nbrowned.</li>\n<li>In a dry skillet over medium-high, char the corn 5 minutes, stirring\nnow and then. Sprinkle with the Tajín.</li>\n<li>Crema: stir the yogurt, lime juice and salt together.</li>\n<li><strong>Divide.</strong> Rob: each of his 3 bowls gets 1 cup (150 g)\nsliced chicken, ½ cup (80 g) rice, ¼ cup (50 g) black beans, ¼ cup (40\ng) corn, a sixth of the peppers and onions and 2 tbsp (15 g)\nMexican-blend cheese in the big side; 1 cup (50 g) romaine, 4 tbsp salsa\nand 3 tbsp (40 g) Greek yogurt crema in the small container. Maggie:\neach of her 3 bowls gets ¾ cup (100 g) sliced chicken, ¼ cup (35 g)\nrice, ¼ cup (40 g) black beans, 3 tbsp (30 g) corn, a sixth of the\npeppers and onions and 1½ tbsp (10 g) Mexican-blend cheese in the big\nside; 1⅔ cups (75 g) romaine, 1 cup (30 g) spinach, 4 tbsp salsa and 3\ntbsp (40 g) Greek yogurt crema in the small container. If the cooked\namounts come out different, weigh the pile, divide it by 5 for each Rob\nbowl, and give each Maggie bowl two-thirds of that.\n<strong>Store:</strong> All 6 bowls in the fridge (Mon to Wed), with the\nsauce and cold toppings in their own containers. <strong>To\neat:</strong> Microwave the big side 1½ to 2 minutes, then add the cold\nside.</li>\n</ol>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>602</td>\n<td>64 g</td>\n<td>56 g</td>\n<td>13 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>428</td>\n<td>47 g</td>\n<td>41 g</td>\n<td>9 g</td>\n</tr>\n</tbody>\n</table>\n","2:D_pork":"<p><strong>Ingredients</strong></p>\n<ul>\n<li>1 pork tenderloin, about 1 lb raw</li>\n<li>Rub: ¾ tsp salt, ½ tsp black pepper, 1 tsp garlic powder, 1 tsp\nsmoked paprika</li>\n<li>2½ medium sweet potatoes (490 g)</li>\n<li>3 cups (300 g) green beans, trimmed</li>\n<li>2½ tsp olive oil</li>\n<li>½ tsp salt and ¼ tsp black pepper for the vegetables</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Heat the oven to 425°F.</li>\n<li>Cut the sweet potatoes into ¾-inch cubes. Toss with 1½ tsp of the\nolive oil, the salt and the pepper on a sheet pan. Roast 25 minutes in\nall.</li>\n<li>Pat the pork dry and coat it with the rub.</li>\n<li>Heat the last 1 tsp olive oil in an oven-safe skillet over\nmedium-high. Sear the pork on all sides, about 6 minutes in all.</li>\n<li>Move the skillet to the oven and roast 15 to 20 minutes, until 145°F\ninside.</li>\n<li>When the sweet potatoes have 12 minutes left, add the green beans to\nthe sheet pan and toss.</li>\n<li>Rest the pork 5 minutes and slice it ½ inch thick.</li>\n<li><strong>Divide.</strong> Rob: 7 oz (200 g) sliced pork, 1⅔ cups\nroasted sweet potato (220 g cooked) and half the green beans. Maggie: 5¼\noz (150 g) sliced pork, 1 cup roasted sweet potato (145 g cooked) and\nhalf the green beans.</li>\n</ol>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>648</td>\n<td>60 g</td>\n<td>70 g</td>\n<td>15 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>473</td>\n<td>45 g</td>\n<td>50 g</td>\n<td>11 g</td>\n</tr>\n</tbody>\n</table>\n","2:snack2:S_mshake":"<p><b>Rob's shake:</b> 1 scoop Tripact PB & vanilla protein, 240 ml (1 cup) Fairlife fat-free milk, 2 cups of raw baby spinach, 1 tbsp ground flax, 1 scoop collagen, plus 3 to 5 g creatine. Blend until smooth. 272 cal, 45 g protein, 13 g carbs.</p><p><b>Maggie (shake):</b> ¾ scoop vanilla protein powder, 200 ml (¾ cup) Fairlife fat-free milk, a handful (about 1 cup) of raw baby spinach, 60 g mixed berries, fresh or thawed frozen (about ⅓ cup). 203 cal, 32 g protein, 16 g carbs.</p>","2:B_oats_banana":"<p><span class=\"tag\">Sunday prep: all 4 jars</span></p>\n<p><em>Makes 4 jars (2 Rob, 2 Maggie).</em></p>\n<p><strong>Ingredients</strong></p>\n<ul>\n<li>¾ cup (70 g) old-fashioned rolled oats</li>\n<li>Vanilla protein powder: 2 scoops for Rob's jars, 1½ scoops for\nMaggie's</li>\n<li>1¾ cups (440 ml) Fairlife fat-free milk</li>\n<li>2¼ cups (500 g) plain nonfat Greek yogurt</li>\n<li>2 tbsp sugar-free vanilla pudding mix (dry)</li>\n<li>In the morning: 2 bananas and 8 Nilla wafers</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Line up four 16-oz mason jars and label two \"Rob\" and two\n\"Maggie\".</li>\n<li>Into each Rob jar: ¼ cup (20 g) oats, 1 scoop vanilla protein powder\nand 1½ tsp dry pudding mix.</li>\n<li>Into each Maggie jar: 2½ tbsp (15 g) oats, ¾ scoop vanilla protein\npowder and 1½ tsp dry pudding mix.</li>\n<li>Stir the dry mix in each jar.</li>\n<li>Pour ½ cup (120 ml) Fairlife into each Rob jar and ½ cup (100 ml)\nFairlife into each Maggie jar. Stir until there are no clumps.</li>\n<li>Add ⅔ cup (150 g) Greek yogurt to each Rob jar and ½ cup (100 g)\nGreek yogurt to each Maggie jar. Stir until smooth.</li>\n<li>Put the lids on and refrigerate overnight.</li>\n<li><strong>Divide.</strong> Rob: his 2 jars (Tue, Thu); each morning\ntop with ½ banana (60 g), sliced, and 2 crushed Nilla wafers. Maggie:\nher 2 jars (Tue, Thu); each morning top with ½ banana (50 g), sliced,\nand 2 crushed Nilla wafers. <strong>Store:</strong> All 4 jars in the\nfridge (Tue, Thu). They keep 5 days.</li>\n</ol>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>427</td>\n<td>49 g</td>\n<td>48 g</td>\n<td>5 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>343</td>\n<td>38 g</td>\n<td>39 g</td>\n<td>4 g</td>\n</tr>\n</tbody>\n</table>\n","2:D_fajita":"<p><span class=\"tag\">Sunday prep: bag and freeze the raw\nchicken</span></p>\n<p><strong>Ingredients</strong></p>\n<ul>\n<li>13½ oz (385 g) chicken breast</li>\n<li>2 bell peppers (1 red, 1 green; 280 g)</li>\n<li>¾ yellow onion (120 g)</li>\n<li>2 tsp olive oil</li>\n<li>1 tbsp fajita seasoning and ¼ tsp salt</li>\n<li>1 lime</li>\n<li>5 small (8-inch) low-carb tortillas</li>\n<li>½ cup jarred salsa</li>\n<li>Crema: ⅓ cup (80 g) plain nonfat Greek yogurt, juice of ½ lime, a\npinch of salt</li>\n<li>1 tbsp shredded Mexican-blend cheese (Rob)</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>The night before (Monday), move the raw chicken from the freezer to\nthe fridge.</li>\n<li>Heat the oven to 425°F and spray a sheet pan.</li>\n<li>Slice the chicken into ½-inch strips and the peppers and onion into\nstrips.</li>\n<li>Toss everything with the olive oil, fajita seasoning and salt and\nspread it in one layer.</li>\n<li>Roast 18 to 20 minutes, until the chicken is 165°F and the\nvegetables are charred at the edges.</li>\n<li>Squeeze ½ lime over the pan.</li>\n<li>Crema: stir the yogurt, the juice of the other ½ lime and the salt\ntogether.</li>\n<li>Warm the tortillas: wrap them in a damp paper towel and microwave 30\nseconds.</li>\n<li><strong>Divide.</strong> Rob: 3 tortillas, 6 oz (170 g) cooked\nchicken, half the peppers and onions, 4 tbsp salsa, 3 tbsp (40 g) Greek\nyogurt crema and 1 tbsp cheese. Maggie: 2 tortillas, 4¼ oz (120 g)\ncooked chicken, half the peppers and onions, 4 tbsp salsa and 3 tbsp (40\ng) Greek yogurt crema.</li>\n</ol>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>650</td>\n<td>74 g</td>\n<td>77 g</td>\n<td>20 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>473</td>\n<td>53 g</td>\n<td>58 g</td>\n<td>14 g</td>\n</tr>\n</tbody>\n</table>\n","2:snack2:S_eggs":"<p><b>Rob's shake:</b> 1 scoop Tripact PB & vanilla protein, 240 ml (1 cup) Fairlife fat-free milk, 2 cups of raw baby spinach, 1 tbsp ground flax, 1 scoop collagen, plus 3 to 5 g creatine. Blend until smooth. 272 cal, 45 g protein, 13 g carbs.</p><p><b>Maggie (edamame + egg):</b> 85 g frozen shelled edamame (about ½ cup), 1 egg. 174 cal, 16 g protein, 8 g carbs.</p>","2:D_meatball":"<p><span class=\"tag\">Sunday prep: roll and bake the meatballs</span></p>\n<p><em>Makes 16 meatballs (made Sunday).</em></p>\n<p><strong>Ingredients</strong></p>\n<ul>\n<li>Meatballs: 1 lb (454 g) 93% lean ground turkey, 1 large egg, ⅓ cup\n(20 g) panko, 3 tbsp (15 g) grated parmesan, 1 tsp Italian seasoning, ½\ntsp garlic powder, ½ tsp salt, ¼ tsp black pepper</li>\n<li>1 cup (275 g) marinara</li>\n<li>1 medium zucchini (225 g) and a pinch of salt</li>\n<li>1¼ oz (35 g) dry spaghetti, plus 1 tbsp salt for the water</li>\n<li>2 tbsp (10 g) grated parmesan to serve</li>\n<li>Cooking spray</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Sunday: heat the oven to 400°F and spray a sheet pan.</li>\n<li>Mix the meatball ingredients with your hands until just\ncombined.</li>\n<li>Roll 16 balls, about 1½ inches (35 g each), and set them on the\npan.</li>\n<li>Bake 15 to 18 minutes, until 165°F. Cool and refrigerate.</li>\n<li>Wednesday: bring a pot of water with 1 tbsp salt to a boil and cook\nthe spaghetti as the package says.</li>\n<li>Warm the marinara in a saucepan over medium. Add 14 meatballs (Rob\n8, Maggie 6), cover and simmer 10 minutes.</li>\n<li>Slice the zucchini and cook it in a sprayed pan over medium-high\nwith the salt, 4 minutes.</li>\n<li><strong>Divide.</strong> Rob: 8 meatballs in sauce, ½ cup cooked\nspaghetti (1 oz dry), ½ medium zucchini (100 g) and 1 tbsp parmesan.\nMaggie: 6 meatballs in sauce, 2½ tbsp cooked spaghetti (¼ oz dry), ½\nmedium zucchini (125 g) and 1 tbsp parmesan. The 2 extra meatballs keep\n4 days in the fridge for a snack or lunch.</li>\n</ol>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>657</td>\n<td>58 g</td>\n<td>40 g</td>\n<td>29 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>481</td>\n<td>44 g</td>\n<td>26 g</td>\n<td>23 g</td>\n</tr>\n</tbody>\n</table>\n","2:snack2:S_cottage":"<p><b>Rob's shake:</b> 1 scoop Tripact PB & vanilla protein, 240 ml (1 cup) Fairlife fat-free milk, 2 cups of raw baby spinach, 1 tbsp ground flax, 1 scoop collagen, plus 3 to 5 g creatine. Blend until smooth. 272 cal, 45 g protein, 13 g carbs.</p><p><b>Maggie (cottage cheese ranch dip):</b> 170 g 2% cottage cheese (about ¾ cup), 100 g yellow or orange bell pepper (about ⅔ pepper), 75 g English cucumber (about ¼ cucumber), with 1 tsp ranch seasoning stirred into the cottage cheese. 180 cal, 20 g protein, 16 g carbs.</p>","2:L_chili":"<p><span class=\"tag\">Sunday prep: the whole batch</span></p>\n<p><em>Makes about 18 cups.</em></p>\n<p><strong>Ingredients</strong></p>\n<ul>\n<li>3 lb (1,360 g) 93% lean ground beef</li>\n<li>2 yellow onions (300 g), diced</li>\n<li>2 green bell peppers (300 g), diced</li>\n<li>1 tbsp olive oil</li>\n<li>Spices: 3 tbsp chili powder, 1 tbsp cumin, 2 tsp smoked paprika, 1\ntsp dried oregano, 2 tsp salt, ½ tsp black pepper</li>\n<li>4 garlic cloves, minced</li>\n<li>2 cans (28 oz each) crushed tomatoes</li>\n<li>2 cans (15 oz each) kidney beans and 1 can (15 oz) black beans,\nrinsed</li>\n<li>1 large sweet potato (1 lb, 450 g), peeled</li>\n<li>Toppings for the week: 1⅓ cups (320 g) plain nonfat Greek yogurt, ¾\ncup (84 g) shredded reduced-fat cheddar</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Peel the sweet potato and cut it into ½-inch cubes.</li>\n<li>Heat the olive oil in a big pot (6 quarts or more) over\nmedium-high.</li>\n<li>Turn the heat to high. Add the beef in two batches, letting each\nbrown 3 to 4 minutes before breaking it up, then add the onions and\npeppers and cook 6 minutes more. If liquid pools in the pan, spoon or\npour it off and keep cooking on high until the meat browns.</li>\n<li>Add the spices and garlic and stir 1 minute.</li>\n<li>Add the tomatoes, beans and sweet potato. Stir and bring to a\nboil.</li>\n<li>Turn the heat to low and simmer with the lid partly on for 40\nminutes, stirring every 10 minutes, until the sweet potato is\ntender.</li>\n<li>Cool 20 minutes before packing.</li>\n<li><strong>Divide.</strong> Rob: 4 containers of 2¼ cups chili; top\neach with 3 tbsp (40 g) Greek yogurt and 2 tbsp (14 g) cheddar when you\neat it. Maggie: 4 containers of 1¾ cups chili; top each with 3 tbsp (40\ng) Greek yogurt and 1 tbsp (7 g) cheddar when you eat it. The batch\nleaves about 2 cups extra; freeze it as a spare lunch.\n<strong>Store:</strong> All 8 containers in the freezer. Wednesday\nnight, move 4 to the fridge (Thu, Fri); Friday night, move the other 4\n(Sat, Sun). Reheat covered, 2½ to 3 minutes, stirring halfway. Cooked\nfood keeps 3 to 4 days in the fridge, which is why these start\nfrozen.</li>\n</ol>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>592</td>\n<td>56 g</td>\n<td>55 g</td>\n<td>18 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>455</td>\n<td>44 g</td>\n<td>43 g</td>\n<td>13 g</td>\n</tr>\n</tbody>\n</table>\n","2:D_mongolian":"<p><span class=\"tag\">Sunday prep: bag and freeze the raw\nsteak</span></p>\n<p><strong>Ingredients</strong></p>\n<ul>\n<li>13½ oz (385 g) sirloin</li>\n<li>2 tbsp cornstarch</li>\n<li>2 tsp olive oil</li>\n<li>Sauce: 2¼ tbsp low-sodium soy sauce, 2½ tsp honey, 2 garlic cloves\n(minced), 2 tsp grated fresh ginger, ¼ tsp red pepper flakes, 2 tbsp\nwater</li>\n<li>4¾ cups (300 g) snap peas and a pinch of salt</li>\n<li>⅓ cup dry white rice</li>\n<li>Cooking spray</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>The night before (Wednesday), move the raw steak from the freezer to\nthe fridge.</li>\n<li>Cook the rice: bring ⅓ cup dry white rice and ⅔ cup water to a boil,\ncover, turn the heat to low and simmer 15 minutes, then let it sit 5\nminutes off the heat and fluff with a fork. (A microwave rice pouch\nworks too.)</li>\n<li>Slice the steak thin (about ⅛ inch) across the grain. It's easiest\nwhile it's still a little frozen.</li>\n<li>Toss the steak with the cornstarch.</li>\n<li>Mix the sauce in a small bowl.</li>\n<li>Heat 1 tsp olive oil in a large skillet over high until shimmering.\nAdd half the beef in one layer, sear 2 minutes without stirring, then\ntoss and move to a plate. Repeat with the other 1 tsp oil and the rest\nof the beef.</li>\n<li>Put all the beef back in the pan and turn the heat to medium. Pour\nin the sauce and toss 1 minute, until glossy.</li>\n<li>In a second sprayed pan over high, stir-fry the snap peas with the\nsalt, 2 minutes.</li>\n<li><strong>Divide.</strong> Rob: 6 oz (170 g) cooked steak in sauce, ⅔\ncup (110 g) rice and half the snap peas. Maggie: 4¼ oz (120 g) cooked\nsteak in sauce, ½ cup (70 g) rice and half the snap peas.</li>\n</ol>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>649</td>\n<td>58 g</td>\n<td>61 g</td>\n<td>18 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>472</td>\n<td>43 g</td>\n<td>44 g</td>\n<td>13 g</td>\n</tr>\n</tbody>\n</table>\n","2:D_chksand":"<p><span class=\"tag\">Sunday prep: bag and freeze the raw\nchicken</span></p>\n<p><strong>Ingredients</strong></p>\n<ul>\n<li>13½ oz (385 g) chicken breast: 8 oz for Rob, 5¾ oz for Maggie</li>\n<li>½ cup pickle juice from the jar</li>\n<li>Coating: ¾ cup (43 g) panko, 1 tsp paprika, ½ tsp garlic powder, ¼\ntsp salt</li>\n<li>3½ tbsp (50 g) liquid egg whites</li>\n<li>½ medium Yukon gold potato (80 g), plus 1½ tsp olive oil and a pinch\neach of salt and garlic powder</li>\n<li>2 whole-wheat sandwich thins</li>\n<li>¼ cup (40 g) dill pickle chips</li>\n<li>Rob's spicy mayo: 2 tsp light mayo and ½ tsp sriracha</li>\n<li>Slaw: 2¾ cups (200 g) coleslaw mix, ¼ cup (55 g) plain nonfat Greek\nyogurt, 2½ tsp light mayo, 1 tsp red wine vinegar, a pinch each of salt\nand pepper</li>\n<li>Cooking spray</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>The night before (Thursday), move the raw chicken from the freezer\nto the fridge.</li>\n<li>Brine the chicken in the pickle juice, 30 minutes (or overnight in\nthe fridge).</li>\n<li>Mix the coating on a plate. Pour the egg whites into a shallow\nbowl.</li>\n<li>Pat the chicken dry, dip it in the egg white and press it into the\ncoating on both sides.</li>\n<li>Cut the potato into thin wedges and toss with the olive oil, salt\nand garlic powder.</li>\n<li>Spray the air fryer basket. Air-fry the chicken (sprayed on top) and\nthe wedges at 400°F for 12 to 14 minutes, until the chicken is 165°F.\nGive the wedges a few more minutes if they need it.</li>\n<li>Spicy mayo: stir the light mayo and sriracha together.</li>\n<li>Slaw: toss the coleslaw mix with the yogurt, light mayo, vinegar,\nsalt and pepper.</li>\n<li>Toast the sandwich thins.</li>\n<li><strong>Divide.</strong> Rob: his sandwich, 6 oz (170 g) cooked\nchicken on a sandwich thin with the spicy mayo and 2 tbsp pickle chips;\n½ cup potato wedges (45 g cooked); half the slaw. Maggie: her sandwich,\n4¼ oz (120 g) cooked chicken on a sandwich thin with 2 tbsp pickle\nchips; 2½ tbsp potato wedges (15 g cooked); half the slaw.</li>\n</ol>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>649</td>\n<td>68 g</td>\n<td>60 g</td>\n<td>16 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>476</td>\n<td>50 g</td>\n<td>46 g</td>\n<td>11 g</td>\n</tr>\n</tbody>\n</table>\n","2:snack2:S_jerky":"<p><b>Rob's shake:</b> 1 scoop Tripact PB & vanilla protein, 240 ml (1 cup) Fairlife fat-free milk, 2 cups of raw baby spinach, 1 tbsp ground flax, 1 scoop collagen, plus 3 to 5 g creatine. Blend until smooth. 272 cal, 45 g protein, 13 g carbs.</p><p><b>Maggie (jerky + apple):</b> 28 g (1 oz) original beef jerky, 180 g Honeycrisp apple (about 1 apple). 174 cal, 11 g protein, 31 g carbs.</p>","2:B_ccpancake":"<p><strong>Ingredients</strong></p>\n<ul>\n<li>½ cup (50 g) old-fashioned rolled oats</li>\n<li>1¼ cups (260 g) 2% cottage cheese</li>\n<li>3 large eggs</li>\n<li>3½ tbsp (50 g) liquid egg whites (Maggie)</li>\n<li>1 tsp baking powder</li>\n<li>½ tsp cinnamon</li>\n<li>2 pinches salt</li>\n<li>½ banana (Rob)</li>\n<li>½ cup mixed berries (Maggie)</li>\n<li>2 tbsp sugar-free maple syrup</li>\n<li>Cooking spray</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Rob's batter: blend ¼ cup (25 g) oats, ⅔ cup (150 g) cottage cheese,\n2 eggs, ½ tsp baking powder, ¼ tsp cinnamon and a pinch of salt until\nsmooth. Pour into a bowl.</li>\n<li>Maggie's batter: blend ¼ cup (25 g) oats, ½ cup (110 g) cottage\ncheese, 1 egg, 3½ tbsp (50 g) egg whites, ½ tsp baking powder, ¼ tsp\ncinnamon and a pinch of salt until smooth.</li>\n<li>Let both batters rest 5 minutes to thicken.</li>\n<li>Heat a large nonstick pan over medium heat and spray it.</li>\n<li>Pour ¼-cup pancakes. Cook about 2 minutes, until bubbles form and\nthe edges look set, then flip and cook 1 to 2 minutes more.</li>\n<li>Cook Rob's batter first and keep it warm in a 200°F oven, then cook\nMaggie's.</li>\n<li><strong>Divide.</strong> Rob: his pancakes topped with ½ banana (60\ng), sliced, and 1 tbsp sugar-free maple syrup. Maggie: her pancakes\ntopped with ½ cup (75 g) berries and 1 tbsp sugar-free maple syrup.</li>\n</ol>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>427</td>\n<td>33 g</td>\n<td>41 g</td>\n<td>15 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>332</td>\n<td>28 g</td>\n<td>34 g</td>\n<td>9 g</td>\n</tr>\n</tbody>\n</table>\n","2:D_tikka":"<p><span class=\"tag\">Sunday prep: bag and freeze the raw\nchicken</span></p>\n<p><strong>Ingredients</strong></p>\n<ul>\n<li>13½ oz (385 g) chicken breast</li>\n<li>½ cup (110 g) plain nonfat Greek yogurt</li>\n<li>Marinade: 1 tsp garam masala, 1 garlic clove (grated), 1 tsp grated\nfresh ginger, ½ tsp salt</li>\n<li>Sauce: ½ yellow onion (90 g), 2 tsp olive oil, 1 garlic clove, 1 tsp\ngrated fresh ginger, 1 tsp garam masala, 1 tsp cumin, 1 tsp paprika, ½\ntsp turmeric, 1¼ cups (275 g) canned crushed tomatoes, ¼ tsp salt</li>\n<li>2 cups (200 g) green beans, trimmed</li>\n<li>½ cup dry white rice</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>The night before (Friday), move the raw chicken from the freezer to\nthe fridge.</li>\n<li>Cut the chicken into 1-inch cubes. Toss with 2½ tbsp (35 g) of the\nyogurt and the marinade. Let it sit 15 minutes (or overnight).</li>\n<li>Cook the rice: bring ½ cup dry white rice and 1 cup water to a boil,\ncover, turn the heat to low and simmer 15 minutes, then let it sit 5\nminutes off the heat and fluff with a fork. (A microwave rice pouch\nworks too.)</li>\n<li>Air-fry the chicken at 400°F for 12 minutes, shaking once.</li>\n<li>Sauce: heat the olive oil in a saucepan over medium. Dice the onion\nand cook it 5 minutes, until soft.</li>\n<li>Add the garlic, ginger and spices and stir 30 seconds.</li>\n<li>Add the crushed tomatoes and salt and simmer 10 minutes.</li>\n<li>Take the pan off the heat. Stir in the rest of the yogurt (about ⅓\ncup), then the chicken.</li>\n<li>Steam the green beans: microwave them in a covered bowl with 2 tbsp\nwater, 4 minutes.</li>\n<li><strong>Divide.</strong> Rob: 6 oz (170 g) cooked chicken in a bit\nmore than half the sauce, 1 cup (155 g) rice and half the green beans.\nMaggie: 4¼ oz (120 g) cooked chicken in the rest of the sauce, ⅔ cup\n(100 g) rice and half the green beans.</li>\n</ol>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>650</td>\n<td>66 g</td>\n<td>68 g</td>\n<td>12 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>474</td>\n<td>48 g</td>\n<td>50 g</td>\n<td>9 g</td>\n</tr>\n</tbody>\n</table>\n","2:B_hash":"<p><strong>Ingredients</strong></p>\n<ul>\n<li>6 Trader Joe's chicken breakfast sausage links (the ones frozen last\nSunday): 4 for Rob, 2 for Maggie</li>\n<li>1½ medium Yukon gold potatoes (250 g)</li>\n<li>¾ red bell pepper (120 g), diced</li>\n<li>⅓ yellow onion (60 g), diced</li>\n<li>1 tsp olive oil</li>\n<li>Potato seasoning: ¼ tsp salt, ¼ tsp garlic powder, a pinch of black\npepper</li>\n<li>3 large eggs</li>\n<li>½ cup (120 g) liquid egg whites</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>The night before, move the 6 frozen sausage links to the\nfridge.</li>\n<li>Dice the potato into ½-inch cubes. Microwave them in a covered bowl\n3 minutes.</li>\n<li>Heat the olive oil in a 12-inch nonstick skillet over medium. Brown\nthe links whole, 8 to 10 minutes, turning, until cooked through (165°F).\nMove them to a board and slice into coins.</li>\n<li>Turn the heat to medium-high. Add the potatoes, pepper, onion and\npotato seasoning and cook 6 to 8 minutes, stirring now and then, until\nthe potatoes are crisp at the edges.</li>\n<li>Stir the sausage back in, keeping Rob's 4 links' worth on one side\nand Maggie's 2 on the other.</li>\n<li>Turn the heat to medium. On Rob's side make 2 wells: crack in 2 eggs\nand pour ¼ cup (60 g) egg whites around them. On Maggie's side make 1\nwell: 1 egg plus ¼ cup (60 g) egg whites.</li>\n<li>Cover and cook 3 to 4 minutes, until the whites are set.</li>\n<li><strong>Divide.</strong> Rob: his side: half the potato hash, his 4\nlinks of sausage and his 2 eggs and whites. Maggie: her side: half the\npotato hash, her 2 links of sausage and her egg and whites.</li>\n</ol>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>430</td>\n<td>44 g</td>\n<td>24 g</td>\n<td>17 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>341</td>\n<td>28 g</td>\n<td>36 g</td>\n<td>9 g</td>\n</tr>\n</tbody>\n</table>\n","2:D_turkeyburger":"<p><span class=\"tag\">Sunday prep: bag and freeze the raw\nturkey</span></p>\n<p><strong>Ingredients</strong></p>\n<ul>\n<li>12 oz (340 g) 93% lean ground turkey</li>\n<li>Seasoning: ½ tsp salt, ½ tsp garlic powder, ½ tsp onion powder, ¼\ntsp black pepper, 1 tsp Worcestershire</li>\n<li>2 whole-wheat sandwich thins</li>\n<li>1 slice American cheese (Rob)</li>\n<li>1¼ cups (60 g) chopped romaine</li>\n<li>1 Roma tomato (80 g), sliced</li>\n<li>¼ cup (40 g) dill pickle chips</li>\n<li>1½ tbsp ketchup</li>\n<li>1⅓ medium sweet potatoes (265 g)</li>\n<li>2 tsp olive oil, ¼ tsp salt, ¼ tsp smoked paprika</li>\n<li>Cooking spray</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>The night before (Saturday), move the raw turkey from the freezer to\nthe fridge.</li>\n<li>Cut the sweet potatoes into ¼-inch fries. Toss with the olive oil,\nsalt and smoked paprika.</li>\n<li>Air-fry at 400°F for 18 to 20 minutes, shaking twice.</li>\n<li>Mix the turkey with the seasoning. Shape 2 patties, ¾ inch thick:\nRob's 7 oz (200 g), Maggie's 5 oz (140 g). Press a dent in the middle of\neach.</li>\n<li>Heat a sprayed skillet over medium. Cook the patties 4 to 5 minutes\na side, until 165°F. Put the cheese on Rob's for the last minute and\ncover.</li>\n<li>Toast the sandwich thins.</li>\n<li><strong>Divide.</strong> Rob: his cheeseburger on a sandwich thin\nwith ⅔ cup (30 g) romaine, ½ Roma tomato (40 g), 2 tbsp (20 g) pickle\nchips and 1 tbsp ketchup, plus 1¼ cups sweet potato fries (100 g\ncooked). Maggie: her burger on a sandwich thin with ⅔ cup (30 g)\nromaine, ½ Roma tomato (40 g), 2 tbsp (20 g) pickle chips and 2 tsp\nketchup, plus 1¼ cups sweet potato fries (100 g cooked).</li>\n</ol>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>650</td>\n<td>49 g</td>\n<td>58 g</td>\n<td>27 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>473</td>\n<td>34 g</td>\n<td>54 g</td>\n<td>16 g</td>\n</tr>\n</tbody>\n</table>\n","3:S_choc":"<p><strong>Ingredients</strong></p>\n<ul>\n<li>1½ cups (350 g) plain nonfat Greek yogurt</li>\n<li>¾ scoop GNC Pro Performance 100% Casein, Chocolate Supreme</li>\n<li>3½ tbsp PB2</li>\n<li>2 tbsp unsweetened cocoa</li>\n<li>3½ tbsp water</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>In Rob's container: 1 cup (200 g) Greek yogurt, ½ scoop chocolate\ncasein, 2 tbsp PB2, 1 tbsp cocoa and 2 tbsp water.</li>\n<li>In Maggie's container: ⅔ cup (150 g) Greek yogurt, ⅓ scoop chocolate\ncasein, 1½ tbsp PB2, 1 tbsp cocoa and 1½ tbsp water.</li>\n<li>Stir each one hard until smooth. Casein thickens more than whey: if\nit is still stiff, add water 1 tsp at a time.</li>\n<li>Lid on, into the fridge overnight. It sets like mousse.</li>\n<li><strong>Divide.</strong> Rob: his container. Maggie: her container.\n<strong>Store:</strong> Mix it the night before and keep it in the\nfridge. It keeps 2 days.</li>\n</ol>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>250</td>\n<td>40 g</td>\n<td>16 g</td>\n<td>3 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>185</td>\n<td>29 g</td>\n<td>13 g</td>\n<td>3 g</td>\n</tr>\n</tbody>\n</table>\n","3:B_burrito3":"<p><span class=\"tag\">Sunday prep: make the whole batch</span></p>\n<p><em>Makes 6 burritos with 10-inch tortillas, or 9 with 8-inch\nwraps.</em></p>\n<p><strong>Ingredients</strong></p>\n<ul>\n<li>1 lb (454 g) 93% lean ground turkey</li>\n<li>Chorizo seasoning: 1 tbsp chili powder, 1 tsp smoked paprika, 1 tsp\ncumin, 1 tsp dried oregano, ½ tsp garlic powder, ¾ tsp salt, ¼ tsp black\npepper, 1 tbsp red wine vinegar</li>\n<li>1 medium Yukon gold potato (200 g)</li>\n<li>1 tsp olive oil and a pinch of salt</li>\n<li>½ yellow onion (75 g), diced</li>\n<li>6 large eggs</li>\n<li>1¼ cups (300 g) liquid egg whites</li>\n<li>½ cup (2 oz) shredded reduced-fat cheddar</li>\n<li>6 large (10-inch) low-carb tortillas, or 9 small 8-inch wraps</li>\n<li>To serve: 2 tbsp jarred salsa each; 1 clementine for Rob (10-inch\nonly); ¾ cup plain nonfat Greek yogurt for Maggie (8-inch only)</li>\n<li>Cooking spray and foil</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Heat the oven to 425°F. Dice the potato into ½-inch cubes, toss with\nthe olive oil and salt, and roast on a sheet pan 20 minutes.</li>\n<li>Stir the chorizo seasoning together in a small bowl, vinegar\nincluded.</li>\n<li>Heat a large skillet over high until very hot. Add the turkey, press\nit flat and leave it 3 minutes to brown, then break it up. If liquid\npools in the pan, spoon or pour it off and keep cooking on high until\nthe meat browns.</li>\n<li>Add the chorizo seasoning and cook 3 to 4 more minutes, until no\npink is left.</li>\n<li>Add the onion and cook 4 minutes, until soft. Move everything to a\nbowl.</li>\n<li>Whisk the eggs and egg whites. Wipe the pan, spray it and turn the\nheat to medium-low. Stir the eggs slowly 3 to 4 minutes, until just\nset.</li>\n<li>Fold in the chorizo, onion and potatoes. Cool 10 minutes. It makes\nabout 7½ cups of filling.</li>\n<li>Spoon 1¼ cups (about 180 g) onto each large tortilla, or a heaping ¾\ncup (about 120 g) onto each 8-inch wrap. Sprinkle the cheese evenly over\nall of them.</li>\n<li>Fold in the sides, roll up tight and wrap each one in foil.</li>\n<li><strong>Divide.</strong> Rob: 1 large burrito with 2 tbsp salsa and\n1 clementine; with 8-inch wraps, 2 burritos with 2 tbsp salsa and no\nclementine. Maggie: 1 large bur
