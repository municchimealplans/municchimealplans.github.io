<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Meal Plans">
<meta name="theme-color" content="#f5f2ec">
<title>Municchi Meal Plans</title>
<style>
:root{
  --bg:#f5f2ec; --card:#fffdf9; --ink:#1f1d1a; --muted:#6f6a62; --line:#e6e0d6;
  --rob:#1f4e79; --rob-soft:#e3ecf5; --mag:#b5531a; --mag-soft:#f8e6da;
  --accent:#2f6b4f; --accent-soft:#e2efe7; --tag:#fff0b8; --warn:#fdeccc;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#161513; --card:#201e1b; --ink:#f1ede6; --muted:#a59e93; --line:#35312c;
    --rob:#8db6de; --rob-soft:#1d2a37; --mag:#f0a072; --mag-soft:#3a2518;
    --accent:#7fc4a1; --accent-soft:#1d2e25; --tag:#4a4020; --warn:#3d3020; }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding-bottom:env(safe-area-inset-bottom)}
.wrap{max-width:720px;margin:0 auto;padding:0 14px 40px}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 10px) 0 8px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:0 14px;max-width:720px;margin:0 auto}
.brand h1{font-size:19px;margin:0;letter-spacing:.2px;font-weight:700}
.brand .sub{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:6px;padding:10px 14px 0;max-width:720px;margin:0 auto}
.tab{flex:1.12;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 4px;font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer}
.tab[data-tab=meals]{flex:.76}
.tab[aria-selected=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.datebar{display:flex;align-items:center;gap:8px;padding:10px 14px 0;max-width:720px;margin:0 auto}
.navbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:20px;line-height:1;cursor:pointer}
.navbtn:disabled{opacity:.35}
.dlabel{flex:1;text-align:center}
.dlabel b{display:block;font-size:17px}
.dlabel span{font-size:12px;color:var(--muted)}
.todaypill{background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:12px;border-radius:999px;padding:2px 9px;margin-left:6px}
.gotoday{border:1px solid var(--line);background:var(--card);color:var(--muted);font-size:12px;border-radius:999px;padding:2px 9px;margin-left:6px;cursor:pointer}
.portion{font-size:14px;color:var(--ink);margin-top:2px}
.mac{font-size:13px;color:var(--muted);margin-top:3px}
.mac b{color:var(--ink)}
.pp.R .mac b{color:var(--rob)} .pp.M .mac b{color:var(--mag)}
.rem{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.rem:last-child{border-bottom:none}
.rem .num{font-weight:700;color:var(--accent);min-width:18px;font-size:15px}
.rem .rb{flex:1;min-width:0}
.rem .rb label{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-size:15px}
.rem .rb input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--accent);flex:none}
.rem.done .rt{color:var(--muted);text-decoration:line-through}
.rem details{margin-top:6px;padding-top:6px}
.howto{display:inline-block;margin-top:4px;font-size:12px;font-weight:600;color:var(--accent);text-decoration:none;border:1px solid var(--accent-soft);background:var(--accent-soft);border-radius:999px;padding:2px 8px}
.strip{display:flex;gap:4px;padding:8px 14px 0;max-width:720px;margin:0 auto}
.strip button{flex:1;border:1px solid transparent;background:none;color:var(--muted);border-radius:10px;padding:4px 0;font-size:11px;cursor:pointer}
.strip button b{display:block;font-size:15px;color:var(--ink)}
.strip button.on{background:var(--card);border-color:var(--line)}
.strip button.today b{color:var(--accent)}
.strip button.today{position:relative}
.strip button.today::after{content:"";position:absolute;bottom:2px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--accent)}
main{padding-top:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:0 0 10px}
.banner{background:var(--warn);border-radius:12px;padding:10px 14px;margin-bottom:10px;font-size:14px}
.totals{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.tot{border-radius:12px;padding:8px 12px;font-size:13px}
.tot b{display:block;font-size:15px}
.tot.R{background:var(--rob-soft)} .tot.R b{color:var(--rob)}
.tot.M{background:var(--mag-soft)} .tot.M b{color:var(--mag)}
.chead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.slot{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--muted)}
.badge{font-size:11px;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:2px 8px;white-space:nowrap}
.dish{font-size:17px;font-weight:650;line-height:1.3}
.help{font-size:14px;color:var(--muted);margin-top:1px}
.people{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.pp{display:flex;gap:10px;align-items:flex-start}
.who{font-size:11px;font-weight:700;border-radius:6px;padding:2px 6px;min-width:52px;text-align:center;margin-top:2px}
.who.R{background:var(--rob-soft);color:var(--rob)} .who.M{background:var(--mag-soft);color:var(--mag)}
.pp .t{flex:1;font-size:14px}
.pp .t .n{font-weight:600}
.carbs{font-size:13px;font-weight:700;white-space:nowrap;margin-top:2px}
.carbrow{display:flex;gap:14px;margin-top:8px;font-size:13px}
.carbrow span b{font-weight:700}
.carbrow .R b{color:var(--rob)} .carbrow .M b{color:var(--mag)}
details{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--accent);list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸ ";} details[open]>summary::before{content:"▾ ";}
.recipe{font-size:15px}
.recipe p{margin:.5em 0}
.recipe ul,.recipe ol{padding-left:1.3em;margin:.4em 0}
.recipe li{margin:.25em 0}
.recipe table{border-collapse:collapse;width:100%;font-size:13px;margin:.5em 0}
.recipe th,.recipe td{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left}
.tag{background:var(--tag);border-radius:4px;padding:1px 5px;font-style:normal;font-size:13px}
h2.sec{font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:18px 2px 8px}
.check{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line);font-size:15px;cursor:pointer}
.check:last-child{border-bottom:none}
.check input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--accent);flex:none}
.check.done .lbl{color:var(--muted);text-decoration:line-through}
.gsec{font-weight:700;font-size:13px;margin:12px 0 2px;color:var(--muted)}
ol.ops{padding-left:1.4em;margin:.3em 0} ol.ops li{margin:.35em 0;font-size:15px}
.wtitle{font-size:20px;font-weight:700;margin:0}
.wmeta{font-size:13px;color:var(--muted);margin-top:2px}
.warm{font-size:14px;background:var(--accent-soft);border-radius:10px;padding:8px 10px;margin-top:10px}
.ex{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
.ex:last-child{border-bottom:none}
.ex input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--accent);flex:none}
.ex .body{flex:1;min-width:0}
.ex .nm{font-size:15px;font-weight:600}
.ex .nm .main{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;background:var(--ink);color:var(--bg);border-radius:4px;padding:1px 5px;margin-right:6px;vertical-align:2px}
.ex .sub{font-size:13px;color:var(--muted);margin-top:2px}
.ex .rx{text-align:right;flex:none;max-width:42%}
.ex .rx .s{font-size:15px;font-weight:700;white-space:nowrap}
.ex .rx .w{font-size:13px;color:var(--muted)}
.ex.done .nm{color:var(--muted);text-decoration:line-through}
.rob .wtitle{color:var(--rob)} .mag .wtitle{color:var(--mag)}
.exb{padding:10px 0;border-bottom:1px solid var(--line)}
.exb:last-child{border-bottom:none}
.exh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.exh .nm{font-size:15px;font-weight:650}
.exh .nm .main{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;background:var(--ink);color:var(--bg);border-radius:4px;padding:1px 5px;margin-right:6px;vertical-align:2px}
.exb .sub{font-size:13px;color:var(--muted);margin-top:2px}
.setting{font-size:13px;font-weight:600;margin-top:4px}
.setrow{display:flex;align-items:center;gap:10px;padding:6px 0 6px 2px;font-size:14px;cursor:pointer}
.setrow input{width:20px;height:20px;margin:0;accent-color:var(--accent);flex:none}
.setrow .sl{flex:1;min-width:0}
.setrow.wu .sl,.setrow.wu .sr{color:var(--muted)}
.setrow .sr{width:118px;text-align:right;white-space:nowrap}
.setrow .sw{width:86px;text-align:right;font-weight:700;white-space:nowrap}
.setrow .sw.empty{color:var(--muted);font-weight:400}
.setrow.done .sl,.setrow.done .sr,.setrow.done .sw{color:var(--muted);text-decoration:line-through}
.exh .howto{margin-top:0;flex:none}
.jump{display:block;width:100%;margin:0 0 10px;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--accent);font-weight:700;font-size:15px;cursor:pointer}
.gcount{font-size:15px;font-weight:700;margin-bottom:2px}
.syncstat{font-size:12px;color:var(--muted);margin-bottom:6px}
.grow{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px;cursor:pointer}
.grow input{width:22px;height:22px;margin:0;accent-color:var(--accent);flex:none}
.grow.done .gi{color:var(--muted);text-decoration:line-through}
.glist .gsec{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:14px 0 2px}
.rest{text-align:center;padding:30px 14px}
.rest b{font-size:20px;display:block;margin-bottom:6px}
.note{font-size:12px;color:var(--muted);margin:14px 2px}
</style>
</head>

ot":"Lunch","badge":"Made Sunday","R":{"name":"Buffalo chicken mac","help":"with broccoli, in a Buffalo cheese sauce","carbs":53,"cal":601,"pro":67,"fat":12,"portion":"1 container, 2¼ cups (460 g)"},"M":{"name":"Buffalo chicken mac","help":"with broccoli, in a Buffalo cheese sauce","carbs":38,"cal":431,"pro":48,"fat":9,"portion":"1 container, 1⅔ cups (330 g)"},"recipe":"w1:1:L_mac"},{"slot":"Dinner","badge":"Cook tonight","R":{"name":"Chicken shawarma bowls","help":"spiced chicken, rice, chickpeas, cucumber-tomato salad, tzatziki and feta","carbs":55,"cal":649,"pro":68,"fat":16,"portion":"6 oz (170 g) cooked chicken, ⅔ cup (110 g) rice, half the chickpeas and salad, 1 cup (50 g) romaine, half the tzatziki and 1½ tbsp (15 g) feta"},"M":{"name":"Chicken shawarma bowls","help":"spiced chicken, rice, chickpeas, cucumber-tomato salad, spinach, tzatziki and feta","carbs":39,"cal":477,"pro":50,"fat":14,"portion":"4 oz (110 g) cooked chicken, ⅓ cup (50 g) rice, half the chickpeas and salad, 1⅔ cups (75 g) romaine, 1 cup (30 g) spinach, half the tzatziki and 1½ tbsp (15 g) feta"},"recipe":"w1:1:D_shawarma"},{"slot":"Snack 1","badge":"Mixed last night","R":{"name":"Chocolate PB pudding","help":"","carbs":16,"cal":250,"pro":40,"fat":3,"portion":"265 g (about 1 cup plus 2 tbsp) in his container"},"M":{"name":"Chocolate PB pudding","help":"","carbs":13,"cal":185,"pro":29,"fat":3,"portion":"The rest, about 200 g (¾ cup plus 2 tbsp), in her container"},"recipe":"w1:1:S_choc"},{"slot":"Snack 2","badge":"","R":{"name":"Shake","help":"protein, milk, spinach, flax and collagen","carbs":13,"cal":288,"pro":44,"fat":4,"portion":"1 scoop Tripact PB & vanilla protein, 240 ml (1 cup) Fairlife fat-free milk, 2 cups of raw baby spinach, 1 tbsp ground flax, 1 scoop collagen"},"M":{"name":"Cottage cheese ranch dip","help":"cottage cheese with ranch, with pepper and cucumber to dip","carbs":16,"cal":180,"pro":20,"fat":4,"portion":"170 g 2% cottage cheese (about ¾ cup), 100 g yellow or orange bell pepper (about ⅔ pepper), 75 g English cucumber (about ¼ cucumber), with 1 tsp ranch seasoning"},"recipe":"w1:1:snack2:S_cottage"}],"tot":{"R":[2218,271,44,180],"M":[1614,183,36,144]}}},"recipes":{"1:B_burrito1":"<p><span class=\"tag\">Sunday prep: freeze Wednesday's and Friday's\nsausage links</span></p>\n<p><em>Makes 3 burritos each morning (2 for Rob, 1 for Maggie), made\nfresh.</em></p>\n<p><strong>Ingredients</strong></p>\n<ul>\n<li>6 Trader Joe's chicken breakfast sausage links (3 each)</li>\n<li>3 large eggs (2 for Rob, 1 for Maggie) and ¼ cup (60 g) liquid egg\nwhites (Maggie)</li>\n<li>A pinch each of salt and black pepper</li>\n<li>3½ tbsp (25 g) shredded reduced-fat cheddar</li>\n<li>3 small (8-inch) Olé low-carb wraps: 2 for Rob, 1 for Maggie</li>\n<li>4 tbsp jarred salsa (2 tbsp each)</li>\n<li>Cooking spray</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Air-fry the 6 sausage links at 400°F for 8 to 10 minutes, turning\nonce, until browned and 165°F inside. Slice them into coins.</li>\n<li>While they cook, whisk Rob's 2 eggs in one bowl and Maggie's egg\nwith the egg whites in another, each with a pinch of salt and\npepper.</li>\n<li>Heat a nonstick pan over medium-low and spray it. Pour Rob's eggs in\none side and Maggie's in the other and stir each slowly 2 to 3 minutes,\nuntil just set.</li>\n<li>Warm the wraps 15 seconds in the microwave so they roll without\ncracking.</li>\n<li>Rob: split his eggs, 3 sliced links and 2 tbsp (14 g) cheddar across\nhis 2 wraps. Maggie: her eggs, 3 sliced links and 1½ tbsp (10 g) cheddar\nin her wrap. Fold in the sides and roll up.</li>\n<li><strong>Divide.</strong> Rob: 2 burritos with 2 tbsp salsa. Maggie:\n1 burrito with 2 tbsp salsa. <strong>Store:</strong> Made fresh each\nmorning. On Sunday, Monday's 6 sausage links stay in the fridge;\nWednesday's and Friday's go in the freezer in two bags. Move each bag to\nthe fridge two nights before: Monday night for Wednesday, Wednesday\nnight for Friday.</li>\n</ol>\n<p><strong>Reheat</strong></p>\n<p>Best eaten fresh. A leftover burrito: wrap it in a damp paper towel\nand microwave 45 to 60 seconds.</p>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>419</td>\n<td>43 g</td>\n<td>31 g</td>\n<td>19 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>307</td>\n<td>37 g</td>\n<td>18 g</td>\n<td>12 g</td>\n</tr>\n</tbody>\n</table>\n","1:L_bigmac":"<p><span class=\"tag\">Sunday prep: pack all 6 bowls</span></p>\n<p><em>Makes 6 bowls (3 Rob, 3 Maggie).</em></p>\n<p><strong>Ingredients</strong></p>\n<ul>\n<li>5⅓ medium Yukon gold potatoes (900 g)</li>\n<li>1½ tbsp olive oil</li>\n<li>Potato seasoning: 1 tsp salt, 1 tsp garlic powder, ½ tsp black\npepper</li>\n<li>2½ lb (1,140 g) 95% lean ground beef</li>\n<li>Beef seasoning: 1 tsp onion powder, 1 tsp salt, ½ tsp black\npepper</li>\n<li>3½ romaine hearts (525 g), chopped</li>\n<li>4 Roma tomatoes (300 g)</li>\n<li>⅔ white onion (120 g)</li>\n<li>1¼ cups (180 g) dill pickle chips</li>\n<li>⅔ cup (72 g) shredded reduced-fat cheddar</li>\n<li>1 cup burger sauce (recipe above)</li>\n<li>Containers: 6 two-compartment containers, 6 small containers, 6\nsauce cups</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Cut the potatoes into ¾-inch cubes and toss them with the olive oil\nand the potato seasoning.</li>\n<li>Air-fry in two batches at 400°F, 18 to 20 minutes each, shaking\nhalfway, until browned and crisp at the edges.</li>\n<li>While they cook, heat a large skillet (cast iron or stainless, not\nnonstick) over high until very hot. Add the beef, press it flat and\nleave it 3 minutes to brown, then break it up and cook 2 more minutes.\nIf liquid pools in the pan, spoon or pour it off and keep cooking on\nhigh until the meat browns.</li>\n<li>Add the beef seasoning and cook 3 to 4 minutes more, until no pink\nis left. Drain the fat.</li>\n<li>Chop the romaine. Dice the tomatoes and the white onion.</li>\n<li><strong>Divide.</strong> Rob: each of his 3 bowls gets 1 cup (150 g)\ncooked beef and 1¼ cups air-fried potatoes (155 g cooked) in the big\nside; 1⅔ cups (75 g) romaine, ⅔ Roma tomato (50 g), 2 tbsp diced white\nonion (20 g), 3 tbsp (30 g) pickle chips and 2 tbsp (14 g) cheddar in\nthe small container; 3 tbsp burger sauce in a cup. Maggie: each of her 3\nbowls gets 1 cup (135 g) cooked beef and ½ cup air-fried potatoes (60 g\ncooked) in the big side; 2¼ cups (100 g) romaine, ⅔ Roma tomato (50 g),\n2 tbsp diced white onion (20 g), 3 tbsp (30 g) pickle chips and 1½ tbsp\n(10 g) cheddar in the small container; 2 tbsp burger sauce in a cup. If\nthe cooked amounts come out different, weigh as you pack: the cooked\namounts above are what each bowl gets. <strong>Store:</strong> All 6\nbowls in the fridge (Mon to Wed), with the sauce and cold toppings in\ntheir own containers.</li>\n</ol>\n<p><strong>Reheat</strong></p>\n<p>Microwave the beef and potatoes 1½ to 2 minutes, then add the cold\ntoppings and sauce.</p>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>588</td>\n<td>56 g</td>\n<td>49 g</td>\n<td>19 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>431</td>\n<td>47 g</td>\n<td>25 g</td>\n<td>16 g</td>\n</tr>\n</tbody>\n</table>\n","1:D_steak":"<p><strong>Ingredients</strong></p>\n<ul>\n<li>Sirloin steaks: about 9 oz raw for Rob, about 7¼ oz raw for\nMaggie</li>\n<li>Steak seasoning: ½ tsp salt, ¼ tsp black pepper, ¼ tsp garlic\npowder</li>\n<li>1¼ medium Yukon gold potatoes (215 g)</li>\n<li>4¼ cups (375 g) Brussels sprouts</li>\n<li>2 tsp olive oil</li>\n<li>Vegetable seasoning: ½ tsp salt, ½ tsp garlic powder, ¼ tsp black\npepper</li>\n<li>2 tbsp (10 g) grated parmesan</li>\n<li>Horseradish cream: ½ cup (110 g) plain nonfat Greek yogurt, 4 tsp\nprepared white horseradish, a pinch of salt</li>\n<li>Cooking spray</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Take the steaks out of the fridge 20 minutes before cooking and pat\nthem dry.</li>\n<li>Cut the potatoes into ¾-inch cubes and halve the Brussels\nsprouts.</li>\n<li>Toss the potatoes and sprouts with the olive oil and the vegetable\nseasoning.</li>\n<li>Air-fry at 400°F for 18 to 20 minutes, shaking halfway (two batches\nif they don't fit in one layer).</li>\n<li>Horseradish cream: stir the yogurt, horseradish and salt\ntogether.</li>\n<li>Season both steaks on both sides with the steak seasoning.</li>\n<li>Heat a cast-iron pan over high until it just starts to smoke, about\n3 to 4 minutes. Spray it.</li>\n<li>Sear the steaks 3 to 4 minutes a side (130°F inside for medium-rare,\n140°F for medium).</li>\n<li>Rest the steaks 5 minutes on a cutting board, then slice across the\ngrain.</li>\n<li>Toss the Brussels sprouts with the parmesan.</li>\n<li><strong>Divide.</strong> Rob: his 6½ oz (185 g) steak, ¾ cup\nair-fried potatoes (100 g cooked), a bit more than half the Brussels\nsprouts and half the horseradish cream. Maggie: her 5¼ oz (150 g) steak,\n⅓ cup air-fried potatoes (55 g cooked), the rest of the Brussels sprouts\nand half the horseradish cream.</li>\n</ol>\n<p><strong>Reheat</strong></p>\n<p>Best eaten fresh. Leftovers: slice the steak and warm it in a skillet\nover low, 1 to 2 minutes (the microwave overcooks it). Potatoes and\nBrussels sprouts: air fryer at 375°F, 4 to 5 minutes. Horseradish cream\nstays cold.</p>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>640</td>\n<td>72 g</td>\n<td>46 g</td>\n<td>21 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>500</td>\n<td>59 g</td>\n<td>32 g</td>\n<td>17 g</td>\n</tr>\n</tbody>\n</table>\n","1:S_apple":"<p><strong>Ingredients</strong></p>\n<ul>\n<li>2 Honeycrisp apples (1 each)</li>\n<li>Part-skim mozzarella string cheese: 2 sticks for Rob, 1 for\nMaggie</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Wash the apples. That's it: no prep, no mixing the night\nbefore.</li>\n<li><strong>Divide.</strong> Rob: 1 Honeycrisp apple (180 g) and 2\nstring cheese sticks. Maggie: 1 Honeycrisp apple (180 g) and 1 string\ncheese stick.</li>\n</ol>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>254</td>\n<td>15 g</td>\n<td>27 g</td>\n<td>10 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>174</td>\n<td>8 g</td>\n<td>26 g</td>\n<td>5 g</td>\n</tr>\n</tbody>\n</table>\n","1:snack2:S_mshake":"<p><b>Rob's shake:</b> 1 scoop Tripact PB & vanilla protein, 240 ml (1 cup) Fairlife fat-free milk, 2 cups of raw baby spinach, 1 tbsp ground flax, 1 scoop collagen. Blend until smooth. 288 cal, 44 g protein, 13 g carbs.</p><p><b>Maggie (shake):</b> ¾ scoop vanilla whey, 200 ml (¾ cup) Fairlife fat-free milk, a handful (about 1 cup) of raw baby spinach, 60 g mixed berries, fresh or thawed frozen (about ⅓ cup). 204 cal, 32 g protein, 16 g carbs.</p>","1:B_oats_cinn":"<p><span class=\"tag\">Made the night before: Monday and Wednesday\nnights</span></p>\n<p><em>Makes one batch, divided into 2 jars (1 Rob, 1 Maggie), made the\nnight before.</em></p>\n<p><strong>Ingredients</strong></p>\n<ul>\n<li>1⅓ cups (120 g) old-fashioned rolled oats</li>\n<li>1½ tbsp (20 g) chia seeds</li>\n<li>1 tsp cinnamon, plus a pinch for the morning</li>\n<li>1¼ cups (300 ml) Fairlife fat-free milk</li>\n<li>½ cup (125 g) plain nonfat Greek yogurt</li>\n<li>2 tbsp sugar-free maple syrup</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>The night before (Monday night for Tuesday, Wednesday night for\nThursday), get out one mixing bowl and two 16-oz mason jars labeled\n\"Rob\" and \"Maggie\".</li>\n<li>In the bowl, stir the oats, chia and cinnamon together.</li>\n<li>Pour in the Fairlife, Greek yogurt and syrup and stir until smooth.\nIt looks loose now and thickens overnight.</li>\n<li>Set Rob's jar on the scale and zero it, then divide as below.</li>\n<li><strong>Divide.</strong> Rob: 330 g (about 1⅓ cups) in his jar.\nMaggie: the rest, about 235 g (1 cup), in her jar.\n<strong>Store:</strong> Make both jars the night before (Monday night\nfor Tuesday, Wednesday night for Thursday) and keep them in the fridge.\n<strong>To eat:</strong> Stir, add a pinch of cinnamon on top and eat it\ncold.</li>\n</ol>\n<p><strong>Reheat</strong></p>\n<p>None. It is eaten cold, straight from the fridge.</p>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>430</td>\n<td>28 g</td>\n<td>62 g</td>\n<td>8 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>306</td>\n<td>20 g</td>\n<td>44 g</td>\n<td>6 g</td>\n</tr>\n</tbody>\n</table>\n","1:D_orange":"<p><span class=\"tag\">Sunday prep: the raw chicken goes in the fridge,\nnot the freezer</span></p>\n<p><strong>Ingredients</strong></p>\n<ul>\n<li>15¼ oz (435 g) chicken breast</li>\n<li>¼ tsp salt and a pinch of black pepper</li>\n<li>2½ tbsp cornstarch, plus 1 tsp if the sauce needs it</li>\n<li>Sauce: 7 tbsp (105 ml) orange juice, 2¼ tbsp low-sodium soy sauce,\n2½ tsp honey, 2 garlic cloves (grated), 1 tbsp grated fresh ginger, ¼\ntsp red pepper flakes</li>\n<li>4¾ cups (300 g) snap peas</li>\n<li>1 tsp olive oil and a pinch of salt</li>\n<li>½ cup dry white rice</li>\n<li>Cooking spray</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Cook the rice: bring ½ cup dry white rice and 1 cup water to a boil,\ncover, turn the heat to low and simmer 15 minutes, then let it sit 5\nminutes off the heat and fluff with a fork. (A microwave rice pouch\nworks too.)</li>\n<li>Cut the chicken into 1-inch cubes. Season with the salt and\npepper.</li>\n<li>Toss the chicken in the cornstarch until coated.</li>\n<li>Spray the air fryer basket, add the chicken in one layer and spray\nthe tops. Air-fry at 400°F for 12 to 14 minutes, shaking once.</li>\n<li>Sauce: in a small pan over medium, simmer the orange juice, soy\nsauce, honey, garlic, ginger and red pepper flakes 2 minutes, until\nglossy. If it stays thin, stir in 1 tsp cornstarch mixed with 1 tbsp\nwater and simmer 30 seconds.</li>\n<li>Toss the chicken in the sauce.</li>\n<li>Heat the olive oil in a skillet over high. Stir-fry the snap peas\nwith a pinch of salt, 2 minutes.</li>\n<li><strong>Divide.</strong> Rob: 6 oz (170 g) cooked chicken in sauce,\n¾ cup (130 g) rice and half the snap peas. Maggie: 5½ oz (160 g) cooked\nchicken in sauce, ⅓ cup (65 g) rice and half the snap peas.</li>\n</ol>\n<p><strong>Reheat</strong></p>\n<p>Microwave the chicken and rice covered 1½ to 2 minutes, stirring\nhalfway, and the snap peas 30 seconds. For crispier chicken, air fryer\nat 375°F for 3 minutes.</p>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>642</td>\n<td>60 g</td>\n<td>74 g</td>\n<td>10 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>501</td>\n<td>55 g</td>\n<td>49 g</td>\n<td>8 g</td>\n</tr>\n</tbody>\n</table>\n","1:snack2:S_eggs":"<p><b>Rob's shake:</b> 1 scoop Tripact PB & vanilla protein, 240 ml (1 cup) Fairlife fat-free milk, 2 cups of raw baby spinach, 1 tbsp ground flax, 1 scoop collagen. Blend until smooth. 288 cal, 44 g protein, 13 g carbs.</p><p><b>Maggie (edamame + egg):</b> 85 g frozen shelled edamame (about ½ cup), 1 egg. 174 cal, 16 g protein, 8 g carbs.</p>","1:D_parm":"<p><span class=\"tag\">Sunday prep: bag and freeze the raw\nchicken</span></p>\n<p><strong>Ingredients</strong></p>\n<ul>\n<li>13½ oz (380 g) chicken breast: 8 oz (225 g) for Rob, 5½ oz (155 g)\nfor Maggie</li>\n<li>¼ tsp salt and ¼ tsp black pepper</li>\n<li>Coating: ⅔ cup (35 g) panko, 3 tbsp (14 g) grated parmesan, ½ tsp\nItalian seasoning, ¼ tsp garlic powder</li>\n<li>3½ tbsp (50 g) liquid egg whites</li>\n<li>1 cup (275 g) marinara</li>\n<li>⅓ cup (34 g) shredded part-skim mozzarella</li>\n<li>1 medium zucchini (225 g)</li>\n<li>A pinch of salt and ¼ tsp garlic powder for the zucchini</li>\n<li>1¾ oz (50 g) dry spaghetti, plus 1 tbsp salt for the water</li>\n<li>Cooking spray</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Two nights before (Monday night for Wednesday, Friday night for\nSunday), move the raw chicken from the freezer to the fridge.</li>\n<li>Put a pot of water with 1 tbsp salt on to boil.</li>\n<li>Butterfly each chicken breast: slice it horizontally almost all the\nway through and open it like a book. Season with the salt and\npepper.</li>\n<li>Mix the coating on a plate. Pour the egg whites into a shallow\nbowl.</li>\n<li>Dip each piece in the egg white, then press it into the coating on\nboth sides.</li>\n<li>Spray the air fryer basket, lay in the chicken and spray the tops.\nAir-fry at 400°F for 10 to 12 minutes, until 165°F.</li>\n<li>Meanwhile cook the spaghetti as the package says and drain.</li>\n<li>Slice the zucchini into half-moons. Cook in a sprayed pan over\nmedium-high with the salt and garlic powder, 4 minutes.</li>\n<li>Spoon 2 tbsp marinara over each piece of chicken and top with the\nmozzarella (3 tbsp (20 g) mozzarella on Rob's, 2 tbsp (14 g) mozzarella\non Maggie's). Air-fry 2 more minutes, until melted.</li>\n<li>Pour the rest of the marinara into the zucchini pan to warm, then\ntoss in the spaghetti.</li>\n<li><strong>Divide.</strong> Rob: his chicken parm, 6 oz (170 g) cooked\nchicken, with ½ cup cooked spaghetti (1 oz dry) and just under half the\nzucchini and sauce. Maggie: her chicken parm, 4 oz (115 g) cooked\nchicken, with ½ cup cooked spaghetti (1 oz dry) and just over half the\nzucchini and sauce.</li>\n</ol>\n<p><strong>Reheat</strong></p>\n<p>Best eaten fresh. Leftovers: chicken in the air fryer at 375°F, 4 to\n5 minutes (the microwave makes the breading soggy). Pasta and zucchini:\nmicrowave covered 1 to 1½ minutes.</p>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>645</td>\n<td>71 g</td>\n<td>48 g</td>\n<td>17 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>502</td>\n<td>51 g</td>\n<td>43 g</td>\n<td>13 g</td>\n</tr>\n</tbody>\n</table>\n","1:snack2:S_cottage":"<p><b>Rob's shake:</b> 1 scoop Tripact PB & vanilla protein, 240 ml (1 cup) Fairlife fat-free milk, 2 cups of raw baby spinach, 1 tbsp ground flax, 1 scoop collagen. Blend until smooth. 288 cal, 44 g protein, 13 g carbs.</p><p><b>Maggie (cottage cheese ranch dip):</b> 170 g 2% cottage cheese (about ¾ cup), 100 g yellow or orange bell pepper (about ⅔ pepper), 75 g English cucumber (about ¼ cucumber), with 1 tsp ranch seasoning stirred into the cottage cheese. 180 cal, 20 g protein, 16 g carbs.</p>","1:L_mac":"<p><span class=\"tag\">Sunday prep: the whole batch</span></p>\n<p><em>Makes 8 containers (4 Rob, 4 Maggie).</em></p>\n<p><strong>Ingredients</strong></p>\n<ul>\n<li>3 lb (1,360 g) chicken breast</li>\n<li>Chicken seasoning: 1 tsp salt, 1 tsp garlic powder, 1 tsp onion\npowder, 1 tsp smoked paprika, ½ tsp black pepper (plus 2 tbsp Frank's\nRedHot if you want more kick)</li>\n<li>1 lb (454 g) elbow pasta, plus 1 tbsp salt for the water</li>\n<li>4 cups (300 g) broccoli florets</li>\n<li>24 oz (680 g) 2% cottage cheese</li>\n<li>1½ cups (360 ml) Fairlife fat-free milk</li>\n<li>1½ cups (6 oz) shredded reduced-fat cheddar</li>\n<li>½ cup Frank's RedHot Original</li>\n<li>2 to 3 tbsp ranch seasoning</li>\n<li>Cooking spray</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Heat the oven to 425°F and spray a sheet pan.</li>\n<li>Lay out the chicken and season both sides with the chicken seasoning\n(toss it in the Frank's first if using). Spray the tops.</li>\n<li>Bake 18 to 22 minutes, until 165°F inside. Rest 5 minutes, then dice\ninto ½-inch pieces.</li>\n<li>Meanwhile bring a big pot of water and 1 tbsp salt to a boil. Cook\nthe pasta 1 minute less than the package says.</li>\n<li>For the last 5 minutes, set a steamer basket of broccoli over the\npot (or drop the florets into the water for the last 3). Drain.</li>\n<li>Blend the cottage cheese with 1 cup of the Fairlife until completely\nsmooth.</li>\n<li>Pour it into a pot over low heat. Add the cheddar, the ½ cup Frank's\nand 2 tbsp ranch seasoning. Stir 4 to 5 minutes until melted. Don't let\nit boil.</li>\n<li>Taste. Add up to 1 more tbsp ranch, and up to ½ cup more Fairlife,\nuntil it looks like thick queso.</li>\n<li>Stir in the chicken, pasta and broccoli.</li>\n<li><strong>Divide.</strong> Rob: 4 containers of 2¼ cups (450 g) each.\nMaggie: 4 containers of 1⅔ cups (330 g) each. <strong>Store:</strong>\nAll 8 containers in the freezer. Two nights before each lunch, move that\nday's 2 containers to the fridge: Tuesday night for Thursday, Wednesday\nnight for Friday, Thursday night for Saturday, Friday night for Sunday.\nCooked food keeps 3 to 4 days in the fridge, which is why these start\nfrozen.</li>\n</ol>\n<p><strong>Reheat</strong></p>\n<p>Microwave covered 2½ to 3 minutes, stirring halfway, until hot in the\nmiddle. If it is still partly frozen, run it 2 minutes on defrost\nfirst.</p>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>588</td>\n<td>66 g</td>\n<td>51 g</td>\n<td>12 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>431</td>\n<td>48 g</td>\n<td>38 g</td>\n<td>9 g</td>\n</tr>\n</tbody>\n</table>\n","1:D_philly":"<p><span class=\"tag\">Sunday prep: bag and freeze the raw\nsteak</span></p>\n<p><strong>Ingredients</strong></p>\n<ul>\n<li>13½ oz (385 g) sirloin</li>\n<li>3 green bell peppers (480 g)</li>\n<li>¾ yellow onion (135 g)</li>\n<li>2 tsp olive oil and ¼ tsp salt</li>\n<li>Steak seasoning: 1 tbsp Worcestershire, ½ tsp garlic powder, ¼ tsp\nsalt, ¼ tsp black pepper</li>\n<li>3 slices provolone</li>\n<li>Rice: ⅔ cup (95 g) cooked (a microwave pouch is easiest)</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Two nights before (Tuesday night), move the raw steak from the\nfreezer to the fridge.</li>\n<li>Slice the steak paper-thin across the grain. It's easiest while it's\nstill a little frozen.</li>\n<li>Rice: heat a microwave rice pouch (90 seconds) and measure out what\nyou need below; the rest keeps 4 days in the fridge.</li>\n<li>Slice the peppers and onion into strips.</li>\n<li>Heat the olive oil in a large skillet over medium-high. Add the\npeppers, onion and salt and cook 8 to 10 minutes, stirring, until soft\nand browned. Move them to a plate.</li>\n<li>Turn the heat to high. Add the steak in one layer with the\nWorcestershire, garlic powder, salt and pepper. Sear 2 to 3 minutes,\ntossing, until no pink is left.</li>\n<li>Make two piles in the pan, Rob's a little bigger. Top each with half\nthe peppers and onions, lay the provolone on top (Rob 2 slices, Maggie\n1), cover and cook 1 minute to melt.</li>\n<li><strong>Divide.</strong> Rob: his pile, 6 oz (170 g) cooked steak\nwith peppers, onions and 2 slices provolone, over ¼ cup (35 g) rice.\nMaggie: her pile, 4¼ oz (120 g) cooked steak with peppers, onions and 1\nslice provolone, over ⅓ cup (60 g) rice.</li>\n</ol>\n<p><strong>Reheat</strong></p>\n<p>Microwave covered 1½ to 2 minutes, stirring halfway.</p>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>642</td>\n<td>64 g</td>\n<td>32 g</td>\n<td>28 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>497</td>\n<td>45 g</td>\n<td>37 g</td>\n<td>19 g</td>\n</tr>\n</tbody>\n</table>\n","1:D_pizza":"<p><span class=\"tag\">Sunday prep: bag and freeze the raw\nchicken</span></p>\n<p><strong>Ingredients</strong></p>\n<ul>\n<li>1 chicken breast, 8½ oz (245 g) raw</li>\n<li>Seasoning: ½ tsp Italian seasoning, ¼ tsp garlic powder, a pinch of\nsalt</li>\n<li>3 large (10-inch) low-carb tortillas: 2 for Rob, 1 for Maggie (with\n8-inch wraps: 3 and 2)</li>\n<li>⅔ cup (150 g) marinara</li>\n<li>65 g shredded part-skim mozzarella</li>\n<li>20 slices (35 g) turkey pepperoni</li>\n<li>⅔ yellow or orange bell pepper (100 g)</li>\n<li>⅓ yellow onion (50 g)</li>\n<li>Salad: 3¼ cups (150 g) chopped romaine, ⅓ English cucumber (100 g),\n1 cup (30 g) baby spinach for Maggie, 4 tbsp light balsamic\nvinaigrette</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Two nights before (Wednesday night), move the raw chicken from the\nfreezer to the fridge.</li>\n<li>Season the chicken and air-fry at 400°F for 14 minutes, until 165°F.\nRest 5 minutes and dice.</li>\n<li>Heat the oven to 425°F. Slice the pepper and onion thin.</li>\n<li>Lay the tortillas on a sheet pan and bake 3 minutes to crisp\nthem.</li>\n<li>Top Rob's 2 tortillas with 0 tsp (0 g) marinara, ⅓ cup (35 g)\nmozzarella, 12 pepperoni slices, ⅔ cup (85 g) diced chicken and half the\npepper and onion, split between them.</li>\n<li>Top Maggie's tortilla with 0 tsp (0 g) marinara, ¼ cup (28 g)\nmozzarella, 8 pepperoni slices, ⅔ cup (90 g) diced chicken and the other\nhalf of the pepper and onion.</li>\n<li>Bake 6 to 8 minutes, until the cheese bubbles and the edges are\ncrisp.</li>\n<li>Salad: slice the cucumber and toss each person's greens with 2 tbsp\nvinaigrette.</li>\n<li><strong>Divide.</strong> Rob: his 2 pizzas with a salad of 1⅔ cups\n(75 g) romaine, ¼ English cucumber (50 g) and 2 tbsp vinaigrette.\nMaggie: her pizza with a salad of 1⅔ cups (75 g) romaine, 1 cup (30 g)\nspinach, ¼ English cucumber (50 g) and 2 tbsp vinaigrette.</li>\n</ol>\n<p><strong>Reheat</strong></p>\n<p>Best eaten fresh. Leftovers: air fryer at 350°F, 3 to 4 minutes, or a\ncovered dry skillet over medium-low, 3 to 4 minutes, until the bottom is\ncrisp. Salad stays cold.</p>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>651</td>\n<td>57 g</td>\n<td>76 g</td>\n<td>26 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>502</td>\n<td>49 g</td>\n<td>47 g</td>\n<td>20 g</td>\n</tr>\n</tbody>\n</table>\n","1:snack2:S_jerky":"<p><b>Rob's shake:</b> 1 scoop Tripact PB & vanilla protein, 240 ml (1 cup) Fairlife fat-free milk, 2 cups of raw baby spinach, 1 tbsp ground flax, 1 scoop collagen. Blend until smooth. 288 cal, 44 g protein, 13 g carbs.</p><p><b>Maggie (jerky + pear):</b> 28 g (1 oz) original beef jerky, 180 g Bartlett pear (about 1 pear). 183 cal, 11 g protein, 33 g carbs.</p>","1:B_waffles":"<p><strong>Ingredients</strong></p>\n<ul>\n<li>1 cup (100 g) Kodiak Power Cakes mix</li>\n<li>¾ cup (200 ml) Fairlife fat-free milk</li>\n<li>2 large eggs (1 each)</li>\n<li>½ tsp cinnamon</li>\n<li>1 banana (Rob)</li>\n<li>⅔ cup mixed berries (Maggie)</li>\n<li>2 tbsp sugar-free maple syrup</li>\n<li>Cooking spray</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Plug in the waffle iron to heat.</li>\n<li>Rob's batter: whisk ½ cup (60 g) Kodiak mix, ½ cup (120 ml)\nFairlife, 1 egg and ¼ tsp cinnamon until just combined. Let it sit 2\nminutes to thicken.</li>\n<li>Maggie's batter: whisk ⅓ cup (40 g) Kodiak mix, ⅓ cup (80 ml)\nFairlife, 1 egg and ¼ tsp cinnamon the same way.</li>\n<li>Spray the waffle iron. Cook Rob's batter about 4 minutes, until\ngolden. Spray again and cook Maggie's.</li>\n<li>Slice Rob's banana. Rinse Maggie's berries (or thaw frozen ones in\nthe microwave 30 seconds).</li>\n<li><strong>Divide.</strong> Rob: his waffles topped with 1 banana (100\ng), sliced, and 1 tbsp sugar-free maple syrup. Maggie: her waffles\ntopped with ⅔ cup (100 g) berries and 1 tbsp sugar-free maple\nsyrup.</li>\n</ol>\n<p><strong>Reheat</strong></p>\n<p>Best eaten fresh. Leftover waffles: toaster or air fryer at 350°F, 2\nto 3 minutes, until crisp (the microwave makes them soft).</p>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>425</td>\n<td>30 g</td>\n<td>63 g</td>\n<td>7 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>301</td>\n<td>22 g</td>\n<td>40 g</td>\n<td>7 g</td>\n</tr>\n</tbody>\n</table>\n","1:D_shawarma":"<p><span class=\"tag\">Sunday prep: bag and freeze the raw\nchicken</span></p>\n<p><strong>Ingredients</strong></p>\n<ul>\n<li>13½ oz (385 g) chicken breast</li>\n<li>Marinade: 2 tsp olive oil, 1 tsp cumin, 1 tsp ground coriander, 1\ntsp paprika, ½ tsp turmeric, ½ tsp salt, ¼ tsp black pepper, 2 garlic\ncloves (minced), juice of ½ lemon</li>\n<li>¾ cup (120 g) canned chickpeas, plus a pinch each of salt and\ncumin</li>\n<li>Salad: ½ English cucumber (150 g), 2 Roma tomatoes (150 g), a pinch\nof salt</li>\n<li>Tzatziki: ½ cup (110 g) plain nonfat Greek yogurt, a 2-inch piece of\ncucumber, 1 garlic clove, ½ tsp dried dill, juice of ½ lemon, a pinch of\nsalt</li>\n<li>2⅔ cups (125 g) chopped romaine</li>\n<li>1 cup (30 g) baby spinach (Maggie)</li>\n<li>1½ tbsp (15 g) crumbled feta (Maggie)</li>\n<li>½ cup dry white rice</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Two nights before (Thursday night), move the raw chicken from the\nfreezer to the fridge.</li>\n<li>Cook the rice: bring ½ cup dry white rice and 1 cup water to a boil,\ncover, turn the heat to low and simmer 15 minutes, then let it sit 5\nminutes off the heat and fluff with a fork. (A microwave rice pouch\nworks too.)</li>\n<li>Cut the chicken into strips and toss with the marinade. Let it sit\n10 minutes (or marinate overnight).</li>\n<li>Rinse the chickpeas, pat them dry and toss with the salt and\ncumin.</li>\n<li>Air-fry the chicken and chickpeas at 400°F for about 14 minutes,\nshaking once, until the chicken is 165°F.</li>\n<li>Salad: dice the cucumber and tomatoes and toss with a pinch of\nsalt.</li>\n<li>Tzatziki: grate the 2-inch piece of cucumber, squeeze it dry, and\nstir it into the yogurt with the grated garlic, dill, lemon juice and\nsalt.</li>\n<li><strong>Divide.</strong> Rob: 6 oz (170 g) cooked chicken, ¾ cup\n(135 g) rice, half the chickpeas and salad, 1 cup (50 g) romaine and\nhalf the tzatziki. Maggie: 4¼ oz (120 g) cooked chicken, ⅓ cup (60 g)\nrice, half the chickpeas and salad, 1⅔ cups (75 g) romaine, 1 cup (30 g)\nspinach, half the tzatziki and 1½ tbsp (15 g) feta.</li>\n</ol>\n<p><strong>Reheat</strong></p>\n<p>Microwave the chicken, chickpeas and rice covered 1½ minutes. The\nsalad, tzatziki and feta stay cold.</p>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>642</td>\n<td>66 g</td>\n<td>61 g</td>\n<td>13 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>502</td>\n<td>52 g</td>\n<td>42 g</td>\n<td>14 g</td>\n</tr>\n</tbody>\n</table>\n","1:B_kodiak_apple":"<p><strong>Ingredients</strong></p>\n<ul>\n<li>1 cup (110 g) Kodiak Power Cakes mix</li>\n<li>¾ cup (200 ml) Fairlife fat-free milk</li>\n<li>2 large eggs (1 each)</li>\n<li>½ tsp cinnamon</li>\n<li>1 Honeycrisp apple (220 g)</li>\n<li>2 tbsp sugar-free maple syrup</li>\n<li>Cooking spray</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Cinnamon apples: dice the apple, then cook it in a sprayed pan over\nmedium with a pinch of cinnamon, 4 to 5 minutes, until soft. Set\naside.</li>\n<li>Rob's batter: whisk ⅔ cup (70 g) Kodiak mix, ½ cup (120 ml)\nFairlife, 1 egg and ¼ tsp cinnamon until just combined. Let it sit 2\nminutes to thicken.</li>\n<li>Maggie's batter: whisk ⅓ cup (40 g) Kodiak mix, ⅓ cup (80 ml)\nFairlife, 1 egg and ¼ tsp cinnamon the same way.</li>\n<li>Heat a large nonstick pan over medium and spray it. Pour ¼-cup\npancakes and cook 2 minutes a side.</li>\n<li>Cook Rob's batter first and keep it warm in a 200°F oven, then cook\nMaggie's.</li>\n<li><strong>Divide.</strong> Rob: his pancakes topped with a bit more\nthan half the cinnamon apples and 1 tbsp sugar-free maple syrup. Maggie:\nher pancakes topped with the rest of the apples and 1 tbsp sugar-free\nmaple syrup.</li>\n</ol>\n<p><strong>Reheat</strong></p>\n<p>Best eaten fresh. Leftover pancakes: microwave 30 to 45 seconds, or a\ndry skillet over medium, 1 minute a side. Warm the apples 30 seconds in\nthe microwave.</p>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>434</td>\n<td>32 g</td>\n<td>63 g</td>\n<td>8 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>303</td>\n<td>21 g</td>\n<td>42 g</td>\n<td>6 g</td>\n</tr>\n</tbody>\n</table>\n","2:B_eggbites":"<p><span class=\"tag\">Sunday prep: make the whole batch</span></p>\n<p><em>Makes 18 egg bites.</em></p>\n<p><strong>Ingredients</strong></p>\n<ul>\n<li>9 slices turkey bacon</li>\n<li>1 red bell pepper (110 g), diced</li>\n<li>12 large eggs</li>\n<li>1½ cups (360 g) liquid egg whites</li>\n<li>1½ cups (340 g) 2% cottage cheese</li>\n<li>½ tsp salt, ¼ tsp black pepper, ½ tsp garlic powder</li>\n<li>¾ cup (3 oz) shredded reduced-fat cheddar</li>\n<li>To serve, each breakfast: 1 Trader Joe's English muffin for Rob\n(toast it from frozen)</li>\n<li>Cooking spray and two 12-cup muffin tins</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Heat the oven to 325°F. Spray 18 muffin cups well.</li>\n<li>Cook the turkey bacon in a skillet over medium, 3 to 4 minutes a\nside, until crisp. Cool and crumble.</li>\n<li>Dice the bell pepper.</li>\n<li>In a blender combine the eggs, egg whites, cottage cheese, salt,\npepper and garlic powder. Blend 30 seconds until smooth.</li>\n<li>Divide the bacon, pepper and cheddar among the 18 cups.</li>\n<li>Pour the egg mixture over them, about ¾ full.</li>\n<li>Bake 22 to 25 minutes, until just set (the centers barely\njiggle).</li>\n<li>Cool 10 minutes, run a knife around each one and pop them out.</li>\n<li><strong>Divide.</strong> Rob: 3 egg bites with 1 Trader Joe's\nEnglish muffin, toasted. Maggie: 3 egg bites. <strong>Store:</strong> 12\negg bites in the fridge (Mon, Wed), 6 in a freezer bag in the freezer\n(Fri). Move Friday's to the fridge Wednesday night.</li>\n</ol>\n<p><strong>Reheat</strong></p>\n<p>Microwave 45 to 60 seconds from the fridge or 1½ minutes from\nfrozen.</p>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>442</td>\n<td>37 g</td>\n<td>29 g</td>\n<td>19 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>312</td>\n<td>32 g</td>\n<td>5 g</td>\n<td>18 g</td>\n</tr>\n</tbody>\n</table>\n","2:L_salad":"<p><span class=\"tag\">Sunday prep: cook the chicken and cut the\nvegetables</span></p>\n<p><em>Makes 6 salads (3 Rob, 3 Maggie): the chicken is cooked Sunday,\nthe salads are built each morning.</em></p>\n<p><strong>Ingredients</strong></p>\n<ul>\n<li>2¾ lb (1,290 g) raw chicken breast</li>\n<li>Marinade: 3 tbsp low-sodium soy sauce, 1 tbsp honey, 1 tbsp toasted\nsesame oil, juice of 1 lime, 3 garlic cloves (grated), 1 tbsp grated\nfresh ginger, ¼ tsp black pepper</li>\n<li>Spring mix, about 18 oz (510 g)</li>\n<li>6 cups (420 g) shredded red cabbage (about ½ small head)</li>\n<li>3 bell peppers (red, yellow or orange; 450 g)</li>\n<li>Roasted sunflower seed kernels: 1½ tbsp (14 g) per Rob salad, 1 tbsp\n(9 g) per Maggie salad</li>\n<li>Trader Joe's Thai Style Peanut dressing: 2 tbsp per Rob salad, 1½\ntbsp per Maggie salad</li>\n<li>Containers: 6 large containers and 6 sauce cups</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Sunday: whisk the marinade in a bowl or zip-top bag, add the chicken\nand turn to coat. Marinate 30 minutes (or overnight in the fridge).</li>\n<li>Heat the oven to 425°F and spray a sheet pan. Lay out the chicken,\nleaving the extra marinade behind, and bake 18 to 22 minutes, until\n165°F.</li>\n<li>Rest 10 minutes, slice thin and refrigerate in one container once\ncool.</li>\n<li>Sunday: slice the peppers thin and shred the cabbage; keep them\ntogether in one container in the fridge.</li>\n<li>Each morning (5 minutes): in 2 containers, layer the spring mix,\ncabbage and peppers, then the chicken (1⅓ cups (185 g) sliced chicken\nfor Rob, 1 cup (125 g) sliced chicken for Maggie) and the sunflower\nseeds.</li>\n<li>Measure the dressing into sauce cups: 2 tbsp for Rob, 1½ tbsp for\nMaggie.</li>\n<li><strong>Divide.</strong> Rob: 1⅓ cups (185 g) sliced chicken, 3 cups\n(85 g) spring mix, 1 cup (70 g) shredded red cabbage, ½ bell pepper (75\ng), 1½ tbsp roasted sunflower seed kernels and 2 tbsp dressing. Maggie:\n1 cup (125 g) sliced chicken, 3 cups (85 g) spring mix, 1 cup (70 g)\nshredded red cabbage, ½ bell pepper (75 g), 1 tbsp roasted sunflower\nseed kernels and 1½ tbsp dressing. <strong>Store:</strong> The sliced\nchicken and the cut peppers and cabbage stay in the fridge in their own\ncontainers; the salads are built each morning.</li>\n</ol>\n<p><strong>Reheat</strong></p>\n<p>Eat it cold. Dress it right before you eat so the greens stay\ncrisp.</p>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>604</td>\n<td>66 g</td>\n<td>31 g</td>\n<td>24 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>437</td>\n<td>46 g</td>\n<td>26 g</td>\n<td>17 g</td>\n</tr>\n</tbody>\n</table>\n","2:D_pork":"<p><strong>Ingredients</strong></p>\n<ul>\n<li>1 pork tenderloin, about 1¼ lb (550 g) raw</li>\n<li>Rub: ¾ tsp salt, ½ tsp black pepper, 1 tsp garlic powder, 1 tsp\nsmoked paprika</li>\n<li>2¼ medium sweet potatoes (435 g)</li>\n<li>3 cups (300 g) green beans, trimmed</li>\n<li>2½ tsp olive oil</li>\n<li>½ tsp salt and ¼ tsp black pepper for the vegetables</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Heat the oven to 425°F.</li>\n<li>Cut the sweet potatoes into ¾-inch cubes. Toss with 1½ tsp of the\nolive oil, the salt and the pepper on a sheet pan. Roast 25 minutes in\nall.</li>\n<li>Pat the pork dry and coat it with the rub.</li>\n<li>Heat the last 1 tsp olive oil in an oven-safe skillet over\nmedium-high. Sear the pork on all sides, about 6 minutes in all.</li>\n<li>Move the skillet to the oven and roast 15 to 20 minutes, until 145°F\ninside.</li>\n<li>When the sweet potatoes have 12 minutes left, add the green beans to\nthe sheet pan and toss.</li>\n<li>Rest the pork 5 minutes and slice it ½ inch thick.</li>\n<li><strong>Divide.</strong> Rob: 7 oz (200 g) sliced pork, 1⅔ cups\nroasted sweet potato (215 g cooked) and half the green beans. Maggie: 7\noz (195 g) sliced pork, ¾ cup roasted sweet potato (110 g cooked) and\nhalf the green beans.</li>\n</ol>\n<p><strong>Reheat</strong></p>\n<p>Microwave covered at half power 2 minutes so the pork stays juicy, or\nslice it and warm in a skillet over low, 2 minutes. Sweet potato and\ngreen beans: microwave covered 1 minute.</p>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>639</td>\n<td>60 g</td>\n<td>68 g</td>\n<td>15 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>499</td>\n<td>56 g</td>\n<td>41 g</td>\n<td>12 g</td>\n</tr>\n</tbody>\n</table>\n","2:S_apple":"<p><strong>Ingredients</strong></p>\n<ul>\n<li>2 Honeycrisp apples (1 each)</li>\n<li>Part-skim mozzarella string cheese: 2 sticks for Rob, 1 for\nMaggie</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Wash the apples. That's it: no prep, no mixing the night\nbefore.</li>\n<li><strong>Divide.</strong> Rob: 1 Honeycrisp apple (180 g) and 2\nstring cheese sticks. Maggie: 1 Honeycrisp apple (180 g) and 1 string\ncheese stick.</li>\n</ol>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>254</td>\n<td>15 g</td>\n<td>27 g</td>\n<td>10 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>174</td>\n<td>8 g</td>\n<td>26 g</td>\n<td>5 g</td>\n</tr>\n</tbody>\n</table>\n","2:snack2:S_mshake":"<p><b>Rob's shake:</b> 1 scoop Tripact PB & vanilla protein, 240 ml (1 cup) Fairlife fat-free milk, 2 cups of raw baby spinach, 1 tbsp ground flax, 1 scoop collagen. Blend until smooth. 288 cal, 44 g protein, 13 g carbs.</p><p><b>Maggie (shake):</b> ¾ scoop vanilla whey, 200 ml (¾ cup) Fairlife fat-free milk, a handful (about 1 cup) of raw baby spinach, 60 g mixed berries, fresh or thawed frozen (about ⅓ cup). 204 cal, 32 g protein, 16 g carbs.</p>","2:B_oats_banana":"<p><span class=\"tag\">Made the night before: Monday and Wednesday\nnights</span></p>\n<p><em>Makes one batch, divided into 2 jars (1 Rob, 1 Maggie), made the\nnight before.</em></p>\n<p><strong>Ingredients</strong></p>\n<ul>\n<li>1 cup (85 g) old-fashioned rolled oats</li>\n<li>1 tbsp (10 g) chia seeds</li>\n<li>1 tbsp sugar-free vanilla pudding mix (dry)</li>\n<li>1 cup (250 ml) Fairlife fat-free milk</li>\n<li>½ cup (125 g) plain nonfat Greek yogurt</li>\n<li>In the morning: 1 banana and 4 Nilla wafers</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>The night before (Monday night for Tuesday, Wednesday night for\nThursday), get out one mixing bowl and two 16-oz mason jars labeled\n\"Rob\" and \"Maggie\".</li>\n<li>In the bowl, stir the oats, chia and dry pudding mix together.</li>\n<li>Pour in the Fairlife and Greek yogurt and stir until smooth. It\nthickens overnight.</li>\n<li>Set Rob's jar on the scale and zero it, then divide as below.</li>\n<li><strong>Divide.</strong> Rob: 290 g (about 1¼ cups) in his jar; in\nthe morning top with ½ banana (60 g), sliced, and 2 crushed Nilla\nwafers. Maggie: the rest, about 190 g (¾ cup), in her jar; in the\nmorning top with ½ banana (50 g), sliced, and 2 crushed Nilla wafers.\n<strong>Store:</strong> Make both jars the night before (Monday night\nfor Tuesday, Wednesday night for Thursday) and keep them in the\nfridge.</li>\n</ol>\n<p><strong>Reheat</strong></p>\n<p>None. It is eaten cold, straight from the fridge.</p>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>430</td>\n<td>25 g</td>\n<td>68 g</td>\n<td>7 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>305</td>\n<td>17 g</td>\n<td>49 g</td>\n<td>5 g</td>\n</tr>\n</tbody>\n</table>\n","2:D_chksand":"<p><span class=\"tag\">Sunday prep: the raw chicken goes in the fridge,\nnot the freezer</span></p>\n<p><strong>Ingredients</strong></p>\n<ul>\n<li>15¼ oz (435 g) chicken breast: 8 oz (225 g) for Rob, 7½ oz (210 g)\nfor Maggie</li>\n<li>½ cup pickle juice from the jar</li>\n<li>Coating: ¾ cup (43 g) panko, 1 tsp paprika, ½ tsp garlic powder, ¼\ntsp salt</li>\n<li>3½ tbsp (50 g) liquid egg whites</li>\n<li>⅓ medium Yukon gold potato (50 g) (Rob's wedges), plus 1 tsp olive\noil and a pinch each of salt and garlic powder</li>\n<li>2 whole-wheat sandwich thins</li>\n<li>¼ cup (40 g) dill pickle chips</li>\n<li>Rob's spicy mayo: 2 tsp light mayo and ½ tsp sriracha</li>\n<li>Slaw: 2¾ cups (200 g) coleslaw mix, ¼ cup (55 g) plain nonfat Greek\nyogurt, 2½ tsp light mayo, 1 tsp red wine vinegar, a pinch each of salt\nand pepper</li>\n<li>Cooking spray</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Brine the chicken in the pickle juice, 30 minutes (or overnight in\nthe fridge).</li>\n<li>Mix the coating on a plate. Pour the egg whites into a shallow\nbowl.</li>\n<li>Pat the chicken dry, dip it in the egg white and press it into the\ncoating on both sides.</li>\n<li>Cut the potato into thin wedges and toss with the olive oil, salt\nand garlic powder.</li>\n<li>Spray the air fryer basket. Air-fry the chicken (sprayed on top) and\nthe wedges at 400°F for 12 to 14 minutes, until the chicken is 165°F.\nGive the wedges a few more minutes if they need it.</li>\n<li>Spicy mayo: stir the light mayo and sriracha together.</li>\n<li>Slaw: toss the coleslaw mix with the yogurt, light mayo, vinegar,\nsalt and pepper.</li>\n<li>Toast the sandwich thins.</li>\n<li><strong>Divide.</strong> Rob: his sandwich, 6 oz (170 g) cooked\nchicken on a sandwich thin with the spicy mayo and 2 tbsp pickle chips;\n½ cup potato wedges (35 g cooked); half the slaw. Maggie: her sandwich,\n5½ oz (160 g) cooked chicken on a sandwich thin with 2 tbsp pickle\nchips, and half the slaw.</li>\n</ol>\n<p><strong>Reheat</strong></p>\n<p>Best eaten fresh. Leftovers: chicken and fries in the air fryer at\n375°F, 4 to 5 minutes, until crisp. Toast the bun. Slaw stays cold.</p>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>641</td>\n<td>68 g</td>\n<td>58 g</td>\n<td>16 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>494</td>\n<td>61 g</td>\n<td>43 g</td>\n<td>10 g</td>\n</tr>\n</tbody>\n</table>\n","2:snack2:S_eggs":"<p><b>Rob's shake:</b> 1 scoop Tripact PB & vanilla protein, 240 ml (1 cup) Fairlife fat-free milk, 2 cups of raw baby spinach, 1 tbsp ground flax, 1 scoop collagen. Blend until smooth. 288 cal, 44 g protein, 13 g carbs.</p><p><b>Maggie (edamame + egg):</b> 85 g frozen shelled edamame (about ½ cup), 1 egg. 174 cal, 16 g protein, 8 g carbs.</p>","2:D_meatball":"<p><span class=\"tag\">Sunday prep: roll and bake the meatballs</span></p>\n<p><em>Makes 16 meatballs (made Sunday).</em></p>\n<p><strong>Ingredients</strong></p>\n<ul>\n<li>Meatballs: 1 lb (454 g) 93% lean ground turkey, 1 large egg, ⅓ cup\n(20 g) panko, 3 tbsp (15 g) grated parmesan, 1 tsp Italian seasoning, ½\ntsp garlic powder, ½ tsp salt, ¼ tsp black pepper</li>\n<li>1 cup (275 g) marinara</li>\n<li>1 medium zucchini (225 g) and a pinch of salt</li>\n<li>1¼ oz (35 g) dry spaghetti, plus 1 tbsp salt for the water</li>\n<li>2 tbsp (10 g) grated parmesan to serve</li>\n<li>Cooking spray</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Sunday: heat the oven to 400°F and spray a sheet pan.</li>\n<li>Mix the meatball ingredients with your hands until just\ncombined.</li>\n<li>Roll 16 balls, about 1½ inches (35 g each), and set them on the\npan.</li>\n<li>Bake 15 to 18 minutes, until 165°F. Cool and refrigerate.</li>\n<li>Wednesday: bring a pot of water with 1 tbsp salt to a boil and cook\nthe spaghetti as the package says.</li>\n<li>Warm the marinara in a saucepan over medium. Add 14 meatballs (Rob\n8, Maggie 6), cover and simmer 10 minutes.</li>\n<li>Slice the zucchini and cook it in a sprayed pan over medium-high\nwith the salt, 4 minutes.</li>\n<li><strong>Divide.</strong> Rob: 8 meatballs in sauce, ⅓ cup cooked\nspaghetti (¾ oz dry), ½ medium zucchini (100 g) and 1 tbsp parmesan.\nMaggie: 6 meatballs in sauce, ¼ cup cooked spaghetti (½ oz dry), ½\nmedium zucchini (125 g) and 1 tbsp parmesan. The 2 extra meatballs keep\n4 days in the fridge for a snack or lunch.</li>\n</ol>\n<p><strong>Reheat</strong></p>\n<p>Microwave covered 2 minutes, stirring halfway. Add 1 tbsp water if\nthe sauce has thickened.</p>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>638</td>\n<td>57 g</td>\n<td>36 g</td>\n<td>29 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>499</td>\n<td>44 g</td>\n<td>30 g</td>\n<td>23 g</td>\n</tr>\n</tbody>\n</table>\n","2:snack2:S_cottage":"<p><b>Rob's shake:</b> 1 scoop Tripact PB & vanilla protein, 240 ml (1 cup) Fairlife fat-free milk, 2 cups of raw baby spinach, 1 tbsp ground flax, 1 scoop collagen. Blend until smooth. 288 cal, 44 g protein, 13 g carbs.</p><p><b>Maggie (cottage cheese ranch dip):</b> 170 g 2% cottage cheese (about ¾ cup), 100 g yellow or orange bell pepper (about ⅔ pepper), 75 g English cucumber (about ¼ cucumber), with 1 tsp ranch seasoning stirred into the cottage cheese. 180 cal, 20 g protein, 16 g carbs.</p>","2:L_chili":"<p><span class=\"tag\">Sunday prep: the whole batch</span></p>\n<p><em>Makes about 18 cups.</em></p>\n<p><strong>Ingredients</strong></p>\n<ul>\n<li>3 lb (1,360 g) 93% lean ground beef</li>\n<li>2 yellow onions (300 g), diced</li>\n<li>2 green bell peppers (300 g), diced</li>\n<li>1 tbsp olive oil</li>\n<li>Spices: 3 tbsp chili powder, 1 tbsp cumin, 2 tsp smoked paprika, 1\ntsp dried oregano, 2 tsp salt, ½ tsp black pepper</li>\n<li>4 garlic cloves, minced</li>\n<li>2 cans (28 oz each) crushed tomatoes</li>\n<li>2 cans (15 oz each) kidney beans and 1 can (15 oz) black beans,\nrinsed</li>\n<li>1 large sweet potato (1 lb, 450 g), peeled</li>\n<li>Toppings for the week: 1⅓ cups (320 g) plain nonfat Greek yogurt, ¾\ncup (84 g) shredded reduced-fat cheddar</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Peel the sweet potato and cut it into ½-inch cubes.</li>\n<li>Heat the olive oil in a big pot (6 quarts or more) over\nmedium-high.</li>\n<li>Turn the heat to high. Add the beef in two batches, letting each\nbrown 3 to 4 minutes before breaking it up, then add the onions and\npeppers and cook 6 minutes more. If liquid pools in the pan, spoon or\npour it off and keep cooking on high until the meat browns.</li>\n<li>Add the spices and garlic and stir 1 minute.</li>\n<li>Add the tomatoes, beans and sweet potato. Stir and bring to a\nboil.</li>\n<li>Turn the heat to low and simmer with the lid partly on for 40\nminutes, stirring every 10 minutes, until the sweet potato is\ntender.</li>\n<li>Cool 20 minutes before packing.</li>\n<li><strong>Divide.</strong> Rob: 4 containers of 2¼ cups chili; top\neach with 3 tbsp (40 g) Greek yogurt and 2 tbsp (14 g) cheddar when you\neat it. Maggie: 4 containers of 1¾ cups chili; top each with 3 tbsp (40\ng) Greek yogurt and 1 tbsp (7 g) cheddar when you eat it. The batch\nleaves about 2 cups extra; freeze it as a spare lunch.\n<strong>Store:</strong> All 8 containers in the freezer. Two nights\nbefore each lunch, move that day's 2 containers to the fridge: Tuesday\nnight for Thursday, Wednesday night for Friday, Thursday night for\nSaturday, Friday night for Sunday. Cooked food keeps 3 to 4 days in the\nfridge, which is why these start frozen.</li>\n</ol>\n<p><strong>Reheat</strong></p>\n<p>Microwave covered 2½ to 3 minutes, stirring halfway, until hot in the\nmiddle, then add the yogurt and cheddar. If it is still partly frozen,\nrun it 2 minutes on defrost first.</p>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>592</td>\n<td>56 g</td>\n<td>55 g</td>\n<td>18 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>455</td>\n<td>44 g</td>\n<td>43 g</td>\n<td>13 g</td>\n</tr>\n</tbody>\n</table>\n","2:D_mongolian":"<p><span class=\"tag\">Sunday prep: bag and freeze the raw beef</span></p>\n<p><strong>Ingredients</strong></p>\n<ul>\n<li>15¼ oz (435 g) 93% lean ground beef</li>\n<li>1½ tsp cornstarch</li>\n<li>Sauce: 2¼ tbsp low-sodium soy sauce, 2½ tsp honey, 2 garlic cloves\n(minced), 2 tsp grated fresh ginger, ¼ tsp red pepper flakes, 3 tbsp\nwater</li>\n<li>4¾ cups (300 g) snap peas and a pinch of salt</li>\n<li>½ cup dry white rice</li>\n<li>Cooking spray</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Two nights before (Tuesday night), move the raw beef from the\nfreezer to the fridge.</li>\n<li>Cook the rice: bring ½ cup dry white rice and 1 cup water to a boil,\ncover, turn the heat to low and simmer 15 minutes, then let it sit 5\nminutes off the heat and fluff with a fork. (A microwave rice pouch\nworks too.)</li>\n<li>Mix the sauce in a small bowl and whisk in the cornstarch.</li>\n<li>Heat a large skillet over high until very hot. Add the beef, press\nit flat and leave it 3 minutes to brown, then break it up and cook 3\nminutes more, until no pink is left. If liquid pools in the pan, spoon\nor pour it off and keep cooking on high until the meat browns.</li>\n<li>Pour in the sauce and toss 1 minute, until glossy.</li>\n<li>In a second sprayed pan over high, stir-fry the snap peas with the\nsalt, 2 minutes.</li>\n<li><strong>Divide.</strong> Rob: 1¼ cups (170 g) cooked beef in sauce,\n1 cup (140 g) rice and half the snap peas. Maggie: 1 cup (160 g) cooked\nbeef in sauce, ⅓ cup (60 g) rice and half the snap peas.</li>\n</ol>\n<p><strong>Reheat</strong></p>\n<p>Microwave covered 1½ to 2 minutes, stirring halfway.</p>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>643</td>\n<td>57 g</td>\n<td>64 g</td>\n<td>17 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>501</td>\n<td>51 g</td>\n<td>37 g</td>\n<td>15 g</td>\n</tr>\n</tbody>\n</table>\n","2:D_fajita":"<p><span class=\"tag\">Sunday prep: bag and freeze the raw chicken (Rob's\nshrimp stays in its bag in the freezer)</span></p>\n<p><strong>Ingredients</strong></p>\n<ul>\n<li>10½ oz (300 g) frozen raw peeled and deveined shrimp (Rob)</li>\n<li>7½ oz (210 g) chicken breast (Maggie)</li>\n<li>2 bell peppers (1 red, 1 green; 280 g)</li>\n<li>¾ yellow onion (120 g)</li>\n<li>2 tsp olive oil</li>\n<li>1 tbsp fajita seasoning and ¼ tsp salt</li>\n<li>1 lime</li>\n<li>5 small (8-inch) Olé low-carb wraps</li>\n<li>½ cup jarred salsa</li>\n<li>Crema: ⅓ cup (80 g) plain nonfat Greek yogurt, juice of ½ lime, a\npinch of salt</li>\n<li>1 tbsp shredded Mexican-blend cheese (Rob)</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Two nights before (Wednesday night), move the raw chicken from the\nfreezer to the fridge.</li>\n<li>Heat the oven to 425°F and spray a large sheet pan.</li>\n<li>Thaw Rob's shrimp: seal it in a zip-top bag and sit it in a bowl of\ncold water for 15 minutes. Pat dry.</li>\n<li>Slice the chicken into ½-inch strips and the peppers and onion into\nstrips.</li>\n<li>Toss the chicken, peppers and onion with 1½ tsp of the olive oil and\ntwo-thirds of the fajita seasoning and salt. Spread it on the pan,\nchicken at one end, and roast 10 minutes.</li>\n<li>Toss the shrimp with the last ½ tsp oil and the rest of the\nseasoning, add it to the open end of the pan and roast 8 to 10 minutes\nmore, until the shrimp is pink and the chicken is 165°F.</li>\n<li>Squeeze ½ lime over the pan. Crema: stir the yogurt, the juice of\nthe other ½ lime and the salt together.</li>\n<li>Warm the wraps: wrap them in a damp paper towel and microwave 30\nseconds.</li>\n<li><strong>Divide.</strong> Rob: 3 wraps, 8½ oz (240 g) cooked shrimp,\nhalf the peppers and onions, 4 tbsp salsa, 3 tbsp (40 g) Greek yogurt\ncrema and 1 tbsp cheese. Maggie: 2 wraps, 5½ oz (160 g) cooked chicken,\nhalf the peppers and onions, 4 tbsp salsa and 3 tbsp (40 g) Greek yogurt\ncrema.</li>\n</ol>\n<p><strong>Reheat</strong></p>\n<p>Microwave the chicken and peppers covered 1 to 1½ minutes. Warm the\ntortillas 15 seconds wrapped in a damp paper towel. Salsa and crema stay\ncold.</p>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>605</td>\n<td>84 g</td>\n<td>59 g</td>\n<td>15 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>513</td>\n<td>64 g</td>\n<td>46 g</td>\n<td>14 g</td>\n</tr>\n</tbody>\n</table>\n","2:snack2:S_jerky":"<p><b>Rob's shake:</b> 1 scoop Tripact PB & vanilla protein, 240 ml (1 cup) Fairlife fat-free milk, 2 cups of raw baby spinach, 1 tbsp ground flax, 1 scoop collagen. Blend until smooth. 288 cal, 44 g protein, 13 g carbs.</p><p><b>Maggie (jerky + pear):</b> 28 g (1 oz) original beef jerky, 180 g Bartlett pear (about 1 pear). 183 cal, 11 g protein, 33 g carbs.</p>","2:B_kodiak_pan":"<p><strong>Ingredients</strong></p>\n<ul>\n<li>1 cup (100 g) Kodiak Power Cakes mix</li>\n<li>¾ cup (200 ml) Fairlife fat-free milk</li>\n<li>2 large eggs (1 each)</li>\n<li>½ tsp cinnamon</li>\n<li>1 banana (Rob)</li>\n<li>⅔ cup mixed berries (Maggie)</li>\n<li>2 tbsp sugar-free maple syrup</li>\n<li>Cooking spray</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Rob's batter: whisk ½ cup (60 g) Kodiak mix, ½ cup (120 ml)\nFairlife, 1 egg and ¼ tsp cinnamon until just combined. Let it sit 2\nminutes to thicken.</li>\n<li>Maggie's batter: whisk ⅓ cup (40 g) Kodiak mix, ⅓ cup (80 ml)\nFairlife, 1 egg and ¼ tsp cinnamon the same way.</li>\n<li>Heat a large nonstick pan over medium and spray it. Pour ¼-cup\npancakes and cook about 2 minutes, until bubbles form, then flip and\ncook 1 to 2 minutes more.</li>\n<li>Cook Rob's batter first and keep it warm in a 200°F oven, then cook\nMaggie's.</li>\n<li>Slice Rob's banana. Warm Maggie's berries 30 seconds in the\nmicrowave.</li>\n<li><strong>Divide.</strong> Rob: his pancakes topped with 1 banana (100\ng), sliced, and 1 tbsp sugar-free maple syrup. Maggie: her pancakes\ntopped with the warm ⅔ cup (100 g) berries and 1 tbsp sugar-free maple\nsyrup.</li>\n</ol>\n<p><strong>Reheat</strong></p>\n<p>Best eaten fresh. Leftover pancakes: microwave 30 to 45 seconds, or a\ndry skillet over medium, 1 minute a side.</p>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>425</td>\n<td>30 g</td>\n<td>63 g</td>\n<td>7 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>301</td>\n<td>22 g</td>\n<td>40 g</td>\n<td>7 g</td>\n</tr>\n</tbody>\n</table>\n","2:D_tikka":"<p><span class=\"tag\">Sunday prep: bag and freeze the raw\nchicken</span></p>\n<p><strong>Ingredients</strong></p>\n<ul>\n<li>15¼ oz (435 g) chicken breast</li>\n<li>½ cup (110 g) plain nonfat Greek yogurt</li>\n<li>Marinade: 1 tsp garam masala, 1 garlic clove (grated), 1 tsp grated\nfresh ginger, ½ tsp salt</li>\n<li>Sauce: ½ yellow onion (90 g), 2 tsp olive oil, 1 garlic clove, 1 tsp\ngrated fresh ginger, 1 tsp garam masala, 1 tsp cumin, 1 tsp paprika, ½\ntsp turmeric, 1¼ cups (275 g) canned crushed tomatoes, ¼ tsp salt</li>\n<li>2 cups (200 g) green beans, trimmed</li>\n<li>½ cup dry white rice</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Two nights before (Thursday night), move the raw chicken from the\nfreezer to the fridge.</li>\n<li>Cut the chicken into 1-inch cubes. Toss with 2½ tbsp (35 g) of the\nyogurt and the marinade. Let it sit 15 minutes (or overnight).</li>\n<li>Cook the rice: bring ½ cup dry white rice and 1 cup water to a boil,\ncover, turn the heat to low and simmer 15 minutes, then let it sit 5\nminutes off the heat and fluff with a fork. (A microwave rice pouch\nworks too.)</li>\n<li>Air-fry the chicken at 400°F for 12 minutes, shaking once.</li>\n<li>Sauce: heat the olive oil in a saucepan over medium. Dice the onion\nand cook it 5 minutes, until soft.</li>\n<li>Add the garlic, ginger and spices and stir 30 seconds.</li>\n<li>Add the crushed tomatoes and salt and simmer 10 minutes.</li>\n<li>Take the pan off the heat. Stir in the rest of the yogurt (about ⅓\ncup), then the chicken.</li>\n<li>Steam the green beans: microwave them in a covered bowl with 2 tbsp\nwater, 4 minutes.</li>\n<li><strong>Divide.</strong> Rob: 6 oz (170 g) cooked chicken in a bit\nmore than half the sauce, 1 cup (145 g) rice and half the green beans.\nMaggie: 5½ oz (160 g) cooked chicken in the rest of the sauce, ½ cup (75\ng) rice and half the green beans.</li>\n</ol>\n<p><strong>Reheat</strong></p>\n<p>Microwave covered 2 minutes, stirring halfway. Add 1 tbsp water if\nthe sauce has thickened.</p>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>637</td>\n<td>65 g</td>\n<td>66 g</td>\n<td>12 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>501</td>\n<td>59 g</td>\n<td>43 g</td>\n<td>10 g</td>\n</tr>\n</tbody>\n</table>\n","2:B_hash":"<p><strong>Ingredients</strong></p>\n<ul>\n<li>6 Trader Joe's chicken breakfast sausage links (the ones frozen last\nSunday): 3 each</li>\n<li>1¼ medium Yukon gold potatoes (200 g)</li>\n<li>¾ red bell pepper (120 g), diced</li>\n<li>⅓ yellow onion (60 g), diced</li>\n<li>1 tsp olive oil</li>\n<li>Potato seasoning: ¼ tsp salt, ¼ tsp garlic powder, a pinch of black\npepper</li>\n<li>3 large eggs</li>\n<li>½ cup (120 g) liquid egg whites</li>\n<li>Cooking spray</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Two nights before (Friday night), move the 6 frozen sausage links to\nthe fridge.</li>\n<li>Dice the potatoes into ½-inch cubes, toss with the olive oil and\npotato seasoning, and air-fry at 400°F for 15 to 18 minutes, shaking\ntwice, until crisp.</li>\n<li>Meanwhile spray a 12-inch nonstick skillet and brown the links whole\nover medium, 8 to 10 minutes, turning, until 165°F. Move them to a board\nand slice into coins.</li>\n<li>Add the pepper and onion to the skillet and cook 5 minutes, until\nsoft. Stir in the sausage, half on Rob's side and half on Maggie's.</li>\n<li>Turn the heat to medium. On Rob's side make 2 wells: crack in 2 eggs\nand pour ¼ cup (60 g) egg whites around them. On Maggie's side make 1\nwell: 1 egg plus ¼ cup (60 g) egg whites.</li>\n<li>Cover and cook 3 to 4 minutes, until the whites are set.</li>\n<li><strong>Divide.</strong> Rob: his side, with 3 links of sausage, his\n2 eggs and whites, and ⅔ cup crispy diced potatoes (90 g cooked).\nMaggie: her side, with 3 links of sausage, her egg and whites, and ⅓ cup\ncrispy diced potatoes (55 g cooked).</li>\n</ol>\n<p><strong>Reheat</strong></p>\n<p>Best eaten fresh. Leftovers: skillet over medium, 3 to 4 minutes,\nstirring, or microwave covered 1 to 1½ minutes. Heat just until hot so\nthe eggs don't go rubbery.</p>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>430</td>\n<td>39 g</td>\n<td>31 g</td>\n<td>16 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>311</td>\n<td>32 g</td>\n<td>22 g</td>\n<td>10 g</td>\n</tr>\n</tbody>\n</table>\n","2:D_turkeyburger":"<p><span class=\"tag\">Sunday prep: bag and freeze the raw\nturkey</span></p>\n<p><strong>Ingredients</strong></p>\n<ul>\n<li>13½ oz (380 g) 93% lean ground turkey</li>\n<li>Seasoning: ½ tsp salt, ½ tsp garlic powder, ½ tsp onion powder, ¼\ntsp black pepper, 1 tsp Worcestershire</li>\n<li>2 whole-wheat sandwich thins</li>\n<li>1 slice American cheese (Rob)</li>\n<li>1¼ cups (60 g) chopped romaine</li>\n<li>1 Roma tomato (80 g), sliced</li>\n<li>¼ cup (40 g) dill pickle chips</li>\n<li>1½ tbsp ketchup</li>\n<li>1 medium sweet potato (215 g)</li>\n<li>2 tsp olive oil, ¼ tsp salt, ¼ tsp smoked paprika</li>\n<li>Cooking spray</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Two nights before (Friday night), move the raw turkey from the\nfreezer to the fridge.</li>\n<li>Cut the sweet potatoes into ¼-inch fries. Toss with the olive oil,\nsalt and smoked paprika.</li>\n<li>Air-fry at 400°F for 18 to 20 minutes, shaking twice.</li>\n<li>Mix the turkey with the seasoning. Shape 2 patties, ¾ inch thick:\nRob's 7 oz (200 g), Maggie's 6¼ oz (180 g). Press a dent in the middle\nof each.</li>\n<li>Heat a sprayed skillet over medium. Cook the patties 4 to 5 minutes\na side, until 165°F. Put the cheese on Rob's for the last minute and\ncover.</li>\n<li>Toast the sandwich thins.</li>\n<li><strong>Divide.</strong> Rob: his cheeseburger on a sandwich thin\nwith ⅔ cup (30 g) romaine, ½ Roma tomato (40 g), 2 tbsp (20 g) pickle\nchips and 1 tbsp ketchup, plus 1 cup sweet potato fries (95 g cooked).\nMaggie: her burger on a sandwich thin with ⅔ cup (30 g) romaine, ½ Roma\ntomato (40 g), 2 tbsp (20 g) pickle chips and 2 tsp ketchup, plus ¾ cup\nsweet potato fries (70 g cooked).</li>\n</ol>\n<p><strong>Reheat</strong></p>\n<p>Burger: microwave covered 45 to 60 seconds, or a covered skillet over\nmedium-low, 2 minutes a side. Fries: air fryer at 400°F, 3 to 4 minutes.\nToast the bun.</p>\n<p><strong>Macros</strong></p>\n<table>\n<thead>\n<tr class=\"header\">\n<th></th>\n<th>Calories</th>\n<th>Protein</th>\n<th>Carbs</th>\n<th>Fat</th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Rob</td>\n<td>642</td>\n<td>48 g</td>\n<td>56 g</td>\n<td>27 g</td>\n</tr>\n<tr class=\"even\">\n<td>Maggie</td>\n<td>499</td>\n<td>41 g</td>\n<td>46 g</td>\n<td>19 g</td>\n</tr>\n</tbody>\n</table>\n","3:B_burrito3":"<p><span class=\"tag\">Sunday prep: cook the chorizo</span></p>\n<p><em>Makes chorizo on Sunday for the week; 3 burritos each morning (2\nfor Rob, 1 for Maggie), made fresh.</em></p>\n<p><strong>Ingredients</strong></p>\n<ul>\n<li>Sunday, turkey chorizo for the week: 1 lb (454 g) 93% lean ground\nturkey and the chorizo seasoning: 1 tbsp chili powder, 1 tsp smoked\npaprika, 1 tsp cumin, 1 tsp dried oregano, ½ tsp garlic powder, ¾ tsp\nsalt, ¼ tsp black pepper, 1 tbsp red wine vinegar</li>\n<li>Each morning: ¾ medium Yukon gold potato (140 g), cooking spray and\na pinch of salt</li>\n<li>Each morning: 2 large eggs and ½ cup (120 g) liquid egg whites, with\na pinch of salt</li>\n<li>Each morning: 3 small (8-inch) Olé low-carb wraps (2 for Rob, 1 for\nMaggie) and 4 tbsp jarred salsa</li>\n</ul>\n<p><strong>Steps</strong></p>\n<ol type=\"1\">\n<li>Sunday: stir the chorizo seasoning together, vinegar included. Heat\na large skillet over high until very hot, add the turkey, press it flat\nand leave it 3 minutes to brown, then break it up. If liquid pools in\nthe pan, spoon or pour it off and keep cooking on high until the meat\nbrowns.</li>\n<li>Add the seasoning and cook 3 to 4 minutes more, until no pink is\nleft. Cool, then split it into 3 containers (one per breakfast):\nMonday's and Wednesday's in the fridge, Friday's in the freezer.</li>\n<li>Each morning: dice the potato into ½-inch cubes, microwave it in a\ncovered bowl 2 minutes, then spray, salt and air-fry at 400°F for 10 to\n12 minutes, shaking once, until crisp.</li>\n<li>While it cooks, whisk the eggs, egg whites and salt. Spray a\nnonstick pan, warm that day's chorizo over medium 2 minutes, then turn\nthe heat to medium-low, pour in the eggs and sti
